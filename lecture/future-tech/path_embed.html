<style>
#path-host, #path-host * { box-sizing: border-box; }
.demo-app.demo-path {
  --ink-2: #ffffff; --ink-3: #f0f5f8; --ink-4: #dce7ee;
  --rule: #cfdde5; --rule-2: #a9c1cf;
  --text: #0b2130; --text-2: #42606f; --text-3: #6b8798;
  --accent: #1d4e89; --accent-on: #ffffff;
  --devi: #be123c;
  margin: 0;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: 14.5px;
  line-height: 1.5;
}
#path-host header { display: none; }
#path-host .tip {
  margin: 0 0 12px;
  padding: 11px 14px;
  border-radius: 12px;
  border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--rule));
  background: color-mix(in srgb, var(--accent) 8%, var(--ink-2));
  color: var(--text-2);
  font-size: 13.5px;
}
#path-host .tip b { color: var(--accent); }
#path-host .ctrl-bar {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px 16px;
  background: var(--ink-3);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 0 0 12px;
}
#path-host .ctrl-bar.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 720px) {
  #path-host .ctrl-bar,
  #path-host .ctrl-bar.two { grid-template-columns: 1fr; }
}
#path-host .ctrl-title {
  margin: 0 0 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-3);
}
#path-host .big-val {
  font-size: 20px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
#path-host input[type=range] {
  width: 100%;
  accent-color: var(--accent);
  min-height: 36px;
}
#path-host .chart {
  width: 100%;
  height: min(52vw, 380px);
  min-height: 240px;
  background: var(--ink-4);
  border: 1px solid var(--rule);
  border-radius: 12px;
  overflow: hidden;
}
#path-host #path-cv { display: block; width: 100%; height: 100%; }
#path-host .stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin: 10px 0;
}
#path-host .stat {
  background: var(--ink-3);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 8px 12px;
}
#path-host .stat .k { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-3); }
#path-host .stat .v {
  font-size: 18px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
#path-host .legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 12.5px;
  color: var(--text-2);
  margin: 2px 0 10px;
}
#path-host .legend i {
  display: inline-block;
  width: 16px;
  height: 3px;
  border-radius: 2px;
  vertical-align: 3px;
  margin-right: 5px;
}
#path-host .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
#path-host button {
  appearance: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  min-height: 40px;
  padding: 8px 16px;
  border-radius: 10px;
  border: 1px solid var(--rule-2);
  background: var(--ink-2);
  color: var(--text);
  cursor: pointer;
}
#path-host #path-btnPlay {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-on);
}
#path-host #path-btnPlay.danger { background: var(--devi); border-color: var(--devi); }
</style>
<div class="demo-app demo-path" id="demo-path">
  <header>
    <h1>직선 경로 추종 제어기</h1>
  </header>
  <p class="tip"><b>K<sub>p,e</sub></b>를 키우면 경로를 넘나들며 흔들릴 수 있습니다. <b>K<sub>d,e</sub></b>로 감쇠하세요. Δ와 R<sub>acc</sub>도 직접 바꿀 수 있습니다.</p>
  <div class="ctrl-bar two">
    <div>
      <p class="ctrl-title">전방주시거리 Δ <span class="big-val" id="path-deltaV">4.0</span> m</p>
      <input type="range" id="path-delta" min="0.8" max="12" step="0.1" value="4">
    </div>
    <div>
      <p class="ctrl-title">Acceptance radius R<sub>acc</sub> <span class="big-val" id="path-raccV">1.8</span> m</p>
      <input type="range" id="path-racc" min="0.4" max="6" step="0.1" value="1.8">
    </div>
  </div>
  <div class="ctrl-bar">
    <div>
      <p class="ctrl-title">K<sub>p,e</sub> 비례 <span class="big-val" id="path-kpeV">0.00</span></p>
      <input type="range" id="path-kpe" min="0" max="4" step="0.05" value="0">
    </div>
    <div>
      <p class="ctrl-title">K<sub>i,e</sub> 적분 <span class="big-val" id="path-kieV">0.00</span></p>
      <input type="range" id="path-kie" min="0" max="1" step="0.01" value="0">
    </div>
    <div>
      <p class="ctrl-title">K<sub>d,e</sub> 미분 <span class="big-val" id="path-kdeV">0.00</span></p>
      <input type="range" id="path-kde" min="0" max="4" step="0.05" value="0">
    </div>
  </div>
  <div class="chart"><canvas id="path-cv"></canvas></div>
  <div class="stats">
    <div class="stat"><span class="k">횡방향 오차 e</span><span class="v" id="path-e">—</span></div>
    <div class="stat"><span class="k">전방주시 Δ</span><span class="v" id="path-dRead">4.0 m</span></div>
    <div class="stat"><span class="k">Acceptance R<sub>acc</sub></span><span class="v" id="path-rRead">1.8 m</span></div>
  </div>
  <div class="legend">
    <span><i style="background:#0369a1"></i>경로</span>
    <span><i style="background:#dc2626"></i>자취</span>
    <span><i style="background:#4d7c0f"></i>LOS 시선</span>
    <span><i style="background:#b45309;height:8px;width:8px;border-radius:50%;border:1.5px dashed #b45309;background:transparent"></i>R<sub>acc</sub></span>
  </div>
  <div class="btn-row">
    <button type="button" id="path-btnPlay">시작</button>
    <button type="button" id="path-btnReset">초기화</button>
  </div>
</div>
