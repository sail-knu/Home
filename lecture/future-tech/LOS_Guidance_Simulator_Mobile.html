<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>LOS 유도 — Δ와 R_acc</title>
<style>
body{
  margin:0;background:#e7eef2;color:#0b2130;
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}
.back{display:inline-block;margin-bottom:12px;color:#1d4e89;font-size:13px;font-weight:700;text-decoration:none}
.kicker{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#1d4e89;font-weight:800}
.wrap > h1{font-size:20px;margin:4px 0 14px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 실습 목록</a>
  <span class="kicker">LOS</span>
  <h1>Δ와 acceptance radius</h1>
  <div id="los-host">
<style>
#los-host, #los-host * { box-sizing: border-box; }
.demo-app.demo-los {
  --ink-2: #ffffff; --ink-3: #f0f5f8; --ink-4: #dce7ee;
  --rule: #cfdde5; --rule-2: #a9c1cf;
  --text: #0b2130; --text-2: #42606f; --text-3: #6b8798;
  --accent: #1d4e89; --accent-on: #ffffff;
  --track: #0369a1; --hull: #15803d; --sight: #4d7c0f; --devi: #be123c;
  margin: 0;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: 14.5px;
  line-height: 1.5;
}
#los-host header { display: none; }
#los-host .tip {
  margin: 0 0 12px;
  padding: 11px 14px;
  border-radius: 12px;
  border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--rule));
  background: color-mix(in srgb, var(--accent) 8%, var(--ink-2));
  color: var(--text-2);
  font-size: 13.5px;
}
#los-host .tip b { color: var(--accent); }
#los-host .ctrl-bar {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 16px;
  background: var(--ink-3);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 0 0 12px;
}
@media (max-width: 620px) {
  #los-host .ctrl-bar { grid-template-columns: 1fr; }
}
#los-host .ctrl-title { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: var(--text-3); }
#los-host .big-val { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); }
#los-host input[type=range] { width: 100%; accent-color: var(--accent); min-height: 36px; }
#los-host .chart {
  width: 100%; height: min(64vw, 380px); min-height: 240px;
  background: var(--ink-4); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden;
}
#los-host #los-cv { display: block; width: 100%; height: 100%; }
#los-host .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 10px 0; }
#los-host .stat { background: var(--ink-3); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; }
#los-host .stat .k { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-3); }
#los-host .stat .v { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); }
#los-host .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin: 2px 0 10px; }
#los-host .legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }
#los-host .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
#los-host button {
  appearance: none; font-family: inherit; font-size: 14px; font-weight: 700;
  min-height: 40px; padding: 8px 16px; border-radius: 10px;
  border: 1px solid var(--rule-2); background: var(--ink-2); color: var(--text); cursor: pointer;
}
#los-host #los-btnPlay { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
#los-host #los-btnPlay.danger { background: var(--devi); border-color: var(--devi); }
</style>
<div class="demo-app demo-los" id="demo-los">
  <p class="tip"><b>Δ</b>는 얼마나 앞을 볼지, <b>R<sub>acc</sub></b>는 다음 웨이포인트에 얼마나 가까이 가야 구간을 넘길지입니다. 큰 Δ는 모서리를 깎고, 큰 R<sub>acc</sub>는 일찍 다음 구간으로 넘어갑니다.</p>
  <div class="ctrl-bar">
    <div>
      <p class="ctrl-title">전방주시거리 Δ <span class="big-val" id="los-deltaV">4.0</span> m</p>
      <input type="range" id="los-delta" min="0.8" max="12" step="0.1" value="4">
    </div>
    <div>
      <p class="ctrl-title">Acceptance radius R<sub>acc</sub> <span class="big-val" id="los-raccV">1.8</span> m</p>
      <input type="range" id="los-racc" min="0.4" max="6" step="0.1" value="1.8">
    </div>
  </div>
  <div class="chart"><canvas id="los-cv"></canvas></div>
  <div class="stats">
    <div class="stat"><span class="k">횡방향 오차 e</span><span class="v" id="los-e">—</span></div>
    <div class="stat"><span class="k">전방주시 Δ</span><span class="v" id="los-dRead">4.0 m</span></div>
    <div class="stat"><span class="k">Acceptance R<sub>acc</sub></span><span class="v" id="los-rRead">1.8 m</span></div>
  </div>
  <div class="legend">
    <span><i style="background:#0369a1"></i>경로</span>
    <span><i style="background:#15803d"></i>자취</span>
    <span><i style="background:#4d7c0f"></i>LOS 시선</span>
    <span><i style="background:#b45309;height:8px;width:8px;border-radius:50%;border:1.5px dashed #b45309;background:transparent"></i>R<sub>acc</sub></span>
  </div>
  <div class="btn-row">
    <button type="button" id="los-btnPlay">시작</button>
    <button type="button" id="los-btnReset">초기화</button>
  </div>
</div>
  </div>
</div>
<script src="los_embed.js"></script>
</body>
</html>
