<style>
#los-host, #los-host * { box-sizing: border-box; }
.demo-app.demo-los {
  --ink: #e7eef2; --ink-2: #ffffff; --ink-3: #f0f5f8; --ink-4: #d3dfe7;
  --rule: #cfdde5; --rule-2: #a9c1cf;
  --text: #0b2130; --text-2: #42606f; --text-3: #6b8798;
  --accent: #0c7a73; --accent-deep: #0c7a73; --accent-on: #ffffff;
  --grid: #dae7ee; --grid-major: #bed4e0;
  --track: #0369a1; --mark: #b45309; --mark-hot: #92400e;
  --hull: #15803d; --devi: #be123c; --sight: #4d7c0f; --course: #6d28d9;
  --warn: #be123c;
  --shadow: 0 6px 20px rgba(20, 50, 70, .12);
  margin: 0;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  line-height: 1.5;
  width: 100%;
  max-width: 100%;
}
#los-host .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }
#los-host .lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 700; }
#los-host :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
#los-host button { font-family: inherit; }
#los-host header { display: none; }

#los-host .tip {
  margin: 0 0 14px;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid var(--rule);
  background: color-mix(in srgb, var(--accent) 8%, var(--ink-2));
  color: var(--text-2);
  font-size: 13px;
  line-height: 1.55;
}
#los-host .tip b { color: var(--accent); font-weight: 800; }

#los-host .stage {
  position: sticky;
  top: 72px;
  z-index: 8;
  background: var(--ink-2);
  border: 1px solid var(--rule);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 12px;
}
#los-host .stage-canvas { position: relative; }
#los-host .chart { position: relative; width: 100%; height: var(--chartH, 230px); min-height: 0; background: var(--ink-4); }
#los-host #los-cv {
  display: block; width: 100%; height: 100%;
  touch-action: none; user-select: none;
}

#los-host .primary {
  padding: 10px 12px 6px;
  background: var(--ink-2);
  border: 1px solid var(--rule);
  border-radius: 16px;
  margin-bottom: 12px;
}
#los-host .primary:has(> .ctl.off) { display: none; }

#los-host .readout {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule);
}
#los-host .readout.key { grid-template-columns: repeat(4, 1fr); }
#los-host .readout .cell { background: var(--ink-2); padding: 6px 8px; min-width: 0; }
#los-host .readout.key .cell { padding: 4px 5px 5px; }
#los-host .readout .k {
  display: block; font-size: 9.5px; letter-spacing: .04em; font-weight: 700; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#los-host .readout.key .k { font-size: 9px; letter-spacing: 0; }
#los-host .readout .v {
  display: block; font-size: 15px; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#los-host .readout.key .v { font-size: 15px; line-height: 1.25; }
#los-host .readout .v.warn { color: var(--devi); }
#los-host .readout .v.ok { color: var(--accent); }
#los-host .readout.sub {
  border: 1px solid var(--rule);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 12px;
}

#los-host .chips {
  display: flex; gap: 6px; flex-wrap: wrap; padding: 0 0 8px;
  background: transparent;
}
#los-host .chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 11px;
  border-radius: 999px; border: 1px solid var(--rule); background: var(--ink-2);
  color: var(--text-3); font-size: 12px; cursor: pointer;
}
#los-host .chip i { width: 13px; height: 3px; border-radius: 2px; display: inline-block; opacity: .35; }
#los-host .chip.on { color: var(--text); border-color: var(--rule-2); background: var(--ink-3); }
#los-host .chip.on i { opacity: 1; }
#los-host #los-recwrap {
  position: relative; height: 200px; min-height: 156px; background: var(--ink-4);
  border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; margin-bottom: 12px;
}
#los-host #los-rec { display: block; width: 100%; height: 100%; }
#los-host #los-recwrap .tag { position: absolute; right: 10px; top: 5px; pointer-events: none; opacity: .7; }

#los-host .sec {
  border: 1px solid var(--rule);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 12px;
  background: var(--ink-2);
}
#los-host .sec-h {
  width: 100%; background: none; border: 0; color: var(--text-2); cursor: pointer;
  display: flex; align-items: center; gap: 9px; padding: 0 12px; min-height: 46px; text-align: left;
}
#los-host .sec-h .t { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; }
#los-host .sec-h .ln { flex: 1; height: 1px; background: var(--rule); }
#los-host .sec-h .car { font-size: 10px; color: var(--text-3); transition: transform .16s; }
#los-host .sec.closed .car { transform: rotate(-90deg); }
#los-host .sec-b { padding: 0 12px 12px; }
#los-host .sec.closed .sec-b { display: none; }

#los-host .ctl { margin: 6px 0 10px; }
#los-host .ctl.off { display: none; }
#los-host .ctl .lab { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 0; }
#los-host .ctl .lab .n { color: var(--text-2); font-size: 13px; line-height: 1.3; }
#los-host .ctl .lab .v {
  color: var(--accent); font-size: 16px; font-weight: 700; flex: none;
  font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums;
}
#los-host .primary .ctl { margin: 2px 0 0; }
#los-host .primary .ctl .lab .n { font-size: 14px; color: var(--text); }
#los-host .primary .ctl .lab .v { font-size: 20px; }

#los-host input[type=range] {
  -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 44px;
  background: transparent; margin: 0; padding: 0; border: 0; outline: none; cursor: pointer;
  touch-action: none;
}
#los-host input[type=range]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 6px; background: var(--rule-2); border: 0;
}
#los-host input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; margin-top: -11px;
  background: var(--accent); border: 3px solid var(--ink-2);
  box-shadow: 0 0 0 1px var(--accent), 0 2px 6px rgba(0,0,0,.18);
}
#los-host input[type=range]::-moz-range-track { height: 6px; border-radius: 6px; background: var(--rule-2); border: 0; }
#los-host input[type=range]::-moz-range-thumb {
  width: 28px; height: 28px; border-radius: 50%; background: var(--accent);
  border: 3px solid var(--ink-2); box-shadow: 0 0 0 1px var(--accent);
}

#los-host .seg { display: flex; flex-wrap: wrap; gap: 6px; }
#los-host .seg button {
  flex: 1 1 44%; min-height: 44px; background: var(--ink-3); border: 1px solid var(--rule);
  color: var(--text-2); padding: 6px 8px; border-radius: 9px; cursor: pointer; font-size: 13px;
}
#los-host .seg button.on { background: var(--accent-deep); border-color: var(--accent); color: var(--accent-on); font-weight: 800; }
#los-host .note {
  color: var(--text-3); font-size: 12px; line-height: 1.6; background: var(--ink-3);
  border-left: 2px solid var(--rule-2); padding: 9px 10px; border-radius: 0 7px 7px 0; margin: 10px 0 0;
}
#los-host .note b { color: var(--text-2); font-weight: 700; }
#los-host .note code { color: var(--accent); font-family: ui-monospace, Consolas, monospace; }
#los-host .eqbox { background: var(--ink-3); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
#los-host .eqbox .eq {
  display: block; font-size: 12.5px; color: var(--sight); margin-top: 3px;
  overflow-x: auto; white-space: nowrap;
}

#los-host .speedrow {
  display: flex; align-items: center; gap: 10px; min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--rule);
  border-radius: 16px;
  background: var(--ink-2);
  margin-bottom: 12px;
}
#los-host .speedrow .lab { flex: none; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--text-3); }
#los-host .speedrow input[type=range] { flex: 1; min-width: 0; }
#los-host .speedrow .val {
  flex: none; min-width: 56px; text-align: right; color: var(--accent);
  font-size: 14px; font-weight: 700;
  font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums;
}

#los-host .demo-toolbar {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 8px;
  padding: 10px 12px;
  border-top: 1px solid var(--rule);
  background: var(--ink-2);
}
#los-host .demo-toolbar button {
  min-height: 46px; width: 100%; border-radius: 11px; font-size: 16px; font-weight: 800; cursor: pointer;
  background: var(--ink-3); border: 1px solid var(--rule); color: var(--text);
}
#los-host .demo-toolbar #los-btn_play { background: var(--accent-deep); border-color: var(--accent); color: var(--accent-on); }
#los-host .demo-toolbar #los-btn_play.danger { background: var(--warn); border-color: var(--warn); color: #fff; }

@media (prefers-reduced-motion: reduce) {
  #los-host, #los-host * { transition: none !important; }
}

@media (min-width: 900px) {
  #los-host .stage { position: static; }
  #los-host .demo-toolbar {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 4;
    display: flex;
    width: auto;
    grid-template-columns: none;
    gap: 6px;
    padding: 6px;
    border: 1px solid var(--rule);
    border-radius: 12px;
    background: color-mix(in srgb, #fff 92%, transparent);
    box-shadow: 0 4px 16px rgba(18, 26, 36, 0.12);
  }
  #los-host .demo-toolbar button {
    min-height: 36px;
    min-width: 88px;
    width: auto;
    padding: 7px 14px;
    font-size: 14px;
  }
}
</style>
<div class="demo-app demo-los" id="demo-los">
<header>
  <span class="kicker">LOS</span>
  <h1>웨이포인트 추종 시뮬레이터</h1>
  <span class="pill" id="los-statusPill">대기</span>
  <button id="los-themeBtn" type="button" aria-label="주간·야간 전환" hidden>◐</button>
</header>

<p class="tip"><b>Δ</b>를 줄이면 <b>RMS |e|</b>는 작아지지만 <b>조타 반전</b>이 늘어납니다 — 슬라이더로 균형점을 찾아보세요.</p>

<div class="demo-layout">
  <div class="demo-stage-col">
    <div class="stage" id="los-stage">
      <div class="stage-canvas">
        <div class="chart"><canvas id="los-cv"></canvas></div>
        <div class="demo-toolbar">
          <button type="button" id="los-btn_play">시작</button>
          <button type="button" id="los-btn_rst">초기화</button>
        </div>
      </div>
      <div class="readout key" id="los-cells"></div>
    </div>
    <div class="primary" id="los-primary"></div>
    <div class="readout sub" id="los-cells2"></div>
    <div class="chips" id="los-chips"></div>
    <div id="los-recwrap">
      <span class="tag lbl">Recorder</span>
      <canvas id="los-rec"></canvas>
    </div>
  </div>
  <div class="demo-ctrl-col">
    <div class="speedrow">
      <span class="lab">배속</span>
      <input type="range" id="los-spd" min="0.25" max="8" step="0.25" aria-label="시뮬레이션 배속">
      <span class="val" id="los-spdv">—</span>
    </div>
    <div id="los-panel"></div>
  </div>
</div>
</div>
