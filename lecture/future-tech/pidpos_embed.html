<style>
#pidpos-host, #pidpos-host * { box-sizing: border-box; }
.demo-app.demo-pidpos {
  --ink-2: #ffffff; --ink-3: #f0f5f8; --ink-4: #dce7ee;
  --rule: #cfdde5; --rule-2: #a9c1cf;
  --text: #0b2130; --text-2: #42606f; --text-3: #6b8798;
  --accent: #1d4e89; --accent-on: #ffffff;
  --devi: #be123c;
  margin: 0;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: 14.5px;
  line-height: 1.5;
}
#pidpos-host header { display: none; }
#pidpos-host .tip {
  margin: 0 0 12px;
  padding: 11px 14px;
  border-radius: 12px;
  border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--rule));
  background: color-mix(in srgb, var(--accent) 8%, var(--ink-2));
  color: var(--text-2);
  font-size: 13.5px;
}
#pidpos-host .tip b { color: var(--accent); }
#pidpos-host .ctrl-bar {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 16px;
  background: var(--ink-3);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 0 0 12px;
}
@media (max-width: 620px) {
  #pidpos-host .ctrl-bar { grid-template-columns: 1fr; }
}
#pidpos-host .ctrl-title {
  margin: 0 0 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-3);
}
#pidpos-host .big-val {
  font-size: 20px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
#pidpos-host input[type=range] {
  width: 100%;
  accent-color: var(--accent);
  min-height: 36px;
}
#pidpos-host .chart {
  width: 100%;
  height: min(56vw, 420px);
  min-height: 280px;
  background: var(--ink-4);
  border: 1px solid var(--rule);
  border-radius: 12px;
  overflow: hidden;
}
@media (max-width: 720px) {
  #pidpos-host .chart { height: min(68vw, 420px); }
}
#pidpos-host #pidpos-cv { display: block; width: 100%; height: 100%; }
#pidpos-host .stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin: 10px 0;
}
#pidpos-host .stat {
  background: var(--ink-3);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 8px 12px;
}
#pidpos-host .stat .k { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-3); }
#pidpos-host .stat .v {
  font-size: 18px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
#pidpos-host .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
#pidpos-host button {
  appearance: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  min-height: 40px;
  padding: 8px 16px;
  border-radius: 10px;
  border: 1px solid var(--rule-2);
  background: var(--ink-2);
  color: var(--text);
  cursor: pointer;
}
#pidpos-host #pidpos-btnPlay {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-on);
}
#pidpos-host #pidpos-btnPlay.danger { background: var(--devi); border-color: var(--devi); }
</style>
<div class="demo-app demo-pidpos" id="demo-pidpos">
  <header>
    <h1>역진자 위치 제어</h1>
  </header>
  <p class="tip">k<sub>P</sub> = 100, k<sub>I</sub> = 0, k<sub>D</sub> = 40 은 고정입니다. <b>k<sub>Px</sub></b>·<b>k<sub>Dx</sub></b>만 바꿔 카트를 x = 0으로 되돌리세요. 위치항은 F에 <b>+ k<sub>Px</sub>·x + k<sub>Dx</sub>·v</b>로 더해집니다.</p>
  <div class="ctrl-bar">
    <div>
      <p class="ctrl-title">k<sub>Px</sub> 위치 <span class="big-val" id="pidpos-kPxV">0.0</span></p>
      <input type="range" id="pidpos-kPx" min="0" max="10" step="0.1" value="0">
    </div>
    <div>
      <p class="ctrl-title">k<sub>Dx</sub> 속도 <span class="big-val" id="pidpos-kDxV">0.0</span></p>
      <input type="range" id="pidpos-kDx" min="0" max="15" step="0.1" value="0">
    </div>
  </div>
  <div class="chart"><canvas id="pidpos-cv"></canvas></div>
  <div class="stats">
    <div class="stat"><span class="k">각도 θ</span><span class="v" id="pidpos-th">—</span></div>
    <div class="stat"><span class="k">위치 x</span><span class="v" id="pidpos-x">—</span></div>
    <div class="stat"><span class="k">제어력 F</span><span class="v" id="pidpos-F">—</span></div>
  </div>
  <div class="btn-row">
    <button type="button" id="pidpos-btnPlay">시작</button>
    <button type="button" id="pidpos-btnReset">초기화</button>
  </div>
</div>
