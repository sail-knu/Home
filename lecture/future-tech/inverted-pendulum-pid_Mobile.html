<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>역진자 PID — kP · kD</title>
<style>
body{
  margin:0;background:#e7eef2;color:#0b2130;
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}
.back{display:inline-block;margin-bottom:12px;color:#1d4e89;font-size:13px;font-weight:700;text-decoration:none}
.kicker{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#1d4e89;font-weight:800}
.wrap > h1{font-size:20px;margin:4px 0 14px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 실습 목록</a>
  <span class="kicker">Inverted pendulum</span>
  <h1>각도 PID — k<sub>P</sub> · k<sub>D</sub></h1>
  <div id="pid-host"></div>
</div>
<script>
(function () {
  var host = document.getElementById('pid-host');
  fetch('pid_embed.html').then(function (r) { return r.text(); }).then(function (html) {
    host.innerHTML = html;
    var s = document.createElement('script');
    s.src = 'pid_embed.js';
    document.body.appendChild(s);
  });
})();
</script>
</body>
</html>
