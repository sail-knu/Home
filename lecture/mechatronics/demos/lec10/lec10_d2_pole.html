<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L10-D2 · 극점 안정성</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">메카트로닉스 10강</p>
  <h1>극점 안정성</h1>
  <p class="lede">좌반면은 죽고, <b>우반면은 발산</b>합니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">실수부 σ <span class="big-val" id="sgv">−1.00</span></p>
        <input type="range" id="sg" min="-4" max="1.5" step="0.05" value="-1">
      </div>
      <div>
        <p class="ctrl-title">허수부 ω <span class="big-val" id="wv">3.0</span></p>
        <input type="range" id="w" min="0" max="6" step="0.1" value="3">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="460"></canvas>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>좌반면 안정</span>
      <span><i style="background:var(--bad)"></i>우반면 발산</span>
      <span><i style="background:var(--accent)"></i>h(t) = e<sup>σt</sup> cos(ωt)</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>메카트로닉스 10강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var st = { sig: -1, w: 3, t: 0, running: true };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','ok','bad','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
var MONO = 'Consolas, ui-monospace, monospace';

function fx(v, n){ var s = v.toFixed(n); return s.charAt(0) === '-' ? '−' + s.slice(1) : s; }
function hAt(t){ return Math.exp(st.sig * t) * Math.cos(st.w * t); }
function xMark(px, py, col){
  ctx.strokeStyle = col; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(px - 8, py - 8); ctx.lineTo(px + 8, py + 8);
  ctx.moveTo(px + 8, py - 8); ctx.lineTo(px - 8, py + 8);
  ctx.stroke();
}

var pL = 36, pR = 430, pT = 46, pB = 430;
var rL = 458, rR = 878, rT = 46, rB = 430;
var SIG_LO = -4.2, SIG_HI = 1.8, W_LO = -6.5, W_HI = 6.5;
function sigX(s){ return pL + (s - SIG_LO) / (SIG_HI - SIG_LO) * (pR - pL); }
function wY(w){ return pB - (w - W_LO) / (W_HI - W_LO) * (pB - pT); }

function draw(){
  var rhp = st.sig > 1e-6, col = rhp ? PAL.bad : (Math.abs(st.sig) < 1e-6 ? PAL.high : PAL.ok);
  var ox = sigX(0), oy = wY(0);
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = PAL.text; ctx.font = 'bold 15px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('s-평면', pL, 30);
  ctx.fillText('h(t)', rL, 30);
  ctx.fillStyle = PAL.accent; ctx.font = '13px ' + MONO; ctx.textAlign = 'right';
  ctx.fillText('s = ' + fx(st.sig, 2) + (st.w > 0 ? ' ± j' + st.w.toFixed(1) : ''), rR, 30);

  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(pL, pT, pR - pL, pB - pT);
  ctx.globalAlpha = 0.14; ctx.fillStyle = PAL.ok;
  ctx.fillRect(pL, pT, ox - pL, pB - pT);
  ctx.fillStyle = PAL.bad;
  ctx.fillRect(ox, pT, pR - ox, pB - pT);
  ctx.globalAlpha = 1;

  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
  var s, w;
  for (s = -4; s <= 1; s++){
    ctx.beginPath(); ctx.moveTo(sigX(s), pT); ctx.lineTo(sigX(s), pB); ctx.stroke();
  }
  for (w = -6; w <= 6; w += 2){
    ctx.beginPath(); ctx.moveTo(pL, wY(w)); ctx.lineTo(pR, wY(w)); ctx.stroke();
  }
  ctx.strokeStyle = PAL.bad; ctx.lineWidth = 1.8; ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(ox, pT); ctx.lineTo(ox, pB); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pL, oy); ctx.lineTo(pR, oy); ctx.stroke();
  ctx.strokeRect(pL, pT, pR - pL, pB - pT);

  ctx.fillStyle = PAL.faint; ctx.font = '12px ' + FONT; ctx.textAlign = 'center';
  [-4, -2, 1].forEach(function(v){ ctx.fillText(String(v), sigX(v), oy + 14); });
  ctx.textAlign = 'right';
  [-4, 4].forEach(function(v){ ctx.fillText((v > 0 ? '+' : '') + v + 'j', ox - 6, wY(v) + 4); });
  ctx.fillStyle = PAL.ok; ctx.font = 'bold 12.5px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('좌반면', (pL + ox) / 2, pB - 10);
  ctx.fillStyle = PAL.bad; ctx.fillText('우반면', (ox + pR) / 2, pB - 10);

  xMark(sigX(st.sig), wY(st.w), col);
  if (st.w > 0.05) xMark(sigX(st.sig), wY(-st.w), col);

  var tHi = 6;
  var peak = 1;
  var k, t, v;
  for (k = 0; k <= 200; k++){
    v = Math.abs(hAt(tHi * k / 200));
    if (isFinite(v)) peak = Math.max(peak, Math.min(v, 12));
  }
  var yHi = peak * 1.15;
  function tX(tt){ return rL + 36 + tt / tHi * (rR - rL - 48); }
  function hY(vv){ return (rT + rB) / 2 - vv / yHi * ((rB - rT) / 2 - 18); }

  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(rL, rT, rR - rL, rB - rT);
  if (rhp){ ctx.globalAlpha = 0.10; ctx.fillStyle = PAL.bad; ctx.fillRect(rL, rT, rR - rL, rB - rT); ctx.globalAlpha = 1; }
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(tX(0), rT + 8); ctx.lineTo(tX(0), rB - 20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tX(0), hY(0)); ctx.lineTo(rR - 10, hY(0)); ctx.stroke();

  var tNow = st.t % tHi;
  ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.beginPath();
  for (k = 0; k <= 240; k++){
    t = tHi * k / 240; v = hAt(t);
    if (k) ctx.lineTo(tX(t), hY(v)); else ctx.moveTo(tX(0), hY(hAt(0)));
  }
  ctx.stroke();
  ctx.fillStyle = PAL.text;
  ctx.beginPath(); ctx.arc(tX(tNow), hY(hAt(tNow)), 5, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = PAL.faint; ctx.font = '12px ' + FONT; ctx.textAlign = 'center';
  [2, 4, 6].forEach(function(tt){ ctx.fillText(String(tt), tX(tt), rB - 6); });
  ctx.strokeStyle = PAL.border; ctx.lineWidth = 1;
  ctx.strokeRect(rL, rT, rR - rL, rB - rT);
}

function syncSig(){
  var s = st.sig.toFixed(2);
  $('sgv').textContent = (st.sig < 0 ? '−' : '') + Math.abs(st.sig).toFixed(2);
}
$('sg').addEventListener('input', function(){ st.sig = parseFloat(this.value); st.t = 0; syncSig(); draw(); });
$('w').addEventListener('input', function(){ st.w = parseFloat(this.value); st.t = 0; $('wv').textContent = st.w.toFixed(1); draw(); });
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.sig = -1; st.w = 3; st.t = 0; st.running = true;
  $('sg').value = -1; syncSig();
  $('w').value = 3; $('wv').textContent = '3.0';
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  draw();
});
var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running) st.t += dt;
  draw();
  requestAnimationFrame(loop);
}
syncSig();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
