<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L13-D4 · GPS + 칼만</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">메카트로닉스 13강</p>
  <h1>GPS + 칼만</h1>
  <p class="lede">점만 보면 흔들리고, 칼만은 <b>선을 잇습니다</b>.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">GPS σ <span class="big-val" id="sv">1.00</span> m</p>
        <input type="range" id="sig" min="0.3" max="2.5" step="0.05" value="1">
      </div>
      <div>
        <p class="ctrl-title">Q <span class="big-val" id="qv">0.05</span></p>
        <input type="range" id="q" min="0.01" max="0.4" step="0.01" value="0.05">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="480"></canvas>
    <div class="legend">
      <span><i style="background:var(--muted);height:0;border-top:2px dashed var(--muted)"></i>참 궤적</span>
      <span><i style="background:var(--high);height:8px;width:8px;border-radius:50%;vertical-align:1px"></i>GPS</span>
      <span><i style="background:var(--accent)"></i>칼만</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>메카트로닉스 13강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var DT = 0.05, NSTEP = 400, GPS_EVERY = 5, VX = 1.6, VY = 1.0, X0 = 2, Y0 = 3;
var st = { sig: 1, Q: 0.05, step: 0, running: true, seed: 20260718, base: [] };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function genBase(seed){
  var t = seed >>> 0;
  function rnd(){
    t = (t + 0x6D2B79F5) | 0;
    var r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  }
  var a = [], i;
  for (i = 0; i < NSTEP * 2 + 8; i++){
    var u = Math.max(1e-9, rnd()), v = rnd();
    a.push(Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v));
  }
  return a;
}
st.base = genBase(st.seed);
function trueX(k){ return X0 + VX * k * DT; }
function trueY(k){ return Y0 + VY * k * DT; }

function runSim(upto){
  var kfx = { x: trueX(0), P: 4 }, kfy = { x: trueY(0), P: 4 };
  var ux = VX * DT, uy = VY * DT, R = st.sig * st.sig;
  var est = [], gps = [], k, z;
  for (k = 0; k <= upto; k++){
    if (k > 0){
      kfx.x += ux; kfx.P += st.Q;
      kfy.x += uy; kfy.P += st.Q;
    }
    if (k % GPS_EVERY === 0){
      z = { x: trueX(k) + st.sig * st.base[2 * k], y: trueY(k) + st.sig * st.base[2 * k + 1] };
      gps.push(z);
      var Kx = kfx.P / (kfx.P + R);
      kfx.x += Kx * (z.x - kfx.x); kfx.P *= (1 - Kx);
      var Ky = kfy.P / (kfy.P + R);
      kfy.x += Ky * (z.y - kfy.x); kfy.P *= (1 - Ky);
    }
    est.push({ x: kfx.x, y: kfy.x });
  }
  return { est: est, gps: gps };
}

var L = 48, R = W - 16, T = 46, B = 448;
function draw(){
  var sim = runSim(st.step), pad = Math.max(3 * st.sig, 2);
  var xLo = trueX(0) - pad, xHi = trueX(NSTEP) + pad;
  var yLo = trueY(0) - pad, yHi = trueY(NSTEP) + pad;
  function X(x){ return L + (x - xLo) / (xHi - xLo) * (R - L); }
  function Y(y){ return B - (y - yLo) / (yHi - yLo) * (B - T); }

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(L, T, R - L, B - T);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(L, T); ctx.lineTo(L, B); ctx.lineTo(R, B); ctx.stroke();

  ctx.strokeStyle = PAL.muted; ctx.lineWidth = 2; ctx.setLineDash([7, 5]);
  ctx.beginPath();
  ctx.moveTo(X(trueX(0)), Y(trueY(0)));
  ctx.lineTo(X(trueX(NSTEP)), Y(trueY(NSTEP)));
  ctx.stroke(); ctx.setLineDash([]);

  var i;
  ctx.fillStyle = PAL.high;
  for (i = 0; i < sim.gps.length; i++){
    ctx.beginPath(); ctx.arc(X(sim.gps[i].x), Y(sim.gps[i].y), 3.2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.6; ctx.beginPath();
  for (i = 0; i < sim.est.length; i++){
    if (i) ctx.lineTo(X(sim.est[i].x), Y(sim.est[i].y));
    else ctx.moveTo(X(sim.est[0].x), Y(sim.est[0].y));
  }
  ctx.stroke();

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('x = 2 + 1.6 t,   y = 3 + t    ·    GPS 매 5스텝', L, 28);
}

$('sig').addEventListener('input', function(){ st.sig = parseFloat(this.value); $('sv').textContent = st.sig.toFixed(2); draw(); });
$('q').addEventListener('input', function(){ st.Q = parseFloat(this.value); $('qv').textContent = st.Q.toFixed(2); draw(); });
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.sig = 1; st.Q = 0.05; st.step = 0; st.running = true;
  st.seed += 7919; st.base = genBase(st.seed);
  $('sig').value = 1; $('sv').textContent = '1.00';
  $('q').value = 0.05; $('qv').textContent = '0.05';
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  draw();
});
var last = 0, acc = 0;
function loop(now){
  var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  if (st.running){
    acc += dt * 28;
    while (acc >= 1 && st.step < NSTEP){ st.step += 1; acc -= 1; }
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
