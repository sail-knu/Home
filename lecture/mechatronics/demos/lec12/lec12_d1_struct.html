<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L12-D1 · P / PI / PD / PID</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">메카트로닉스 12강</p>
  <h1>P / PI / PD / PID</h1>
  <p class="lede">같은 게인이라도 <b>구조</b>가 다르면 곡선이 다릅니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">K<sub>p</sub> <span class="big-val" id="kpv">6.0</span></p>
        <input type="range" id="kp" min="1" max="12" step="0.1" value="6">
      </div>
      <div>
        <p class="ctrl-title">K<sub>i</sub> <span class="big-val" id="kiv">3.0</span></p>
        <input type="range" id="ki" min="0" max="8" step="0.1" value="3">
      </div>
      <div>
        <p class="ctrl-title">K<sub>d</sub> <span class="big-val" id="kdv">1.5</span></p>
        <input type="range" id="kd" min="0" max="4" step="0.1" value="1.5">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="440"></canvas>
    <div class="legend">
      <span><i style="background:var(--high);border-top:2px dashed var(--high);height:0;background:transparent;border-top:2px dashed var(--high)"></i>목표 r = 1</span>
      <span><i style="background:var(--muted)"></i>P</span>
      <span><i style="background:var(--ok)"></i>PI</span>
      <span><i style="background:var(--float)"></i>PD</span>
      <span><i style="background:var(--accent)"></i>PID</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>메카트로닉스 12강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var WN = 2, ZETA = 0.3, REF = 1, TEND = 10, DT = 0.002;
var st = { Kp: 6, Ki: 3, Kd: 1.5, t: 0, running: true };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','ok','float','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); cache = null; draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); cache = null; draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function simulate(useI, useD){
  var ki = useI ? st.Ki : 0, kd = useD ? st.Kd : 0;
  var y = 0, v = 0, I = 0, acc, e, u;
  var ys = [0], n = Math.round(TEND / DT), k, every = 5;
  for (k = 1; k <= n; k++){
    e = REF - y;
    u = st.Kp * e + ki * I + kd * (-v);
    acc = WN * WN * (u - y) - 2 * ZETA * WN * v;
    y += v * DT;
    v += acc * DT;
    I += e * DT;
    if (k % every === 0) ys.push(y);
  }
  return ys;
}
var cache = null;
function rebuild(){
  cache = [
    { y: simulate(false, false), c: PAL.muted, w: 2.0 },
    { y: simulate(true, false),  c: PAL.ok,    w: 2.3 },
    { y: simulate(false, true),  c: PAL.float, w: 2.3 },
    { y: simulate(true, true),   c: PAL.accent,w: 2.8 }
  ];
}

var L = 58, R = W - 18, T = 48, B = 400;
function draw(){
  if (!cache) rebuild();
  var curves = cache;
  var n = curves[0].y.length, hi = 1.35, lo = -0.15, i, j;
  for (i = 0; i < 4; i++){
    for (j = 0; j < n; j++){
      if (curves[i].y[j] > hi) hi = curves[i].y[j];
    }
  }
  hi = Math.max(1.35, hi * 1.08);
  var tmax = st.t;
  var upto = Math.max(2, Math.min(n, Math.floor(tmax / TEND * (n - 1)) + 1));
  function X(k){ return L + k / (n - 1) * (R - L); }
  function Y(v){ return T + (hi - v) / (hi - lo) * (B - T); }

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(L, T, R - L, B - T);
  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
  var gv;
  for (gv = 0; gv <= hi + 1e-9; gv += 0.5){
    ctx.beginPath(); ctx.moveTo(L, Y(gv)); ctx.lineTo(R, Y(gv)); ctx.stroke();
  }
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(L, T); ctx.lineTo(L, B); ctx.lineTo(R, B); ctx.stroke();

  ctx.strokeStyle = PAL.high; ctx.lineWidth = 1.6; ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.moveTo(L, Y(REF)); ctx.lineTo(R, Y(REF)); ctx.stroke();
  ctx.setLineDash([]);

  for (i = 0; i < 4; i++){
    ctx.strokeStyle = curves[i].c; ctx.lineWidth = curves[i].w; ctx.beginPath();
    for (j = 0; j < upto; j++){
      if (j) ctx.lineTo(X(j), Y(curves[i].y[j]));
      else ctx.moveTo(X(0), Y(curves[i].y[0]));
    }
    ctx.stroke();
  }

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('ÿ = ωₙ²(u − y) − 2ζωₙ ẏ   ·   r = 1', L, 28);
  ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'center';
  var ts;
  for (ts = 0; ts <= TEND; ts += 2) ctx.fillText(String(ts), X(ts / TEND * (n - 1)), B + 22);
  ctx.fillText('t [s]', (L + R) / 2, H - 8);
}

function sync(){
  $('kpv').textContent = st.Kp.toFixed(1);
  $('kiv').textContent = st.Ki.toFixed(1);
  $('kdv').textContent = st.Kd.toFixed(1);
}
$('kp').addEventListener('input', function(){ st.Kp = parseFloat(this.value); st.t = 0; cache = null; sync(); draw(); });
$('ki').addEventListener('input', function(){ st.Ki = parseFloat(this.value); st.t = 0; cache = null; sync(); draw(); });
$('kd').addEventListener('input', function(){ st.Kd = parseFloat(this.value); st.t = 0; cache = null; sync(); draw(); });
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.Kp = 6; st.Ki = 3; st.Kd = 1.5; st.t = 0; st.running = true; cache = null;
  $('kp').value = 6; $('ki').value = 3; $('kd').value = 1.5;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  sync(); draw();
});
var last = 0;
function loop(now){
  var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  if (st.running){
    st.t += dt * 2.2;
    if (st.t > TEND) st.t = TEND;
  }
  draw();
  requestAnimationFrame(loop);
}
sync();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
