<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L6-D3 · 질량–스프링–댐퍼</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">메카트로닉스 6강</p>
  <h1>질량–스프링–댐퍼</h1>
  <p class="lede">c만 바꾸면 <b>감쇠 종류</b>가 바뀝니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">질량 m <span class="big-val" id="mv">1.00</span></p>
        <input type="range" id="m" min="0.5" max="4" step="0.05" value="1">
      </div>
      <div>
        <p class="ctrl-title">감쇠 c <span class="big-val" id="cvl">4.0</span></p>
        <input type="range" id="c" min="0" max="12" step="0.1" value="4">
      </div>
      <div>
        <p class="ctrl-title">강성 k <span class="big-val" id="kv">25</span></p>
        <input type="range" id="k" min="8" max="80" step="0.5" value="25">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="500"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>x(t), x₀=1, F=0</span>
      <span><i style="background:var(--ok)"></i>임계 ζ=1</span>
      <span><i style="background:var(--float)"></i>현재 시각</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>메카트로닉스 6강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var X0 = 1, TMAX = 6, NS = 420;
var st = { m: 1, c: 4, k: 25, t: 0, running: true };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','float','ok','bad','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function freeX(t, z, wn){
  if (Math.abs(z - 1) < 1e-4) return X0 * (1 + wn * t) * Math.exp(-wn * t);
  if (z < 1){
    var wd = wn * Math.sqrt(Math.max(1e-12, 1 - z * z));
    return X0 * Math.exp(-z * wn * t) * (Math.cos(wd * t) + (z * wn / wd) * Math.sin(wd * t));
  }
  var a = z * wn, b = wn * Math.sqrt(z * z - 1);
  return X0 * Math.exp(-a * t) * (Math.cosh(b * t) + (a / b) * Math.sinh(b * t));
}
function klass(z){
  if (Math.abs(z - 1) < 1e-3) return { name: '임계감쇠  ζ = 1', col: 'ok' };
  if (z < 1) return { name: '부족감쇠  ζ < 1', col: 'accent' };
  return { name: '과도감쇠  ζ > 1', col: 'high' };
}

function hatchWall(x, y0, y1){
  ctx.fillStyle = PAL.grid;
  ctx.fillRect(x - 18, y0, 18, y1 - y0);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
}
function spring(x0, y, x1){
  var n = 7, i, coil0 = 14, span = x1 - x0 - 28, cw = span / (n * 2);
  ctx.strokeStyle = PAL.muted; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + coil0, y);
  for (i = 0; i < n * 2; i++){
    ctx.lineTo(x0 + coil0 + (i + 1) * cw, y + (i % 2 === 0 ? -11 : 11));
  }
  ctx.lineTo(x1, y); ctx.stroke();
}

var L = 64, R = W - 22, PT = 188, PB = 458;
function Xp(t){ return L + t / TMAX * (R - L); }
function Yp(v){ return PT + (1.25 - v) / 2.5 * (PB - PT); }

function draw(){
  var m = st.m, c = st.c, k = st.k;
  var wn = Math.sqrt(k / m);
  var z = c / (2 * Math.sqrt(m * k));
  var rg = klass(z);
  var tc = ((st.t % TMAX) + TMAX) % TMAX;
  var xc = freeX(tc, z, wn);
  var i;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('ẍ + 2ζωₙẋ + ωₙ²x = 0', 24, 28);
  ctx.fillStyle = PAL[rg.col]; ctx.font = '13px Consolas, monospace'; ctx.textAlign = 'right';
  ctx.fillText('ωₙ=' + wn.toFixed(2) + '   ζ=' + z.toFixed(2) + '   ' + rg.name, W - 22, 28);

  hatchWall(50, 48, 168);
  var rest = 430, mw = 72, mh = 56;
  var mx = rest + xc * 110;
  spring(50, 96, mx);
  ctx.fillStyle = PAL.accent;
  ctx.fillRect(mx, 68, mw, mh);
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent-ink').trim() || '#fff';
  ctx.font = 'bold 18px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('m', mx + mw / 2, 102);
  ctx.fillStyle = PAL.float; ctx.font = '13px ' + FONT;
  ctx.fillText('x = ' + xc.toFixed(2), mx + mw / 2, 158);

  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(L, PT, R - L, PB - PT);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(L, PT); ctx.lineTo(L, PB); ctx.lineTo(R, PB); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(L, Yp(0)); ctx.lineTo(R, Yp(0)); ctx.stroke();

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.5; ctx.beginPath();
  for (i = 0; i <= NS; i++){
    var ti = i / NS * TMAX, yi = freeX(ti, z, wn);
    if (i) ctx.lineTo(Xp(ti), Yp(yi)); else ctx.moveTo(Xp(0), Yp(yi));
  }
  ctx.stroke();
  ctx.strokeStyle = PAL.float; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(Xp(tc), PT); ctx.lineTo(Xp(tc), PB); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = PAL.float;
  ctx.beginPath(); ctx.arc(Xp(tc), Yp(xc), 6, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'center';
  for (i = 0; i <= 6; i++) ctx.fillText(i + ' s', Xp(i), PB + 20);
}

function sync(){
  $('mv').textContent = st.m.toFixed(2);
  $('cvl').textContent = st.c.toFixed(1);
  $('kv').textContent = String(Math.round(st.k) === st.k ? st.k : st.k.toFixed(1));
  $('m').value = st.m; $('c').value = st.c; $('k').value = st.k;
}
$('m').addEventListener('input', function(){ st.m = parseFloat(this.value); st.t = 0; sync(); draw(); });
$('c').addEventListener('input', function(){ st.c = parseFloat(this.value); st.t = 0; sync(); draw(); });
$('k').addEventListener('input', function(){ st.k = parseFloat(this.value); st.t = 0; sync(); draw(); });
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.m = 1; st.c = 4; st.k = 25; st.t = 0; st.running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  sync(); draw();
});
var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running) st.t += dt;
  draw();
  requestAnimationFrame(loop);
}
sync();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
