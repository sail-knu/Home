<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L2-D4 · 정확도 vs 정밀도</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">메카트로닉스 2강</p>
  <h1>정확도 vs 정밀도</h1>
  <p class="lede">정확도는 <b>편향 b</b>, 정밀도는 <b>산포 σ</b>입니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">편향 b <span class="big-val" id="bv">0.00</span></p>
        <input type="range" id="b" min="0" max="1.5" step="0.01" value="0">
      </div>
      <div>
        <p class="ctrl-title">산포 σ <span class="big-val" id="sv">0.80</span></p>
        <input type="range" id="s" min="0.05" max="1" step="0.01" value="0.80">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="500"></canvas>
    <div class="legend">
      <span><i style="background:var(--high);height:8px;width:8px;border-radius:50%;vertical-align:1px"></i>참값 x</span>
      <span><i style="background:var(--muted);height:8px;width:8px;border-radius:50%;vertical-align:1px"></i>측정 z<sub>k</sub></span>
      <span><i style="background:var(--accent)"></i>표본 평균</span>
    </div>
    <div class="btn-row">
      <button class="btn" id="p1">정확·정밀</button>
      <button class="btn" id="p2">정확·부정밀</button>
      <button class="btn" id="p3">부정확·정밀</button>
      <button class="btn" id="p4">부정확·부정밀</button>
      <button class="btn" id="reset">🎲 다시 측정</button>
    </div>
  </div>
</section>
</main>
<footer>메카트로닉스 2강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var N = 36, DIR = Math.SQRT1_2, CX = 450, CY = 268, SCALE = 88;
var st = { b: 0, sigma: 0.80, base: [] };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','float','ok','bad','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function genBase(seed){
  var t = seed >>> 0;
  function rnd(){
    t = (t + 0x6D2B79F5) | 0;
    var r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  }
  var a = [], i;
  for (i = 0; i < N * 2; i++){
    var u = Math.max(1e-9, rnd()), v = rnd();
    a.push(Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v));
  }
  return a;
}
st.base = genBase(20260718);
function px(ux, uy){ return [CX + ux * SCALE, CY - uy * SCALE]; }

function draw(){
  var b = st.b, sig = st.sigma, k;
  var bx = b * DIR, by = b * DIR;
  var xs = [], ys = [], sx = 0, sy = 0;
  for (k = 0; k < N; k++){
    var x = bx + sig * st.base[2 * k];
    var y = by + sig * st.base[2 * k + 1];
    xs.push(x); ys.push(y); sx += x; sy += y;
  }
  var mx = sx / N, my = sy / N;
  var offset = Math.hypot(mx, my);
  var ss = 0;
  for (k = 0; k < N; k++) ss += (xs[k] - mx) * (xs[k] - mx) + (ys[k] - my) * (ys[k] - my);
  var sdev = Math.sqrt(ss / (2 * N - 2));

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(24, 48, W - 48, H - 70);
  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(CX - 230, CY); ctx.lineTo(CX + 230, CY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX, CY - 200); ctx.lineTo(CX, CY + 200); ctx.stroke();
  [0.5, 1, 1.5, 2].forEach(function(r){
    ctx.beginPath(); ctx.arc(CX, CY, r * SCALE, 0, Math.PI * 2); ctx.stroke();
  });

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('zₖ = x + b + vₖ', 36, 30);
  ctx.font = '13px Consolas, monospace'; ctx.textAlign = 'right';
  ctx.fillStyle = PAL.high;
  ctx.fillText('편향 ' + offset.toFixed(2), W - 160, 30);
  ctx.fillStyle = PAL.accent;
  ctx.fillText('산포 ' + sdev.toFixed(2), W - 36, 30);

  ctx.fillStyle = PAL.high;
  ctx.beginPath(); ctx.arc(CX, CY, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PAL.muted;
  for (k = 0; k < N; k++){
    var p = px(xs[k], ys[k]);
    ctx.beginPath(); ctx.arc(p[0], p[1], 3.4, 0, Math.PI * 2); ctx.fill();
  }
  var mp = px(mx, my);
  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.8;
  ctx.beginPath();
  ctx.moveTo(mp[0] - 10, mp[1]); ctx.lineTo(mp[0] + 10, mp[1]);
  ctx.moveTo(mp[0], mp[1] - 10); ctx.lineTo(mp[0], mp[1] + 10);
  ctx.stroke();
  if (offset * SCALE > 8){
    ctx.strokeStyle = PAL.high; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(mp[0], mp[1]); ctx.stroke();
  }
}

function sync(){
  $('b').value = st.b; $('s').value = st.sigma;
  $('bv').textContent = st.b.toFixed(2);
  $('sv').textContent = st.sigma.toFixed(2);
  draw();
}
$('b').addEventListener('input', function(){ st.b = parseFloat(this.value); $('bv').textContent = st.b.toFixed(2); draw(); });
$('s').addEventListener('input', function(){ st.sigma = parseFloat(this.value); $('sv').textContent = st.sigma.toFixed(2); draw(); });
function preset(b, sig){ st.b = b; st.sigma = sig; sync(); }
$('p1').addEventListener('click', function(){ preset(0.0, 0.15); });
$('p2').addEventListener('click', function(){ preset(0.0, 0.80); });
$('p3').addEventListener('click', function(){ preset(1.0, 0.15); });
$('p4').addEventListener('click', function(){ preset(1.0, 0.80); });
var tick = 1;
$('reset').addEventListener('click', function(){
  st.base = genBase(20260718 + tick * 7919); tick += 1; draw();
});
draw();
})();
</script>
</body>
</html>
