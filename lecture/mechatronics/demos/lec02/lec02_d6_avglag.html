<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L2-D6 · 평균 필터의 한계</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --c-true:#2a6fbb; --c-meas:#7aa3c9; --c-avg:#e07a28;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --c-true:#7eb6ee; --c-meas:#8aa8bc; --c-avg:#f0a05a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
  --c-true:#7eb6ee; --c-meas:#8aa8bc; --c-avg:#f0a05a;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --c-true:#2a6fbb; --c-meas:#7aa3c9; --c-avg:#e07a28;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:70ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:1fr;gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 14px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.eq{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:9px 14px;margin:0 0 14px;font-size:14.5px;text-align:center;font-variant-numeric:tabular-nums}
.eq b{color:var(--accent)}
.eq sub,.eq sup{font-size:.72em}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
.legend i.o{width:8px;height:8px;border-radius:50%;vertical-align:1px}
.legend i.d{height:0;background:none;border-top:3px dashed currentColor;border-radius:0;vertical-align:4px}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.note{margin:12px 0 0;padding:10px 13px;border-left:3px solid var(--c-avg);background:var(--surface2);
  border-radius:0 10px 10px 0;font-size:13.5px;color:var(--muted);line-height:1.55}
.note b{color:var(--text)}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">메카트로닉스 2강</p>
  <h1>평균 필터의 한계: 변하는 값에는 느리게 반응</h1>
  <p class="lede">측정이 시간에 따라 들어오고, 누적 평균이 그때그때 갱신됩니다. 참값이 변하면 <b>초반의 낮은 값</b>을 버리지 못해 한참 뒤처집니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">참값 기울기 a <span class="big-val" id="av">5.0</span> km/h/s</p>
        <input type="range" id="a" min="1" max="12" step="0.1" value="5">
      </div>
    </div>
    <div class="eq">
      측정 <b>z<sub>k</sub></b> = 참값 <b>x(t)</b> + 노이즈
      &nbsp;→&nbsp; 평균 <b>x̄<sub>k</sub></b> = (1/k) Σ z<sub>i</sub>
      &nbsp;&nbsp;<span style="color:var(--muted);font-size:.86em">램프 구간에서는 x̄ ≈ x / 2</span>
    </div>
    <canvas id="cv" class="sim" width="900" height="500"></canvas>
    <div class="legend">
      <span style="color:var(--c-true)"><i style="background:var(--c-true)"></i>참 속도</span>
      <span style="color:var(--c-meas)"><i class="o" style="background:var(--c-meas)"></i>노이즈 측정값</span>
      <span style="color:var(--c-avg)"><i class="d"></i>평균 필터 출력</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
    <p class="note" id="note">—</p>
  </div>
</section>
</main>
<footer>메카트로닉스 2강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var TMAX = 15, VMAX = 50, SIG = 2.4, DT = 0.1, SPEED = 1.5;
var N = Math.round(TMAX / DT) + 1;
var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var st = { slope: 5, t: reduceMotion ? TMAX : 0, running: !reduceMotion, base: [] };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','grid','c-true','c-meas','c-avg'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Malgun Gothic", "Noto Sans KR", "Segoe UI", system-ui, sans-serif';

function genBase(seed){
  var t = seed >>> 0;
  function rnd(){
    t = (t + 0x6D2B79F5) | 0;
    var r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  }
  var a = [], i;
  for (i = 0; i < N; i++){
    var u = Math.max(1e-9, rnd()), v = rnd();
    a.push(Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v));
  }
  return a;
}
st.base = genBase(20260908);

function tru(t, slope){
  return Math.min(VMAX, slope * t);
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function syncPlayBtn(){
  var btn = $('play');
  if (!btn) return;
  if (st.running){
    btn.textContent = '⏸ 일시정지';
    btn.classList.add('btn-acc');
  } else {
    btn.textContent = st.t >= TMAX - 1e-6 ? '▶ 다시' : '▶ 재생';
    btn.classList.remove('btn-acc');
  }
}

var L = 72, R = W - 28, T = 44, B = 448;
function draw(){
  var slope = st.slope, k, t;
  var tNow = Math.max(0, Math.min(TMAX, st.t));
  var nShow = Math.max(1, Math.min(N, Math.floor(tNow / DT + 1e-9) + 1));
  var tRamp = Math.min(TMAX, VMAX / slope);
  var z = [], avg = [], xs = [], ys = [], sum = 0;
  for (k = 0; k < nShow; k++){
    t = k * DT;
    var xk = tru(t, slope);
    var zk = xk + SIG * st.base[k];
    sum += zk;
    xs.push(t); ys.push(xk); z.push(zk); avg.push(sum / (k + 1));
  }
  var lastX = ys[nShow - 1], lastZ = z[nShow - 1], lastA = avg[nShow - 1];
  var yLo = -2, yHi = 62;
  function X(v){ return L + v / TMAX * (R - L); }
  function Y(v){ return T + (yHi - v) / (yHi - yLo) * (B - T); }

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(L, T, R - L, B - T);

  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
  var g;
  for (g = 0; g <= 60; g += 10){
    ctx.beginPath(); ctx.moveTo(L, Y(g)); ctx.lineTo(R, Y(g)); ctx.stroke();
  }
  for (g = 0; g <= TMAX; g += 5){
    ctx.beginPath(); ctx.moveTo(X(g), T); ctx.lineTo(X(g), B); ctx.stroke();
  }

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(L, T); ctx.lineTo(L, B); ctx.lineTo(R, B); ctx.stroke();

  if (tRamp < TMAX - 0.05 && tNow >= tRamp){
    ctx.strokeStyle = PAL.faint; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(X(tRamp), T); ctx.lineTo(X(tRamp), B); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PAL.faint; ctx.font = '11.5px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText('정체 시작 ' + tRamp.toFixed(1) + ' s', X(tRamp), T + 14);
  }

  ctx.strokeStyle = PAL['c-true']; ctx.lineWidth = 2.6;
  ctx.beginPath();
  for (k = 0; k < nShow; k++){
    if (k) ctx.lineTo(X(xs[k]), Y(ys[k])); else ctx.moveTo(X(xs[k]), Y(ys[k]));
  }
  ctx.stroke();

  ctx.fillStyle = PAL['c-meas'];
  for (k = 0; k < nShow; k++){
    ctx.beginPath(); ctx.arc(X(xs[k]), Y(z[k]), 2.15, 0, Math.PI * 2); ctx.fill();
  }

  ctx.strokeStyle = PAL['c-avg']; ctx.lineWidth = 2.5; ctx.setLineDash([7, 5]);
  ctx.beginPath();
  for (k = 0; k < nShow; k++){
    if (k) ctx.lineTo(X(xs[k]), Y(avg[k])); else ctx.moveTo(X(xs[k]), Y(avg[k]));
  }
  ctx.stroke(); ctx.setLineDash([]);

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 1.2; ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.moveTo(X(tNow), T); ctx.lineTo(X(tNow), B); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = PAL['c-meas'];
  ctx.beginPath(); ctx.arc(X(xs[nShow - 1]), Y(lastZ), 5.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PAL['c-avg'];
  ctx.beginPath(); ctx.arc(X(xs[nShow - 1]), Y(lastA), 6.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = PAL.surface2; ctx.lineWidth = 1.6; ctx.stroke();

  var iAnn = Math.round(Math.min(tRamp, TMAX * 0.7) / DT);
  iAnn = Math.max(20, Math.min(nShow - 1, iAnn));
  if (nShow > 28 && iAnn >= 20){
    var ax = X(xs[iAnn]), ay = Y(avg[iAnn]);
    var label = '초반 낮은 값들이 평균을 끌어내림';
    ctx.font = 'bold 13px ' + FONT;
    var tw = ctx.measureText(label).width;
    var boxW = tw + 18, boxH = 28;
    var bx = Math.min(R - boxW - 6, Math.max(L + 8, ax + 36));
    var by = Math.max(T + 22, ay - 56);
    if (by + boxH + 8 > B) by = ay - boxH - 18;

    ctx.strokeStyle = PAL['c-avg']; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx + 10, by + boxH); ctx.stroke();
    ctx.fillStyle = PAL['c-avg'];
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax + 7, ay - 5);
    ctx.lineTo(ax + 7, ay + 5);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = PAL.surface2;
    ctx.strokeStyle = PAL['c-avg']; ctx.lineWidth = 1.4;
    roundRect(bx, by, boxW, boxH, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = PAL['c-avg']; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(label, bx + 9, by + boxH / 2);
    ctx.textBaseline = 'alphabetic';
  }

  ctx.fillStyle = PAL.faint; ctx.font = '12px ' + FONT; ctx.textAlign = 'right';
  for (g = 0; g <= 60; g += 10) ctx.fillText(String(g), L - 8, Y(g) + 4);
  ctx.textAlign = 'center';
  for (g = 0; g <= TMAX; g += 5) ctx.fillText(String(g), X(g), B + 18);

  ctx.fillStyle = PAL.muted; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'center';
  ctx.save();
  ctx.translate(18, (T + B) / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('속도 [km/h]', 0, 0);
  ctx.restore();
  ctx.fillText('시간 [s]', (L + R) / 2, H - 10);

  ctx.fillStyle = PAL.text; ctx.font = 'bold 15px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('x̄ₖ = x̄ₖ₋₁ + (1/k)(zₖ − x̄ₖ₋₁)', L, 28);
  ctx.fillStyle = PAL['c-avg']; ctx.font = '13px Consolas, "Malgun Gothic", monospace'; ctx.textAlign = 'right';
  ctx.fillText('t = ' + tNow.toFixed(1) + ' s   참 ' + lastX.toFixed(1) +
    '   측정 ' + lastZ.toFixed(1) + '   평균 ' + lastA.toFixed(1) + ' km/h', R, 28);

  var note = $('note');
  var half = lastX > 1 ? (lastA / lastX) : 0;
  if (tNow < 1.2){
    note.innerHTML = '측정이 들어오고 평균이 <b>한 점씩</b> 갱신됩니다. 기울기만 바꾸면 처음부터 다시 돌아갑니다.';
  } else if (tNow < tRamp - 0.15){
    note.innerHTML = 't = <b>' + tNow.toFixed(1) + ' s</b> · 참값 ' + lastX.toFixed(1) +
      ' · 평균 <b>' + lastA.toFixed(1) + ' km/h</b>. 램프 구간이라 평균이 참값의 약 <b>' +
      (100 * half).toFixed(0) + '%</b>에 머뭅니다.';
  } else if (tNow < TMAX - 0.05 && tRamp < TMAX){
    note.innerHTML = '참값은 이미 <b>' + VMAX + ' km/h</b>에서 멈췄지만, 초반 낮은 값이 남아서 평균은 <b>' +
      lastA.toFixed(1) + ' km/h</b>에서 천천히 따라갑니다.';
  } else if (tRamp < TMAX - 0.05){
    note.innerHTML = '기울기 <b>' + slope.toFixed(1) + ' km/h/s</b> → ' + tRamp.toFixed(1) +
      ' s에 ' + VMAX + ' km/h 도달. 정체 뒤에도 초반 값이 남아서 15 s 평균은 <b>' +
      lastA.toFixed(1) + ' km/h</b>입니다.';
  } else {
    note.innerHTML = '기울기 <b>' + slope.toFixed(1) + ' km/h/s</b>로는 15 s 안에 ' + VMAX +
      ' km/h에 못 미칩니다. 누적 평균은 늘 <b>참값의 약 절반</b>(' +
      lastX.toFixed(1) + ' → ' + lastA.toFixed(1) + ' km/h)입니다.';
  }
}

function restart(){
  st.t = 0;
  st.running = true;
  syncPlayBtn();
}

$('a').addEventListener('input', function(){
  st.slope = parseFloat(this.value);
  $('av').textContent = st.slope.toFixed(1);
  restart();
});
$('play').addEventListener('click', function(){
  if (st.t >= TMAX - 1e-6 && !st.running){
    st.t = 0;
    st.running = true;
  } else {
    st.running = !st.running;
  }
  syncPlayBtn();
});
$('reset').addEventListener('click', restart);

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  if (st.running){
    st.t += dt * SPEED;
    if (st.t >= TMAX){
      st.t = TMAX;
      st.running = false;
      syncPlayBtn();
    }
  }
  draw();
  requestAnimationFrame(loop);
}
syncPlayBtn();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
