<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개루프 vs 폐루프 — 1강 데모</title>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --high-soft:#fbe9e6;
  --low:#2f66ad; --low-soft:#e7eefb;
  --float:#8a56c8; --float-soft:#f0e8fa;
  --ok:#177a4c; --ok-soft:#e2f3e9; --bad:#bb4038; --bad-soft:#fbe9e8;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --high-soft:#3c211d;
    --low:#82b4f0; --low-soft:#182f4a;
    --float:#b58ae6; --float-soft:#2b1e40;
    --ok:#5cc793; --ok-soft:#153426; --bad:#f09289; --bad-soft:#3d1f1c;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --high-soft:#3c211d;
  --low:#82b4f0; --low-soft:#182f4a;
  --float:#b58ae6; --float-soft:#2b1e40;
  --ok:#5cc793; --ok-soft:#153426; --bad:#f09289; --bad-soft:#3d1f1c;
  --plot-bg:#0e2429; --grid:#1e3d44;
  --mass:#4d7d86; --mass-ink:#e6f4f4;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --high-soft:#fbe9e6;
  --low:#2f66ad; --low-soft:#e7eefb;
  --float:#8a56c8; --float-soft:#f0e8fa;
  --ok:#177a4c; --ok-soft:#e2f3e9; --bad:#bb4038; --bad-soft:#fbe9e8;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px;-webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
.wrap{max-width:1024px;margin:0 auto;padding:0 20px}
.wrap.wide{max-width:1320px}
.hero{padding-top:42px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.02em}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
section{margin:38px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-bar .cb{min-width:0}
.ctrl-bar .ctrl-title{margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl-bar input[type=range]{width:100%;display:block;accent-color:var(--accent)}
@media (max-width:1000px){.ctrl-bar{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.ctrl-bar{grid-template-columns:1fr}}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:-.01em}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);
  border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
.legend i.d{height:0;background:none;border-top:3px dashed currentColor;width:16px}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-acc:hover{color:var(--accent-ink);opacity:.92}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<header class="hero wrap wide" style="padding-top:26px">
  <p class="eyebrow">메카트로닉스 1강</p>
  <h1>개루프 vs 폐루프</h1>
  <p class="lede">개루프 = 스로틀 고정. 폐루프 = 오차 <b>e = r − y</b>를 보고 조절.</p>
</header>

<main class="wrap wide">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div class="cb">
        <p class="ctrl-title">목표 속도 r <span class="big-val" id="rVal">90</span> km/h</p>
        <input type="range" id="r" min="40" max="120" step="1" value="90">
      </div>
      <div class="cb">
        <p class="ctrl-title">폐루프 세기 K<sub>p</sub> <span class="big-val" id="kpVal">0.60</span></p>
        <input type="range" id="kp" min="0.05" max="2.50" step="0.05" value="0.60">
      </div>
      <div class="cb">
        <p class="ctrl-title">오르막 외란 <span class="big-val" id="dVal">18</span></p>
        <input type="range" id="dist" min="0" max="40" step="1" value="18">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="500"></canvas>
    <div class="legend">
      <span><i class="d" style="border-color:var(--faint)"></i>목표 r</span>
      <span><i style="background:var(--high)"></i>개루프 y</span>
      <span><i style="background:var(--accent)"></i>폐루프 y</span>
      <span><i style="background:var(--high);opacity:.35"></i>오르막</span>
    </div>
    <div class="btn-row" style="margin:12px 0 0">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>

<footer>메카트로닉스 1강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var GAIN = 130, TAU = 3.0, DT = 0.02, T_MAX = 40, U_MAX = 1.6;
var DIST_START = 16, DIST_END = 30, TAU_ACT = 0.8, DIST_SCALE = 0.16;
var NS = Math.round(T_MAX / DT);
var YOL = new Float64Array(NS + 1), YCL = new Float64Array(NS + 1);

var DEF = { r: 90, Kp: 0.60, dist: 18 };
var p = { r: DEF.r, Kp: DEF.Kp, dist: DEF.dist };
var tAnim = 0, running = true;

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['bg','surface','surface2','surface3','border','border2','text','muted','faint',
   'accent','accent-soft','accent-line','accent-ink','high','high-soft','low','low-soft',
   'float','ok','bad','plot-bg','grid','mass','mass-ink'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').addEventListener){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
}
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function distAt(t, dist){
  if (t < DIST_START || t > DIST_END) return 0;
  var ramp = 1.5, g = 1;
  if (t < DIST_START + ramp) g = (t - DIST_START) / ramp;
  else if (t > DIST_END - ramp) g = (DIST_END - t) / ramp;
  return dist * DIST_SCALE * Math.max(0, Math.min(1, g));
}
function distShape(t){
  if (t < DIST_START || t > DIST_END) return 0;
  var ramp = 1.5, g = 1;
  if (t < DIST_START + ramp) g = (t - DIST_START) / ramp;
  else if (t > DIST_END - ramp) g = (DIST_END - t) / ramp;
  return Math.max(0, Math.min(1, g));
}
function plantStep(v, uAct, uCmd, d){
  uAct += (uCmd - uAct) / TAU_ACT * DT;
  v = Math.max(0, v + ((GAIN * uAct - v) / TAU - d) * DT);
  return { v: v, u: uAct };
}

function recompute(){
  var r = p.r, Kp = p.Kp, dist = p.dist;
  var uOpen = clamp(r / GAIN, 0, U_MAX);
  var vOl = 0, uOl = 0, vCl = 0, uCl = 0, t = 0, i, d, s;
  YOL[0] = 0; YCL[0] = 0;
  for (i = 1; i <= NS; i++){
    d = distAt(t, dist);
    s = plantStep(vOl, uOl, uOpen, d);
    vOl = s.v; uOl = s.u;
    s = plantStep(vCl, uCl, clamp(Kp * (r - vCl) / GAIN, 0, U_MAX), d);
    vCl = s.v; uCl = s.u;
    t += DT;
    YOL[i] = vOl; YCL[i] = vCl;
  }
}

var ROAD_X0 = 32, ROAD_X1 = 868, CAR_X = 220, ROAD_Y = 248;
var PX_PER_S = 22, HILL_H = 42;
var PL = 64, PR = 876, PT = 322, PB = 470, VLO = 0, VHI = 130;
function ty(v){ return PT + (1 - (v - VLO) / (VHI - VLO)) * (PB - PT); }
function tx(t){ return PL + t / T_MAX * (PR - PL); }

function roundRect(x, y, w, h, rad){
  ctx.beginPath();
  ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad); ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad); ctx.closePath();
}
function dashLine(x1, y1, x2, y2, color, lw, dash, alpha){
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash(dash);
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}
function roadPx(px, tA){
  return ROAD_Y - distShape(tA + (px - CAR_X) / PX_PER_S) * HILL_H;
}
function drawCar(x, y, col, soft, name, v){
  ctx.fillStyle = PAL.mass;
  ctx.beginPath(); ctx.arc(x - 28, y + 16, 9, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 32, y + 16, 9, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x - 28, y + 16, 9, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x + 32, y + 16, 9, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = PAL.surface2; ctx.beginPath(); ctx.arc(x - 28, y + 16, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 32, y + 16, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = soft; ctx.strokeStyle = col; ctx.lineWidth = 2.4;
  roundRect(x - 54, y - 10, 112, 28, 9); ctx.fill(); ctx.stroke();
  ctx.fillStyle = PAL.surface; roundRect(x - 18, y - 28, 52, 20, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = col; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(v.toFixed(0), x + 8, y + 4);
  ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText(name + '  ' + v.toFixed(0) + ' km/h', x + 68, y + 6);
}

function draw(){
  var tA = Math.min(tAnim, T_MAX);
  var i = Math.min(NS, Math.round(tA / DT));
  var yOl = YOL[i], yCl = YCL[i];
  var px;

  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = PAL.surface; ctx.fillRect(18, 14, 864, 272);
  ctx.strokeStyle = PAL.border; ctx.lineWidth = 1; ctx.strokeRect(18.5, 14.5, 864, 272);

  var hx0 = CAR_X + (DIST_START - tA) * PX_PER_S;
  var hx1 = CAR_X + (DIST_END - tA) * PX_PER_S;
  var wy = roadPx(CAR_X, tA);

  ctx.save();
  ctx.beginPath(); ctx.rect(ROAD_X0, 14, ROAD_X1 - ROAD_X0, 272); ctx.clip();
  ctx.beginPath(); ctx.moveTo(ROAD_X0, roadPx(ROAD_X0, tA));
  for (px = ROAD_X0; px <= ROAD_X1; px += 2) ctx.lineTo(px, roadPx(px, tA));
  ctx.lineTo(ROAD_X1, 284); ctx.lineTo(ROAD_X0, 284); ctx.closePath();
  ctx.globalAlpha = .13; ctx.fillStyle = PAL.high; ctx.fill(); ctx.globalAlpha = 1;
  if (hx1 > ROAD_X0 && hx0 < ROAD_X1){
    var x0 = Math.max(ROAD_X0, hx0), x1 = Math.min(ROAD_X1, hx1);
    ctx.beginPath(); ctx.moveTo(x0, ROAD_Y);
    for (px = x0; px <= x1; px += 2) ctx.lineTo(px, roadPx(px, tA));
    ctx.lineTo(x1, ROAD_Y); ctx.closePath();
    ctx.globalAlpha = .22; ctx.fillStyle = PAL.high; ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = PAL.high; ctx.font = 'bold 12px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText('오르막', (x0 + x1) / 2, ROAD_Y - HILL_H - 12);
  }
  ctx.strokeStyle = PAL.high; ctx.lineWidth = 2.6; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(ROAD_X0, roadPx(ROAD_X0, tA));
  for (px = ROAD_X0; px <= ROAD_X1; px += 2) ctx.lineTo(px, roadPx(px, tA));
  ctx.stroke();
  ctx.restore();

  drawCar(CAR_X, wy - 86, PAL.high, PAL['high-soft'], '개루프', yOl);
  drawCar(CAR_X, wy - 22, PAL.accent, PAL['accent-soft'], '폐루프', yCl);
  dashLine(CAR_X, 36, CAR_X, wy - 100, PAL.border2, 1, [4, 4]);

  ctx.textAlign = 'left'; ctx.fillStyle = PAL.text; ctx.font = 'bold 15px ' + FONT;
  ctx.fillText('속도 y(t) [km/h]', PL, 306);

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5; ctx.strokeRect(PL, PT, PR - PL, PB - PT);
  var gv;
  for (gv = 20; gv <= 120; gv += 20) dashLine(PL, ty(gv), PR, ty(gv), PAL.grid, 1, [3, 4]);
  ctx.font = '12.5px ' + FONT; ctx.fillStyle = PAL.faint; ctx.textAlign = 'right';
  for (gv = 0; gv <= 120; gv += 20) ctx.fillText(String(gv), PL - 8, ty(gv) + 4);
  ctx.textAlign = 'center';
  var gs;
  for (gs = 0; gs <= T_MAX; gs += 5){
    if (gs > 0 && gs < T_MAX) dashLine(tx(gs), PT, tx(gs), PB, PAL.grid, 1, [3, 4]);
    ctx.fillStyle = PAL.faint; ctx.fillText(gs + ' s', tx(gs), PB + 17);
  }

  ctx.save();
  ctx.beginPath(); ctx.rect(PL, PT, PR - PL, PB - PT); ctx.clip();
  ctx.globalAlpha = .16; ctx.fillStyle = PAL.high;
  ctx.fillRect(tx(DIST_START), PT, tx(DIST_END) - tx(DIST_START), PB - PT);
  ctx.globalAlpha = 1;

  var ry = ty(p.r);
  dashLine(PL, ry, PR, ry, PAL.faint, 1.8, [7, 5]);

  function strokeSeries(arr, color, upto, fade){
    var j, step = fade ? 3 : 2;
    ctx.strokeStyle = color; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    for (j = 0; j <= upto; j += step){
      if (j) ctx.lineTo(tx(j * DT), ty(arr[j])); else ctx.moveTo(tx(j * DT), ty(arr[j]));
    }
    if (upto % step) ctx.lineTo(tx(upto * DT), ty(arr[upto]));
    ctx.stroke();
  }
  ctx.lineWidth = 1.6; ctx.globalAlpha = .32;
  strokeSeries(YOL, PAL.high, NS, true);
  strokeSeries(YCL, PAL.accent, NS, true);
  ctx.globalAlpha = 1; ctx.lineWidth = 2.8;
  strokeSeries(YOL, PAL.high, i, false);
  strokeSeries(YCL, PAL.accent, i, false);
  ctx.restore();

  var cx = tx(tA);
  dashLine(cx, PT, cx, PB, PAL.faint, 1, [], .5);
  ctx.fillStyle = PAL.surface; ctx.lineWidth = 2.4;
  ctx.strokeStyle = PAL.high; ctx.beginPath(); ctx.arc(cx, ty(yOl), 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = PAL.accent; ctx.beginPath(); ctx.arc(cx, ty(yCl), 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}

function syncSpans(){
  $('rVal').textContent = String(p.r);
  $('kpVal').textContent = p.Kp.toFixed(2);
  $('dVal').textContent = String(p.dist);
  $('r').value = p.r; $('kp').value = p.Kp; $('dist').value = p.dist;
}
function bindSlider(id, key, parse){
  $(id).addEventListener('input', function(){
    p[key] = parse(this.value);
    syncSpans(); recompute(); draw();
  });
}
bindSlider('r', 'r', function(v){ return parseInt(v, 10); });
bindSlider('kp', 'Kp', parseFloat);
bindSlider('dist', 'dist', function(v){ return parseInt(v, 10); });

$('play').addEventListener('click', function(){
  running = !running;
  this.textContent = running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', running);
});
$('reset').addEventListener('click', function(){
  p = { r: DEF.r, Kp: DEF.Kp, dist: DEF.dist };
  tAnim = 0; running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncSpans(); recompute(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (running) tAnim += dt;
  if (tAnim > T_MAX + 0.8) tAnim = 0;
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
recompute();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
