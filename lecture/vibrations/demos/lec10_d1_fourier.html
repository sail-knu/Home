<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L10-D1 · 푸리에 급수 합성</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 10강</p>
  <h1>푸리에 급수 합성</h1>
  <p class="lede">항을 더할수록 파형에 다가가고, 불연속에서 Gibbs 오버슈트 ~9%가 남습니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">항 개수 N <span class="big-val" id="Nv">8</span></p>
        <input type="range" id="N" min="1" max="50" step="1" value="8">
      </div>
      <div>
        <p class="ctrl-title">파형</p>
        <div class="btn-row" style="margin:0">
          <button class="btn btn-acc" id="wsq">사각파</button>
          <button class="btn" id="wsaw">톱니파</button>
        </div>
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="420"></canvas>
    <div class="legend">
      <span><i style="background:var(--faint)"></i>목표 파형 F(t)</span>
      <span><i style="background:var(--accent)"></i>부분합 S(N, t)</span>
      <span><i style="background:var(--high)"></i>Gibbs 오버슈트</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 10강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var TWO_PI = Math.PI * 2;

var state = {
  wave: 'square',
  N: 8,
  showHarm: false,
  playing: true,
  paused: false,
  playN: 8,
  acc: 0
};

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','float','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
var MONO = 'Consolas, ui-monospace, monospace';

function bn(n){
  if (state.wave === 'square') return (n % 2 === 1) ? 4 / (n * Math.PI) : 0;
  return -1 / (Math.PI * n);
}
function a0half(){ return state.wave === 'square' ? 0 : 0.5; }
function partial(t, N){
  var s = a0half();
  for (var n = 1; n <= N; n++){
    var b = bn(n);
    if (b !== 0) s += b * Math.sin(n * t);
  }
  return s;
}
function target(t){
  var x = t % TWO_PI; if (x < 0) x += TWO_PI;
  if (state.wave === 'square') return x < Math.PI ? 1 : -1;
  return x / TWO_PI;
}

var topL = 62, topR = W - 26, topTop = 52, topBot = 378;
var tMin = 0, tMax = 2 * TWO_PI;
var yMin = -1.45, yMax = 1.45;
function tx(t){ return topL + (t - tMin) / (tMax - tMin) * (topR - topL); }
function ty(y){ return topBot - (y - yMin) / (yMax - yMin) * (topBot - topTop); }
function currentN(){ return state.N; }

function gibbsInfo(N){
  var td, jumpTop, jumpMag;
  if (state.wave === 'square'){ td = Math.PI; jumpTop = 1; jumpMag = 2; }
  else { td = TWO_PI; jumpTop = 1; jumpMag = 1; }
  var peak = -Infinity, peakT = td;
  var win = Math.PI, steps = 600;
  for (var i = 0; i <= steps; i++){
    var t = td - win * i / steps;
    var v = partial(t, N);
    if (v > peak){ peak = v; peakT = t; }
  }
  var over = (peak - jumpTop) / jumpMag;
  return { td:td, peak:peak, peakT:peakT, jumpTop:jumpTop, over: Math.max(0, over) };
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  var N = currentN();

  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(16, 14, 868, H - 28);

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  var name = state.wave === 'square' ? '사각파' : '톱니파';
  ctx.fillText(name + '  F(t) ≈ 부분합 S(N = ' + N + ', t)', 24, 38);

  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  for (var k = 0; k <= 4; k++){
    var Xg = tx(k * Math.PI);
    ctx.beginPath(); ctx.moveTo(Xg, topTop); ctx.lineTo(Xg, topBot); ctx.stroke();
  }
  [1, -1].forEach(function(v){
    ctx.beginPath(); ctx.moveTo(topL, ty(v)); ctx.lineTo(topR, ty(v)); ctx.stroke();
  });
  ctx.setLineDash([]);

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(topL, ty(0)); ctx.lineTo(topR, ty(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(topL, topTop); ctx.lineTo(topL, topBot); ctx.lineTo(topR, topBot); ctx.stroke();

  ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'right';
  [[1, '+1'], [0, '0'], [-1, '−1']].forEach(function(p){
    ctx.fillText(p[1], topL - 8, ty(p[0]) + 4);
  });
  ctx.textAlign = 'center';
  ['0', 'π', '2π', '3π', '4π'].forEach(function(lb, k){
    ctx.fillText(lb, tx(k * Math.PI), topBot + 19);
  });

  var stepsT = 1400, i, t, y, X, Y;
  ctx.strokeStyle = PAL.faint; ctx.lineWidth = 2; ctx.beginPath();
  var prev = null;
  for (i = 0; i <= stepsT; i++){
    t = tMin + (tMax - tMin) * i / stepsT;
    y = target(t); X = tx(t); Y = ty(y);
    if (prev === null) ctx.moveTo(X, Y);
    else if (Math.abs(y - prev) > 0.6){ ctx.lineTo(X, ty(prev)); ctx.lineTo(X, Y); }
    else ctx.lineTo(X, Y);
    prev = y;
  }
  ctx.stroke();

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.8; ctx.lineJoin = 'round'; ctx.beginPath();
  for (i = 0; i <= stepsT; i++){
    t = tMin + (tMax - tMin) * i / stepsT;
    y = partial(t, N); X = tx(t); Y = ty(y);
    if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
  }
  ctx.stroke();

  var g = gibbsInfo(N);
  if (g.over > 0.003){
    var mx = tx(g.peakT), my = ty(g.peak);
    ctx.strokeStyle = PAL.high; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
    ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx, ty(g.jumpTop)); ctx.stroke();
    ctx.globalAlpha = 1; ctx.setLineDash([]);
    ctx.fillStyle = PAL.high;
    ctx.beginPath(); ctx.arc(mx, my, 5, 0, TWO_PI); ctx.fill();
    ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'left';
    ctx.fillText('오버슈트 +' + (g.over * 100).toFixed(1) + '%', Math.min(mx + 10, topR - 150), my - 8);
  }

  ctx.textAlign = 'right'; ctx.font = '14px ' + MONO; ctx.fillStyle = PAL.muted;
  var formula = state.wave === 'square' ? 'bₙ = 4/(nπ)  홀수 n만' : 'a₀/2 = ½,  bₙ = −1/(πn)';
  ctx.fillText(formula + '   Gibbs +' + (g.over * 100).toFixed(1) + '%', topR, 38);
}

function setWave(w){
  state.wave = w;
  $('wsq').classList.toggle('btn-acc', w === 'square');
  $('wsaw').classList.toggle('btn-acc', w === 'sawtooth');
  draw();
}
function setPlay(on){
  state.playing = on;
  $('play').textContent = on ? '⏸ 일시정지' : '▶ 재생';
  $('play').classList.toggle('btn-acc', on);
}
function syncN(){
  $('N').value = state.N;
  $('Nv').textContent = String(state.N);
}

$('wsq').addEventListener('click', function(){ setWave('square'); });
$('wsaw').addEventListener('click', function(){ setWave('sawtooth'); });
$('N').addEventListener('input', function(){
  state.N = parseInt(this.value, 10);
  $('Nv').textContent = String(state.N);
  draw();
});
$('play').addEventListener('click', function(){ setPlay(!state.playing); });
$('reset').addEventListener('click', function(){
  state.N = 8; state.acc = 0;
  setWave('square');
  setPlay(true);
  syncN();
  draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  if (state.playing){
    state.acc += dt;
    if (state.acc > 0.35){
      state.acc = 0;
      state.N += 1;
      if (state.N > 50) state.N = 1;
      syncN();
    }
  }
  draw();
  requestAnimationFrame(loop);
}
setWave('square');
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
