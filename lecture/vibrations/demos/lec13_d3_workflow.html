<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L13-D3 · 모드해석 5단계</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
  --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 13강</p>
  <h1>모드해석 5단계</h1>
  <p class="lede">M,K → 고유치 → S → 모드 초기조건 → x=Sr.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">단계</p>
        <div class="btn-row" style="margin:0">
          <button class="btn btn-sm" id="prev">◀ 이전</button>
          <button class="btn btn-sm btn-acc" id="sd1">1</button>
          <button class="btn btn-sm" id="sd2">2</button>
          <button class="btn btn-sm" id="sd3">3</button>
          <button class="btn btn-sm" id="sd4">4</button>
          <button class="btn btn-sm" id="sd5">5</button>
          <button class="btn btn-sm" id="next">다음 ▶</button>
        </div>
      </div>
      <div>
        <p class="ctrl-title">시간 t <span class="big-val" id="tv">0.00</span> s</p>
        <input type="range" id="tslider" min="0" max="12" step="0.01" value="0">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="540"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>모드 1 (ω₁=√2)</span>
      <span><i style="background:var(--low)"></i>모드 2 (ω₂=2)</span>
      <span><i style="background:var(--float)"></i>물리 x₁(t)</span>
      <span><i style="background:var(--ok)"></i>물리 x₂(t)</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 13강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var M = [[9,0],[0,1]];
var K = [[27,-3],[-3,3]];
var x0 = [1,0];
var S  = [[1/(3*Math.SQRT2), -1/(3*Math.SQRT2)],
          [3/(3*Math.SQRT2),  3/(3*Math.SQRT2)]];
var Sinv = [[3/Math.SQRT2, 1/Math.SQRT2],
            [-3/Math.SQRT2, 1/Math.SQRT2]];
var w1 = Math.SQRT2, w2 = 2;
var lam1 = 2, lam2 = 4;
var r10 =  3/Math.SQRT2;
var r20 = -3/Math.SQRT2;

function r1f(t){ return r10*Math.cos(w1*t); }
function r2f(t){ return r20*Math.cos(w2*t); }
function x1f(t){ return 0.5*(Math.cos(w1*t)+Math.cos(w2*t)); }
function x2f(t){ return 1.5*(Math.cos(w1*t)-Math.cos(w2*t)); }

var step = 1;
var t = 0, running = true;
var TMAX = 12;

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','accent-ink','high','low','ok','float','grid',
   'mass','mass-ink','spring','wall'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function rgbParts(c){
  var m = String(c).match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if (m) return [+m[1], +m[2], +m[3]];
  if (c.charAt(0) === '#' && c.length === 7)
    return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  return [136,136,136];
}
function alpha(key, a){
  var p = rgbParts(PAL[key]);
  return 'rgba('+p[0]+','+p[1]+','+p[2]+','+a+')';
}

function txt(s,x,y,col,font,align){
  ctx.fillStyle=col||PAL.text; ctx.font=font||('14px '+FONT);
  ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic'; ctx.fillText(s,x,y);
}
function arrow(x1,y1,x2,y2,col,lw){
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw||2.5;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  var ang=Math.atan2(y2-y1,x2-x1), h=9;
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-h*Math.cos(ang-0.4), y2-h*Math.sin(ang-0.4));
  ctx.lineTo(x2-h*Math.cos(ang+0.4), y2-h*Math.sin(ang+0.4));
  ctx.closePath(); ctx.fill();
}
function drawMatrix(cx, cy, mat, title, color, fmt){
  var cw=64, ch=42, x0m=cx, y0m=cy;
  var bw=cw*2, bh=ch*2;
  txt(title, x0m+bw/2, y0m-14, color, 'bold 16px '+FONT,'center');
  ctx.strokeStyle=color; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(x0m-8,y0m); ctx.lineTo(x0m-8,y0m+bh);
  ctx.moveTo(x0m-8,y0m); ctx.lineTo(x0m-2,y0m);
  ctx.moveTo(x0m-8,y0m+bh); ctx.lineTo(x0m-2,y0m+bh);
  ctx.moveTo(x0m+bw+8,y0m); ctx.lineTo(x0m+bw+8,y0m+bh);
  ctx.moveTo(x0m+bw+8,y0m); ctx.lineTo(x0m+bw+2,y0m);
  ctx.moveTo(x0m+bw+8,y0m+bh); ctx.lineTo(x0m+bw+2,y0m+bh);
  ctx.stroke();
  for(var i=0;i<2;i++) for(var j=0;j<2;j++){
    var gx=x0m+j*cw, gy=y0m+i*ch;
    ctx.fillStyle=PAL.surface2;
    ctx.fillRect(gx+3,gy+3,cw-6,ch-6);
    txt(fmt?fmt(mat[i][j]):(''+mat[i][j]), gx+cw/2, gy+ch/2+5, PAL.text,'15px Consolas,monospace','center');
  }
}
function drawVector(cx, cy, vec, title, color, fmt){
  var cw=70, ch=42, bh=ch*2;
  txt(title, cx+cw/2, cy-14, color, 'bold 15px '+FONT,'center');
  ctx.strokeStyle=color; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx-8,cy); ctx.lineTo(cx-8,cy+bh);
  ctx.moveTo(cx-8,cy); ctx.lineTo(cx-2,cy);
  ctx.moveTo(cx-8,cy+bh); ctx.lineTo(cx-2,cy+bh);
  ctx.moveTo(cx+cw+8,cy); ctx.lineTo(cx+cw+8,cy+bh);
  ctx.moveTo(cx+cw+8,cy); ctx.lineTo(cx+cw+2,cy);
  ctx.moveTo(cx+cw+8,cy+bh); ctx.lineTo(cx+cw+2,cy+bh);
  ctx.stroke();
  for(var i=0;i<2;i++){
    var gy=cy+i*ch;
    ctx.fillStyle=PAL.surface2; ctx.fillRect(cx+3,gy+3,cw-6,ch-6);
    txt(fmt?fmt(vec[i]):(''+vec[i]), cx+cw/2, gy+ch/2+5, PAL.text,'14px Consolas,monospace','center');
  }
}

function drawStep1(){
  txt('① 시스템 행렬 M, K 와 초기조건', 30, 40, PAL.accent, 'bold 18px '+FONT);
  txt('2자유도 자유진동. 질량행렬 M, 강성행렬 K 가 서로 결합되어 있다.', 30, 68, PAL.muted, '13px '+FONT);
  drawMatrix(120, 150, M, 'M', PAL.accent);
  drawMatrix(430, 150, K, 'K', PAL.ok);
  drawVector(700, 150, x0, 'x(0)', PAL.float);
  txt('ẋ(0) = 0', 700, 300, PAL.float, '15px Consolas,monospace','left');
  txt('K 의 비대각 항 −3 → 두 좌표 x₁, x₂ 가 서로 얽혀 있다.', 30, 380, PAL.high,'13px '+FONT);
  txt('이대로는 두 방정식을 따로 풀 수 없다. → 좌표를 바꾸자.', 30, 406, PAL.high,'13px '+FONT);
  drawChain(180, 470, 0, 0);
  txt('결합된 2자유도계: m₁–k–m₂ (벽)', 30, 520, PAL.faint,'12px '+FONT);
}
function drawStep2(){
  txt('② 고유값 문제  K u = λ M u', 30, 40, PAL.accent, 'bold 18px '+FONT);
  txt('특성방정식 |K − λM| = 9(λ²−6λ+8)=0  →  λ₁=2, λ₂=4', 30, 68, PAL.muted,'13px '+FONT);
  txt('ω₁ = √2 ≈ 1.414 rad/s     ω₂ = 2 rad/s', 30, 92, PAL.text,'14px Consolas,monospace');
  var cy = 300, ax1=260, ax2=650;
  txt('모드 1  ω₁=√2  (동위상)', ax1, 160, PAL.accent,'bold 15px '+FONT,'center');
  txt('u₁ = (1/3√2)[1, 3]ᵀ', ax1, 184, PAL.faint,'13px Consolas,monospace','center');
  drawModeArrows(ax1, cy, 1, 3, PAL.accent);
  txt('모드 2  ω₂=2  (역위상)', ax2, 160, PAL.low,'bold 15px '+FONT,'center');
  txt('u₂ = (1/3√2)[−1, 3]ᵀ', ax2, 184, PAL.faint,'13px Consolas,monospace','center');
  drawModeArrows(ax2, cy, -1, 3, PAL.low);
  txt('u₁ 은 두 성분 같은 부호 = 두 질량이 같은 방향(동위상).', 30, 470, PAL.muted,'13px '+FONT);
  txt('u₂ 는 반대 부호 = 두 질량이 반대 방향(역위상). 고유벡터는 방향만 의미.', 30, 494, PAL.muted,'13px '+FONT);
  txt('크기는 질량 정규화(uᵀMu=1)로 확정 → S 구성에 사용.', 30, 518, PAL.faint,'12px '+FONT);
}
function drawModeArrows(cx, cy, c1, c2, col){
  var gap=150, box=44, sc=26;
  var positions=[cx-gap/2, cx+gap/2];
  var comps=[c1,c2];
  ctx.strokeStyle=PAL.border2; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(cx-gap/2-70,cy); ctx.lineTo(cx+gap/2+70,cy); ctx.stroke();
  ctx.setLineDash([]);
  for(var i=0;i<2;i++){
    var px=positions[i];
    ctx.fillStyle=col; ctx.globalAlpha=0.85;
    ctx.fillRect(px-box/2, cy-box/2, box, box); ctx.globalAlpha=1;
    txt('m'+(i+1), px, cy+5, PAL['accent-ink'],'bold 15px '+FONT,'center');
    var len = comps[i]*sc;
    arrow(px, cy-box/2, px, cy-box/2 - len, col, 3);
    txt((comps[i]>0?'+':'−')+Math.abs(comps[i]), px+box/2+14, cy - len - box/2 + 4, col,'13px Consolas,monospace','left');
  }
}
function drawStep3(){
  txt('③ 모드행렬 S 구성  &  초기조건 변환  r₀ = SᵀM x₀', 30, 40, PAL.accent,'bold 18px '+FONT);
  txt('고유벡터를 열로 세워 S 를 만든다. 질량 정규화 덕분에 SᵀMS = I, SᵀKS = Λ.', 30, 68, PAL.muted,'13px '+FONT);
  drawMatrix(90, 150, [[1,-1],[3,3]], 'S  (×1/3√2)', PAL.accent);
  drawMatrix(390, 150, [[3,1],[-3,1]], 'S⁻¹=SᵀM  (×1/√2)', PAL.low);
  arrow(680, 195, 750, 195, PAL.float, 2.5);
  drawVector(600, 320, x0, 'x₀', PAL.float, function(v){ return v.toFixed(0); });
  txt('r₀ = SᵀM x₀', 700, 300, PAL.float,'bold 15px '+FONT,'left');
  drawVector(760, 320, [r10, r20], 'r₀', PAL.ok, function(v){ return v.toFixed(3); });
  txt('r₀ = [ 3/√2,  −3/√2 ]ᵀ ≈ [2.121, −2.121]ᵀ,   ṙ₀ = 0', 30, 470, PAL.muted,'13px '+FONT);
  txt('물리 초기조건을 모드 초기조건으로 옮겨 심었다.', 30, 500, PAL.faint,'12px '+FONT);
}
function drawStep4(){
  txt('④ 분리된 모드방정식  r̈ᵢ + ωᵢ² rᵢ = 0', 30, 38, PAL.accent,'bold 17px '+FONT);
  txt('모드 1', 240, 78, PAL.accent,'bold 15px '+FONT,'center');
  txt('r̈₁ + 2 r₁ = 0', 240, 104, PAL.text,'15px Consolas,monospace','center');
  txt('r₁(t) = (3/√2)·cos(√2 t)', 240, 128, PAL.accent,'13px Consolas,monospace','center');
  txt('모드 2', 660, 78, PAL.low,'bold 15px '+FONT,'center');
  txt('r̈₂ + 4 r₂ = 0', 660, 104, PAL.text,'15px Consolas,monospace','center');
  txt('r₂(t) = −(3/√2)·cos(2 t)', 660, 128, PAL.low,'13px Consolas,monospace','center');
  drawModeOscillator(240, 210, r1f(t), r10, PAL.accent, 'r₁');
  drawModeOscillator(660, 210, r2f(t), Math.abs(r20), PAL.low, 'r₂');
  drawModePlot(40, 350, 400, 170, r1f, r10, PAL.accent, 'r₁(t)');
  drawModePlot(470, 350, 400, 170, r2f, Math.abs(r20), PAL.low, 'r₂(t)');
}
function drawModeOscillator(cx, cy, val, amp, col, label){
  var box=40;
  var my = cy + (val/amp)*40 + 40;
  var topY = cy - box/2 - 40;
  ctx.strokeStyle=PAL.border2; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(cx-70, cy+40); ctx.lineTo(cx+70, cy+40); ctx.stroke(); ctx.setLineDash([]);
  txt(label+' = '+val.toFixed(2), cx, topY-8, col,'13px Consolas,monospace','center');
  ctx.strokeStyle=PAL.spring; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx, topY);
  var coils=6, segEnd=my-box/2, seg=Math.max((segEnd-topY)/(coils*2), 1);
  for(var i=0;i<coils*2;i++) ctx.lineTo(cx+(i%2===0?-10:10), topY+seg*(i+0.5));
  ctx.lineTo(cx, segEnd); ctx.stroke();
  ctx.fillStyle=col; ctx.globalAlpha=0.9; ctx.fillRect(cx-box/2, my-box/2, box, box); ctx.globalAlpha=1;
}
function drawModePlot(x, y, w, h, fn, amp, col, label){
  ctx.strokeStyle=PAL.border2; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+h); ctx.lineTo(x+w, y+h); ctx.stroke();
  var midY=y+h/2;
  ctx.strokeStyle=PAL.grid; ctx.beginPath(); ctx.moveTo(x, midY); ctx.lineTo(x+w, midY); ctx.stroke();
  txt(label, x+6, y+16, col,'13px '+FONT,'left');
  ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath();
  for(var i=0;i<=w;i++){ var tt=i/w*TMAX; var Y=midY-(fn(tt)/amp)*(h/2*0.9);
    i?ctx.lineTo(x+i,Y):ctx.moveTo(x+i,Y); }
  ctx.stroke();
  var mx=x+(t/TMAX)*w;
  ctx.strokeStyle=PAL.faint; ctx.setLineDash([3,3]); ctx.beginPath();
  ctx.moveTo(mx,y); ctx.lineTo(mx,y+h); ctx.stroke(); ctx.setLineDash([]);
  var cyv=midY-(fn(t)/amp)*(h/2*0.9);
  ctx.fillStyle=PAL.float; ctx.beginPath(); ctx.arc(mx,cyv,4,0,7); ctx.fill();
}
function drawStep5(){
  txt('⑤ 합성  x(t) = S r(t)', 30, 36, PAL.accent,'bold 18px '+FONT);
  txt('x₁ = 0.5(cos√2 t + cos2t),   x₂ = 1.5(cos√2 t − cos2t)', 30, 62, PAL.muted,'13px Consolas,monospace');
  drawPhysPlot(40, 92, 830, 250);
  drawPipeline(40, 372);
}
function drawPhysPlot(x, y, w, h){
  ctx.strokeStyle=PAL.border2; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+h); ctx.lineTo(x+w, y+h); ctx.stroke();
  var midY=y+h/2, amp=3.2;
  ctx.strokeStyle=PAL.grid; ctx.beginPath(); ctx.moveTo(x,midY); ctx.lineTo(x+w,midY); ctx.stroke();
  txt('시간 t →', x+w-56, y+h+16, PAL.faint,'11px '+FONT,'left');
  var plot=function(fn,col){ ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.beginPath();
    for(var i=0;i<=w;i++){ var tt=i/w*TMAX; var Y=midY-(fn(tt)/amp)*(h/2*0.9);
      i?ctx.lineTo(x+i,Y):ctx.moveTo(x+i,Y);} ctx.stroke(); };
  plot(x1f,PAL.float); plot(x2f,PAL.ok);
  txt('x₁(t)', x+w-58, midY-40, PAL.float,'12px '+FONT,'left');
  txt('x₂(t)', x+w-58, midY+50, PAL.ok,'12px '+FONT,'left');
  var mx=x+(t/TMAX)*w;
  ctx.strokeStyle=PAL.faint; ctx.setLineDash([3,3]); ctx.beginPath();
  ctx.moveTo(mx,y); ctx.lineTo(mx,y+h); ctx.stroke(); ctx.setLineDash([]);
  var p1=midY-(x1f(t)/amp)*(h/2*0.9), p2=midY-(x2f(t)/amp)*(h/2*0.9);
  ctx.fillStyle=PAL.float; ctx.beginPath(); ctx.arc(mx,p1,4,0,7); ctx.fill();
  ctx.fillStyle=PAL.ok; ctx.beginPath(); ctx.arc(mx,p2,4,0,7); ctx.fill();
}
function drawPipeline(x, y){
  var boxes=[
    ['복잡한\n2자유도', PAL.high],
    ['좌표변환\nr=SᵀMx', PAL.float],
    ['아는 문제\n1자유도 ×2', PAL.accent],
    ['해 r₁,r₂', PAL.low],
    ['합성\nx=Sr', PAL.ok]
  ];
  var bw=140, bh=64, gap=(830-bw*5)/4;
  for(var i=0;i<boxes.length;i++){
    var bx=x+i*(bw+gap);
    ctx.fillStyle=PAL.surface2; ctx.strokeStyle=boxes[i][1]; ctx.lineWidth=2;
    ctx.fillRect(bx,y,bw,bh); ctx.strokeRect(bx,y,bw,bh);
    var lines=boxes[i][0].split('\n');
    lines.forEach(function(ln,k){ txt(ln, bx+bw/2, y+bh/2-2+k*17-(lines.length-1)*8, boxes[i][1],'13px '+FONT,'center'); });
    if(i<boxes.length-1){ var ax=bx+bw+2; arrow(ax, y+bh/2, ax+gap-4, y+bh/2, PAL.faint, 2.5); }
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(step===1) drawStep1();
  else if(step===2) drawStep2();
  else if(step===3) drawStep3();
  else if(step===4) drawStep4();
  else if(step===5) drawStep5();
}
function drawChain(x, y){
  var box=42, k=110;
  ctx.fillStyle=PAL.wall; ctx.fillRect(x-16, y-40, 14, 80);
  spring(x, y, x+k, y);
  ctx.fillStyle=PAL.mass; ctx.fillRect(x+k, y-box/2, box, box);
  txt('m₁', x+k+box/2, y+5, PAL['mass-ink'],'bold 14px '+FONT,'center');
  spring(x+k+box, y, x+2*k+box, y);
  ctx.fillStyle=PAL.ok; ctx.fillRect(x+2*k+box, y-box/2, box, box);
  txt('m₂', x+2*k+box+box/2, y+5, PAL['accent-ink'],'bold 14px '+FONT,'center');
}
function spring(x1,y,x2){
  ctx.strokeStyle=PAL.spring; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x1,y);
  var coils=6, seg=(x2-x1)/(coils*2);
  for(var i=0;i<coils*2;i++) ctx.lineTo(x1+seg*(i+0.5), y+(i%2===0?-9:9));
  ctx.lineTo(x2,y); ctx.stroke();
}

function refreshUI(){
  for(var i=1;i<=5;i++){
    $('sd'+i).classList.toggle('btn-acc', i===step);
  }
  $('prev').disabled = (step===1);
  $('next').disabled = (step===5);
}
function goStep(n){
  step = Math.max(1, Math.min(5, n));
  refreshUI();
  draw();
}
$('next').addEventListener('click', function(){ if(step<5) goStep(step+1); });
$('prev').addEventListener('click', function(){ if(step>1) goStep(step-1); });
for(var si=1;si<=5;si++){
  (function(n){ $('sd'+n).addEventListener('click', function(){ goStep(n); }); })(si);
}

var tslider=$('tslider'), tv=$('tv');
tslider.addEventListener('input', function(){
  t=parseFloat(this.value); running=false;
  $('play').textContent='▶ 재생';
  $('play').classList.remove('btn-acc');
  draw();
});
$('play').addEventListener('click', function(){
  running=!running; this.textContent=running?'⏸ 일시정지':'▶ 재생';
  this.classList.toggle('btn-acc', running);
});
$('reset').addEventListener('click', function(){
  t=0; tslider.value=0; tv.textContent='0.00';
  running=true; step=1;
  $('play').textContent='⏸ 일시정지'; $('play').classList.add('btn-acc');
  refreshUI();
  draw();
});

var last=0;
function loop(now){
  var dt = last ? Math.min(0.033,(now-last)/1000) : 0; last=now;
  if(running){ t+=dt; if(t>TMAX) t-=TMAX; tslider.value=t.toFixed(2); }
  tv.textContent=t.toFixed(2);
  draw();
  requestAnimationFrame(loop);
}
refreshUI();
draw();
requestAnimationFrame(loop);
})();
</script>
