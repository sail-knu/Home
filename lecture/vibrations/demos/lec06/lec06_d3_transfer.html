<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L7-D3 · 전달함수 H(s)</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 7강</p>
  <h1>전달함수 H(s)</h1>
  <p class="lede">F(s)에 H(s)=1/(ms²+cs+k)를 곱하면 X(s)입니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">질량 m <span class="big-val" id="mv">1.0</span> kg</p>
        <input type="range" id="m" min="0.5" max="4" step="0.1" value="1">
      </div>
      <div>
        <p class="ctrl-title">감쇠 c <span class="big-val" id="cvl">2.0</span> N·s/m</p>
        <input type="range" id="c" min="0" max="20" step="0.5" value="2">
      </div>
      <div>
        <p class="ctrl-title">강성 k <span class="big-val" id="kv">100</span> N/m</p>
        <input type="range" id="k" min="20" max="200" step="5" value="100">
      </div>
      <div>
        <p class="ctrl-title">가진 주파수 ω <span class="big-val" id="wv">10.0</span> rad/s</p>
        <input type="range" id="w" min="0.5" max="30" step="0.5" value="10">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="380"></canvas>
    <div class="legend">
      <span><i style="background:var(--low)"></i>입력 F(t) = F₀ sin ωt</span>
      <span><i style="background:var(--accent)"></i>H(s) = 1/(ms²+cs+k)</span>
      <span><i style="background:var(--high)"></i>출력 x(t) = X sin(ωt − θ)</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 7강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var DEF = { m:1, c:2, k:100, w:10 };
var F0 = 10;
var p = { m:1, c:2, k:100, w:10 };
var phi = 0, running = true;

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','surface3','border','border2','text','muted','faint','accent','accent-soft','high','low','float','ok','bad','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function compute(){
  var wn = Math.sqrt(p.k / p.m);
  var zeta = p.c / (2 * Math.sqrt(p.m * p.k));
  var r = p.w / Math.max(wn, 1e-9);
  var re = p.k - p.m * p.w * p.w;
  var im = p.c * p.w;
  var den = Math.sqrt(re * re + im * im);
  var diverge = den < 1e-5;
  den = Math.max(den, 1e-6);
  var magH = 1 / den;
  var theta = Math.atan2(im, re);
  if (im === 0 && Math.abs(re) < 1e-9) theta = Math.PI / 2;
  return { wn:wn, zeta:zeta, r:r, magH:magH, theta:theta,
           X:F0 * magH, lam:p.k * magH, diverge:diverge };
}
function fmtH(v){ return v >= 0.01 ? v.toFixed(4) : v.toExponential(2); }

var inL = 35, inR = 270, outL = 630, outR = 865, cy = 190, HH = 88;
var bx1 = 340, bx2 = 565, by1 = 140, by2 = 240;

function drawWave(x1, x2, cyy, amp, phase0, q, color){
  ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.beginPath();
  for (var px = x1; px <= x2; px += 2){
    var y = cyy - amp * Math.sin(phi + phase0 + q * (x2 - px));
    if (px === x1) ctx.moveTo(px, y); else ctx.lineTo(px, y);
  }
  ctx.stroke();
}
function arrow(x1, x2, y){
  ctx.strokeStyle = PAL.border2; ctx.fillStyle = PAL.border2; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2 - 8, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y); ctx.lineTo(x2 - 9, y - 5); ctx.lineTo(x2 - 9, y + 5); ctx.closePath(); ctx.fill();
  for (var i = 0; i < 3; i++){
    var u = ((phi * 0.18 + i / 3) % 1 + 1) % 1;
    ctx.fillStyle = PAL.accent;
    ctx.beginPath(); ctx.arc(x1 + u * (x2 - x1 - 10), y, 3, 0, Math.PI * 2); ctx.fill();
  }
}
function roundBox(x, y, w, h, r){
  if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  var q = compute();
  var qq = Math.max(0.014, p.w * 0.0035);
  var mag = Math.min(q.lam, 2000);
  var s = 26;
  var outPx = Math.min(72, Math.max(s * mag, 1.2));

  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(18, 16, W - 36, H - 32);

  [[inL, inR], [outL, outR]].forEach(function(pr){
    ctx.fillStyle = PAL.surface3;
    ctx.fillRect(pr[0], cy - HH, pr[1] - pr[0], HH * 2);
    ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(pr[0], cy); ctx.lineTo(pr[1], cy); ctx.stroke(); ctx.setLineDash([]);
  });
  drawWave(inL, inR, cy, s, 0, qq, PAL.low);
  drawWave(outL, outR, cy, outPx, -q.theta, qq, PAL.high);

  ctx.font = 'bold 15px ' + FONT; ctx.textAlign = 'center';
  ctx.fillStyle = PAL.low;  ctx.fillText('입력 F(t) = F₀ sin ωt', (inL + inR) / 2, 52);
  ctx.fillStyle = PAL.high; ctx.fillText('출력 x(t) = X sin(ωt − θ)', (outL + outR) / 2, 52);

  ctx.font = '13px ' + FONT; ctx.fillStyle = PAL.muted;
  ctx.fillText('F₀ = ' + F0 + ' N', (inL + inR) / 2, 318);
  ctx.fillStyle = q.diverge ? PAL.bad : PAL.text;
  ctx.fillText(q.diverge ? 'X → ∞ (비감쇠 공진)' :
    'X = ' + fmtH(q.X) + ' m',
    (outL + outR) / 2, 318);

  arrow(inR, bx1, cy);
  arrow(bx2, outL, cy);
  ctx.font = '12.5px ' + FONT; ctx.fillStyle = PAL.muted; ctx.textAlign = 'center';
  ctx.fillText('F(s)', (inR + bx1) / 2, cy - 16);
  ctx.font = 'bold 12.5px ' + FONT; ctx.fillStyle = PAL.accent;
  ctx.fillText('× H(jω)', (bx2 + outL) / 2, cy - 34);
  ctx.font = '12.5px ' + FONT;
  ctx.fillText('위상 −θ', (bx2 + outL) / 2, cy - 16);

  ctx.fillStyle = PAL['accent-soft']; ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2;
  roundBox(bx1, by1, bx2 - bx1, by2 - by1, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = PAL.text; ctx.font = 'bold 20px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('H(s) =', 430, 192);
  ctx.textAlign = 'center'; ctx.font = 'bold 17px ' + FONT;
  ctx.fillText('1', 492, 172);
  ctx.strokeStyle = PAL.text; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(440, 184); ctx.lineTo(546, 184); ctx.stroke();
  ctx.font = '16px ' + FONT;
  ctx.fillText('ms² + cs + k', 493, 209);

  ctx.font = '13px ' + FONT; ctx.fillStyle = PAL.muted;
  ctx.fillText('= 1/(' + p.m.toFixed(1) + 's² + ' + p.c.toFixed(1) + 's + ' + p.k.toFixed(0) + ')', (bx1 + bx2) / 2, 268);

  ctx.fillStyle = PAL.text; ctx.font = '13px ' + FONT; ctx.textAlign = 'left';
  var thDeg = q.theta * 180 / Math.PI;
  ctx.fillText('|H| = ' + (q.diverge ? '∞' : fmtH(q.magH)) + ' m/N   θ = ' + thDeg.toFixed(1) + '°   r = ' + q.r.toFixed(2) + '   ζ = ' + q.zeta.toFixed(3), 28, 356);
}

function syncSpans(){
  $('mv').textContent = p.m.toFixed(1);
  $('cvl').textContent = p.c.toFixed(1);
  $('kv').textContent = p.k.toFixed(0);
  $('wv').textContent = p.w.toFixed(1);
  $('m').value = p.m; $('c').value = p.c; $('k').value = p.k; $('w').value = p.w;
}
function bind(id, key){
  $(id).addEventListener('input', function(){
    p[key] = parseFloat(this.value); syncSpans(); draw();
  });
}
bind('m', 'm'); bind('c', 'c'); bind('k', 'k'); bind('w', 'w');

$('play').addEventListener('click', function(){
  running = !running;
  this.textContent = running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', running);
});
$('reset').addEventListener('click', function(){
  p = { m:DEF.m, c:DEF.c, k:DEF.k, w:DEF.w }; phi = 0; running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (running) phi += 2.2 * dt;
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
