<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L6-D5 · |H(jω)| = Λ/k</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 6강</p>
  <h1>|H(jω)| = Λ/k</h1>
  <p class="lede">s=jω이면 |H| 곡선은 1강 무차원 진폭을 k로 나눈 것과 겹칩니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">질량 m <span class="big-val" id="mv">1.0</span> kg</p>
        <input type="range" id="m" min="0.5" max="4" step="0.1" value="1">
      </div>
      <div>
        <p class="ctrl-title">감쇠 c <span class="big-val" id="cvl">2.0</span> N·s/m</p>
        <input type="range" id="c" min="0" max="20" step="0.5" value="2">
      </div>
      <div>
        <p class="ctrl-title">강성 k <span class="big-val" id="kv">100</span> N/m</p>
        <input type="range" id="k" min="20" max="200" step="5" value="100">
      </div>
      <div>
        <p class="ctrl-title">가진 주파수 ω <span class="big-val" id="wv">10.0</span> rad/s</p>
        <input type="range" id="w" min="0.5" max="30" step="0.5" value="10">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="460"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>|H(jω)|</span>
      <span><i style="background:var(--float)"></i>Λ(r)/k</span>
      <span><i style="background:var(--ok)"></i>ωₙ (r=1)</span>
      <span><i style="background:var(--high)"></i>현재 ω</span>
    </div>
    <div class="btn-row">
      <button class="btn" id="play">▶ 재생</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 6강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var DEF = { m:1, c:2, k:100, w:10 };
var p = { m:1, c:2, k:100, w:10 };
var running = false, sweepDir = 1;
var W_LO = 0.5, W_HI = 30;

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','float','ok','grid','plot-bg'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function compute(){
  var wn = Math.sqrt(p.k / p.m);
  var zeta = p.c / (2 * Math.sqrt(p.m * p.k));
  var r = p.w / Math.max(wn, 1e-9);
  var re = p.k - p.m * p.w * p.w;
  var im = p.c * p.w;
  var den = Math.sqrt(re * re + im * im);
  var diverge = den < 1e-5;
  den = Math.max(den, 1e-6);
  var magH = 1 / den;
  var theta = Math.atan2(im, re);
  if (im === 0 && Math.abs(re) < 1e-9) theta = Math.PI / 2;
  return { wn:wn, zeta:zeta, r:r, magH:magH, theta:theta, lam:p.k * magH, diverge:diverge };
}
function magAt(w){
  var re = p.k - p.m * w * w, im = p.c * w;
  var v = 1 / Math.max(Math.sqrt(re * re + im * im), 1e-6);
  return Math.min(Math.max(v, 1e-6), 20);
}
function lamAt(w, wn, ze){
  var r = w / Math.max(wn, 1e-9);
  var a = 1 - r * r, b = 2 * ze * r;
  var v = 1 / (p.k * Math.max(Math.sqrt(a * a + b * b), 1e-9));
  return Math.min(Math.max(v, 1e-6), 20);
}
function fmtH(v){ return v >= 0.01 ? v.toFixed(4) : v.toExponential(2); }

var SUP = { '-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹' };
function sup(n){ return String(n).split('').map(function(ch){ return SUP[ch] || ch; }).join(''); }

var plotL = 70, plotR = 836, plotT = 52, plotB = 410;

function draw(){
  ctx.clearRect(0, 0, W, H);
  var q = compute();
  var wLo = 0.3, wHi = 31, N = 300;
  var vals = [], lams = [];
  var lgMin = Infinity, lgMax = -Infinity, i, w;
  for (i = 0; i <= N; i++){
    w = wLo + (wHi - wLo) * i / N;
    var lg = Math.log10(magAt(w));
    vals.push([w, lg]);
    lams.push([w, Math.log10(lamAt(w, q.wn, q.zeta))]);
    if (lg < lgMin) lgMin = lg;
    if (lg > lgMax) lgMax = lg;
  }
  lgMin = Math.floor(lgMin); lgMax = Math.ceil(lgMax);
  if (lgMax <= lgMin) lgMax = lgMin + 1;
  var xw  = function(v){ return plotL + (v - wLo) / (wHi - wLo) * (plotR - plotL); };
  var ylg = function(v){ return plotB - (Math.min(Math.max(v, lgMin), lgMax) - lgMin) / (lgMax - lgMin) * (plotB - plotT); };

  ctx.font = 'bold 16px ' + FONT; ctx.fillStyle = PAL.text; ctx.textAlign = 'left';
  ctx.fillText('|H(jω)| [m/N]  (log)', plotL, 28);
  ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('|H| = ' + (q.diverge ? '∞' : fmtH(q.magH)) + '   Λ/k = ' + (q.diverge ? '∞' : fmtH(q.lam / p.k)) + '   ω = ' + p.w.toFixed(1) + '   ωₙ = ' + q.wn.toFixed(2), plotR, 28);

  ctx.font = '12.5px ' + FONT;
  for (var d = lgMin; d <= lgMax; d++){
    var y = ylg(d);
    ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(plotL, y); ctx.lineTo(plotR, y); ctx.stroke();
    ctx.fillStyle = PAL.muted; ctx.textAlign = 'right';
    ctx.fillText('10' + sup(d), plotL - 8, y + 4);
  }
  for (w = 0; w <= 30; w += 5){
    if (w < wLo) continue;
    var x = xw(w);
    ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, plotB); ctx.lineTo(x, plotB + 5); ctx.stroke();
    ctx.fillStyle = PAL.muted; ctx.textAlign = 'center';
    ctx.fillText(String(w), x, plotB + 20);
  }
  ctx.font = '13.5px ' + FONT; ctx.fillStyle = PAL.muted; ctx.textAlign = 'center';
  ctx.fillText('ω [rad/s]', (plotL + plotR) / 2, plotB + 38);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(plotL, plotT); ctx.lineTo(plotL, plotB); ctx.lineTo(plotR, plotB); ctx.stroke();

  var yk = ylg(Math.log10(1 / p.k));
  ctx.strokeStyle = PAL.muted; ctx.globalAlpha = 0.55; ctx.setLineDash([3, 5]); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(plotL, yk); ctx.lineTo(plotR, yk); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  ctx.fillStyle = PAL.muted; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('|H| = 1/k', plotL + 8, yk - 6);

  ctx.strokeStyle = PAL.float; ctx.lineWidth = 6; ctx.globalAlpha = 0.85;
  ctx.setLineDash([9, 7]); ctx.beginPath();
  lams.forEach(function(pt, j){
    var X = xw(pt[0]), Y = ylg(pt[1]);
    if (j) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
  });
  ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.6; ctx.beginPath();
  vals.forEach(function(pt, j){
    var X = xw(pt[0]), Y = ylg(pt[1]);
    if (j) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
  });
  ctx.stroke();

  var xNow = xw(Math.min(Math.max(p.w, wLo), wHi));
  var yNow = Math.min(Math.max(ylg(Math.log10(magAt(p.w))), plotT + 8), plotB - 3);

  if (q.wn >= wLo && q.wn <= wHi){
    var xn = xw(q.wn);
    ctx.strokeStyle = PAL.ok; ctx.lineWidth = 1.4; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(xn, plotT); ctx.lineTo(xn, plotB); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = PAL.ok; ctx.font = 'bold 12.5px ' + FONT; ctx.textAlign = 'left';
    ctx.fillText('ωₙ', xn + 8, plotT + 16);
  }
  ctx.strokeStyle = PAL.high; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(xNow, plotT); ctx.lineTo(xNow, plotB); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = PAL.high;
  ctx.beginPath(); ctx.arc(xNow, yNow, 6, 0, Math.PI * 2); ctx.fill();
}

function syncSpans(){
  $('mv').textContent = p.m.toFixed(1);
  $('cvl').textContent = p.c.toFixed(1);
  $('kv').textContent = p.k.toFixed(0);
  $('wv').textContent = p.w.toFixed(1);
  $('m').value = p.m; $('c').value = p.c; $('k').value = p.k; $('w').value = p.w;
}
function bind(id, key){
  $(id).addEventListener('input', function(){
    p[key] = parseFloat(this.value); syncSpans(); draw();
  });
}
bind('m', 'm'); bind('c', 'c'); bind('k', 'k'); bind('w', 'w');

function setPlayUi(){
  $('play').textContent = running ? '⏸ 일시정지' : '▶ 재생';
  $('play').classList.toggle('btn-acc', running);
}
$('play').addEventListener('click', function(){
  running = !running;
  setPlayUi();
});
$('reset').addEventListener('click', function(){
  p = { m:DEF.m, c:DEF.c, k:DEF.k, w:DEF.w }; running = false; sweepDir = 1;
  setPlayUi(); syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (running){
    p.w += sweepDir * 4.0 * dt;
    if (p.w >= W_HI){ p.w = W_HI; sweepDir = -1; }
    if (p.w <= W_LO){ p.w = W_LO; sweepDir = 1; }
    syncSpans();
  }
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
