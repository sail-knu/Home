<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L7-D2 · 회전 페이저</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 7강</p>
  <h1>회전 페이저</h1>
  <p class="lede">응답 벡터는 가진보다 θ만큼 늦습니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">감쇠비 ζ <span class="big-val" id="zv">0.10</span></p>
        <input type="range" id="z" min="0.05" max="1" step="0.01" value="0.1">
      </div>
      <div>
        <p class="ctrl-title">주파수비 r <span class="big-val" id="rv">1.00</span></p>
        <input type="range" id="r" min="0" max="3" step="0.01" value="1">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="520"></canvas>
    <div class="legend">
      <span><i style="background:var(--low)"></i>가진 F₀e<sup>jωt</sup></span>
      <span><i style="background:var(--accent)"></i>응답 Xe<sup>j(ωt−θ)</sup></span>
      <span><i style="background:var(--float)"></i>위상 지연 θ</span>
      <span><i style="background:var(--high)"></i>x(t) 트랙</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 7강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var WN = 10, F0 = 10, K = 200;
var EPS = 1e-9;
var st = { zeta: 0.1, r: 1.0, wt: 0, running: true };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','float','ok','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function resp(r, z){
  var a = 1 - r * r, b = 2 * z * r;
  var D = Math.max(a * a + b * b, 1e-12);
  var lam = 1 / Math.sqrt(D);
  var th = Math.atan2(b, a);
  return { lam:lam, th:th, re: a / D, im: -b / D };
}

var cx1 = 450, cy1 = 250, RMAX = 210, RF = 78;
var trackY = 478;

function arrow(x1, y1, x2, y2, color, lw){
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  var ang = Math.atan2(y2 - y1, x2 - x1), s = 12;
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - s * Math.cos(ang - 0.42), y2 - s * Math.sin(ang - 0.42));
  ctx.lineTo(x2 - s * Math.cos(ang + 0.42), y2 - s * Math.sin(ang + 0.42));
  ctx.closePath(); ctx.fill();
}

function draw(){
  var z = st.zeta, r = st.r, wt = st.wt;
  var h = resp(r, z), lam = h.lam, th = h.th;
  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(cx1 - RMAX - 16, cy1); ctx.lineTo(cx1 + RMAX + 16, cy1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx1, cy1 - RMAX - 16); ctx.lineTo(cx1, cy1 + RMAX + 16); ctx.stroke();

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('복소평면 페이저  ·  ωₙ = ' + WN, 28, 28);
  ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('ζ = ' + z.toFixed(2) + '   r = ' + r.toFixed(2) + '   Λ = ' + lam.toFixed(2) + '   θ = ' + (th * 180 / Math.PI).toFixed(1) + '°   X = ' + (lam * F0 / K).toFixed(3) + ' m', W - 28, 28);

  ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('Re', cx1 + RMAX + 12, cy1 - 8);
  ctx.textAlign = 'left';
  ctx.fillText('Im', cx1 + 8, cy1 - RMAX - 6);

  ctx.strokeStyle = PAL.low; ctx.globalAlpha = 0.35; ctx.lineWidth = 1;
  ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.arc(cx1, cy1, RF, 0, 2 * Math.PI); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  var rDisp = RF * lam, clipped = false;
  if (rDisp > RMAX){ rDisp = RMAX; clipped = true; }
  if (clipped){
    ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'left';
    ctx.fillText('표시 길이 축소 — 실제 Λ = ' + lam.toFixed(2), 28, 52);
  }

  var fx = cx1 + RF * Math.cos(wt), fy = cy1 - RF * Math.sin(wt);
  var rx = cx1 + rDisp * Math.cos(wt - th), ry = cy1 - rDisp * Math.sin(wt - th);

  if (th > 0.015){
    var rArc = Math.min(56, rDisp * 0.6 + 18);
    ctx.fillStyle = PAL.float; ctx.globalAlpha = 0.16;
    ctx.beginPath(); ctx.moveTo(cx1, cy1);
    ctx.arc(cx1, cy1, rArc, -wt, -(wt - th), false);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.75; ctx.strokeStyle = PAL.float; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(cx1, cy1, rArc, -wt, -(wt - th), false); ctx.stroke();
    ctx.globalAlpha = 1;
    var mid = wt - th / 2;
    ctx.fillStyle = PAL.float; ctx.font = 'bold 15px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText('θ', cx1 + (rArc + 16) * Math.cos(mid), cy1 - (rArc + 16) * Math.sin(mid) + 5);
  }

  ctx.setLineDash([3, 4]); ctx.lineWidth = 1.3; ctx.globalAlpha = 0.7;
  ctx.strokeStyle = PAL.low;
  ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, cy1); ctx.stroke();
  ctx.strokeStyle = PAL.accent;
  ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx, cy1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rx, cy1); ctx.lineTo(rx, trackY); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx1, cy1); ctx.lineTo(rx, cy1); ctx.stroke(); ctx.lineCap = 'butt';
  ctx.fillStyle = PAL.low;
  ctx.beginPath(); ctx.arc(fx, cy1, 4, 0, 2 * Math.PI); ctx.fill();

  arrow(cx1, cy1, fx, fy, PAL.low, 3);
  arrow(cx1, cy1, rx, ry, PAL.accent, 3.4);
  ctx.font = 'bold 13.5px ' + FONT; ctx.textAlign = 'center';
  ctx.fillStyle = PAL.low;
  ctx.fillText('F', fx + 18 * Math.cos(wt), fy - 18 * Math.sin(wt));
  ctx.fillStyle = PAL.accent;
  ctx.fillText('X', rx + 20 * Math.cos(wt - th), ry - 20 * Math.sin(wt - th));

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(cx1 - RMAX, trackY); ctx.lineTo(cx1 + RMAX, trackY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx1, trackY - 7); ctx.lineTo(cx1, trackY + 7); ctx.stroke();
  ctx.fillStyle = PAL.high;
  ctx.beginPath(); ctx.arc(rx, trackY, 8, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('x(t) = X cos(ωt − θ)', cx1, trackY + 28);
}

function syncSpans(){
  $('zv').textContent = st.zeta.toFixed(2);
  $('rv').textContent = st.r.toFixed(2);
  $('z').value = st.zeta;
  $('r').value = st.r;
}
$('z').addEventListener('input', function(){
  st.zeta = parseFloat(this.value); syncSpans(); draw();
});
$('r').addEventListener('input', function(){
  st.r = parseFloat(this.value); syncSpans(); draw();
});
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.zeta = 0.1; st.r = 1.0; st.wt = 0; st.running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running) st.wt = (st.wt + 1.6 * st.r * dt) % (2 * Math.PI);
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
