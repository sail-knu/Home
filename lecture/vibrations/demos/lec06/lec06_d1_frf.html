<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L6-D1 · 무차원 진폭·위상 FRF</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 6강</p>
  <h1>무차원 진폭·위상 FRF</h1>
  <p class="lede">ζ가 작을수록 공진 봉우리가 높아지고, 위상은 0°→90°→180°로 갑니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">감쇠비 ζ <span class="big-val" id="zv">0.10</span></p>
        <input type="range" id="z" min="0.005" max="1.5" step="0.005" value="0.1">
      </div>
      <div>
        <p class="ctrl-title">주파수비 r <span class="big-val" id="rv">1.00</span></p>
        <input type="range" id="r" min="0" max="3" step="0.01" value="1.0">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="540"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>|Xk/F₀| · θ</span>
      <span><i style="background:var(--high)"></i>현재 r</span>
      <span><i style="background:var(--low)"></i>r<sub>peak</sub> = √(1−2ζ²)</span>
      <span><i style="background:var(--ok)"></i>Xk/F₀ = 1</span>
      <span><i style="background:var(--float)"></i>r=1 → θ=90°</span>
    </div>
    <div class="btn-row">
      <button class="btn" id="play">▶ 재생</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 6강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var EPS = 1e-6;
var st = { zeta: 0.10, r: 1.00, running: false, sweepDir: 1 };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','float','ok','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function mag(r, z){
  var a = 1 - r * r;
  var b = 2 * z * r;
  var denom = Math.sqrt(a * a + b * b);
  return 1 / Math.max(denom, EPS);
}
function phase(r, z){
  return Math.atan2(2 * z * r, 1 - r * r);
}
function rPeak(z){
  var s = 1 - 2 * z * z;
  return s > 0 ? Math.sqrt(s) : null;
}
function peakValue(z){
  var rp = rPeak(z);
  if (rp === null) return mag(0, z);
  return 1 / (2 * z * Math.sqrt(Math.max(1 - z * z, EPS)));
}

var plotL = 76, plotR = 874, plotW = plotR - plotL;
var magTop = 46, magBot = 294;
var phTop = 356, phBot = 498;
var R_MAX = 3, MAG_MAX = 6;

function rx(r){ return plotL + (r / R_MAX) * plotW; }
function magY(m){ return magBot - (m / MAG_MAX) * (magBot - magTop); }
function phY(deg){ return phBot - (deg / 180) * (phBot - phTop); }
function fmtZ(z){ return z < 0.02 ? z.toFixed(3) : z.toFixed(2); }
function fmtMag(m){ return m >= 1000 ? '≥1000' : m.toFixed(3); }

function drawMagCurve(z, color, lw){
  ctx.save();
  ctx.beginPath(); ctx.rect(plotL, magTop, plotW, magBot - magTop); ctx.clip();
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath();
  for (var px = plotL; px <= plotR; px++){
    var r = ((px - plotL) / plotW) * R_MAX;
    var y = magY(mag(r, z));
    if (px === plotL) ctx.moveTo(px, y); else ctx.lineTo(px, y);
  }
  ctx.stroke();
  ctx.restore();
}
function drawPhaseCurve(z, color, lw){
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath();
  for (var px = plotL; px <= plotR; px++){
    var r = ((px - plotL) / plotW) * R_MAX;
    var y = phY(phase(r, z) * 180 / Math.PI);
    if (px === plotL) ctx.moveTo(px, y); else ctx.lineTo(px, y);
  }
  ctx.stroke();
}

function draw(){
  var z = st.zeta, r = st.r;
  var mVal = mag(r, z), degVal = phase(r, z) * 180 / Math.PI;
  var rp = rPeak(z), pv = peakValue(z);
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(plotL, magTop, plotW, magBot - magTop);
  ctx.fillRect(plotL, phTop, plotW, phBot - phTop);

  ctx.font = '12.5px ' + FONT;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (var m = 0; m <= MAG_MAX; m++){
    var y = magY(m);
    ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(plotL, y); ctx.lineTo(plotR, y); ctx.stroke();
    ctx.fillStyle = PAL.faint; ctx.fillText(String(m), plotL - 8, y);
  }
  ctx.strokeStyle = PAL.ok; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(plotL, magY(1)); ctx.lineTo(plotR, magY(1)); ctx.stroke();
  ctx.setLineDash([]);

  ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
  [0, 45, 90, 135, 180].forEach(function(d){
    var y = phY(d);
    ctx.strokeStyle = (d === 90) ? PAL.float : PAL.grid; ctx.lineWidth = (d === 90) ? 1.4 : 1;
    if (d === 90) ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(plotL, y); ctx.lineTo(plotR, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PAL.faint; ctx.fillText(d + '°', plotL - 8, y);
  });

  ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.font = '12.5px ' + FONT;
  for (var rr = 0; rr <= R_MAX + 1e-9; rr += 0.5){
    var x = rx(rr);
    var atOne = Math.abs(rr - 1) < 1e-9;
    ctx.strokeStyle = atOne ? PAL.border2 : PAL.grid; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, magTop); ctx.lineTo(x, magBot); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, phTop); ctx.lineTo(x, phBot); ctx.stroke();
    ctx.fillStyle = atOne ? PAL.text : PAL.faint;
    ctx.font = (atOne ? 'bold ' : '') + '12.5px ' + FONT;
    ctx.fillText(rr.toFixed(1), x, magBot + 6);
    ctx.fillText(rr.toFixed(1), x, phBot + 6);
  }

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.strokeRect(plotL, magTop, plotW, magBot - magTop);
  ctx.strokeRect(plotL, phTop, plotW, phBot - phTop);

  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('|Xk/F₀|', plotL, magTop - 12);
  ctx.fillText('θ [°]', plotL, phTop - 12);

  drawMagCurve(z, PAL.accent, 3.0);
  drawPhaseCurve(z, PAL.accent, 2.8);

  if (rp !== null){
    var xp = rx(rp);
    ctx.strokeStyle = PAL.low; ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(xp, magTop); ctx.lineTo(xp, magBot); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PAL.low;
    if (pv > MAG_MAX){
      ctx.beginPath();
      ctx.moveTo(xp, magTop + 3); ctx.lineTo(xp - 6, magTop + 15); ctx.lineTo(xp + 6, magTop + 15);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(xp, magY(pv), 4.5, 0, 2 * Math.PI); ctx.fill();
    }
  }

  var x1 = rx(1), y90 = phY(90);
  ctx.strokeStyle = PAL.float; ctx.lineWidth = 1.2; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(x1, phTop); ctx.lineTo(x1, phBot); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = PAL.float;
  ctx.beginPath(); ctx.arc(x1, y90, 5, 0, 2 * Math.PI); ctx.fill();

  var mx = rx(r);
  ctx.strokeStyle = PAL.high; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(mx, magTop); ctx.lineTo(mx, magBot); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx, phTop); ctx.lineTo(mx, phBot); ctx.stroke();
  ctx.fillStyle = PAL.high;
  if (mVal > MAG_MAX){
    ctx.beginPath();
    ctx.moveTo(mx, magTop + 3); ctx.lineTo(mx - 7, magTop + 17); ctx.lineTo(mx + 7, magTop + 17);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(mx, magY(mVal), 5.5, 0, 2 * Math.PI); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(mx, phY(degVal), 5.5, 0, 2 * Math.PI); ctx.fill();

  ctx.fillStyle = PAL.text; ctx.font = '13px ' + FONT; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('ζ = ' + fmtZ(z) + '   r = ' + r.toFixed(2) + '   |Xk/F₀| = ' + fmtMag(mVal) + '   θ = ' + degVal.toFixed(1) + '°', plotR, magTop - 12);
}

function syncSpans(){
  $('zv').textContent = fmtZ(st.zeta);
  $('rv').textContent = st.r.toFixed(2);
  $('z').value = st.zeta;
  $('r').value = st.r;
}
function setPlayUi(){
  $('play').textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  $('play').classList.toggle('btn-acc', st.running);
}
$('z').addEventListener('input', function(){
  st.zeta = parseFloat(this.value);
  $('zv').textContent = fmtZ(st.zeta);
  draw();
});
$('r').addEventListener('input', function(){
  st.r = parseFloat(this.value);
  $('rv').textContent = st.r.toFixed(2);
  draw();
});
$('play').addEventListener('click', function(){
  st.running = !st.running;
  setPlayUi();
});
$('reset').addEventListener('click', function(){
  st.zeta = 0.10; st.r = 1.00; st.sweepDir = 1; st.running = false;
  setPlayUi(); syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running){
    st.r += st.sweepDir * 0.45 * dt;
    if (st.r >= R_MAX){ st.r = R_MAX; st.sweepDir = -1; }
    if (st.r <= 0){ st.r = 0; st.sweepDir = 1; }
    $('r').value = st.r;
    $('rv').textContent = st.r.toFixed(2);
  }
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
