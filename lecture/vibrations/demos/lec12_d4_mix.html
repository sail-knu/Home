<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L12-D4 · 모드 혼합</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
  --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 12강</p>
  <h1>모드 혼합</h1>
  <p class="lede">x(0)=[1,0]이면 두 리듬이 섞여 정확히 반복되지 않습니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">속도 <span class="big-val" id="spdv">1.0</span>×</p>
        <input type="range" id="spd" min="0.1" max="3" step="0.1" value="1">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="540"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>x₁ = 0.5(cos√2t + cos2t)</span>
      <span><i style="background:var(--high)"></i>x₂ = 1.5(cos√2t − cos2t)</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 12강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var SYS = {
  m1: 9, m2: 1, k1: 24, k2: 3,
  w1: Math.SQRT2,
  w2: 2,
  u1: [1/3, 1],
  u2: [-1/3, 1]
};

var state = {
  A1: 1.5, A2: -1.5, phi1: Math.PI/2, phi2: Math.PI/2,
  t: 0, spd: 1, running: true
};
var hist = [];
var HIST_T = 14;

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','ok','float','grid',
   'mass','mass-ink','spring','wall'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function rgbParts(c){
  var m = String(c).match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if (m) return [+m[1], +m[2], +m[3]];
  if (c.charAt(0) === '#' && c.length === 7)
    return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  return [136,136,136];
}
function blend(k1, k2, t){
  var a = rgbParts(PAL[k1]), b = rgbParts(PAL[k2]);
  t = Math.max(0, Math.min(1, t));
  return 'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';
}

function disp(t){
  var s1 = state.A1 * Math.sin(SYS.w1 * t + state.phi1);
  var s2 = state.A2 * Math.sin(SYS.w2 * t + state.phi2);
  var x1 = s1 * SYS.u1[0] + s2 * SYS.u2[0];
  var x2 = s1 * SYS.u1[1] + s2 * SYS.u2[1];
  return [x1, x2];
}

function seedHist(){
  hist.length = 0;
  var s = disp(0);
  hist.push({ t: 0, x1: s[0], x2: s[1] });
}

var chainTop = 20, chainBot = 250;
var chainY = (chainTop + chainBot) / 2;
var wallX = 60;
var eq1 = 320, eq2 = 620;
var massHalf = 34;
var plotL = 60, plotR = W - 20;
var plotW = plotR - plotL;
var p1Top = 300, p1Bot = 400;
var p2Top = 430, p2Bot = 530;
var DISP_SC = 45;

function drawSpring(x1, y, x2, coils, color, thick){
  ctx.strokeStyle = color; ctx.lineWidth = thick;
  ctx.beginPath(); ctx.moveTo(x1, y);
  var len = x2 - x1;
  var nseg = coils * 2;
  var seg = len / nseg;
  var amp = Math.max(4, Math.min(13, Math.abs(len) / (coils * 1.4)));
  for (var i = 0; i < nseg; i++){
    var px = x1 + seg * (i + 0.5);
    ctx.lineTo(px, y + (i % 2 === 0 ? -amp : amp));
  }
  ctx.lineTo(x2, y); ctx.stroke();
}

function drawMass(x, y, label, sub){
  var s = massHalf;
  ctx.fillStyle = PAL.mass; ctx.strokeStyle = PAL.border; ctx.lineWidth = 2;
  ctx.fillRect(x - s, y - s, 2*s, 2*s);
  ctx.strokeRect(x - s, y - s, 2*s, 2*s);
  ctx.fillStyle = PAL['mass-ink']; ctx.font = 'bold 20px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y - 6);
  ctx.font = '11px ' + FONT;
  ctx.fillText(sub, x, y + 14);
  ctx.textBaseline = 'alphabetic';
}

function arrow(x, y, dx, color){
  if (Math.abs(dx) < 5) return;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y); ctx.stroke();
  var s = Math.sign(dx);
  ctx.beginPath();
  ctx.moveTo(x + dx, y); ctx.lineTo(x + dx - s*8, y - 5); ctx.lineTo(x + dx - s*8, y + 5);
  ctx.closePath(); ctx.fill();
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  var d = disp(state.t), x1 = d[0], x2 = d[1];
  var d1 = Math.max(-140, Math.min(140, x1 * DISP_SC));
  var d2 = Math.max(-140, Math.min(140, x2 * DISP_SC));
  var mx1 = eq1 + d1;
  var mx2 = eq2 + d2;

  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(20, chainTop, W - 40, chainBot - chainTop);

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  [eq1, eq2].forEach(function(ex){
    ctx.beginPath(); ctx.moveTo(ex, chainTop + 8); ctx.lineTo(ex, chainBot - 22); ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.fillStyle = PAL.faint; ctx.font = '11px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('m₁ 평형', eq1, chainBot - 6);
  ctx.fillText('m₂ 평형', eq2, chainBot - 6);

  ctx.fillStyle = PAL.wall; ctx.fillRect(wallX - 14, chainY - 60, 14, 120);
  for (var i = 0; i < 8; i++){
    ctx.strokeStyle = PAL.border2; ctx.beginPath();
    ctx.moveTo(wallX - 14, chainY - 60 + i*15); ctx.lineTo(wallX, chainY - 72 + i*15); ctx.stroke();
  }

  var restGap = eq2 - eq1;
  var curGap = mx2 - mx1;
  var strain = (curGap - restGap) / restGap;
  var strainMag = Math.min(1, Math.abs(strain) * 3.2);
  var k2col = blend('spring', 'high', strainMag);

  drawSpring(wallX, chainY, mx1 - massHalf, 12, PAL.spring, 2);
  drawSpring(mx1 + massHalf, chainY, mx2 - massHalf, 10, k2col, 2.5 + 1.5*strainMag);

  drawMass(mx1, chainY, 'm₁', 'x₁');
  drawMass(mx2, chainY, 'm₂', 'x₂');

  arrow(eq1, chainY - massHalf - 14, d1, PAL.accent);
  arrow(eq2, chainY - massHalf - 14, d2, PAL.high);

  ctx.fillStyle = PAL.text; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('A₁ = 1.5,  A₂ = −1.5,  φ = π/2   →   x(0) = [1, 0]', 28, 38);

  drawPlot(p1Top, p1Bot, 'x₁(t)', PAL.accent, function(p){ return p.x1; });
  drawPlot(p2Top, p2Bot, 'x₂(t)', PAL.high, function(p){ return p.x2; });
}

function drawPlot(top, bot, label, color, sel){
  var mid = (top + bot) / 2;
  var halfH = (bot - top) / 2 - 6;
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(plotL, mid); ctx.lineTo(plotR, mid); ctx.stroke();
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(plotL, top); ctx.lineTo(plotL, bot); ctx.stroke();
  ctx.fillStyle = color; ctx.font = 'bold 12px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText(label, plotL + 6, top + 14);
  ctx.fillStyle = PAL.faint; ctx.font = '10px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('시간 →', plotR - 4, bot - 4);

  var YSC = halfH / 3.2;
  var t1 = state.t, t0 = t1 - HIST_T;
  var tx = function(t){ return plotL + (t - t0) / HIST_T * plotW; };
  var yv = function(v){ return mid - Math.max(-halfH, Math.min(halfH, v * YSC)); };

  if (hist.length > 1){
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
    var started = false;
    for (var i = 0; i < hist.length; i++){
      var p = hist[i];
      if (p.t < t0) continue;
      var X = tx(p.t), Y = yv(sel(p));
      if (!started){ ctx.moveTo(X, Y); started = true; } else ctx.lineTo(X, Y);
    }
    ctx.stroke();
    var cur = hist[hist.length - 1];
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(tx(cur.t), yv(sel(cur)), 3.5, 0, 2*Math.PI); ctx.fill();
  }
}

function step(dt){
  state.t += dt * state.spd;
  var d = disp(state.t);
  hist.push({ t: state.t, x1: d[0], x2: d[1] });
  while (hist.length && hist[0].t < state.t - HIST_T - 1) hist.shift();
}

$('spd').addEventListener('input', function(){
  state.spd = parseFloat(this.value);
  $('spdv').textContent = state.spd.toFixed(1);
});
$('play').addEventListener('click', function(){
  state.running = !state.running;
  this.textContent = state.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', state.running);
});
$('reset').addEventListener('click', function(){
  state.A1 = 1.5; state.A2 = -1.5;
  state.phi1 = Math.PI/2; state.phi2 = Math.PI/2;
  state.spd = 1; state.t = 0; state.running = true;
  $('spd').value = '1';
  $('spdv').textContent = '1.0';
  $('play').textContent = '⏸ 일시정지';
  $('play').classList.add('btn-acc');
  seedHist();
  draw();
});

seedHist();
var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (state.running) step(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
