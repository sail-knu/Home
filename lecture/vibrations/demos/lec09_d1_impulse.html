<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L9-D1 · 임펄스 응답 h(t)</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 9강</p>
  <h1>임펄스 응답 h(t)</h1>
  <p class="lede">임펄스는 속도만 주고, x(0)은 항상 0입니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">감쇠비 ζ <span class="big-val" id="zv">0.125</span></p>
        <input type="range" id="z" min="0" max="0.98" step="0.005" value="0.125">
      </div>
      <div>
        <p class="ctrl-title">고유진동수 ωₙ <span class="big-val" id="wv">2.0</span> rad/s</p>
        <input type="range" id="w" min="1" max="12" step="0.1" value="2">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="620"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>x(t) = F̂ · h(t)</span>
      <span><i style="background:var(--high)"></i>포락선 ±(F̂/mω_d)e<sup>−ζωₙt</sup></span>
      <span><i style="background:var(--float)"></i>첫 봉우리 t_p</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 9강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var EPS = 1e-6;

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','float','grid',
   'plot-bg','mass','mass-ink','spring','wall'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
var MONO = 'Consolas, ui-monospace, monospace';

/* ---- 상태: m=1, F̂=0.2, t=0 단일 임펄스 ---- */
var P = { zeta: 0.125, wn: 2, m: 1, Fhat: 0.2 };
var impulses = [{ t0: 0, Fh: 0.2 }];
var state = { t: 0, running: true, famOn: false };

/* ---- 물리 (원본 유지) ---- */
function derive(){
  var z  = Math.min(Math.max(P.zeta, 0), 1 - EPS);
  var wn = Math.max(P.wn, EPS);
  var wd = Math.max(wn * Math.sqrt(Math.max(1 - z * z, EPS)), EPS);
  var m  = Math.max(P.m, EPS);
  return { z:z, wn:wn, wd:wd, m:m, zwn: z * wn };
}
function respOne(t, imp, d){
  var dt = t - imp.t0;
  if (dt < 0) return 0;
  return imp.Fh / (d.m * d.wd) * Math.exp(-d.zwn * dt) * Math.sin(d.wd * dt);
}
function respSum(t, d){
  var s = 0;
  for (var i = 0; i < impulses.length; i++) s += respOne(t, impulses[i], d);
  return s;
}
function peakTime(d){ return Math.atan2(d.wd, Math.max(d.zwn, EPS)) / d.wd; }

function yScaleAmp(d){
  var a = 0, tp = Math.max(0, peakTime(d));
  for (var i = 0; i < impulses.length; i++)
    a += impulses[i].Fh / (d.m * d.wd) * Math.exp(-d.zwn * tp);
  if (state.famOn) a = Math.max(a, P.Fhat / (d.m * (P.wn * Math.sqrt(0.99))));
  return Math.max(a, 1e-4);
}
function winSpan(d){
  var Td   = 2 * Math.PI / d.wd;
  var tDec = d.zwn > 1e-9 ? 6 / d.zwn : Infinity;
  var need = Math.max(tDec, 2.5 * peakTime(d));
  return Math.min(24, Math.max(1, Math.min(4 * Td, need)));
}
function fullSpan(d){
  var last = impulses.length ? impulses[impulses.length - 1].t0 : 0;
  return last + winSpan(d);
}
function niceStep(x){
  var e = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1e-9))));
  var f = x / e, n = f < 1.5 ? 1 : (f < 3 ? 2 : (f < 7 ? 5 : 10));
  return n * e;
}
function fmt(v, n){ return (isFinite(v) ? v : 0).toFixed(n); }
function mmTxt(v){ return (v * 1000).toFixed(Math.abs(v) < 0.02 ? 2 : 1) + ' mm'; }

var bandTop = 22, bandBot = 196, massY = (bandTop + bandBot) / 2;
var eqX = 470, wallX = 76, mside = 64;
var plotL = 68, plotR = 876, plotTop = 258, plotBot = 574;
var plotW = plotR - plotL, plotH = plotBot - plotTop, zeroY = plotTop + plotH / 2;

function arrow(x1, y1, x2, y2, color, lw){
  var dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  if (L < 4) return;
  var ux = dx / L, uy = dy / L, hs = Math.min(10, L * 0.5);
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hs*ux - hs*0.5*uy, y2 - hs*uy + hs*0.5*ux);
  ctx.lineTo(x2 - hs*ux + hs*0.5*uy, y2 - hs*uy - hs*0.5*ux);
  ctx.closePath(); ctx.fill();
}
function drawSpring(x1, y, x2, coils){
  ctx.strokeStyle = PAL.spring; ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y);
  var len = x2 - x1, seg = len / (coils * 2);
  for (var i = 0; i < coils * 2; i++){
    ctx.lineTo(x1 + seg * (i + 0.5), y + (i % 2 === 0 ? -12 : 12));
  }
  ctx.lineTo(x2, y); ctx.stroke();
}
function tagText(txt, x, y, color, align){
  ctx.textAlign = align || 'left';
  var w = ctx.measureText(txt).width, ox = (align === 'center') ? -w / 2 : (align === 'right' ? -w : 0);
  ctx.fillStyle = PAL['plot-bg'];
  ctx.fillRect(x + ox - 3, y - 12, w + 6, 16);
  ctx.fillStyle = color;
  ctx.fillText(txt, x, y);
}

function drawBand(d, x, amp){
  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(20, bandTop, W - 40, bandBot - bandTop);
  ctx.strokeStyle = PAL.border; ctx.lineWidth = 1;
  ctx.strokeRect(20, bandTop, W - 40, bandBot - bandTop);

  ctx.fillStyle = PAL.faint; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('질량 m = 1 kg  ·  F̂ = 0.2 N·s', 32, bandTop + 20);

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(eqX, bandTop + 28); ctx.lineTo(eqX, bandBot - 26); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('평형 위치 x = 0', eqX, bandBot - 9);

  ctx.fillStyle = PAL.wall; ctx.fillRect(wallX - 16, massY - 56, 16, 112);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.2;
  for (var i = 0; i < 8; i++){
    ctx.beginPath();
    ctx.moveTo(wallX - 16, massY - 56 + i * 14);
    ctx.lineTo(wallX, massY - 68 + i * 14); ctx.stroke();
  }
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(wallX - 16, massY + 44); ctx.lineTo(W - 34, massY + 44); ctx.stroke();

  var massSc = 132 / amp;
  var massX = eqX + Math.max(-150, Math.min(150, x * massSc));
  drawSpring(wallX, massY, massX - mside / 2, 12);
  ctx.fillStyle = PAL.mass; ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2;
  ctx.fillRect(massX - mside/2, massY - mside/2, mside, mside);
  ctx.strokeRect(massX - mside/2, massY - mside/2, mside, mside);
  ctx.fillStyle = PAL['mass-ink']; ctx.font = 'bold 21px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('m', massX, massY); ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = PAL.accent; ctx.font = 'bold 13.5px ' + MONO; ctx.textAlign = 'center';
  ctx.fillText('x = ' + mmTxt(x), massX, massY - mside/2 - 10);

  var age = state.t - impulses[0].t0;
  if (age >= 0 && age < 0.5){
    ctx.save();
    ctx.globalAlpha = 1 - age / 0.5;
    arrow(massX - mside/2 - 74, massY, massX - mside/2 - 8, massY, PAL.high, 4);
    ctx.font = '30px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = PAL.high;
    ctx.fillText('🔨', massX - mside/2 - 92, massY + 10);
    ctx.restore();
  }
}

function drawPlot(d, x, amp, TWIN){
  var winT0 = 0, winT1 = TWIN;
  var tx = function(t){ return plotL + (t - winT0) / TWIN * plotW; };
  var yScale = (plotH / 2) * 0.9 / amp;
  var yx = function(v){ return zeroY - v * yScale; };

  ctx.textAlign = 'left';
  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT;
  ctx.fillText('x(t)  [mm]', 20, plotTop - 36);
  ctx.fillStyle = PAL.muted; ctx.font = '13.5px ' + FONT;
  ctx.fillText('x(t) = (F̂ / m ω_d) · e^(−ζωₙ t) · sin ω_d t', 20, plotTop - 14);

  var ts = niceStep(TWIN / 6);
  ctx.font = '12.5px ' + FONT; ctx.textAlign = 'center';
  for (var tv = Math.ceil(winT0 / ts) * ts; tv <= winT1 + 1e-9; tv += ts){
    var gx = tx(tv);
    ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(gx, plotTop); ctx.lineTo(gx, plotBot); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PAL.faint;
    ctx.fillText(fmt(tv, ts < 1 ? 1 : 0), gx, plotBot + 19);
  }
  var vs = niceStep(amp * 0.55);
  ctx.textAlign = 'right';
  for (var k = 1; k <= 3; k++){
    for (var sg = -1; sg <= 1; sg += 2){
      var vv = sg * k * vs, gy = yx(vv);
      if (gy < plotTop + 2 || gy > plotBot - 2) continue;
      ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.moveTo(plotL, gy); ctx.lineTo(plotR, gy); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT;
      ctx.fillText((vv * 1000).toFixed(vs < 0.02 ? 1 : 0), plotL - 8, gy + 4);
    }
  }

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(plotL, plotTop); ctx.lineTo(plotL, plotBot); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(plotL, zeroY); ctx.lineTo(plotR, zeroY); ctx.stroke();
  ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('t [s] →', plotR, plotBot + 40);

  ctx.save();
  ctx.beginPath(); ctx.rect(plotL, plotTop, plotW, plotH); ctx.clip();

  var im0 = impulses[0];
  ctx.strokeStyle = PAL.high; ctx.globalAlpha = 0.6; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.6;
  for (var s2 = -1; s2 <= 1; s2 += 2){
    ctx.beginPath(); var st2 = false;
    for (var pxE = 0; pxE <= plotW; pxE += 2){
      var tE = winT0 + pxE / plotW * TWIN, dtE = tE - im0.t0;
      if (dtE < 0) continue;
      var yvE = s2 * im0.Fh / (d.m * d.wd) * Math.exp(-d.zwn * dtE);
      if (st2) ctx.lineTo(plotL + pxE, yx(yvE)); else { ctx.moveTo(plotL + pxE, yx(yvE)); st2 = true; }
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.setLineDash([]);

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.8; ctx.lineJoin = 'round';
  ctx.beginPath(); var st4 = false;
  for (var pxS = 0; pxS <= plotW; pxS += 1.5){
    var tS = winT0 + pxS / plotW * TWIN;
    if (tS > state.t + 1e-9) break;
    var yvS = respSum(tS, d);
    if (st4) ctx.lineTo(plotL + pxS, yx(yvS)); else { ctx.moveTo(plotL + pxS, yx(yvS)); st4 = true; }
  }
  ctx.stroke();

  var tp = peakTime(d), tpAbs = im0.t0 + tp, xp = respOne(tpAbs, im0, d);
  var pxTp = tx(tpAbs);
  if (state.t >= tpAbs && pxTp >= plotL && pxTp <= plotR){
    ctx.strokeStyle = PAL.float; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(pxTp, zeroY); ctx.lineTo(pxTp, yx(xp)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PAL.float;
    ctx.beginPath(); ctx.arc(pxTp, yx(xp), 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.font = 'bold 12.5px ' + FONT;
    var tpTxt = 't_p = ' + fmt(tp, 3) + ' s';
    var tpRight = pxTp + 8 + ctx.measureText(tpTxt).width < plotR - 4;
    tagText(tpTxt, tpRight ? pxTp + 8 : pxTp - 8,
            Math.max(plotTop + 14, yx(xp) - 8), PAL.float, tpRight ? 'left' : 'right');
  }

  var cx = tx(state.t);
  if (state.t >= impulses[0].t0 && cx >= plotL && cx <= plotR + 1){
    ctx.fillStyle = PAL.text;
    ctx.beginPath(); ctx.arc(cx, yx(x), 5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  ctx.font = '13px ' + MONO; ctx.textAlign = 'right';
  ctx.fillStyle = PAL.accent;
  ctx.fillText('ω_d = ' + fmt(d.wd, 3) + '   v₀ = ' + fmt(P.Fhat / d.m, 3) + ' m/s   x = ' + mmTxt(x), plotR, plotTop - 14);
}

function draw(){
  var d = derive();
  var x = respSum(state.t, d), amp = yScaleAmp(d), TWIN = fullSpan(d);
  ctx.clearRect(0, 0, W, H);
  drawBand(d, x, amp);
  drawPlot(d, x, amp, TWIN);
}

function syncSpans(){
  $('zv').textContent = P.zeta.toFixed(3);
  $('wv').textContent = P.wn.toFixed(1);
  $('z').value = P.zeta; $('w').value = P.wn;
}
function setPlay(on){
  state.running = on;
  $('play').textContent = on ? '⏸ 일시정지' : '▶ 재생';
  $('play').classList.toggle('btn-acc', on);
}
$('z').addEventListener('input', function(){
  P.zeta = parseFloat(this.value); $('zv').textContent = P.zeta.toFixed(3); draw();
});
$('w').addEventListener('input', function(){
  P.wn = parseFloat(this.value); $('wv').textContent = P.wn.toFixed(1); draw();
});
$('play').addEventListener('click', function(){
  if (!state.running && state.t >= fullSpan(derive()) - 1e-9) state.t = 0;
  setPlay(!state.running);
});
$('reset').addEventListener('click', function(){
  P.zeta = 0.125; P.wn = 2; P.m = 1; P.Fhat = 0.2;
  impulses = [{ t0: 0, Fh: 0.2 }];
  state.t = 0; state.famOn = false;
  setPlay(true);
  syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (state.running && impulses.length){
    state.t += dt;
    var lim = fullSpan(derive());
    if (state.t >= lim){ state.t = lim; setPlay(false); }
  }
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
draw();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
