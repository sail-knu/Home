<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L14-D1 · 흡진기 조정: X=0</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
  --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 14강</p>
  <h1>흡진기 조정: X=0</h1>
  <p class="lede">ωₐ=ω가 되면 주질량 진폭 X가 0이 됩니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">흡진기 강성 kₐ <span class="big-val" id="kav">20000</span> N/m</p>
        <input type="range" id="ka" min="4000" max="40000" step="500" value="20000">
      </div>
      <div>
        <p class="ctrl-title">흡진기 질량 mₐ <span class="big-val" id="mav">2.0</span> kg</p>
        <input type="range" id="ma" min="0.5" max="6" step="0.1" value="2">
      </div>
      <div>
        <p class="ctrl-title">가진 진동수 ω <span class="big-val" id="wv">100</span> rad/s</p>
        <input type="range" id="w" min="40" max="160" step="1" value="100">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="540"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>주질량 진폭 |X|</span>
      <span><i style="background:var(--low)"></i>흡진기 mₐ</span>
      <span><i style="background:var(--float)"></i>현재 ω</span>
      <span><i style="background:var(--high)"></i>조정점 ωₐ</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 14강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var M = 10;
var K = 1.0e5;
var F0 = 40;

var state = { ka: 20000, ma: 2, w: 100, t: 0, running: true };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','accent-ink','high','low','ok','float','grid',
   'mass','mass-ink','spring','wall'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function rgbParts(c){
  var m = String(c).match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if (m) return [+m[1], +m[2], +m[3]];
  if (c.charAt(0) === '#' && c.length === 7)
    return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  return [136,136,136];
}
function alpha(key, a){
  var p = rgbParts(PAL[key]);
  return 'rgba('+p[0]+','+p[1]+','+p[2]+','+a+')';
}

function reset(){
  state.ka = 20000; state.ma = 2; state.w = 100; state.t = 0;
  state.running = true;
  $('ka').value = 20000; $('kav').textContent = '20000';
  $('ma').value = 2;     $('mav').textContent = '2.0';
  $('w').value = 100;    $('wv').textContent = '100';
  $('play').textContent = '⏸ 일시정지';
  $('play').classList.add('btn-acc');
}

function amplitudes(w, ka, ma, F0v){
  var w2 = w * w;
  var num = ka - ma * w2;
  var det = (K + ka - M * w2) * num - ka * ka;
  var floor = 1e-6 * ka * ka;
  if (Math.abs(det) < floor) det = (det < 0 ? -1 : 1) * floor;
  var X  = num * F0v / det;
  var Xa = ka * F0v / det;
  return { X: X, Xa: Xa, det: det, num: num };
}

var animL = 30, animR = W * 0.42;
var plotL = W * 0.50, plotR = W - 30;
var plotTop = 60, plotBot = H - 55;
var groundY = H - 80;

function ampToPx(a){
  var capM = 0.006;
  var px = a / capM * 46;
  return Math.max(-70, Math.min(70, px));
}

function drawSpring(x0, y0, x1, y1, coils, col){
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  var dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
  var ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
  ctx.beginPath(); ctx.moveTo(x0, y0);
  var n = coils * 2;
  for (var i = 0; i < n; i++){
    var f = (i + 0.5) / n;
    var off = (i % 2 === 0 ? 8 : -8);
    ctx.lineTo(x0 + dx * f + nx * off, y0 + dy * f + ny * off);
  }
  ctx.lineTo(x1, y1); ctx.stroke();
}

function arrow(x, y, len, col, label){
  if (Math.abs(len) < 4) return;
  var s = Math.sign(len);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + len, y); ctx.lineTo(x + len - s * 9, y - 5); ctx.lineTo(x + len - s * 9, y + 5);
  ctx.closePath(); ctx.fill();
  if (label){ ctx.font = '11px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText(label, x + len + s * 12, y - 8); }
}

function draw(){
  ctx.clearRect(0, 0, W, H);

  var amp = amplitudes(state.w, state.ka, state.ma, F0);
  var X = amp.X, Xa = amp.Xa;
  var wa = Math.sqrt(state.ka / state.ma);
  var tuned = Math.abs(state.w - wa) < 0.8;

  var s = Math.sin(state.w * state.t);
  var xMain = ampToPx(X * s);
  var xAbs  = ampToPx(Xa * s);

  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = PAL.wall;
  ctx.fillRect(animL, groundY, animR - animL, 12);
  ctx.strokeStyle = PAL.border2;
  for (var i = 0; i < 12; i++){ ctx.beginPath();
    ctx.moveTo(animL + i * 20, groundY + 12); ctx.lineTo(animL + i * 20 + 10, groundY + 22); ctx.stroke(); }

  var midX = (animL + animR) / 2;
  var mainCX = midX + xMain;
  var mainCY = groundY - 150;
  var mainW = 120, mainHt = 88;

  drawSpring(midX - 30, groundY, mainCX - 30, mainCY + mainHt / 2, 7, PAL.spring);
  ctx.strokeStyle = PAL.spring; ctx.lineWidth = 2;
  ctx.setLineDash([3,5]); ctx.beginPath();
  ctx.moveTo(midX, groundY); ctx.lineTo(midX, plotTop + 10); ctx.stroke(); ctx.setLineDash([]);

  ctx.fillStyle = PAL.mass;
  ctx.strokeStyle = tuned ? PAL.ok : PAL.accent; ctx.lineWidth = 2.5;
  ctx.fillRect(mainCX - mainW/2, mainCY - mainHt/2, mainW, mainHt);
  ctx.strokeRect(mainCX - mainW/2, mainCY - mainHt/2, mainW, mainHt);
  ctx.fillStyle = PAL['mass-ink']; ctx.font = 'bold 18px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('주질량 m', mainCX, mainCY - 10);
  ctx.font = '12px ' + FONT; ctx.fillStyle = PAL['mass-ink'];
  ctx.fillText('장치', mainCX, mainCY + 14);
  ctx.textBaseline = 'alphabetic';

  var attachX = mainCX + mainW/2;
  var attachY = mainCY;
  var absCX = attachX + 70 + (xAbs - xMain);
  var absCY = attachY;
  var absS = 46;
  drawSpring(attachX, attachY, absCX - absS/2, absCY, 6, tuned ? PAL.ok : PAL.low);
  ctx.fillStyle = PAL.mass;
  ctx.strokeStyle = PAL.low; ctx.lineWidth = 2.5;
  ctx.fillRect(absCX - absS/2, absCY - absS/2, absS, absS);
  ctx.strokeRect(absCX - absS/2, absCY - absS/2, absS, absS);
  ctx.fillStyle = PAL['mass-ink']; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('mₐ', absCX, absCY); ctx.textBaseline = 'alphabetic';
  ctx.font = '11px ' + FONT; ctx.fillStyle = PAL.muted; ctx.textAlign = 'center';
  ctx.fillText('흡진기', absCX, absCY + absS/2 + 16);
  ctx.fillText('kₐ', (attachX + absCX - absS/2)/2, attachY - 12);

  var forceY = mainCY - mainHt/2 - 30;
  var Fpx = Math.max(-55, Math.min(55, F0 / 120 * 55)) * s;
  arrow(mainCX, forceY, Fpx, PAL.float, 'F₀ 외력');
  var Fabs = state.ka * ((Xa - X) * s);
  var FabsPx = Math.max(-55, Math.min(55, Fabs / 120 * 55));
  arrow(mainCX, forceY + 26, FabsPx, tuned ? PAL.ok : PAL.high, 'kₐ(xₐ−x)');
  if (tuned){
    ctx.fillStyle = PAL.ok; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText('두 힘이 상쇄 → 합력 0', mainCX, forceY - 24);
  }

  ctx.fillStyle = PAL.faint; ctx.font = '12px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('X : Xₐ 실제 비율', midX, plotTop - 4);

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(plotL, plotTop); ctx.lineTo(plotL, plotBot); ctx.lineTo(plotR, plotBot); ctx.stroke();
  ctx.fillStyle = PAL.muted; ctx.font = '12px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('주질량 진폭 |X|  vs  ω', (plotL + plotR)/2, plotTop - 8);
  ctx.textAlign = 'right'; ctx.fillText('|X|', plotL - 6, plotTop + 10);
  ctx.textAlign = 'center'; ctx.fillText('ω [rad/s]', (plotL + plotR)/2, plotBot + 32);

  var wMin = 40, wMax = 160;
  var plotW = plotR - plotL, plotH = plotBot - plotTop;
  var wx = function(w){ return plotL + (w - wMin) / (wMax - wMin) * plotW; };
  var Xref = F0 / K;
  var yScaleMax = Xref * 8;
  var Xy = function(a){ return plotBot - Math.min(1, Math.abs(a) / yScaleMax) * plotH * 0.94; };

  ctx.strokeStyle = PAL.grid; ctx.fillStyle = PAL.faint; ctx.font = '10px ' + FONT; ctx.textAlign = 'center';
  for (var wt = 40; wt <= 160; wt += 20){
    var px = wx(wt);
    ctx.beginPath(); ctx.moveTo(px, plotBot); ctx.lineTo(px, plotBot + 4); ctx.stroke();
    ctx.fillText(wt, px, plotBot + 16);
  }

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.2; ctx.beginPath();
  var started = false;
  for (var pxp = plotL; pxp <= plotR; pxp += 1.5){
    var wv = wMin + (pxp - plotL) / plotW * (wMax - wMin);
    var a = amplitudes(wv, state.ka, state.ma, F0);
    var big = Math.abs(a.X) > yScaleMax * 1.02;
    var y = Xy(a.X);
    if (big){ started = false; continue; }
    if (!started){ ctx.moveTo(pxp, y); started = true; }
    else ctx.lineTo(pxp, y);
  }
  ctx.stroke();

  if (wa >= wMin && wa <= wMax){
    var pxA = wx(wa);
    ctx.strokeStyle = PAL.high; ctx.setLineDash([5,4]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(pxA, plotTop); ctx.lineTo(pxA, plotBot); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = PAL.high; ctx.font = '11px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText('ωₐ (X=0)', pxA, plotTop + 12);
    ctx.fillStyle = PAL.high; ctx.beginPath(); ctx.arc(pxA, plotBot - 2, 4, 0, Math.PI*2); ctx.fill();
  }

  var pxW = wx(state.w);
  ctx.strokeStyle = PAL.float; ctx.lineWidth = 1.8; ctx.setLineDash([2,3]);
  ctx.beginPath(); ctx.moveTo(pxW, plotTop); ctx.lineTo(pxW, plotBot); ctx.stroke(); ctx.setLineDash([]);
  var curY = Xy(X);
  ctx.fillStyle = PAL.float; ctx.beginPath(); ctx.arc(pxW, curY, 5, 0, Math.PI*2); ctx.fill();
  ctx.font = '11px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('현재 ω', pxW, plotTop + 24);

  var fmtAmp = function(a){
    var mm = Math.abs(a) * 1000;
    return mm > 1e4 ? '발산' : mm.toFixed(2) + ' mm';
  };
  ctx.fillStyle = PAL.text; ctx.font = '12px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('|X|=' + fmtAmp(X) + '   |Xₐ|=' + fmtAmp(Xa) + '   ωₐ=' + wa.toFixed(1), plotL, H - 12);
}

function bind(id, key, span, fmt){
  $(id).addEventListener('input', function(){
    state[key] = parseFloat(this.value);
    $(span).textContent = fmt(state[key]);
  });
}
bind('ka', 'ka', 'kav', function(v){ return v.toFixed(0); });
bind('ma', 'ma', 'mav', function(v){ return v.toFixed(1); });
bind('w',  'w',  'wv',  function(v){ return v.toFixed(0); });

$('play').addEventListener('click', function(){
  state.running = !state.running;
  this.textContent = state.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', state.running);
});
$('reset').addEventListener('click', reset);

reset();
var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0; last = now;
  if (state.running) state.t += dt;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
