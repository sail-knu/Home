<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L13-D2 · 직교성과 정규화</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
  --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 13강</p>
  <h1>직교성과 정규화</h1>
  <p class="lede">고유벡터를 질량정규화하면 SᵀMS=I, SᵀKS=Λ입니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">질량 m₁ <span class="big-val" id="m1v">1.0</span> kg</p>
        <input type="range" id="m1" min="0.5" max="6" step="0.1" value="1">
      </div>
      <div>
        <p class="ctrl-title">질량 m₂ <span class="big-val" id="m2v">4.0</span> kg</p>
        <input type="range" id="m2" min="0.5" max="6" step="0.1" value="4">
      </div>
      <div>
        <p class="ctrl-title">강성 k₁ = k₃ <span class="big-val" id="k13v">10</span> N/m</p>
        <input type="range" id="k13" min="1" max="30" step="1" value="10">
      </div>
      <div>
        <p class="ctrl-title">연결 강성 k₂ <span class="big-val" id="k2v">2</span> N/m</p>
        <input type="range" id="k2" min="0" max="20" step="1" value="2">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="420"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>대각 = 1 (정규화)</span>
      <span><i style="background:var(--float)"></i>대각 = ω² = λ</span>
      <span><i style="background:var(--ok)"></i>비대각 ≈ 0</span>
      <span><i style="background:var(--high)"></i>0에서 벗어남</span>
    </div>
    <div class="btn-row">
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 13강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var EPS = 1e-6;

var state = { m1: 1, m2: 4, k13: 10, k2: 2 };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','surface3','border','border2','text','muted','faint','accent','accent-soft','high','low','ok','float','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function rgbParts(c){
  var m = String(c).match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if (m) return [+m[1], +m[2], +m[3]];
  if (c.charAt(0) === '#' && c.length === 7)
    return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  return [136,136,136];
}
function alpha(key, a){
  var p = rgbParts(PAL[key]);
  return 'rgba('+p[0]+','+p[1]+','+p[2]+','+a+')';
}

function solve(){
  var m1 = Math.max(state.m1, EPS), m2 = Math.max(state.m2, EPS);
  var k13 = state.k13, k2 = state.k2;
  var M = [[m1, 0], [0, m2]];
  var K = [[k13 + k2, -k2], [-k2, k2 + k13]];

  var s1 = 1 / Math.sqrt(m1), s2 = 1 / Math.sqrt(m2);
  var a = K[0][0] * s1 * s1;
  var d = K[1][1] * s2 * s2;
  var b = K[0][1] * s1 * s2;

  var tr = a + d, det = a * d - b * b;
  var disc = Math.max((a - d) * (a - d) + 4 * b * b, 0);
  var rt = Math.sqrt(disc);
  var l1 = Math.max((tr - rt) / 2, 0), l2 = Math.max((tr + rt) / 2, 0);

  function eigvecA(lam){
    var yx, yy;
    var r1a = a - lam, r1b = b;
    var r2a = b, r2b = d - lam;
    if (Math.abs(r1a) + Math.abs(r1b) >= Math.abs(r2a) + Math.abs(r2b)){
      if (Math.abs(r1b) > EPS){ yx = 1; yy = -r1a / r1b; }
      else if (Math.abs(r1a) > EPS){ yx = 0; yy = 1; }
      else { yx = 1; yy = 0; }
    } else {
      if (Math.abs(r2b) > EPS){ yx = 1; yy = -r2a / r2b; }
      else if (Math.abs(r2a) > EPS){ yx = 0; yy = 1; }
      else { yx = 1; yy = 0; }
    }
    var n = Math.hypot(yx, yy) || 1;
    return [yx / n, yy / n];
  }
  var y1 = eigvecA(l1);
  var y2 = [-y1[1], y1[0]];
  var u1 = [s1 * y1[0], s2 * y1[1]];
  var u2 = [s1 * y2[0], s2 * y2[1]];

  if (u1[0] < 0){ u1 = [-u1[0], -u1[1]]; }
  if (u2[0] > 0){ u2 = [-u2[0], -u2[1]]; }

  var Smat = [[u1[0], u2[0]], [u1[1], u2[1]]];
  return { M: M, K: K, S: Smat, u1: u1, u2: u2, l1: l1, l2: l2 };
}

function matT(A){ return [[A[0][0],A[1][0]],[A[0][1],A[1][1]]]; }
function matMul(A,B){
  return [
    [A[0][0]*B[0][0]+A[0][1]*B[1][0], A[0][0]*B[0][1]+A[0][1]*B[1][1]],
    [A[1][0]*B[0][0]+A[1][1]*B[1][0], A[1][0]*B[0][1]+A[1][1]*B[1][1]]
  ];
}
function clean(x){ return (Math.abs(x) < 1e-9) ? 0 : x; }

function drawMatrix(x, y, title, A, mode){
  var cell = 58, pad = 2;
  ctx.fillStyle = PAL.text; ctx.font = 'bold 14px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline='alphabetic';
  ctx.fillText(title, x, y - 10);
  for (var i = 0; i < 2; i++){
    for (var j = 0; j < 2; j++){
      var cx = x + j * (cell + pad), cy = y + i * (cell + pad);
      var val = A[i][j];
      var bg = PAL.surface2, fg = PAL.text;
      var isDiag = (i === j);
      if (mode === 'identity'){
        if (isDiag){
          var err = Math.abs(val - 1);
          bg = err < 0.02 ? alpha('accent', 0.28) : alpha('float', 0.28);
          fg = PAL.text;
        } else {
          var off = Math.abs(val);
          if (off < 0.02){ bg = alpha('ok', 0.20); fg = PAL.muted; }
          else { bg = alpha('high', 0.28); fg = PAL.high; }
        }
      } else if (mode === 'lambda'){
        if (isDiag){ bg = alpha('float', 0.28); fg = PAL.text; }
        else {
          var off2 = Math.abs(val);
          if (off2 < 0.02){ bg = alpha('ok', 0.20); fg = PAL.muted; }
          else { bg = alpha('high', 0.28); fg = PAL.high; }
        }
      } else {
        if (isDiag) bg = alpha('accent', 0.16);
        else if (Math.abs(val) > 1e-9) bg = alpha('ok', 0.12);
      }
      ctx.fillStyle = bg;
      roundRect(cx, cy, cell, cell, 7); ctx.fill();
      ctx.strokeStyle = PAL.border; ctx.lineWidth = 1;
      roundRect(cx, cy, cell, cell, 7); ctx.stroke();
      ctx.fillStyle = fg; ctx.font = '15px Consolas, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(fmtNum(clean(val)), cx + cell/2, cy + cell/2);
    }
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}
function fmtNum(v){
  if (v === 0) return '0';
  if (Math.abs(v) >= 100) return v.toFixed(1);
  if (Math.abs(v) >= 10) return v.toFixed(2);
  return v.toFixed(3);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  var sol = solve();
  var M = sol.M, K = sol.K, Smat = sol.S;
  var St = matT(Smat);
  var StMS = matMul(matMul(St, M), Smat);
  var StKS = matMul(matMul(St, K), Smat);

  var topY = 44, colGap = 40, base = 40;
  var x = base;
  drawMatrix(x, topY, 'M (질량)', M, 'plain'); x += 118 + colGap;
  drawMatrix(x, topY, 'K (강성)', K, 'plain'); x += 118 + colGap;
  drawMatrix(x, topY, 'S = [u₁ u₂]', Smat, 'plain');

  var midY = 232;
  ctx.fillStyle = PAL.accent; ctx.font = 'bold 15px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('검산', base, midY - 14);

  var x2 = base + 90;
  drawMatrix(x2, midY, 'SᵀM S  ( = I )', StMS, 'identity'); x2 += 118 + 70;
  drawMatrix(x2, midY, 'SᵀK S  ( = Λ )', StKS, 'lambda');

  ctx.fillStyle = PAL.muted; ctx.font = '12px ' + FONT;
  ctx.fillText('대각 → 1 (질량 정규화),  비대각 → 0 (M-직교)', base + 90, midY + 145);
  ctx.fillText('대각 → λ = ω²,  비대각 → 0', base + 90 + 308, midY + 145);

  ctx.fillStyle = PAL.text; ctx.font = '13px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('λ₁=' + sol.l1.toFixed(3) + '   λ₂=' + sol.l2.toFixed(3) +
    '   ω₁=' + Math.sqrt(sol.l1).toFixed(3) + '   ω₂=' + Math.sqrt(sol.l2).toFixed(3), W - 24, 22);
}

function bindNum(id, key, span, fmt){
  $(id).addEventListener('input', function(){
    state[key] = parseFloat(this.value);
    $(span).textContent = fmt(state[key]);
    draw();
  });
}
bindNum('m1', 'm1', 'm1v', function(v){ return v.toFixed(1); });
bindNum('m2', 'm2', 'm2v', function(v){ return v.toFixed(1); });
bindNum('k13', 'k13', 'k13v', function(v){ return v.toFixed(0); });
bindNum('k2', 'k2', 'k2v', function(v){ return v.toFixed(0); });

function reset(){
  state.m1 = 1; state.m2 = 4; state.k13 = 10; state.k2 = 2;
  $('m1').value = 1;  $('m1v').textContent = '1.0';
  $('m2').value = 4;  $('m2v').textContent = '4.0';
  $('k13').value = 10; $('k13v').textContent = '10';
  $('k2').value = 2;  $('k2v').textContent = '2';
  draw();
}
$('reset').addEventListener('click', reset);
draw();
})();
</script>
</body>
</html>
