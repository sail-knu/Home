<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L11-D3 · 시간이동 정리</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 11강</p>
  <h1>시간이동 정리</h1>
  <p class="lede">임펄스를 a만큼 늦추면 응답 모양은 같고 오른쪽으로 밀립니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">임펄스 시각 a <span class="big-val" id="av">3.14</span> s</p>
        <input type="range" id="a" min="0" max="10" step="0.01" value="3.14">
      </div>
      <div>
        <p class="ctrl-title">감쇠비 ζ <span class="big-val" id="zv">0.707</span></p>
        <input type="range" id="z" min="0" max="0.98" step="0.001" value="0.707">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="460"></canvas>
    <div class="legend">
      <span><i style="background:var(--faint)"></i>기준 h(t) (a=0)</span>
      <span><i style="background:var(--accent)"></i>지연 응답 x(t) = h(t−a)Φ(t−a)</span>
      <span><i style="background:var(--high)"></i>임펄스 δ(t−a)</span>
      <span><i style="background:var(--float)"></i>평행이동량 a</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 11강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','float','grid','plot-bg','accent-line'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT  = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
var MONOF = 'Consolas, ui-monospace, monospace';

var M = 1.0;
var WN = Math.SQRT2;
var T_MAX = 12;
var A0 = Math.PI, Z0 = 0.707;

var st = { a: A0, zeta: Z0, running: true, t: 0 };
var impulses = [ { a: A0 } ];

function omegaD(z){
  var zc = Math.min(0.999999, Math.max(0, z));
  return WN * Math.sqrt(1 - zc * zc);
}
function h(t, z){
  if (t < 0) return 0;
  var wd = omegaD(z);
  var env = Math.exp(-z * WN * t);
  if (wd < 1e-6) return t * env;
  return (1 / (M * wd)) * env * Math.sin(wd * t);
}
function xk(t, ak, z){ return h(t - ak, z); }
function xtotal(t, z){
  var s = 0;
  for (var i = 0; i < impulses.length; i++) s += xk(t, impulses[i].a, z);
  return s;
}
function peakTime(z){
  var wd = omegaD(z);
  if (wd < 1e-6) return 1 / (z * WN);
  return Math.atan2(wd, z * WN) / wd;
}

var plotL = 66, plotR = W - 30, plotTop = 78, plotBot = H - 66;
var plotW = plotR - plotL, plotH = plotBot - plotTop, midY = (plotTop + plotBot) / 2;
function tx(t){ return plotL + (t / T_MAX) * plotW; }

function yScale(){
  var amax = 0, NN = 600;
  for (var i = 0; i <= NN; i++){
    var v = Math.abs(xtotal((i / NN) * T_MAX, st.zeta));
    if (v > amax) amax = v;
  }
  if (!isFinite(amax) || amax < 1e-6) amax = 1;
  return (plotH * 0.40) / amax;
}
function ty(v, sc){
  var y = midY - v * sc;
  if (!isFinite(y)) y = midY;
  return Math.max(plotTop, Math.min(plotBot, y));
}
function textBox(txt, x, y, align, font, color){
  ctx.font = font; ctx.textAlign = align;
  var w = ctx.measureText(txt).width;
  var bx = (align === 'center') ? x - w/2 : (align === 'right' ? x - w : x);
  ctx.fillStyle = PAL['plot-bg'];
  ctx.fillRect(bx - 5, y - 13, w + 10, 19);
  ctx.fillStyle = color;
  ctx.fillText(txt, x, y);
}
function arrowHead(x, y, dx, dy, size){
  var L = Math.hypot(dx, dy); if (L < 1e-6) return;
  var ux = dx / L, uy = dy / L;
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x - size*ux - size*0.5*uy, y - size*uy + size*0.5*ux);
  ctx.lineTo(x - size*ux + size*0.5*uy, y - size*uy - size*0.5*ux);
  ctx.closePath(); ctx.fill();
}

function draw(){
  impulses = [{ a: st.a }];
  var z = st.zeta, a = st.a, sc = yScale(), wd = omegaD(z), zwn = z * WN;
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT;
  ctx.fillText('x(t) = h(t−a)·Φ(t−a)', 26, 28);
  ctx.fillStyle = PAL.muted; ctx.font = '13.5px ' + FONT;
  ctx.fillText('L[ f(t−a)Φ(t−a) ] = e^(−as)·F(s)      ωₙ = √2,  m = 1', 26, 52);

  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
  for (var tt = 0; tt <= T_MAX; tt += 2){
    var Xg = tx(tt);
    ctx.beginPath(); ctx.moveTo(Xg, plotTop); ctx.lineTo(Xg, plotBot); ctx.stroke();
  }
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(plotL, plotTop - 6); ctx.lineTo(plotL, plotBot + 6);
  ctx.moveTo(plotL - 6, midY);    ctx.lineTo(plotR + 6, midY);
  ctx.stroke();

  ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT;
  ctx.textAlign = 'left';  ctx.fillText('x(t)', 26, midY - 8);
  ctx.textAlign = 'right'; ctx.fillText('시간 t [s] →', plotR, plotBot + 44);
  ctx.textAlign = 'center'; ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT;
  for (var t2 = 0; t2 <= T_MAX; t2 += 2) ctx.fillText(t2.toFixed(0), tx(t2), plotBot + 22);

  [Math.PI, 2*Math.PI, 3*Math.PI].forEach(function(pv, i){
    if (pv > T_MAX) return;
    var X = tx(pv);
    ctx.strokeStyle = PAL['accent-line'] || PAL.accent; ctx.setLineDash([3,4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(X, plotTop); ctx.lineTo(X, plotBot); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PAL.accent; ctx.font = 'bold 12.5px ' + FONT;
    ctx.fillText((i === 0 ? 'π' : (i+1) + 'π'), X, plotBot + 41);
  });

  if (a > 0.15){
    ctx.strokeStyle = PAL.faint; ctx.lineWidth = 1.8;
    ctx.setLineDash([6,5]); ctx.globalAlpha = 0.8; ctx.beginPath();
    for (var pg = 0; pg <= plotW; pg++){
      var tg = (pg / plotW) * T_MAX, Yg = ty(h(tg, z), sc);
      if (pg === 0) ctx.moveTo(plotL, Yg); else ctx.lineTo(plotL + pg, Yg);
    }
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    textBox('기준 h(t) : a=0', plotL + 6, midY + 62, 'left', '12.5px ' + FONT, PAL.faint);
  }

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 3.2; ctx.beginPath();
  for (var pt = 0; pt <= plotW; pt++){
    var tv = (pt / plotW) * T_MAX, Yt = ty(xtotal(tv, z), sc);
    if (pt === 0) ctx.moveTo(plotL, Yt); else ctx.lineTo(plotL + pt, Yt);
  }
  ctx.stroke();

  var ax = tx(a);
  ctx.strokeStyle = PAL.high; ctx.fillStyle = PAL.high; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(ax, midY); ctx.lineTo(ax, plotTop + 26); ctx.stroke();
  arrowHead(ax, plotTop + 18, 0, -1, 11);
  ctx.font = 'bold 12.5px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('δ(t−' + a.toFixed(2) + ')', ax, plotTop + 8);

  if (a > 0.3){
    var tp = peakTime(z), yPk = ty(h(tp, z), sc);
    var x1 = tx(tp), x2 = tx(tp + a);
    if (x2 < plotR - 4){
      ctx.strokeStyle = PAL.float; ctx.fillStyle = PAL.float; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x1, yPk); ctx.lineTo(x2, yPk); ctx.stroke();
      arrowHead(x2, yPk, 1, 0, 9); arrowHead(x1, yPk, -1, 0, 9);
      textBox('평행이동 a = ' + a.toFixed(2) + ' s', (x1 + x2)/2, yPk + 4,
              'center', 'bold 13px ' + FONT, PAL.float);
    }
  }

  if (a > 1.2){
    textBox('t < a : x = 0', (plotL + tx(a)) / 2, midY + 26,
            'center', '13px ' + FONT, PAL.muted);
  }

  var tc = st.t;
  if (tc <= T_MAX){
    var cx = tx(tc), cy = ty(xtotal(tc, z), sc);
    ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(cx, plotTop); ctx.lineTo(cx, plotBot); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PAL.text;
    ctx.beginPath(); ctx.arc(cx, cy, 5.5, 0, Math.PI * 2); ctx.fill();
  }

  textBox('h(t) = (1/ωd) e^(−ζωn t) sin(ωd t)', plotR, plotBot - 40, 'right', '14px ' + MONOF, PAL.muted);
  textBox('ωn=' + WN.toFixed(3) + '  ζωn=' + zwn.toFixed(3) + '  ωd=' + wd.toFixed(3) +
          '  x=' + (tc <= T_MAX ? xtotal(tc, z) : 0).toFixed(3),
          plotR, plotBot - 16, 'right', 'bold 15px ' + MONOF, PAL.accent);
  ctx.textAlign = 'left';
}

function syncSpans(){
  $('av').textContent = st.a.toFixed(2);
  $('zv').textContent = st.zeta.toFixed(3);
  $('a').value = st.a; $('z').value = st.zeta;
}
$('a').addEventListener('input', function(){
  st.a = parseFloat(this.value);
  impulses = [{ a: st.a }];
  $('av').textContent = st.a.toFixed(2);
});
$('z').addEventListener('input', function(){
  st.zeta = parseFloat(this.value);
  $('zv').textContent = st.zeta.toFixed(3);
});
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.a = A0; st.zeta = Z0; st.t = 0; st.running = true;
  impulses = [ { a: A0 } ];
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running){
    st.t += dt * 1.6;
    if (st.t > T_MAX) st.t = 0;
  }
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
