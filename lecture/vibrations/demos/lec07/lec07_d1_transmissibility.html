<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L7-D1 · 전달률 X/Y</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 7강</p>
  <h1>전달률 X/Y</h1>
  <p class="lede">r=√2에서 모든 ζ의 X/Y가 1로 만납니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">감쇠비 ζ <span class="big-val" id="zv">0.10</span></p>
        <input type="range" id="z" min="0" max="1" step="0.01" value="0.10">
      </div>
      <div>
        <p class="ctrl-title">진동수비 r <span class="big-val" id="rv">0.50</span></p>
        <input type="range" id="r" min="0" max="4" step="0.01" value="0.50">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="480"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>X/Y</span>
      <span><i style="background:var(--high)"></i>증폭 r&lt;√2</span>
      <span><i style="background:var(--ok)"></i>절연 r&gt;√2</span>
      <span><i style="background:var(--low)"></i>바닥 Y</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 7강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var EPS = 1e-6;
var SQRT2 = Math.SQRT2;
var st = { z: 0.10, r: 0.50, running: true, phase: 0 };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface','surface2','border','border2','text','muted','faint','accent','high','low','float','ok','grid','plot-bg'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function dispTR(z, r){
  var two = 2 * z * r;
  var denom = (1 - r * r) * (1 - r * r) + two * two;
  if (denom < EPS * EPS) denom = EPS * EPS;
  var val = Math.sqrt((1 + two * two) / denom);
  return isFinite(val) ? val : 1e6;
}
function fmtTR(v){ return (isFinite(v) && v <= 999) ? v.toFixed(2) : '≫999'; }

var plotL = 66, plotR = W - 24, plotTop = 44, plotBot = H - 48;
var plotW = plotR - plotL, plotH = plotBot - plotTop;
var R_MAX = 4, TR_MAX = 6;

function rx(r){ return plotL + (r / R_MAX) * plotW; }
function ty(v){
  var cl = Math.max(0, Math.min(TR_MAX, v));
  return plotBot - (cl / TR_MAX) * plotH;
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  var curV = dispTR(st.z, st.r);

  ctx.globalAlpha = 0.09;
  ctx.fillStyle = PAL.high;
  ctx.fillRect(plotL, plotTop, rx(SQRT2) - plotL, plotH);
  ctx.fillStyle = PAL.ok;
  ctx.fillRect(rx(SQRT2), plotTop, plotR - rx(SQRT2), plotH);
  ctx.globalAlpha = 1;

  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
  ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT;
  for (var ri = 0; ri <= R_MAX; ri++){
    ctx.beginPath(); ctx.moveTo(rx(ri), plotTop); ctx.lineTo(rx(ri), plotBot); ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillText(String(ri), rx(ri), plotBot + 20);
  }
  [1,2,3,4,5,6].forEach(function(v){
    ctx.beginPath(); ctx.moveTo(plotL, ty(v)); ctx.lineTo(plotR, ty(v)); ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillText(String(v), plotL - 8, ty(v) + 4.5);
  });

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(plotL, plotTop); ctx.lineTo(plotL, plotBot); ctx.lineTo(plotR, plotBot); ctx.stroke();

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(plotL, ty(1)); ctx.lineTo(plotR, ty(1)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = PAL.muted; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('X/Y = 1', plotL + 8, ty(1) + 16);

  ctx.strokeStyle = PAL.text; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.7;
  ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.moveTo(rx(SQRT2), plotTop); ctx.lineTo(rx(SQRT2), plotBot); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  ctx.fillStyle = PAL.text; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('r = √2', rx(SQRT2), plotBot + 36);

  ctx.font = 'bold 13px ' + FONT;
  ctx.fillStyle = PAL.high; ctx.fillText('증폭', rx(0.55), plotTop + 18);
  ctx.fillStyle = PAL.ok;   ctx.fillText('절연', rx(2.6), plotTop + 18);

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('전달률 X/Y', plotL, plotTop - 14);
  ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('ζ = ' + st.z.toFixed(2) + '   r = ' + st.r.toFixed(2) + '   X/Y = ' + fmtTR(curV), plotR, plotTop - 14);

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 3.0;
  ctx.beginPath();
  for (var px = 0; px <= plotW; px++){
    var rr = (px / plotW) * R_MAX;
    var X = plotL + px, Y = ty(dispTR(st.z, rr));
    if (px === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.stroke();

  var cxX = rx(SQRT2), cxY = ty(1);
  ctx.fillStyle = PAL.text; ctx.globalAlpha = 0.28;
  ctx.beginPath(); ctx.arc(cxX, cxY, 8, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(cxX, cxY, 4.5, 0, Math.PI * 2); ctx.fill();

  var mX = rx(st.r), mY = ty(curV);
  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.55;
  ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(mX, plotBot); ctx.lineTo(mX, mY); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  var mYc = Math.max(plotTop + 3, mY);
  ctx.beginPath(); ctx.arc(mX, mYc, 7, 0, Math.PI * 2);
  ctx.fillStyle = (Math.abs(st.r - SQRT2) < 0.03) ? PAL.float : ((st.r < SQRT2) ? PAL.high : PAL.ok);
  ctx.fill();

  drawMotionInset();
}

function drawMotionInset(){
  var bw = 200, bh = 110, bx = plotR - bw - 12, by = plotTop + 28;
  ctx.fillStyle = PAL.surface;
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1; ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = PAL.text; ctx.font = 'bold 12px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('Y vs X', bx + 10, by + 16);

  var rawRatio = dispTR(st.z, st.r);
  var cyF = by + 48, cyM = by + 86;
  var Yamp = 22;
  var ratio = Math.min(3.2, rawRatio);
  var Xamp = Yamp * ratio;
  var s = st.phase;
  var lane = 40;
  var cxc = bx + lane + (bw - lane - 10) / 2;
  var half = (bw - lane - 10) / 2 - 14;

  var fx = cxc + Yamp * Math.sin(s);
  ctx.fillStyle = PAL.low;
  ctx.fillRect(fx - 12, cyF - 8, 24, 16);
  var mx = cxc + Math.max(-half, Math.min(half, Xamp * Math.sin(s)));
  ctx.fillStyle = PAL.accent;
  ctx.fillRect(mx - 14, cyM - 9, 28, 18);
  ctx.font = '12px ' + FONT; ctx.textAlign = 'left';
  ctx.fillStyle = PAL.low;    ctx.fillText('Y', bx + 8, cyF + 4);
  ctx.fillStyle = PAL.accent; ctx.fillText('X', bx + 8, cyM + 4);
}

function syncSpans(){
  $('zv').textContent = st.z.toFixed(2);
  $('rv').textContent = st.r.toFixed(2);
  $('z').value = st.z; $('r').value = st.r;
}
$('z').addEventListener('input', function(){ st.z = parseFloat(this.value); syncSpans(); draw(); });
$('r').addEventListener('input', function(){ st.r = parseFloat(this.value); syncSpans(); draw(); });
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.z = 0.10; st.r = 0.50; st.phase = 0; st.running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running) st.phase += 3 * dt;
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
