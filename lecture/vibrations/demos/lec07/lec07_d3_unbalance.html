<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L7-D3 · 회전불균형</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 7강</p>
  <h1>회전불균형</h1>
  <p class="lede">고속에서 진폭은 m₀ε/m로 수렴하고, 힘 F=m₀εω²은 계속 커집니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">회전속도 ωᵣ <span class="big-val" id="wv">15.0</span> rad/s</p>
        <input type="range" id="w" min="0" max="60" step="0.5" value="15">
      </div>
      <div>
        <p class="ctrl-title">감쇠비 ζ <span class="big-val" id="zv">0.10</span></p>
        <input type="range" id="z" min="0" max="1" step="0.01" value="0.10">
      </div>
      <div>
        <p class="ctrl-title">불균형량 m₀ε <span class="big-val" id="mev">0.75</span> kg·m</p>
        <input type="range" id="me" min="0.05" max="2" step="0.05" value="0.75">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="540"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>β(r) = mX/m₀ε</span>
      <span><i style="background:var(--high)"></i>편심 m₀ · r=1</span>
      <span><i style="background:var(--float)"></i>원심력 F</span>
      <span><i style="background:var(--ok)"></i>β = 1 · 본체 X</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 7강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var M = 60;
var WN = 15;
var EPS = 1e-6;
var st = { me: 0.75, z: 0.10, w: 15, phi: 0, running: true };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface','surface2','border','border2','text','muted','faint','accent','high','low','float','ok','grid','plot-bg','mass','mass-ink','spring','wall'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function beta(r, z){
  var num = r * r;
  var den = Math.sqrt((1 - r * r) * (1 - r * r) + (2 * z * r) * (2 * z * r));
  return num / Math.max(den, EPS);
}
function fmtX(Xm){
  return (isFinite(Xm) && Xm < 10) ? (Xm * 1000).toFixed(1) + ' mm' : '≫10 m';
}

var machCX = 212, bodyW = 246, bodyH = 152, drumR = 60;
var machBaseY = 208;
var floorY = 442;
var DISP_MAX = 58;
var plotL = 478, plotR = 872, plotTop = 68, plotBot = 468;
var plotW = plotR - plotL, plotH = plotBot - plotTop;
var R_MAX = 4, B_MAX = 5;
function rx(rr){ return plotL + rr / R_MAX * plotW; }
function by(bb){ return plotBot - Math.min(bb, B_MAX) / B_MAX * plotH; }
function ampScalePx(Xm){
  var px = Xm / 0.05 * 60;
  return Math.max(-DISP_MAX, Math.min(DISP_MAX, px));
}

function drawSpring(x, yTop, yBot, coils, w){
  ctx.strokeStyle = PAL.spring; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(x, yTop);
  var len = yBot - yTop, seg = len / (coils * 2);
  for (var i = 0; i < coils * 2; i++){
    var py = yTop + seg * (i + 0.5);
    ctx.lineTo(x + (i % 2 === 0 ? -w : w), py);
  }
  ctx.lineTo(x, yBot); ctx.stroke();
}
function drawArrow(x0, y0, x1, y1, color, lw, headScale){
  var hs = headScale || 8;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  var ang = Math.atan2(y1 - y0, x1 - x0);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - hs * Math.cos(ang - 0.4), y1 - hs * Math.sin(ang - 0.4));
  ctx.lineTo(x1 - hs * Math.cos(ang + 0.4), y1 - hs * Math.sin(ang + 0.4));
  ctx.closePath(); ctx.fill();
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  var r = st.w / WN;
  var b = beta(r, st.z);
  var Xm = (st.me / M) * b;
  var Xlim = st.me / M;
  var F = st.me * st.w * st.w;
  var apx = ampScalePx(Xm);
  var disp = apx * Math.cos(st.phi);
  var bodyTop = machBaseY + disp, bodyBot = bodyTop + bodyH;

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('세탁기 탈수', 20, 32);
  ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT;
  ctx.fillText('r = ' + r.toFixed(2) + '   β = ' + ((isFinite(b) && b < 1e3) ? b.toFixed(2) : '≫1e3') + '   X = ' + fmtX(Xm) + '   F = ' + F.toFixed(0) + ' N', 20, 54);

  ctx.fillStyle = PAL.wall;
  ctx.fillRect(14, floorY, 400, 13);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.4;
  for (var i = 0; i < 15; i++){
    var hx = 22 + i * 27;
    ctx.beginPath(); ctx.moveTo(hx, floorY + 13); ctx.lineTo(hx - 12, floorY + 26); ctx.stroke();
  }

  drawSpring(machCX - 88, bodyBot, floorY, 6, 9);
  drawSpring(machCX + 88, bodyBot, floorY, 6, 9);

  ctx.strokeStyle = PAL.border2; ctx.setLineDash([5, 5]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(14, machBaseY); ctx.lineTo(404, machBaseY); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = PAL.mass;
  ctx.fillRect(machCX - bodyW / 2, bodyTop, bodyW, bodyH);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 2;
  ctx.strokeRect(machCX - bodyW / 2, bodyTop, bodyW, bodyH);

  var drumCY = bodyTop + bodyH / 2;
  ctx.strokeStyle = PAL['mass-ink']; ctx.globalAlpha = 0.55; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.arc(machCX, drumCY, drumR, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 0.25; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(machCX, drumCY, drumR - 9, 0, Math.PI * 2); ctx.stroke();
  for (var k = 0; k < 4; k++){
    var a = st.phi + k * Math.PI / 2;
    ctx.beginPath(); ctx.moveTo(machCX, drumCY);
    ctx.lineTo(machCX + (drumR - 9) * Math.cos(a), drumCY + (drumR - 9) * Math.sin(a)); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  var er = drumR - 22;
  var ex = machCX + er * Math.cos(st.phi);
  var ey = drumCY + er * Math.sin(st.phi);
  ctx.strokeStyle = PAL.high; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(machCX, drumCY); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = PAL.high;
  ctx.beginPath(); ctx.arc(ex, ey, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PAL.surface; ctx.font = 'bold 12.5px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('m₀', ex, ey + 1);
  ctx.textBaseline = 'alphabetic';

  var Fpx = Math.min(76, F * 0.12);
  if (Fpx > 6){
    var sx = ex + 13 * Math.cos(st.phi), sy = ey + 13 * Math.sin(st.phi);
    var fx = sx + Fpx * Math.cos(st.phi), fy = sy + Fpx * Math.sin(st.phi);
    drawArrow(sx, sy, fx, fy, PAL.float, 3, 10);
    ctx.fillStyle = PAL.float; ctx.font = 'bold 13.5px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText('F', fx + 13 * Math.cos(st.phi), fy + 13 * Math.sin(st.phi) + 5);
  }

  var bodyL = machCX - bodyW / 2;
  var axx = bodyL - 24;
  var yUp = machBaseY - apx, yDn = machBaseY + apx;
  ctx.strokeStyle = PAL.ok; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(axx, yUp); ctx.lineTo(axx, yDn); ctx.stroke();
  drawArrow(axx, yUp + 1, axx, yUp - 15, PAL.ok, 2.2, 8);
  drawArrow(axx, yDn - 1, axx, yDn + 15, PAL.ok, 2.2, 8);
  ctx.fillStyle = PAL.ok; ctx.font = 'bold 13.5px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('X', axx, yUp - 21);

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('mX / m₀ε', plotL, 36);

  ctx.font = '12.5px ' + FONT;
  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
  for (var rr = 0; rr <= R_MAX; rr++){
    ctx.beginPath(); ctx.moveTo(rx(rr), plotTop); ctx.lineTo(rx(rr), plotBot); ctx.stroke();
  }
  for (var bb = 0; bb <= B_MAX; bb++){
    ctx.beginPath(); ctx.moveTo(plotL, by(bb)); ctx.lineTo(plotR, by(bb)); ctx.stroke();
  }
  ctx.fillStyle = PAL.faint;
  ctx.textAlign = 'center';
  for (var rr2 = 0; rr2 <= R_MAX; rr2++) ctx.fillText(String(rr2), rx(rr2), plotBot + 19);
  ctx.textAlign = 'right';
  for (var bb2 = 0; bb2 <= B_MAX; bb2++) ctx.fillText(String(bb2), plotL - 8, by(bb2) + 4);

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(plotL, plotTop); ctx.lineTo(plotL, plotBot); ctx.lineTo(plotR, plotBot); ctx.stroke();
  ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('r = ωᵣ/ωₙ', (plotL + plotR) / 2, plotBot + 42);

  ctx.strokeStyle = PAL.high; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(rx(1), plotTop); ctx.lineTo(rx(1), plotBot); ctx.stroke();
  ctx.strokeStyle = PAL.ok; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(plotL, by(1)); ctx.lineTo(plotR, by(1)); ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.8; ctx.beginPath();
  for (var j = 0; j <= 300; j++){
    var rr4 = j / 300 * R_MAX, X2 = rx(rr4), Y2 = by(beta(rr4, st.z));
    if (j) ctx.lineTo(X2, Y2); else ctx.moveTo(X2, Y2);
  }
  ctx.stroke();

  var pxp = rx(Math.min(r, R_MAX)), pyp = by(b);
  ctx.fillStyle = PAL.ok;
  ctx.beginPath(); ctx.arc(pxp, pyp, 6.5, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = PAL.high; ctx.font = 'bold 12.5px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('r=1', rx(1) - 8, plotTop + 16);
  ctx.fillStyle = PAL.ok; ctx.textAlign = 'right';
  ctx.fillText('β=1', plotR - 8, by(1) - 8);
}

function syncSpans(){
  $('mev').textContent = st.me.toFixed(2);
  $('zv').textContent  = st.z.toFixed(2);
  $('wv').textContent  = st.w.toFixed(1);
  $('me').value = st.me; $('z').value = st.z; $('w').value = st.w;
}
function bind(id, key){
  $(id).addEventListener('input', function(){
    st[key] = parseFloat(this.value); syncSpans(); draw();
  });
}
bind('me', 'me'); bind('z', 'z'); bind('w', 'w');

$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.me = 0.75; st.z = 0.10; st.w = 15; st.phi = 0; st.running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running){
    st.phi += st.w * 0.25 * dt;
    if (st.phi > Math.PI * 2) st.phi -= Math.PI * 2;
  }
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
