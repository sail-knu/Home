<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L7-D2 · 노면 주행 자동차</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:8px}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 7강</p>
  <h1>노면 주행 자동차</h1>
  <p class="lede">같은 노면 파장에서 속도가 가진 진동수 ω_b를 바꿉니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">주행 속도 v <span class="big-val" id="vv">20</span> km/h</p>
        <input type="range" id="v" min="2" max="160" step="1" value="20">
      </div>
      <div>
        <p class="ctrl-title">적재</p>
        <div class="btn-row" style="margin:0">
          <button class="btn btn-sm btn-acc" id="loadEmpty">공차</button>
          <button class="btn btn-sm" id="loadFull">만차</button>
        </div>
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="540"></canvas>
    <div class="legend">
      <span><i style="background:var(--low)"></i>노면 y(t) · λ=6 m, Y=1 cm</span>
      <span><i style="background:var(--accent)"></i>차체 X</span>
      <span><i style="background:var(--faint)"></i>다른 적재</span>
      <span><i style="background:var(--float)"></i>현재 v</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 7강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var LAMBDA  = 6;
var Y0      = 0.01;
var K       = 4e4;
var C       = 2000;
var M_EMPTY = 1007;
var M_FULL  = 1585;
var EPS     = 1e-6;
var V_MAX_PLOT = 160;
var ROOT2 = Math.SQRT2;

var st = { v: 20, loaded: false, t: 0, running: true };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface','surface2','border','border2','text','muted','faint','accent','accent-soft','high','low','float','ok','grid','plot-bg','mass','spring'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function sysVals(loaded){
  var m = loaded ? M_FULL : M_EMPTY;
  return { m:m, wn: Math.sqrt(K / m), zeta: C / (2 * Math.sqrt(K * m)) };
}
function omegaB(v){ return 2 * Math.PI * (v / 3.6) / LAMBDA; }
function speedFor(r, wn){ return r * wn * 3.6 * LAMBDA / (2 * Math.PI); }
function transmissibility(r, zeta){
  var num = 1 + (2 * zeta * r) * (2 * zeta * r);
  var den = (1 - r * r) * (1 - r * r) + (2 * zeta * r) * (2 * zeta * r);
  if (den < EPS) den = EPS;
  return Math.sqrt(num / den);
}
function phase(r, zeta){
  var th1 = Math.atan2(2 * zeta * r, 1 - r * r);
  var th2 = Math.atan(2 * zeta * r);
  return -th1 + th2;
}
function peak(loaded){
  var s = sysVals(loaded), bestV = 0, bestT = -1;
  for (var v = 1; v <= 200; v += 0.25){
    var T = transmissibility(omegaB(v) / s.wn, s.zeta);
    if (T > bestT){ bestT = T; bestV = v; }
  }
  return { v: bestV, T: bestT };
}
var PEAK_E = peak(false), PEAK_F = peak(true);
var XMAX = Math.max(PEAK_E.T, PEAK_F.T) * Y0 * 1.1;

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function niceStep(x){
  var e = Math.pow(10, Math.floor(Math.log(x) / Math.LN10)), f = x / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e;
}

var BAND_T = 14, BAND_B = 306;
var PX_PER_CM = 11;
var roadY = 262, wheelR = 18, roadWaveAmp = PX_PER_CM, roadPxPerM = 70;
var roadWlPx = LAMBDA * roadPxPerM;
var restY = 144;
var carX = W * 0.5;
var plotL = 64, plotR = W - 26, plotTop = 350, plotBot = H - 38;
var plotW = plotR - plotL, plotH = plotBot - plotTop;

function vx(v){ return plotL + (v / V_MAX_PLOT) * plotW; }
function xy(X){ return plotBot - Math.min(1, X / (XMAX || EPS)) * plotH; }
function roadYat(px){
  var distM = (st.v / 3.6) * st.t;
  var roadPhase = 2 * Math.PI * distM / LAMBDA;
  return roadY - roadWaveAmp * Math.sin(2 * Math.PI * (px - 20) / roadWlPx + roadPhase);
}

function draw(){
  var sv = sysVals(st.loaded), wn = sv.wn, zeta = sv.zeta;
  var wb = omegaB(st.v);
  var r  = wb / wn;
  var T  = transmissibility(r, zeta);
  var phi = phase(r, zeta);
  var Xamp = T * Y0;
  var pk = st.loaded ? PEAK_F : PEAK_E;
  var vres = pk.v;
  var vIso = speedFor(ROOT2, wn);

  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = PAL.surface;
  ctx.fillRect(18, BAND_T, W - 36, BAND_B - BAND_T);
  ctx.strokeStyle = PAL.border; ctx.lineWidth = 1;
  ctx.strokeRect(18.5, BAND_T + 0.5, W - 37, BAND_B - BAND_T - 1);

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('노면 → 차체', 32, 34);

  ctx.strokeStyle = PAL.low; ctx.lineWidth = 2.6; ctx.beginPath();
  for (var px = 20; px <= W - 20; px++){
    var yy = roadYat(px);
    if (px === 20) ctx.moveTo(px, yy); else ctx.lineTo(px, yy);
  }
  ctx.stroke();
  ctx.lineTo(W - 20, BAND_B - 4); ctx.lineTo(20, BAND_B - 4); ctx.closePath();
  ctx.globalAlpha = 0.13; ctx.fillStyle = PAL.low; ctx.fill(); ctx.globalAlpha = 1;

  ctx.strokeStyle = PAL.border2; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(carX - 96, restY); ctx.lineTo(carX + 150, restY); ctx.stroke();
  ctx.setLineDash([]);

  var bodyDispPx = PX_PER_CM * Xamp * 100 * Math.sin(wb * st.t + phi);
  var bodyY = restY - bodyDispPx;
  var bodyBot = bodyY + 20;
  ctx.strokeStyle = PAL.spring; ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
  [carX - 44, carX + 44].forEach(function(wx){
    var wy = roadYat(wx) - wheelR;
    var n = 12, dy = (bodyBot - wy) / n;
    ctx.beginPath(); ctx.moveTo(wx, wy);
    for (var i = 0; i < n; i++) ctx.lineTo(wx + (i % 2 === 0 ? -9 : 9), wy + dy * (i + 0.5));
    ctx.lineTo(wx, bodyBot); ctx.stroke();
  });
  [carX - 44, carX + 44].forEach(function(wx){
    var wy = roadYat(wx) - wheelR;
    ctx.fillStyle = PAL.mass; ctx.beginPath(); ctx.arc(wx, wy, wheelR, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = PAL.border2; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = PAL.surface2; ctx.beginPath(); ctx.arc(wx, wy, 5, 0, 2 * Math.PI); ctx.fill();
  });
  ctx.fillStyle = PAL['accent-soft']; ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.5;
  roundRect(carX - 70, bodyY - 20, 140, 40, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = PAL.surface; ctx.lineWidth = 2;
  roundRect(carX - 40, bodyY - 42, 80, 26, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = PAL.accent; ctx.font = 'bold 15px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(st.loaded ? '만차 1585 kg' : '공차 1007 kg', carX, bodyY);
  ctx.textBaseline = 'alphabetic';

  ctx.textAlign = 'left'; ctx.font = '13px ' + FONT; ctx.fillStyle = PAL.text;
  ctx.fillText('v = ' + st.v.toFixed(0) + ' km/h   ω_b = ' + wb.toFixed(2) + '   r = ' + r.toFixed(3) + '   X = ' + (Xamp * 100).toFixed(2) + ' cm', 32, BAND_B - 16);

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('차체 진폭 X [cm]', plotL - 2, plotTop - 14);

  if (vIso < V_MAX_PLOT){
    ctx.globalAlpha = 0.10; ctx.fillStyle = PAL.ok;
    ctx.fillRect(vx(vIso), plotTop, plotR - vx(vIso), plotH); ctx.globalAlpha = 1;
  }

  var maxCm = XMAX * 100, step = niceStep(maxCm / 4);
  ctx.font = '12.5px ' + FONT;
  for (var g = 0; g <= maxCm + 1e-9; g += step){
    var gy = xy(g / 100);
    if (g > 0){
      ctx.strokeStyle = PAL.grid; ctx.setLineDash([3, 4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(plotL, gy); ctx.lineTo(plotR, gy); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.fillStyle = PAL.faint; ctx.textAlign = 'right';
    ctx.fillText(g.toFixed(step < 1 ? 1 : 0), plotL - 8, gy + 4);
  }

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(plotL, plotTop); ctx.lineTo(plotL, plotBot); ctx.lineTo(plotR, plotBot); ctx.stroke();

  ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'center';
  [20, 40, 60, 80, 100, 120, 140, 160].forEach(function(v){
    ctx.fillText(String(v), vx(v), plotBot + 19);
  });

  ctx.strokeStyle = PAL.high; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(vx(vres), plotTop); ctx.lineTo(vx(vres), plotBot); ctx.stroke();
  ctx.strokeStyle = PAL.ok;
  ctx.beginPath(); ctx.moveTo(vx(vIso), plotTop); ctx.lineTo(vx(vIso), plotBot); ctx.stroke();
  ctx.setLineDash([]);

  function curve(loaded, color, lw, dash){
    var s2 = sysVals(loaded);
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash(dash || []);
    ctx.beginPath();
    for (var vv = 0; vv <= V_MAX_PLOT; vv += 1){
      var XX = transmissibility(omegaB(vv) / s2.wn, s2.zeta) * Y0;
      if (vv === 0) ctx.moveTo(vx(vv), xy(XX)); else ctx.lineTo(vx(vv), xy(XX));
    }
    ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.globalAlpha = 0.45; curve(!st.loaded, PAL.faint, 1.6, [6, 5]); ctx.globalAlpha = 1;
  curve(st.loaded, PAL.accent, 2.8);

  var mx = vx(st.v), my = xy(Xamp);
  ctx.strokeStyle = PAL.float; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.6;
  ctx.beginPath(); ctx.moveTo(mx, plotBot); ctx.lineTo(mx, my); ctx.stroke(); ctx.globalAlpha = 1;
  ctx.fillStyle = PAL.float; ctx.beginPath(); ctx.arc(mx, my, 6, 0, 2 * Math.PI); ctx.fill();
}

function syncUI(){
  $('vv').textContent = st.v.toFixed(0);
  $('v').value = st.v;
  $('loadEmpty').classList.toggle('btn-acc', !st.loaded);
  $('loadFull').classList.toggle('btn-acc', st.loaded);
}
$('v').addEventListener('input', function(){
  st.v = parseFloat(this.value); syncUI(); draw();
});
$('loadEmpty').addEventListener('click', function(){ st.loaded = false; syncUI(); draw(); });
$('loadFull').addEventListener('click', function(){ st.loaded = true; syncUI(); draw(); });
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.v = 20; st.loaded = false; st.t = 0; st.running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncUI(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running) st.t += dt;
  draw();
  requestAnimationFrame(loop);
}
syncUI();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
