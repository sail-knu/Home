<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L13-D1 · 모드좌표 vs 물리좌표</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
  --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 13강</p>
  <h1>모드좌표 vs 물리좌표</h1>
  <p class="lede">같은 운동을 x로 보면 섞이고, r로 보면 순수 사인입니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">초기 변위 x₁(0) <span class="big-val" id="x10v">1.00</span></p>
        <input type="range" id="x10" min="-2" max="2" step="0.05" value="1">
      </div>
      <div>
        <p class="ctrl-title">초기 변위 x₂(0) <span class="big-val" id="x20v">0.00</span></p>
        <input type="range" id="x20" min="-2" max="2" step="0.05" value="0">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="420"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>x₁ / r₁ (모드1, ω₁=√2)</span>
      <span><i style="background:var(--high)"></i>x₂ / r₂ (모드2, ω₂=2)</span>
      <span><i style="background:var(--float)"></i>현재 시각</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 13강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var W1 = Math.sqrt(2), W2 = 2;
var s = 1/(3*Math.sqrt(2));
var S = [[ s*1, s*(-1)], [ s*3, s*3]];
var si = 1/Math.sqrt(2);
var Sinv = [[ si*3, si*1], [ si*(-3), si*1]];

function modeIC(x1, x2){
  return [ Sinv[0][0]*x1 + Sinv[0][1]*x2,
           Sinv[1][0]*x1 + Sinv[1][1]*x2 ];
}
function rAt(r0, t){
  return [ r0[0]*Math.cos(W1*t), r0[1]*Math.cos(W2*t) ];
}
function physFrom(r){
  return [ S[0][0]*r[0] + S[0][1]*r[1],
           S[1][0]*r[0] + S[1][1]*r[1] ];
}

var state = { x10: 1.0, x20: 0.0, t: 0, running: true };
var r0 = modeIC(state.x10, state.x20);
var T_SPAN = 10;

function recompute(){ r0 = modeIC(state.x10, state.x20); }

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','ok','float','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function ampScale(){
  var rmax = Math.max(1e-6, Math.abs(r0[0]), Math.abs(r0[1]));
  var xmaxA = Math.abs(S[0][0]*r0[0]) + Math.abs(S[0][1]*r0[1]);
  var xmaxB = Math.abs(S[1][0]*r0[0]) + Math.abs(S[1][1]*r0[1]);
  var xmax = Math.max(1e-6, xmaxA, xmaxB);
  return { rmax: rmax, xmax: xmax };
}

var midX = W/2;
var gap = 26;
var halfL = { x0: 16, x1: midX - gap/2 };
var halfR = { x0: midX + gap/2, x1: W - 16 };
var curveTop = 48, curveBot = H - 28;

function drawAxes(reg, top, bot, xlabel){
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.2;
  var midY = (top+bot)/2;
  ctx.beginPath();
  ctx.moveTo(reg.x0+34, top+6); ctx.lineTo(reg.x0+34, bot);
  ctx.moveTo(reg.x0+34, midY); ctx.lineTo(reg.x1-6, midY);
  ctx.stroke();
  ctx.fillStyle = PAL.faint; ctx.font='11px '+FONT; ctx.textAlign='left';
  ctx.fillText(xlabel, reg.x1-58, bot+14);
}

function drawCurve(reg, top, bot, valueFn, sc, color, lw){
  var midY=(top+bot)/2, plotW=(reg.x1-6)-(reg.x0+34), plotL=reg.x0+34;
  ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.beginPath();
  var N=260, i, t, X, Y;
  for (i=0;i<=N;i++){
    t=i/N*T_SPAN;
    X=plotL + i/N*plotW;
    Y=midY - valueFn(t)*sc;
    Y=Math.max(top+4, Math.min(bot-4, Y));
    i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
  }
  ctx.stroke();
}

function curveCursor(reg, top, bot, valueFn, sc, tcur){
  var midY=(top+bot)/2, plotW=(reg.x1-6)-(reg.x0+34), plotL=reg.x0+34;
  var frac=(tcur % T_SPAN)/T_SPAN;
  var X=plotL+frac*plotW;
  var Y=midY - valueFn(tcur % T_SPAN)*sc;
  Y=Math.max(top+4, Math.min(bot-4, Y));
  ctx.fillStyle=PAL.float; ctx.beginPath(); ctx.arc(X,Y,4,0,7); ctx.fill();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  var sca = ampScale();
  var rmax = sca.rmax, xmax = sca.xmax;

  ctx.fillStyle=PAL.surface2;
  ctx.fillRect(halfL.x0, 34, halfL.x1-halfL.x0, H-50);
  ctx.fillRect(halfR.x0, 34, halfR.x1-halfR.x0, H-50);

  ctx.textAlign='center'; ctx.font='bold 14px '+FONT;
  ctx.fillStyle=PAL.accent; ctx.fillText('물리 좌표  x₁(t), x₂(t)', (halfL.x0+halfL.x1)/2, 26);
  ctx.fillStyle=PAL.low; ctx.fillText('모드 좌표  r₁(t), r₂(t)', (halfR.x0+halfR.x1)/2, 26);

  var tcur = state.t;
  var curveH = (curveBot-curveTop);
  var xSc = (curveH*0.42)/xmax;
  var rSc = (curveH*0.42)/rmax;

  drawAxes(halfL, curveTop, curveBot, '시간 →');
  var x1Fn = function(t){ return physFrom(rAt(r0,t))[0]; };
  var x2Fn = function(t){ return physFrom(rAt(r0,t))[1]; };
  drawCurve(halfL, curveTop, curveBot, x1Fn, xSc, PAL.accent, 2);
  drawCurve(halfL, curveTop, curveBot, x2Fn, xSc, PAL.high, 2);
  curveCursor(halfL, curveTop, curveBot, x1Fn, xSc, tcur);
  curveCursor(halfL, curveTop, curveBot, x2Fn, xSc, tcur);

  drawAxes(halfR, curveTop, curveBot, '시간 →');
  var r1Fn = function(t){ return rAt(r0,t)[0]; };
  var r2Fn = function(t){ return rAt(r0,t)[1]; };
  drawCurve(halfR, curveTop, curveBot, r1Fn, rSc, PAL.accent, 2);
  drawCurve(halfR, curveTop, curveBot, r2Fn, rSc, PAL.high, 2);
  curveCursor(halfR, curveTop, curveBot, r1Fn, rSc, tcur);
  curveCursor(halfR, curveTop, curveBot, r2Fn, rSc, tcur);

  ctx.fillStyle=PAL.muted; ctx.font='12px '+FONT; ctx.textAlign='center';
  ctx.fillText('r₁(0)='+r0[0].toFixed(3)+'   r₂(0)='+r0[1].toFixed(3), midX, H-8);
}

function setSliders(x1, x2){
  state.x10=x1; state.x20=x2;
  $('x10').value=x1;
  $('x20').value=x2;
  $('x10v').textContent=x1.toFixed(2);
  $('x20v').textContent=x2.toFixed(2);
  recompute(); state.t=0;
}
$('x10').addEventListener('input', function(){
  state.x10=parseFloat(this.value);
  $('x10v').textContent=state.x10.toFixed(2);
  recompute();
});
$('x20').addEventListener('input', function(){
  state.x20=parseFloat(this.value);
  $('x20v').textContent=state.x20.toFixed(2);
  recompute();
});
$('play').addEventListener('click', function(){
  state.running=!state.running;
  this.textContent = state.running?'⏸ 일시정지':'▶ 재생';
  this.classList.toggle('btn-acc', state.running);
});
$('reset').addEventListener('click', function(){
  setSliders(1.0, 0.0);
  state.running=true;
  $('play').textContent='⏸ 일시정지';
  $('play').classList.add('btn-acc');
});

setSliders(1.0, 0.0);
var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033,(now-last)/1000) : 0;
  last=now;
  if (state.running) state.t += dt;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
