<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L12-D2 · 특성방정식</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
  --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 12강</p>
  <h1>특성방정식</h1>
  <p class="lede">det(K−λM)=0의 근 λ가 ω²입니다. k/m은 진짜 근이 아닙니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">질량 m₁ <span class="big-val" id="m1v">9.0</span> kg</p>
        <input type="range" id="m1" min="0.5" max="12" step="0.1" value="9">
      </div>
      <div>
        <p class="ctrl-title">질량 m₂ <span class="big-val" id="m2v">1.0</span> kg</p>
        <input type="range" id="m2" min="0.5" max="12" step="0.1" value="1">
      </div>
      <div>
        <p class="ctrl-title">강성 k₁ <span class="big-val" id="k1v">24</span> N/m</p>
        <input type="range" id="k1" min="0" max="40" step="1" value="24">
      </div>
      <div>
        <p class="ctrl-title">강성 k₂ <span class="big-val" id="k2v">3</span> N/m</p>
        <input type="range" id="k2" min="0" max="40" step="1" value="3">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="420"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>p(λ)</span>
      <span><i style="background:var(--high)"></i>근 λ₁, λ₂</span>
      <span><i style="background:var(--faint)"></i>파선 k₁/m₁, k₂/m₂</span>
    </div>
    <div class="btn-row">
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 12강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var EPS = 1e-6;

var state = { m1: 9, m2: 1, k1: 24, k2: 3 };
var DEFAULT = { m1: 9, m2: 1, k1: 24, k2: 3 };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','ok','float','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function rgbParts(c){
  var m = String(c).match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if (m) return [+m[1], +m[2], +m[3]];
  if (c.charAt(0) === '#' && c.length === 7)
    return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  return [136,136,136];
}
function alpha(key, a){
  var p = rgbParts(PAL[key]);
  return 'rgba('+p[0]+','+p[1]+','+p[2]+','+a+')';
}

function solve(s){
  var a = s.m1 * s.m2;
  var b = -(s.m1 * s.k2 + s.m2 * s.k1 + s.m2 * s.k2);
  var c = s.k1 * s.k2;
  var disc = Math.max(0, b * b - 4 * a * c);
  var sq = Math.sqrt(disc);
  var lam1 = Math.max(0, (-b - sq) / (2 * a));
  var lam2 = Math.max(0, (-b + sq) / (2 * a));
  var w1 = Math.sqrt(lam1), w2 = Math.sqrt(lam2);
  function eigvec(lam){
    var denom = (s.k1 + s.k2) - lam * s.m1;
    var r;
    if (Math.abs(denom) < EPS){
      r = (Math.abs(s.k2) < EPS) ? 0 : (s.k2 - lam * s.m2) / s.k2;
    } else {
      r = s.k2 / denom;
    }
    var u1 = r, u2 = 1;
    var n = Math.hypot(u1, u2) || 1;
    return { u1: u1 / n, u2: u2 / n, ratio: r };
  }
  return { a: a, b: b, c: c, lam1: lam1, lam2: lam2, w1: w1, w2: w2, disc: disc,
           u1: eigvec(lam1), u2: eigvec(lam2) };
}

var plotL = 60, plotR = W - 24, plotTop = 48, plotBot = 360;
var plotW = plotR - plotL, plotH = plotBot - plotTop;

function fmt(x, d){
  if (!isFinite(x)) return '—';
  return x.toFixed(d);
}

function draw(){
  var s = state, r = solve(s);
  ctx.clearRect(0, 0, W, H);

  var lamMax = Math.max(r.lam2 * 1.6, 4, r.lam2 + 2);
  var xOfLam = function(lam){ return plotL + (lam / lamMax) * plotW; };
  var pOf = function(lam){ return r.a * lam * lam + r.b * lam + r.c; };
  var pMin = Infinity, pMax = -Infinity;
  var NS = 240, i, lam, p;
  for (i = 0; i <= NS; i++){
    lam = (i / NS) * lamMax;
    p = pOf(lam);
    if (p < pMin) pMin = p; if (p > pMax) pMax = p;
  }
  if (pMax - pMin < EPS){ pMax = pMin + 1; }
  var pad = (pMax - pMin) * 0.12;
  pMin -= pad; pMax += pad;
  if (pMin > 0) pMin = -pMax * 0.15;
  var yOfP = function(pv){ return plotBot - ((pv - pMin) / (pMax - pMin)) * plotH; };

  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(plotL, plotTop, plotW, plotH);
  var y0 = yOfP(0);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(plotL, y0); ctx.lineTo(plotR, y0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(plotL, plotTop); ctx.lineTo(plotL, plotBot); ctx.stroke();
  ctx.fillStyle = PAL.muted; ctx.font = '11px ' + FONT;
  ctx.textAlign = 'left';  ctx.fillText('p(λ)', plotL - 40, plotTop + 12);
  ctx.textAlign = 'right'; ctx.fillText('λ = ω² →', plotR, plotBot + 18);
  ctx.textAlign = 'left';  ctx.fillText('p = 0', plotL + 4, y0 - 4);

  ctx.fillStyle = PAL.faint; ctx.font = '10px ' + FONT; ctx.textAlign = 'center';
  var tickN = 6;
  for (i = 0; i <= tickN; i++){
    lam = (i / tickN) * lamMax;
    var X = xOfLam(lam);
    ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(X, plotTop); ctx.lineTo(X, plotBot); ctx.stroke();
    ctx.fillStyle = PAL.faint;
    ctx.fillText(lam.toFixed(1), X, plotBot + 18);
  }

  var sub = [
    { v: s.k1 / s.m1, label: 'k₁/m₁' },
    { v: s.k2 / s.m2, label: 'k₂/m₂' }
  ];
  ctx.setLineDash([4, 4]); ctx.lineWidth = 1.2;
  sub.forEach(function(sv){
    if (sv.v <= lamMax + EPS && sv.v >= 0){
      var Xs = xOfLam(sv.v);
      ctx.strokeStyle = PAL.faint;
      ctx.beginPath(); ctx.moveTo(Xs, plotTop + 4); ctx.lineTo(Xs, plotBot - 4); ctx.stroke();
      ctx.fillStyle = PAL.muted; ctx.font = '10px ' + FONT; ctx.textAlign = 'center';
      ctx.fillText(sv.label, Xs, plotTop + 14);
    }
  });
  ctx.setLineDash([]);

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.5; ctx.beginPath();
  for (i = 0; i <= NS; i++){
    lam = (i / NS) * lamMax;
    var Xp = xOfLam(lam), Y = yOfP(pOf(lam));
    i ? ctx.lineTo(Xp, Y) : ctx.moveTo(Xp, Y);
  }
  ctx.stroke();

  [[r.lam1, 'λ₁'], [r.lam2, 'λ₂']].forEach(function(rt){
    var Xr = xOfLam(rt[0]);
    ctx.fillStyle = PAL.high;
    ctx.beginPath(); ctx.arc(Xr, y0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = PAL.border; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = PAL.high; ctx.font = 'bold 12px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText(rt[1] + ' = ' + rt[0].toFixed(3), Xr, y0 + 22);
  });

  ctx.fillStyle = PAL.text; ctx.font = '13px ' + FONT; ctx.textAlign = 'left';
  var bAbs = Math.abs(r.b);
  var bSign = r.b < 0 ? '−' : '+';
  ctx.fillText('p(λ) = ' + r.a.toFixed(1) + ' λ² ' + bSign + ' ' + bAbs.toFixed(1) + ' λ + ' + r.c.toFixed(1), plotL, 28);
  ctx.fillStyle = PAL.muted; ctx.font = '12px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('ω₁=' + fmt(r.w1, 3) + '   ω₂=' + fmt(r.w2, 3), plotR, 28);
}

function setUI(){
  $('m1').value = state.m1;
  $('m2').value = state.m2;
  $('k1').value = state.k1;
  $('k2').value = state.k2;
  $('m1v').textContent = state.m1.toFixed(1);
  $('m2v').textContent = state.m2.toFixed(1);
  $('k1v').textContent = state.k1.toFixed(0);
  $('k2v').textContent = state.k2.toFixed(0);
}
function bind(id, key, span, d){
  $(id).addEventListener('input', function(){
    state[key] = parseFloat(this.value);
    $(span).textContent = state[key].toFixed(d);
    draw();
  });
}
bind('m1', 'm1', 'm1v', 1);
bind('m2', 'm2', 'm2v', 1);
bind('k1', 'k1', 'k1v', 0);
bind('k2', 'k2', 'k2v', 0);

$('reset').addEventListener('click', function(){
  state.m1 = DEFAULT.m1; state.m2 = DEFAULT.m2;
  state.k1 = DEFAULT.k1; state.k2 = DEFAULT.k2;
  setUI();
  draw();
});

setUI();
draw();
})();
</script>
</body>
</html>
