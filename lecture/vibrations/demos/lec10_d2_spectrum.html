<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L10-D2 · 파형 ↔ 스펙트럼</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 10강</p>
  <h1>파형 ↔ 스펙트럼</h1>
  <p class="lede">시간파형의 리듬이 막대 스펙트럼의 n번 항입니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">부분합 항 수 N <span class="big-val" id="Nv">7</span></p>
        <input type="range" id="N" min="1" max="40" step="1" value="7">
      </div>
      <div>
        <p class="ctrl-title">강조 고조파 n <span class="big-val" id="nselv">1</span></p>
        <input type="range" id="nsel" min="1" max="40" step="1" value="1">
      </div>
      <div>
        <p class="ctrl-title">파형</p>
        <div class="btn-row" style="margin:0">
          <button class="btn btn-acc" id="wSquare">사각파</button>
          <button class="btn" id="wSaw">톱니파</button>
        </div>
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="420"></canvas>
    <div class="legend">
      <span><i style="background:var(--low)"></i>목표 파형 F(t)</span>
      <span><i style="background:var(--accent)"></i>N차 부분합</span>
      <span><i style="background:var(--high)"></i>선택 고조파 n</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 10강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var st = { wave:'square', A:1.0, Tk:2, T:2*Math.PI, N:7, nsel:1, msel:2, ortho:false, running:true, t:0 };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','float','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
var MONO = 'Consolas, ui-monospace, monospace';

var SUBD = '₀₁₂₃₄₅₆₇₈₉';
function sub(n){
  return String(n).split('').map(function(d){ return SUBD.charAt(+d); }).join('');
}

function b_n(wave, n){
  if (wave === 'square') return (n % 2 === 1) ? 4 / (n * Math.PI) : 0;
  return -1 / (Math.PI * n);
}
function a0_half(wave){ return (wave === 'square') ? 0 : 0.5; }
function partialSum(wave, A, T, N, t){
  var w = 2 * Math.PI / T, s = a0_half(wave);
  for (var n = 1; n <= N; n++) s += b_n(wave, n) * Math.sin(n * w * t);
  return A * s;
}
function target(wave, A, T, t){
  var w = 2 * Math.PI / T;
  var ph = ((t * w) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
  if (wave === 'square') return A * (ph < Math.PI ? 1 : -1);
  return A * (ph / (2 * Math.PI));
}

var NMAX = 40;
var TL = 64, TT = 48;
var tvR = Math.round(W * 0.47);
var spL = tvR + 56;
var spR = W - 28;
function BOT(){ return H - 48; }
function barGeom(){ return { gw:(spR - spL) / NMAX, x0:spL }; }

var hoverN = 0;
function nAtX(px, py){
  if (py < TT || py > BOT()) return 0;
  var g = barGeom();
  var idx = Math.floor((px - g.x0) / g.gw);
  if (idx < 0 || idx >= NMAX) return 0;
  return idx + 1;
}
function evPt(e){
  var r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left) * (W / r.width), y:(e.clientY - r.top) * (H / r.height) };
}
cv.addEventListener('mousemove', function(e){ var p = evPt(e); hoverN = nAtX(p.x, p.y); });
cv.addEventListener('mouseleave', function(){ hoverN = 0; });
cv.addEventListener('click', function(e){
  var p = evPt(e), n = nAtX(p.x, p.y);
  if (n >= 1){ st.nsel = n; syncSpans(); draw(); }
});

function drawTimeDomain(){
  var bot = BOT(), midY = (TT + bot) / 2, h = bot - TT;
  var vmax = st.A * 1.35;
  var yOf = function(v){ return midY - (v / vmax) * (h / 2); };
  var tSpan = st.T * 2;
  var xOf = function(tt){ return TL + (tt / tSpan) * (tvR - TL); };

  ctx.fillStyle = PAL.surface2; ctx.fillRect(TL, TT, tvR - TL, h);
  ctx.strokeStyle = PAL.border; ctx.lineWidth = 1; ctx.strokeRect(TL, TT, tvR - TL, h);

  ctx.strokeStyle = PAL.border2; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(TL, midY); ctx.lineTo(tvR, midY); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = PAL.grid; ctx.setLineDash([3, 4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(xOf(st.T), TT); ctx.lineTo(xOf(st.T), bot); ctx.stroke(); ctx.setLineDash([]);

  var steps = 700, i, tt, v, X, Y;

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.8; ctx.beginPath();
  for (i = 0; i <= steps; i++){
    tt = tSpan * i / steps; v = partialSum(st.wave, st.A, st.T, st.N, tt);
    X = xOf(tt); Y = yOf(v);
    if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
  }
  ctx.stroke();

  ctx.strokeStyle = PAL.low; ctx.lineWidth = 2.4; ctx.setLineDash([8, 5]); ctx.beginPath();
  for (i = 0; i <= steps; i++){
    tt = tSpan * i / steps; v = target(st.wave, st.A, st.T, tt);
    X = xOf(tt); Y = yOf(v);
    if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
  }
  ctx.stroke(); ctx.setLineDash([]);

  var w = 2 * Math.PI / st.T, bn = b_n(st.wave, st.nsel);
  ctx.strokeStyle = PAL.high; ctx.lineWidth = 2; ctx.beginPath();
  for (i = 0; i <= steps; i++){
    tt = tSpan * i / steps; v = st.A * bn * Math.sin(st.nsel * w * tt);
    X = xOf(tt); Y = yOf(v);
    if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
  }
  ctx.stroke();

  var tc = (st.t % tSpan + tSpan) % tSpan, cx = xOf(tc);
  ctx.strokeStyle = PAL.faint; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, TT); ctx.lineTo(cx, bot); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = PAL.accent;
  ctx.beginPath(); ctx.arc(cx, yOf(partialSum(st.wave, st.A, st.T, st.N, tc)), 5, 0, 2 * Math.PI); ctx.fill();

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('시간영역 F(t) — N=' + st.N, TL, TT - 14);
  ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('T = 2π', xOf(st.T), bot + 18);
  ctx.textAlign = 'right';
  ctx.fillText('2T', tvR, bot + 18);
}

function drawSpectrum(){
  var bot = BOT(), h = bot - TT, base = bot, g = barGeom();
  var bmax = st.A * (st.wave === 'square' ? 4 / Math.PI : 1 / Math.PI);
  var yOf = function(v){ return base - (v / (bmax * 1.24)) * h; };

  ctx.fillStyle = PAL.surface2; ctx.fillRect(spL, TT, spR - spL, h);
  ctx.strokeStyle = PAL.border; ctx.lineWidth = 1; ctx.strokeRect(spL, TT, spR - spL, h);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(spL, TT); ctx.lineTo(spL, base); ctx.lineTo(spR, base); ctx.stroke();

  var b1 = Math.abs(st.A * b_n(st.wave, 1));
  ctx.strokeStyle = PAL.grid; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(spL, yOf(b1)); ctx.lineTo(spR, yOf(b1)); ctx.stroke(); ctx.setLineDash([]);

  var n, bn, bx, bw, barH, col, alpha;
  for (n = 1; n <= NMAX; n++){
    bn = Math.abs(st.A * b_n(st.wave, n));
    bx = g.x0 + (n - 1) * g.gw + g.gw * 0.18;
    bw = g.gw * 0.64;
    if (bn > 0){
      barH = base - yOf(bn);
      col = PAL.accent; alpha = 1;
      if (n === st.nsel) col = PAL.high;
      else if (n === hoverN) col = PAL.float;
      else if (n > st.N) alpha = 0.34;
      ctx.globalAlpha = alpha; ctx.fillStyle = col;
      ctx.fillRect(bx, base - barH, bw, barH);
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = PAL.border2;
      ctx.fillRect(bx, base - 2, bw, 2);
    }
  }

  if (st.N < NMAX){
    var xN = g.x0 + st.N * g.gw;
    ctx.strokeStyle = PAL.muted; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(xN, TT + 4); ctx.lineTo(xN, base); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = PAL.muted; ctx.font = 'bold 12.5px ' + FONT;
    if (xN < spR - 70){ ctx.textAlign = 'left';  ctx.fillText('N = ' + st.N, xN + 6, TT + 20); }
    else              { ctx.textAlign = 'right'; ctx.fillText('N = ' + st.N, xN - 6, TT + 20); }
  }

  ctx.font = '12.5px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = PAL.faint;
  [1, 5, 10, 20, 30, 40].forEach(function(k){
    ctx.fillText(k, g.x0 + (k - 0.5) * g.gw, base + 19);
  });

  var cxs = g.x0 + (st.nsel - 0.5) * g.gw;
  var bsel = Math.abs(st.A * b_n(st.wave, st.nsel));
  ctx.fillStyle = PAL.high; ctx.font = 'bold 13px ' + MONO; ctx.textAlign = 'center';
  ctx.fillText('|b' + sub(st.nsel) + '| = ' + bsel.toFixed(3),
               Math.min(Math.max(cxs, spL + 50), spR - 50), TT + 18);

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('계수 스펙트럼 |bₙ|', spL, TT - 14);
  ctx.fillStyle = PAL.muted; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('n →', spR, base + 34);
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  drawTimeDomain();
  drawSpectrum();
}

function syncSpans(){
  $('Nv').textContent = String(st.N);
  $('nselv').textContent = String(st.nsel);
  $('N').value = st.N; $('nsel').value = st.nsel;
  $('wSquare').classList.toggle('btn-acc', st.wave === 'square');
  $('wSaw').classList.toggle('btn-acc', st.wave === 'saw');
}
function selectWave(w){ st.wave = w; syncSpans(); draw(); }
$('wSquare').addEventListener('click', function(){ selectWave('square'); });
$('wSaw').addEventListener('click', function(){ selectWave('saw'); });
$('N').addEventListener('input', function(){
  st.N = Math.round(parseFloat(this.value)); syncSpans(); draw();
});
$('nsel').addEventListener('input', function(){
  st.nsel = Math.round(parseFloat(this.value)); syncSpans(); draw();
});
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.wave = 'square'; st.A = 1.0; st.Tk = 2; st.T = 2 * Math.PI;
  st.N = 7; st.nsel = 1; st.t = 0; st.running = true;
  hoverN = 0;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running) st.t += dt * st.T * 0.4;
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
