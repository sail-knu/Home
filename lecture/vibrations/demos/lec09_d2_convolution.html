<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L9-D2 · 컨벌루션 적분</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 9강</p>
  <h1>컨벌루션 적분</h1>
  <p class="lede">x(t)는 F(τ)·h(t−τ)의 면적입니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">현재 시각 t <span class="big-val" id="tv">1.60</span> s</p>
        <input type="range" id="t" min="0" max="10" step="0.02" value="1.6">
      </div>
      <div>
        <p class="ctrl-title">감쇠비 ζ <span class="big-val" id="zv">0.10</span></p>
        <input type="range" id="z" min="0" max="0.98" step="0.01" value="0.1">
      </div>
      <div>
        <p class="ctrl-title">고유진동수 ωₙ <span class="big-val" id="wv">6.0</span> rad/s</p>
        <input type="range" id="w" min="2" max="12" step="0.1" value="6">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="540"></canvas>
    <div class="legend">
      <span><i style="background:var(--low)"></i>입력 F(τ)</span>
      <span><i style="background:var(--high)"></i>뒤집힌 h(t−τ)</span>
      <span><i style="background:var(--float)"></i>곱 F(τ)·h(t−τ)</span>
      <span><i style="background:var(--accent)"></i>응답 x(t) = 곱의 면적</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 9강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','float','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
var MONO = 'Consolas, ui-monospace, monospace';

/* ---- 물리 파라미터 (m = 1 kg, 사각펄스 고정) ---- */
var M = 1.0;
var st = { wn:6.0, zeta:0.10, t:1.6, fType:'rect', running:true, barsOn:false, N:16 };
var TMAX = 10;
var GRID = 900;

function omegaD(){
  var z = Math.min(st.zeta, 1 - 1e-6);
  return st.wn * Math.sqrt(Math.max(1e-9, 1 - z * z));
}
function hFun(s){
  if (s < 0) return 0;
  var z = Math.min(st.zeta, 1 - 1e-6);
  var wd = omegaD();
  return (1 / (M * wd)) * Math.exp(-z * st.wn * s) * Math.sin(wd * s);
}
function fFun(tau){
  var t = tau;
  switch (st.fType){
    case 'rect':   return (t >= 0.5 && t <= 3.0) ? 1.0 : 0.0;
    case 'tri':
      if (t < 0.5 || t > 3.5) return 0;
      return t <= 2.0 ? (t - 0.5) / 1.5 : (3.5 - t) / 1.5;
    case 'trap':
      if (t < 0.5 || t > 4.0) return 0;
      if (t < 1.3) return (t - 0.5) / 0.8;
      if (t <= 3.2) return 1.0;
      return (4.0 - t) / 0.8;
    case 'hsin':
      if (t < 0.5 || t > 3.5) return 0;
      return Math.sin(Math.PI * (t - 0.5) / 3.0);
  }
  return 0;
}

function convTrue(t){
  if (t <= 0) return 0;
  var n = GRID, dtau = t / n, sum = 0;
  for (var i = 0; i <= n; i++){
    var tau = i * dtau;
    var val = fFun(tau) * hFun(t - tau);
    sum += (i === 0 || i === n) ? 0.5 * val : val;
  }
  return sum * dtau;
}

var NX = 260;
var traj = { key:'', xs:[], xmax:1e-6 };
function trajectory(){
  var key = st.fType + '|' + st.zeta + '|' + st.wn;
  if (traj.key !== key){
    var xs = [], xmax = 1e-6;
    for (var i = 0; i <= NX; i++){
      var tt = i / NX * TMAX, xv = convTrue(tt);
      xs.push({ tt:tt, xv:xv });
      if (Math.abs(xv) > xmax) xmax = Math.abs(xv);
    }
    traj = { key:key, xs:xs, xmax:xmax };
  }
  return traj;
}

var PL = 68, PR = W - 20;
var p1 = { top:34,  bot:172 };
var p2 = { top:212, bot:350 };
var p3 = { top:388, bot:506 };
function tauX(tau){ return PL + (tau / TMAX) * (PR - PL); }

function drawAxis(p, ylabel){
  var yc = (p.top + p.bot) / 2;
  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(10, p.top - 25, (PR + 10) - 10, (p.bot - p.top) + 33);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(PL, p.top); ctx.lineTo(PL, p.bot); ctx.stroke();
  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PL, yc); ctx.lineTo(PR, yc); ctx.stroke();
  ctx.fillStyle = PAL.muted; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText(ylabel, 14, yc + 4);
  return yc;
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  var t = st.t, tX = tauX(t);
  var tj = trajectory();

  var hMax = 1 / (M * omegaD());
  var fScale = 46;
  var hScale = 40 / Math.max(hMax, 1e-6);

  var yc1 = drawAxis(p1, 'F, h');
  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('① F(τ) 와 뒤집혀 미끄러지는 h(t−τ)', PL + 2, p1.top - 8);
  ctx.fillStyle = PAL.faint; ctx.font = '12px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('사각펄스 0.5–3.0 s,  m = 1 kg', PR, p1.top - 8);
  ctx.textAlign = 'left';

  ctx.strokeStyle = PAL.low; ctx.lineWidth = 2.4; ctx.beginPath();
  for (var px = PL; px <= PR; px++){
    var tau = (px - PL) / (PR - PL) * TMAX;
    var y = yc1 - fFun(tau) * fScale;
    if (px === PL) ctx.moveTo(px, y); else ctx.lineTo(px, y);
  }
  ctx.stroke();

  ctx.strokeStyle = PAL.high; ctx.lineWidth = 2.2; ctx.beginPath();
  var started = false;
  for (var px2 = PL; px2 <= tX; px2++){
    var tau2 = (px2 - PL) / (PR - PL) * TMAX;
    var y2 = yc1 - hFun(t - tau2) * hScale;
    if (!started){ ctx.moveTo(px2, y2); started = true; } else ctx.lineTo(px2, y2);
  }
  ctx.stroke();

  var yc2 = drawAxis(p2, 'F·h');
  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('② 곱 F(τ)·h(t−τ) — 음영 면적이 곧 지금의 x(t)', PL + 2, p2.top - 8);

  var prodScale = 46 / Math.max(1e-6, hMax);
  var pts = [];
  for (var px3 = PL; px3 <= tX; px3 += 1){
    var tau3 = (px3 - PL) / (PR - PL) * TMAX;
    pts.push({ px:px3, val:fFun(tau3) * hFun(t - tau3) });
  }
  if (pts.length > 1){
    ctx.beginPath();
    ctx.moveTo(pts[0].px, yc2);
    pts.forEach(function(p){ ctx.lineTo(p.px, yc2 - p.val * prodScale); });
    ctx.lineTo(pts[pts.length - 1].px, yc2);
    ctx.closePath();
    ctx.globalAlpha = 0.26; ctx.fillStyle = PAL.accent; ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = PAL.float; ctx.lineWidth = 2.2; ctx.beginPath();
    pts.forEach(function(p, i){
      var y = yc2 - p.val * prodScale;
      if (i) ctx.lineTo(p.px, y); else ctx.moveTo(p.px, y);
    });
    ctx.stroke();
  }

  var yc3 = drawAxis(p3, 'x(t)');
  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('③ 응답 x(t) = ∫₀ᵗ F(τ)·h(t−τ) dτ', PL + 2, p3.top - 8);

  var xs = tj.xs, xScale = 58 / tj.xmax;

  ctx.save();
  ctx.beginPath(); ctx.rect(PL - 2, p3.top, (PR - PL) + 6, p3.bot - p3.top); ctx.clip();

  ctx.globalAlpha = 0.32;
  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 1.6; ctx.beginPath();
  xs.forEach(function(p, i){
    var X = tauX(p.tt), Y = yc3 - p.xv * xScale;
    if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
  });
  ctx.stroke(); ctx.globalAlpha = 1;

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.8; ctx.beginPath();
  started = false;
  xs.forEach(function(p){
    if (p.tt > t + 1e-9) return;
    var X = tauX(p.tt), Y = yc3 - p.xv * xScale;
    if (!started){ ctx.moveTo(X, Y); started = true; } else ctx.lineTo(X, Y);
  });
  var xNow = convTrue(t);
  ctx.lineTo(tX, yc3 - xNow * xScale); ctx.stroke();

  ctx.fillStyle = PAL.accent;
  ctx.beginPath(); ctx.arc(tX, yc3 - xNow * xScale, 4.8, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.strokeStyle = PAL.text; ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]);
  ctx.globalAlpha = 0.55;
  ctx.beginPath();
  [p1, p2, p3].forEach(function(p){ ctx.moveTo(tX, p.top); ctx.lineTo(tX, p.bot); });
  ctx.stroke();
  ctx.globalAlpha = 1; ctx.setLineDash([]);
  ctx.fillStyle = PAL.text; ctx.font = 'bold 13px ' + FONT;
  if (tX > PR - 110){ ctx.textAlign = 'right'; ctx.fillText('τ = t = ' + t.toFixed(2) + ' s', tX - 6, p1.top + 13); }
  else { ctx.textAlign = 'left'; ctx.fillText('τ = t = ' + t.toFixed(2) + ' s', tX + 6, p1.top + 13); }

  ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'center';
  for (var s = 0; s <= TMAX; s += 2) ctx.fillText(s + ' s', tauX(s), p3.bot + 18);

  ctx.textAlign = 'right'; ctx.font = 'bold 15px ' + MONO;
  ctx.fillStyle = PAL.accent;
  ctx.fillText('x(t) = ' + xNow.toFixed(4) + '    ω_d = ' + omegaD().toFixed(2), PR, p3.top + 16);
  ctx.textAlign = 'left';
}

function syncSpans(){
  $('tv').textContent = st.t.toFixed(2);
  $('zv').textContent = st.zeta.toFixed(2);
  $('wv').textContent = st.wn.toFixed(1);
  $('t').value = st.t; $('z').value = st.zeta; $('w').value = st.wn;
}
function setPlay(on){
  st.running = on;
  $('play').textContent = on ? '⏸ 일시정지' : '▶ 재생';
  $('play').classList.toggle('btn-acc', on);
}

$('t').addEventListener('input', function(){
  st.t = parseFloat(this.value); $('tv').textContent = st.t.toFixed(2);
  setPlay(false); draw();
});
$('z').addEventListener('input', function(){
  st.zeta = parseFloat(this.value); $('zv').textContent = st.zeta.toFixed(2); draw();
});
$('w').addEventListener('input', function(){
  st.wn = parseFloat(this.value); $('wv').textContent = st.wn.toFixed(1); draw();
});
$('play').addEventListener('click', function(){ setPlay(!st.running); });
$('reset').addEventListener('click', function(){
  st.fType = 'rect'; st.zeta = 0.10; st.wn = 6.0; st.t = 1.6; st.N = 16; st.barsOn = false;
  setPlay(true); syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running){
    st.t += dt * 0.9;
    if (st.t > TMAX) st.t = 0;
    $('t').value = st.t.toFixed(2);
    $('tv').textContent = st.t.toFixed(2);
  }
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
