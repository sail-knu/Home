<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L11-D1 · s-평면 극점 ↔ 시간응답</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 11강</p>
  <h1>s-평면 극점 ↔ 시간응답</h1>
  <p class="lede">σ=−ζωₙ은 감쇠 빠르기, ωd는 출렁이는 리듬입니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">감쇠비 ζ <span class="big-val" id="zv">0.20</span></p>
        <input type="range" id="z" min="-0.15" max="1.20" step="0.001" value="0.20">
      </div>
      <div>
        <p class="ctrl-title">고유진동수 ωₙ <span class="big-val" id="wnv">6.00</span> rad/s</p>
        <input type="range" id="wn" min="1" max="12" step="0.01" value="6">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="500" style="touch-action:none"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>극점 s = −ζωₙ ± jωd</span>
      <span><i style="background:var(--low)"></i>임펄스 응답 h(t)</span>
      <span><i style="background:var(--float)"></i>포락선 ±(1/ωd)e<sup>σt</sup></span>
      <span><i style="background:var(--bad)"></i>발산 (우반면 σ&gt;0)</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 11강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var EPS = 1e-6;
var st = { zeta: 0.20, wn: 6.0, t: 0, running: true };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','float','ok','bad','grid','plot-bg'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
var MONO = 'Consolas, ui-monospace, monospace';

var planeL = 46, planeR = 432, planeT = 46, planeB = 478;
var SCALE  = 19;
var ox = planeR - 4 * SCALE, oy = (planeT + planeB) / 2;
function reToX(re){ return ox + re * SCALE; }
function imToY(im){ return oy - im * SCALE; }
function xToRe(x){ return (x - ox) / SCALE; }
function yToIm(y){ return (oy - y) / SCALE; }

var respL = 470, respR = 884, respT = 46, respB = 478;
var cxA = respL + 34, midY = (respT + respB) / 2;
var plotW = respR - cxA - 10, plotH = (respB - respT) / 2 - 26;

function derived(){
  var wn = st.wn, zeta = st.zeta;
  var disc = 1 - zeta * zeta;
  var wd = wn * Math.sqrt(Math.max(0, disc));
  var sigma = -zeta * wn;
  return { wn:wn, zeta:zeta, wd:wd, sigma:sigma, disc:disc };
}
function impulse(t){
  var d = derived(), az = Math.abs(d.zeta);
  if (az < 1 - EPS){
    var wdd = Math.max(d.wd, EPS);
    return Math.exp(d.sigma * t) * Math.sin(wdd * t) / wdd;
  } else if (az <= 1 + EPS){
    return t * Math.exp(d.sigma * t);
  }
  var beta = Math.max(d.wn * Math.sqrt(d.zeta * d.zeta - 1), EPS);
  return Math.exp(d.sigma * t) * Math.sinh(beta * t) / beta;
}

function fx(v, n){ var s = v.toFixed(n); return s.charAt(0) === '-' ? '−' + s.slice(1) : s; }
function panelFrame(l, t, r, b){
  ctx.strokeStyle = PAL.border; ctx.lineWidth = 1;
  ctx.strokeRect(l + 0.5, t + 0.5, r - l - 1, b - t - 1);
}
function labelChip(txt, x, y, align, col, font){
  ctx.font = font || ('bold 12.5px ' + FONT);
  var w = ctx.measureText(txt).width;
  var lx = (align === 'right') ? x - w : (align === 'center') ? x - w / 2 : x;
  ctx.fillStyle = PAL['plot-bg'];
  ctx.fillRect(lx - 4, y - 13, w + 8, 18);
  ctx.fillStyle = col; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(txt, lx, y);
}
function hidden(x, y, poles, rx, ry){
  for (var i = 0; i < poles.length; i++){
    if (Math.abs(poles[i][0] - x) < rx && Math.abs(poles[i][1] - y) < ry) return true;
  }
  return false;
}
function xMark(px, py, col, ring){
  ctx.save();
  ctx.beginPath(); ctx.rect(planeL + 1, planeT + 1, planeR - planeL - 2, planeB - planeT - 2); ctx.clip();
  ctx.strokeStyle = col; ctx.lineWidth = 3.2;
  var s = 9;
  ctx.beginPath();
  ctx.moveTo(px - s, py - s); ctx.lineTo(px + s, py + s);
  ctx.moveTo(px + s, py - s); ctx.lineTo(px - s, py + s);
  ctx.stroke();
  if (ring){
    ctx.strokeStyle = col; ctx.globalAlpha = 0.45; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(px, py, 15, 0, 2 * Math.PI); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawPlane(){
  var d = derived(), az = Math.abs(d.zeta);
  var rootP = Math.sqrt(Math.max(0, d.zeta * d.zeta - 1));
  var poles = (az < 1 - EPS)
    ? [[reToX(d.sigma), imToY(d.wd)], [reToX(d.sigma), imToY(-d.wd)]]
    : [[reToX(d.wn * (-d.zeta + rootP)), oy], [reToX(d.wn * (-d.zeta - rootP)), oy]];

  ctx.globalAlpha = 0.12; ctx.fillStyle = PAL.bad;
  ctx.fillRect(ox, planeT, planeR - ox, planeB - planeT);
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.beginPath(); ctx.rect(planeL, planeT, planeR - planeL, planeB - planeT); ctx.clip();
  ctx.strokeStyle = PAL.accent; ctx.globalAlpha = 0.28; ctx.lineWidth = 1;
  for (var r = 2; r <= 14; r += 2){
    ctx.beginPath(); ctx.arc(ox, oy, r * SCALE, 0, 2 * Math.PI); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1; ctx.font = '12px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var imLab = (oy - (planeT + 22)) / SCALE;
  for (var zt = 0.2; zt <= 0.8001; zt += 0.2){
    var th = Math.acos(zt), R = 17;
    var re = -R * zt, im = R * Math.sin(th);
    ctx.strokeStyle = PAL.low; ctx.globalAlpha = 0.32;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(reToX(re), imToY(im)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(reToX(re), imToY(-im)); ctx.stroke();
    ctx.globalAlpha = 0.9; ctx.fillStyle = PAL.low;
    ctx.fillText('ζ=' + zt.toFixed(1), reToX(-imLab * zt / Math.sin(th)), planeT + 22);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(planeL, oy); ctx.lineTo(planeR, oy); ctx.stroke();
  ctx.strokeStyle = PAL.bad; ctx.setLineDash([6, 4]); ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(ox, planeT + 2); ctx.lineTo(ox, planeB - 2); ctx.stroke();
  ctx.setLineDash([]);

  ctx.font = '12.5px ' + FONT; ctx.fillStyle = PAL.muted;
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText('Re(s) = σ →', planeR - 8, oy - 14);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('Im(s) = jω', ox + 9, planeT + 7);
  ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 12.5px ' + FONT;
  ctx.fillStyle = PAL.ok;  ctx.textAlign = 'right'; ctx.fillText('안정 σ<0', ox - 8, planeB - 12);
  ctx.fillStyle = PAL.bad; ctx.textAlign = 'left';  ctx.fillText('불안정', ox + 8, planeB - 12);

  ctx.font = '12px ' + FONT; ctx.fillStyle = PAL.faint;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  [-15, -12, -9, -6, -3, 3].forEach(function(re){
    if (hidden(reToX(re), oy + 13, poles, 26, 24)) return;
    ctx.fillText(fx(re, 0), reToX(re), oy + 6);
  });
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  [-8, -4, 4, 8].forEach(function(im){
    if (hidden(ox + 18, imToY(im), poles, 30, 15)) return;
    ctx.fillText((im > 0 ? '+' : '−') + Math.abs(im) + 'j', ox + 7, imToY(im));
  });
  ctx.textBaseline = 'alphabetic';

  if (az < 1 - EPS){
    var px = reToX(d.sigma), py = imToY(d.wd), pyc = imToY(-d.wd);
    var rhp = d.sigma > EPS, col = rhp ? PAL.bad : PAL.accent;
    ctx.strokeStyle = PAL.accent; ctx.globalAlpha = 0.75; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(px, py); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = PAL.muted; ctx.globalAlpha = 0.7;
    ctx.setLineDash([3, 3]); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(px, oy); ctx.lineTo(px, py); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox, py); ctx.lineTo(px, py); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    if (Math.abs(d.sigma) > 0.25){
      labelChip('σ = ' + fx(d.sigma, 2), px - 8, (oy + py) / 2 + 4, 'right', PAL.high);
    }
    ctx.font = 'bold 12.5px ' + FONT;
    var lab = 'ωd = ' + d.wd.toFixed(2);
    labelChip(lab, Math.min(px + 4, ox - 10 - ctx.measureText(lab).width),
              Math.max(py - 20, planeT + 46), 'left', PAL.low);
    labelChip('ωₙ = ' + d.wn.toFixed(2),
              ox + 0.52 * (px - ox) + 9, oy + 0.52 * (py - oy) + 18, 'left', PAL.accent);
    xMark(px, py, col, true);
    xMark(px, pyc, col, false);
  } else {
    var root = Math.sqrt(Math.max(0, d.zeta * d.zeta - 1));
    var s1 = d.wn * (-d.zeta + root), s2 = d.wn * (-d.zeta - root);
    var c1 = s1 > EPS ? PAL.bad : PAL.accent;
    var x1 = reToX(s1);
    xMark(x1, oy, c1, true);
    labelChip('s₁ = ' + fx(s1, 2), x1, oy - 22, 'center', c1);
    if (root > 1e-4){
      var x2 = reToX(s2);
      if (x2 >= planeL + 12){
        xMark(x2, oy, PAL.accent, false);
        labelChip('s₂ = ' + fx(s2, 2), x2, oy + 36, 'center', PAL.accent);
      } else {
        ctx.fillStyle = PAL.accent;
        ctx.beginPath();
        ctx.moveTo(planeL + 4, oy); ctx.lineTo(planeL + 18, oy - 8); ctx.lineTo(planeL + 18, oy + 8);
        ctx.closePath(); ctx.fill();
        labelChip('s₂ = ' + fx(s2, 2), planeL + 22, oy + 26, 'left', PAL.accent);
      }
    } else {
      labelChip('중근 (ζ=1)', x1, oy + 36, 'center', PAL.float);
    }
  }
  panelFrame(planeL, planeT, planeR, planeB);
}

function drawResponse(){
  var d = derived(), az = Math.abs(d.zeta);
  var rhp = d.sigma > EPS;

  if (rhp){
    ctx.globalAlpha = 0.10; ctx.fillStyle = PAL.bad;
    ctx.fillRect(respL, respT, respR - respL, respB - respT);
    ctx.globalAlpha = 1;
  }

  var Tmax = Math.max(6, 24 / Math.max(d.wn, 0.5));
  var NS = 400, vals = new Float64Array(NS + 1), peak = 1e-9, i, t, v;
  for (i = 0; i <= NS; i++){
    t = Tmax * i / NS; v = impulse(t); vals[i] = v;
    if (isFinite(v)) peak = Math.max(peak, Math.abs(v));
  }
  var yscale = plotH * 0.92 / peak;
  var tToX = function(tt){ return cxA + tt / Tmax * plotW; };
  var vToY = function(vv){ return midY - vv * yscale; };

  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  ctx.font = '12px ' + FONT; ctx.fillStyle = PAL.faint; ctx.textAlign = 'center';
  [0.5, 1].forEach(function(f){
    var gx = tToX(Tmax * f);
    ctx.beginPath(); ctx.moveTo(gx, respT + 8); ctx.lineTo(gx, respB - 24); ctx.stroke();
    ctx.fillText((Tmax * f).toFixed(1) + ' s', gx, respB - 8);
  });
  ctx.setLineDash([]);

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(cxA, respT + 8); ctx.lineTo(cxA, respB - 22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cxA, midY); ctx.lineTo(respR - 8, midY); ctx.stroke();
  ctx.font = '12.5px ' + FONT; ctx.fillStyle = PAL.muted;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('시간 t [s] →', cxA + 6, respB - 8);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillStyle = PAL.faint; ctx.fillText('0', cxA - 6, midY);
  ctx.textBaseline = 'alphabetic';

  ctx.save();
  ctx.beginPath();
  ctx.rect(respL + 1, respT + 1, respR - respL - 2, respB - respT - 2);
  ctx.clip();

  if (az < 1 - EPS){
    var envAmp = 1 / Math.max(d.wd, EPS);
    ctx.strokeStyle = PAL.float; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.4;
    [1, -1].forEach(function(sg){
      ctx.beginPath();
      for (var k = 0; k <= NS; k++){
        var tt = Tmax * k / NS, e = sg * envAmp * Math.exp(d.sigma * tt);
        var X = tToX(tt), Y = vToY(e);
        if (k) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
      }
      ctx.stroke();
    });
    ctx.setLineDash([]);
  }

  ctx.strokeStyle = rhp ? PAL.bad : PAL.low; ctx.lineWidth = 2.6;
  ctx.beginPath();
  for (i = 0; i <= NS; i++){
    var X = tToX(Tmax * i / NS), Y = vToY(vals[i]);
    if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
  }
  ctx.stroke();

  var tm = st.t % Tmax, Xm = tToX(tm), Ym = vToY(impulse(tm));
  ctx.strokeStyle = PAL.text; ctx.globalAlpha = 0.35; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(Xm, midY); ctx.lineTo(Xm, Ym); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = PAL.text;
  ctx.beginPath(); ctx.arc(Xm, Ym, 5, 0, 2 * Math.PI); ctx.fill();
  ctx.restore();

  var f = (az < 1 - EPS) ? 'h(t) = (1/ωd)·e^(σt)·sin(ωd t)'
        : (az <= 1 + EPS) ? 'h(t) = t·e^(σt)'
        : 'h(t) = (1/β)·e^(σt)·sinh(βt)';
  labelChip(f, cxA + 6, respT + 22, 'left', PAL.muted, '12.5px ' + FONT);
  labelChip('σ=' + fx(d.sigma, 2) + '  ωd=' + ((az < 1 - EPS) ? d.wd.toFixed(2) : '0'),
            respR - 10, respT + 22, 'right', PAL.accent, '13px ' + MONO);
  if (rhp){
    labelChip('발산 — 포락선이 커진다', respR - 10, respT + 44, 'right', PAL.bad, 'bold 14px ' + FONT);
  }
  panelFrame(respL, respT, respR, respB);
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillStyle = PAL.text;
  ctx.fillText('s-평면 — 극점 (드래그)', planeL, 34);
  ctx.fillText('임펄스 응답 h(t)', respL, 34);
  drawPlane();
  drawResponse();
}

function syncSliders(){
  $('z').value = st.zeta;   $('wn').value = st.wn;
  $('zv').textContent = st.zeta.toFixed(2);
  $('wnv').textContent = st.wn.toFixed(2);
}
$('z').addEventListener('input', function(){
  st.zeta = parseFloat(this.value); st.t = 0;
  $('zv').textContent = st.zeta.toFixed(2); draw();
});
$('wn').addEventListener('input', function(){
  st.wn = parseFloat(this.value); st.t = 0;
  $('wnv').textContent = st.wn.toFixed(2); draw();
});
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.zeta = 0.20; st.wn = 6.0; st.t = 0; st.running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncSliders(); draw();
});

var dragging = false;
function canvasPos(e){
  var rect = cv.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * cv.width / rect.width,
           y: (e.clientY - rect.top) * cv.height / rect.height };
}
function poleScreen(){
  var d = derived();
  return { x: reToX(d.sigma), y: imToY(d.wd) };
}
function setFromDrag(x, y){
  x = Math.max(planeL, Math.min(planeR, x));
  y = Math.max(planeT, Math.min(planeB, y));
  var re = xToRe(x), im = Math.max(0, yToIm(y));
  var wn = Math.min(12, Math.max(1, Math.sqrt(re * re + im * im)));
  var zeta = Math.max(-0.15, Math.min(1.20, -re / Math.max(wn, 1e-6)));
  st.zeta = zeta; st.wn = wn; st.t = 0;
  syncSliders(); draw();
}
cv.addEventListener('pointerdown', function(e){
  var p = canvasPos(e);
  if (p.x < planeL || p.x > planeR || p.y < planeT || p.y > planeB) return;
  var pole = poleScreen();
  if (Math.hypot(p.x - pole.x, p.y - pole.y) < 40 || p.y < oy){
    dragging = true;
    if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
    setFromDrag(p.x, p.y);
  }
});
cv.addEventListener('pointermove', function(e){ if (dragging){ var p = canvasPos(e); setFromDrag(p.x, p.y); } });
cv.addEventListener('pointerup', function(){ dragging = false; });
cv.addEventListener('pointercancel', function(){ dragging = false; });

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running) st.t += dt;
  draw();
  requestAnimationFrame(loop);
}
syncSliders();
requestAnimationFrame(loop);
})();
</script>
</body>
