<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L12-D3 · 모드 중첩</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
  --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 12강</p>
  <h1>모드 중첩</h1>
  <p class="lede">초기 변위가 각 모드 진폭 A₁, A₂를 정합니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">초기변위 x₁(0) <span class="big-val" id="x10v">1.00</span></p>
        <input type="range" id="x10" min="-2" max="2" step="0.05" value="1">
      </div>
      <div>
        <p class="ctrl-title">초기변위 x₂(0) <span class="big-val" id="x20v">0.00</span></p>
        <input type="range" id="x20" min="-2" max="2" step="0.05" value="0">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="540"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>x₁(t) 실선</span>
      <span><i style="background:var(--high)"></i>x₂(t) 점선</span>
      <span><i style="background:var(--low)"></i>모드1 ω₁=√2</span>
      <span><i style="background:var(--ok)"></i>모드2 ω₂=2</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 12강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var W1 = Math.sqrt(2);
var W2 = 2.0;
var U1_BASE = [1/3, 1];
var U2_BASE = [-1/3, 1];

var state = { x10: 1.0, x20: 0.0, scale: 1, t: 0, running: true };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','ok','float','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function uVecs(){
  var s = state.scale;
  return { u1: [U1_BASE[0]*s, U1_BASE[1]*s], u2: [U2_BASE[0]*s, U2_BASE[1]*s] };
}

function modalAmps(){
  var uv = uVecs(), u1 = uv.u1, u2 = uv.u2;
  var det = u1[0]*u2[1] - u2[0]*u1[1];
  var dsafe = Math.abs(det) < 1e-9 ? (det < 0 ? -1e-9 : 1e-9) : det;
  var A1 = ( u2[1]*state.x10 - u2[0]*state.x20) / dsafe;
  var A2 = (-u1[1]*state.x10 + u1[0]*state.x20) / dsafe;
  return { A1: A1, A2: A2, u1: u1, u2: u2 };
}

function eval_t(t){
  var m = modalAmps();
  var g1 = m.A1 * Math.cos(W1 * t);
  var g2 = m.A2 * Math.cos(W2 * t);
  return {
    m1: [g1*m.u1[0], g1*m.u1[1]],
    m2: [g2*m.u2[0], g2*m.u2[1]],
    tot:[g1*m.u1[0]+g2*m.u2[0], g1*m.u1[1]+g2*m.u2[1]]
  };
}

var padL = 56, padR = 24;
var rowGap = 14, rowTop = 30;
var rowH = (H - rowTop - 2*rowGap - 16) / 3;
var plotW = W - padL - padR;
var T_WIN = 12;

function yScaleFor(maxAmp){
  var m = Math.max(maxAmp, 1e-6);
  return (rowH/2 - 12) / m;
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  var curT = state.t;
  var t0 = curT - T_WIN;
  var am = modalAmps();
  var A1 = am.A1, A2 = am.A2, u1 = am.u1, u2 = am.u2;
  var maxTot = Math.abs(A1)*Math.max(Math.abs(u1[0]),Math.abs(u1[1]))
             + Math.abs(A2)*Math.max(Math.abs(u2[0]),Math.abs(u2[1]));
  var maxM1 = Math.abs(A1)*Math.max(Math.abs(u1[0]),Math.abs(u1[1]));
  var maxM2 = Math.abs(A2)*Math.max(Math.abs(u2[0]),Math.abs(u2[1]));
  var gAmp = Math.max(maxTot, maxM1, maxM2, 1e-6);
  var sc = yScaleFor(gAmp);

  var rows = [
    { idx:0, title:'모드1  x⁽¹⁾(t) = A₁cos(ω₁t)·u₁', color: PAL.low, key:'m1' },
    { idx:1, title:'모드2  x⁽²⁾(t) = A₂cos(ω₂t)·u₂', color: PAL.ok, key:'m2' },
    { idx:2, title:'총합  x(t) = x⁽¹⁾ + x⁽²⁾', color: PAL.text, key:'tot' }
  ];

  var N = 360;
  rows.forEach(function(r){
    var y0 = rowTop + r.idx*(rowH + rowGap) + rowH/2;
    ctx.fillStyle = PAL.surface2;
    ctx.fillRect(padL-4, y0 - rowH/2, plotW+8, rowH);
    ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, y0); ctx.lineTo(padL+plotW, y0); ctx.stroke();
    ctx.fillStyle = r.color; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'left';
    ctx.fillText(r.title, padL, y0 - rowH/2 + 15);

    var tx = function(t){ return padL + (t - t0)/T_WIN * plotW; };
    var dra1 = [], draw2 = [], i, tt, e;
    for (i=0;i<=N;i++){
      tt = t0 + (i/N)*T_WIN;
      if (tt < 0) continue;
      e = eval_t(tt);
      dra1.push([tx(tt), y0 - e[r.key][0]*sc]);
      draw2.push([tx(tt), y0 - e[r.key][1]*sc]);
    }
    ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2; ctx.setLineDash([]);
    ctx.beginPath(); dra1.forEach(function(p,i){ i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }); ctx.stroke();
    ctx.strokeStyle = PAL.high; ctx.lineWidth = 2; ctx.setLineDash([6,4]);
    ctx.beginPath(); draw2.forEach(function(p,i){ i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }); ctx.stroke();
    ctx.setLineDash([]);
    if (curT >= 0){
      e = eval_t(curT);
      ctx.fillStyle = PAL.accent;
      ctx.beginPath(); ctx.arc(padL+plotW, y0 - e[r.key][0]*sc, 3.5, 0, 7); ctx.fill();
      ctx.fillStyle = PAL.high;
      ctx.beginPath(); ctx.arc(padL+plotW, y0 - e[r.key][1]*sc, 3.5, 0, 7); ctx.fill();
    }
    ctx.fillStyle = PAL.faint; ctx.font = '10px ' + FONT; ctx.textAlign = 'right';
    ctx.fillText('mm', padL-8, y0 - rowH/2 + 20);
    ctx.textAlign = 'center';
    ctx.fillText('t →', padL+plotW-14, y0 + rowH/2 - 4);
  });

  ctx.fillStyle = PAL.text; ctx.font = 'bold 14px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('A₁ = ' + A1.toFixed(3) + '    A₂ = ' + A2.toFixed(3), W - 24, 22);
}

function syncSliders(){
  $('x10').value = state.x10;
  $('x20').value = state.x20;
  $('x10v').textContent = state.x10.toFixed(2);
  $('x20v').textContent = state.x20.toFixed(2);
}
$('x10').addEventListener('input', function(){
  state.x10 = parseFloat(this.value);
  $('x10v').textContent = state.x10.toFixed(2);
});
$('x20').addEventListener('input', function(){
  state.x20 = parseFloat(this.value);
  $('x20v').textContent = state.x20.toFixed(2);
});
$('play').addEventListener('click', function(){
  state.running = !state.running;
  this.textContent = state.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', state.running);
});
$('reset').addEventListener('click', function(){
  state.x10 = 1.0; state.x20 = 0.0; state.scale = 1; state.t = 0;
  state.running = true;
  $('play').textContent = '⏸ 일시정지';
  $('play').classList.add('btn-acc');
  syncSliders();
  draw();
});

syncSliders();
var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last)/1000) : 0;
  last = now;
  if (state.running) state.t += dt;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
