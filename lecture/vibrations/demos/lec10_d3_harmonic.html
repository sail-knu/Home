<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L10-D3 · 고조파 공진</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 10강</p>
  <h1>고조파 공진</h1>
  <p class="lede">nωₜ ≈ ωₙ인 홀수 고조파가 출력을 지배합니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">진동수비 r = ωₙ/ωₜ <span class="big-val" id="ratv">3.00</span></p>
        <input type="range" id="rat" min="1" max="9" step="0.01" value="3">
      </div>
      <div>
        <p class="ctrl-title">감쇠비 ζ <span class="big-val" id="zv">0.050</span></p>
        <input type="range" id="z" min="0.01" max="0.5" step="0.005" value="0.05">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="540"></canvas>
    <div class="legend">
      <span><i style="background:var(--low)"></i>입력 사각파 bₙ = 4/(nπ)</span>
      <span><i style="background:var(--float)"></i>FRF |H(ω)|</span>
      <span><i style="background:var(--high)"></i>ωₙ · 공진 고조파 n*</span>
      <span><i style="background:var(--accent)"></i>출력 Xₙ · 정상상태 응답</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 10강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var M = 1, WT = 1;
var WN_PHYS = 10;
var NMAX = 9;
var EPS = 1e-6;
var st = { ratio: 3, zeta: 0.05, t: 0, running: true };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','float','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
var MONO = 'Consolas, ui-monospace, monospace';

function bn(n){ return (n % 2 === 1) ? 4 / (n * Math.PI) : 0; }
function frfMag(w){
  var wn = st.ratio * WT;
  var z = st.zeta;
  var re = wn*wn - w*w;
  var im = 2*z*wn*w;
  var denom = Math.sqrt(re*re + im*im);
  return 1 / Math.max(denom, EPS);
}
function frfPhase(w){
  var wn = st.ratio * WT, z = st.zeta;
  return Math.atan2(2*z*wn*w, wn*wn - w*w);
}
function Xn(n){ return (bn(n) / M) * frfMag(n * WT); }
function resonantOrder(){
  var n = Math.round(st.ratio);
  if (n < 1) n = 1;
  if (n % 2 === 0){
    var lo = n - 1, hi = n + 1;
    n = (Math.abs(st.ratio - lo) <= Math.abs(st.ratio - hi)) ? lo : hi;
  }
  if (n < 1) n = 1;
  return n;
}

var marL = 58, marR = 26;
var plotW = W - marL - marR;
var bandH = 108, gap = 26;
var b1Top = 22,          b1Bot = b1Top + bandH;
var b2Top = b1Bot + gap, b2Bot = b2Top + bandH;
var b3Top = b2Bot + gap, b3Bot = b3Top + bandH;
var tTop  = b3Bot + gap + 4, tBot = H - 12;
var barMax = bandH - 50;
var barW = plotW / NMAX * 0.5;

function xForOrder(n){ return marL + (n - 0.5) / NMAX * plotW; }
function xForFreq(w){  return marL + (w / WT - 0.5) / NMAX * plotW; }

function segText(x, y, segs){
  var cx = x;
  ctx.textAlign = 'left';
  for (var i = 0; i < segs.length; i++){
    ctx.fillStyle = segs[i][1];
    ctx.fillText(segs[i][0], cx, y);
    cx += ctx.measureText(segs[i][0]).width;
  }
}
function bandFrame(top, bot, segs, ylab){
  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(marL, top, plotW, bot - top);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(marL, top); ctx.lineTo(marL, bot); ctx.lineTo(marL + plotW, bot); ctx.stroke();
  ctx.font = 'bold 15px ' + FONT;
  segText(marL + 9, top + 20, segs);
  ctx.fillStyle = PAL.faint; ctx.font = '13px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText(ylab, marL - 7, top + 16);
}
function xAxisLabels(bot){
  ctx.fillStyle = PAL.faint; ctx.font = '13px ' + FONT; ctx.textAlign = 'center';
  for (var n = 1; n <= NMAX; n++) ctx.fillText(n + 'ωₜ', xForOrder(n), bot + 17);
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  var n, x, h, val;
  var nres = resonantOrder();
  var wn = st.ratio * WT;

  bandFrame(b1Top, b1Bot, [
    ['① 입력 스펙트럼 ', PAL.text],
    ['사각파 bₙ = 4/(nπ)', PAL.low]
  ], 'bₙ');
  var inMax = bn(1);
  for (n = 1; n <= NMAX; n++){
    var b = Math.abs(bn(n));
    x = xForOrder(n);
    h = (b / inMax) * barMax;
    if (b > 0){
      ctx.fillStyle = PAL.low;
      ctx.fillRect(x - barW/2, b1Bot - 1 - h, barW, h);
    } else {
      ctx.fillStyle = PAL.border2;
      ctx.fillRect(x - barW/2, b1Bot - 4, barW, 3);
    }
  }
  xAxisLabels(b1Bot);

  bandFrame(b2Top, b2Bot, [
    ['② FRF ', PAL.text],
    ['|H(ω)|', PAL.float],
    ['  · 봉우리 ', PAL.text],
    ['ωₙ', PAL.high]
  ], '|H|');
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = PAL.low;
  for (n = 1; n <= NMAX; n++){
    if (bn(n) === 0) continue;
    x = xForOrder(n);
    h = (Math.abs(bn(n)) / inMax) * barMax;
    ctx.fillRect(x - barW/2, b2Bot - 1 - h, barW, h);
  }
  ctx.globalAlpha = 1;

  var frfPeak = 0, w;
  for (w = 0.5; w <= NMAX + 0.5; w += 0.02) frfPeak = Math.max(frfPeak, frfMag(w * WT));
  frfPeak = Math.max(frfPeak, EPS);
  ctx.strokeStyle = PAL.float; ctx.lineWidth = 2.6; ctx.beginPath();
  var started = false;
  for (w = 0.5; w <= NMAX + 0.5; w += 0.02){
    var X = xForFreq(w * WT);
    var Y = b2Bot - 1 - (frfMag(w * WT) / frfPeak) * barMax;
    if (started) ctx.lineTo(X, Y); else { ctx.moveTo(X, Y); started = true; }
  }
  ctx.stroke();

  var xwn = xForFreq(wn);
  if (xwn >= marL && xwn <= marL + plotW){
    ctx.strokeStyle = PAL.high; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(xwn, b2Top + 48); ctx.lineTo(xwn, b2Bot); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PAL.high; ctx.font = 'bold 13.5px ' + FONT; ctx.textAlign = 'center';
    var lx = Math.min(Math.max(xwn, marL + 58), marL + plotW - 58);
    ctx.fillText('ωₙ = ' + st.ratio.toFixed(2) + 'ωₜ', lx, b2Top + 43);
  }
  xAxisLabels(b2Bot);

  bandFrame(b3Top, b3Bot, [
    ['③ 출력 스펙트럼 ', PAL.text],
    ['Xₙ = (bₙ/m)·|H(nωₜ)|', PAL.accent]
  ], 'Xₙ');
  var outMax = EPS;
  for (n = 1; n <= NMAX; n++) outMax = Math.max(outMax, Xn(n));
  for (n = 1; n <= NMAX; n++){
    x = xForOrder(n);
    val = Xn(n);
    h = (val / outMax) * barMax;
    if (bn(n) === 0){
      ctx.fillStyle = PAL.border2;
      ctx.fillRect(x - barW/2, b3Bot - 4, barW, 3);
      continue;
    }
    var isRes = (n === nres);
    ctx.fillStyle = isRes ? PAL.high : PAL.accent;
    ctx.globalAlpha = isRes ? 1 : 0.55;
    ctx.fillRect(x - barW/2, b3Bot - 1 - h, barW, h);
    ctx.globalAlpha = 1;
    if (isRes){
      ctx.fillStyle = PAL.high; ctx.font = 'bold 13.5px ' + FONT; ctx.textAlign = 'center';
      var lblY = Math.max(b3Top + 42, b3Bot - 8 - h);
      ctx.fillText('n = ' + n, x, lblY);
    }
  }
  xAxisLabels(b3Bot);

  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(marL, tTop, plotW, tBot - tTop);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(marL, tTop); ctx.lineTo(marL, tBot); ctx.lineTo(marL + plotW, tBot); ctx.stroke();
  ctx.font = 'bold 15px ' + FONT;
  segText(marL + 9, tTop + 20, [
    ['④ 시간영역 — ', PAL.text],
    ['입력', PAL.low],
    [' vs ', PAL.text],
    ['정상상태 응답', PAL.accent]
  ]);
  var midY = tTop + 26 + (tBot - tTop - 26) / 2;
  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.moveTo(marL, midY); ctx.lineTo(marL + plotW, midY); ctx.stroke();
  ctx.setLineDash([]);

  var Tspan = 4 * Math.PI / WT;
  var tOff = st.t, N = 460, i;
  var inAmpPx = (tBot - tTop) * 0.26;
  ctx.strokeStyle = PAL.low; ctx.lineWidth = 2; ctx.beginPath();
  for (i = 0; i <= N; i++){
    var tt = tOff + i / N * Tspan, f = 0;
    for (n = 1; n <= NMAX; n += 2) f += bn(n) * Math.sin(n * WT * tt);
    ctx.lineTo(marL + i / N * plotW, midY - Math.max(-1.15, Math.min(1.15, f)) * inAmpPx);
  }
  ctx.stroke();

  var outAmp = EPS, outSamp = [];
  for (i = 0; i <= N; i++){
    var t2 = tOff + i / N * Tspan, y = 0;
    for (n = 1; n <= NMAX; n += 2){
      var wv = n * WT;
      y += Xn(n) * Math.sin(wv * t2 - frfPhase(wv));
    }
    outSamp.push(y);
    outAmp = Math.max(outAmp, Math.abs(y));
  }
  var outAmpPx = (tBot - tTop) * 0.30;
  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.8; ctx.beginPath();
  for (i = 0; i <= N; i++){
    ctx.lineTo(marL + i / N * plotW, midY - (outSamp[i] / outAmp) * outAmpPx);
  }
  ctx.stroke();

  var Xres = Xn(nres), X1 = Xn(1);
  var H0 = 1 / Math.max(wn*wn, EPS);
  var magRes = frfMag(nres * WT) / H0;
  var domRatio = Xres / Math.max(X1, EPS);
  ctx.font = '13px ' + MONO; ctx.textAlign = 'right'; ctx.fillStyle = PAL.muted;
  ctx.fillText('n*=' + nres + '  ωₜ=' + (WN_PHYS / st.ratio).toFixed(2) +
               '  배율 ' + magRes.toFixed(1) + '×  Xₙ*/X₁=' + domRatio.toFixed(1) + '×',
               marL + plotW - 8, tTop + 20);
}

function syncSpans(){
  $('ratv').textContent = st.ratio.toFixed(2);
  $('zv').textContent = st.zeta.toFixed(3);
  $('rat').value = st.ratio;
  $('z').value = st.zeta;
}
$('rat').addEventListener('input', function(){
  st.ratio = parseFloat(this.value); syncSpans(); draw();
});
$('z').addEventListener('input', function(){
  st.zeta = parseFloat(this.value); syncSpans(); draw();
});
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.ratio = 3; st.zeta = 0.05; st.t = 0; st.running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running) st.t += dt * 0.9;
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
draw();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
