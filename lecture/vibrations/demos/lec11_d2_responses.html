<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L11-D2 · 변환표 8번 vs 9번</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 11강</p>
  <h1>변환표 8번 vs 9번</h1>
  <p class="lede">계단응답의 미분을 ωₙ²로 나누면 임펄스응답입니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">감쇠비 ζ <span class="big-val" id="zv">0.707</span></p>
        <input type="range" id="z" min="0" max="0.99" step="0.001" value="0.707">
      </div>
      <div>
        <p class="ctrl-title">고유진동수 ωₙ <span class="big-val" id="wv">1.41</span> rad/s</p>
        <input type="range" id="w" min="0.5" max="4" step="0.01" value="1.41">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="540"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>표 8번 임펄스형 h₀(t)</span>
      <span><i style="background:var(--float)"></i>g′(t)/ωₙ² (항상 겹침)</span>
      <span><i style="background:var(--low)"></i>표 9번 계단형 g(t)</span>
      <span><i style="background:var(--ok)"></i>±2% 정착 밴드 · Ts</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 11강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var st = { z: 0.707, wn: 1.41, t: 0, running: true, showDeriv: true };
var T_SPAN = 12;
var SWEEP  = 6;

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','float','ok','grid','plot-bg'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
var MONO = 'Consolas, ui-monospace, monospace';

function params(){
  var z  = Math.min(0.999999, Math.max(0, st.z));
  var wn = Math.max(1e-6, st.wn);
  var root = Math.sqrt(Math.max(1e-12, 1 - z * z));
  var wd  = wn * root;
  var phi = Math.acos(Math.min(1, Math.max(-1, z)));
  return { z:z, wn:wn, wd:wd, phi:phi, root:root };
}
function impulse(t, p){
  return (1 / p.wd) * Math.exp(-p.z * p.wn * t) * Math.sin(p.wd * t);
}
function step(t, p){
  return 1 - (p.wn / p.wd) * Math.exp(-p.z * p.wn * t) * Math.sin(p.wd * t + p.phi);
}
function stepDeriv(t, p){
  return p.wn * p.wn * impulse(t, p);
}
function impulsePeak(p){
  var tp = Math.atan2(p.wd, p.z * p.wn) / p.wd;
  return impulse(tp, p);
}
function overshoot(p){
  return Math.exp(-p.z * Math.PI / p.root);
}

var padL = 64, padR = 26;
var plotW = W - padL - padR;
var topY0 = 46, topY1 = 254;
var botY0 = 322, botY1 = 508;

function tx(t){ return padL + (t / T_SPAN) * plotW; }

function drawAxes(y0, y1, yMin, yMax, title, fs){
  var yv = function(v){ return y1 - (v - yMin) / (yMax - yMin) * (y1 - y0); };
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.strokeRect(padL, y0, plotW, y1 - y0);
  ctx.font = '12.5px ' + FONT; ctx.textAlign = 'center';
  for (var s = 2; s <= T_SPAN - 2; s += 2){
    var x = tx(s);
    ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
    ctx.fillStyle = PAL.faint;
    ctx.fillText(s.toString(), x, y1 + 18);
  }
  ctx.fillStyle = PAL.muted; ctx.textAlign = 'right';
  ctx.fillText('t [s] →  ' + T_SPAN, padL + plotW, y1 + 18);
  var yz = yv(0);
  ctx.setLineDash([4, 4]); ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, yz); ctx.lineTo(padL + plotW, yz); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('0', padL - 8, yz + 4);
  ctx.textAlign = 'left'; ctx.font = 'bold 16px ' + FONT;
  ctx.fillStyle = PAL.text; ctx.fillText(title, padL, y0 - 13);
  var tw = ctx.measureText(title).width;
  ctx.font = '14px ' + MONO; ctx.fillStyle = PAL.muted;
  ctx.fillText(fs, padL + tw + 20, y0 - 13);
  return yv;
}

function plotCurve(fn, yv, color, lw, p, tEnd){
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  var N = 900, started = false;
  for (var i = 0; i <= N; i++){
    var t = (i / N) * T_SPAN;
    if (t > tEnd) break;
    var v = fn(t, p);
    if (!isFinite(v)) continue;
    var X = tx(t), Y = yv(v);
    if (!started){ ctx.moveTo(X, Y); started = true; } else ctx.lineTo(X, Y);
  }
  ctx.stroke();
}

function labelBox(text, x, y, align, color, font){
  ctx.font = font; ctx.textAlign = 'left';
  var w = ctx.measureText(text).width;
  var x0 = (align === 'right') ? x - w : x;
  ctx.fillStyle = PAL['plot-bg'];
  ctx.fillRect(x0 - 5, y - 12, w + 10, 17);
  ctx.fillStyle = color;
  ctx.fillText(text, x0, y);
}

function draw(){
  var p = params();
  ctx.clearRect(0, 0, W, H);
  var tEnd = st.running ? Math.min(T_SPAN, (st.t / SWEEP) * T_SPAN) : T_SPAN;

  var ipk = Math.max(1e-6, impulsePeak(p));
  var topMax = ipk * 1.25, topMin = -ipk * 1.25;
  var yvTop = drawAxes(topY0, topY1, topMin, topMax,
    '표 8번 · h₀(t)', 'F(s) = 1/(s²+2ζωₙs+ωₙ²)');

  ctx.save();
  ctx.beginPath(); ctx.rect(padL + 1, topY0 + 1, plotW - 2, topY1 - topY0 - 2); ctx.clip();

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.5;
  ctx.setLineDash([5, 5]);
  [1, -1].forEach(function(sg){
    ctx.beginPath();
    for (var i = 0; i <= 240; i++){
      var t = (i / 240) * T_SPAN;
      var e = sg * (1 / p.wd) * Math.exp(-p.z * p.wn * t);
      if (i === 0) ctx.moveTo(tx(t), yvTop(e)); else ctx.lineTo(tx(t), yvTop(e));
    }
    ctx.stroke();
  });
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  plotCurve(function(t, pp){ return stepDeriv(t, pp) / (pp.wn * pp.wn); }, yvTop, PAL.float, 5.5, p, tEnd);
  plotCurve(impulse, yvTop, PAL.accent, 2.6, p, tEnd);
  ctx.restore();

  var os = overshoot(p);
  var botMax = 1 + Math.max(os * 1.15, 0.18) + 0.05, botMin = -0.15;
  var yvBot = drawAxes(botY0, botY1, botMin, botMax,
    '표 9번 · g(t)', 'F(s) = ωₙ²/[s(s²+2ζωₙs+ωₙ²)]');

  ctx.save();
  ctx.beginPath(); ctx.rect(padL + 1, botY0 + 1, plotW - 2, botY1 - botY0 - 2); ctx.clip();

  var yb1 = yvBot(1.02), yb2 = yvBot(0.98);
  ctx.globalAlpha = 0.34; ctx.fillStyle = PAL.ok;
  ctx.fillRect(padL + 1, yb1, plotW - 2, yb2 - yb1);
  ctx.globalAlpha = 0.55; ctx.strokeStyle = PAL.ok; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL + 1, yb1 + .5); ctx.lineTo(padL + plotW - 1, yb1 + .5);
  ctx.moveTo(padL + 1, yb2 - .5); ctx.lineTo(padL + plotW - 1, yb2 - .5); ctx.stroke();
  ctx.globalAlpha = 1;

  var y1v = yvBot(1);
  ctx.setLineDash([6, 5]); ctx.strokeStyle = PAL.low; ctx.lineWidth = 1.3; ctx.globalAlpha = 0.75;
  ctx.beginPath(); ctx.moveTo(padL, y1v); ctx.lineTo(padL + plotW, y1v); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  var Ts = (p.z * p.wn > 1e-6) ? 4 / (p.z * p.wn) : Infinity;
  if (isFinite(Ts) && Ts <= T_SPAN){
    var xts = tx(Ts);
    ctx.strokeStyle = PAL.ok; ctx.lineWidth = 2; ctx.setLineDash([7, 4]);
    ctx.beginPath(); ctx.moveTo(xts, botY0 + 2); ctx.lineTo(xts, botY1 - 2); ctx.stroke();
    ctx.setLineDash([]);
    labelBox('Ts = ' + Ts.toFixed(2) + ' s', Math.min(xts + 9, padL + plotW - 96), botY1 - 11,
      'left', PAL.ok, 'bold 13px ' + FONT);
  } else {
    labelBox('Ts = ' + (isFinite(Ts) ? Ts.toFixed(1) + ' s' : '∞'),
      padL + plotW - 10, botY1 - 11, 'right', PAL.ok, 'bold 13px ' + FONT);
  }

  plotCurve(step, yvBot, PAL.low, 2.6, p, tEnd);

  var tp = Math.PI / p.wd;
  if (tp <= T_SPAN && tp <= tEnd + 1e-9 && os > 0.002){
    var xp = tx(tp), yp = yvBot(1 + os);
    ctx.fillStyle = PAL.low;
    ctx.beginPath(); ctx.arc(xp, yp, 5, 0, Math.PI * 2); ctx.fill();
    var toL = (xp - 105) > padL;
    labelBox('Mp = ' + (os * 100).toFixed(1) + '%', xp + (toL ? -11 : 11),
      Math.max(botY0 + 16, yp - 11), toL ? 'right' : 'left', PAL.low, 'bold 13px ' + FONT);
  }
  ctx.restore();

  ctx.fillStyle = PAL.low; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('1', padL - 8, y1v + 4);

  if (st.running && tEnd < T_SPAN){
    var xc = tx(tEnd);
    ctx.strokeStyle = PAL.faint; ctx.lineWidth = 1; ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.moveTo(xc, topY0); ctx.lineTo(xc, topY1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(xc, botY0); ctx.lineTo(xc, botY1); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = PAL.accent;
    ctx.beginPath(); ctx.arc(xc, yvTop(impulse(tEnd, p)), 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = PAL.low;
    ctx.beginPath(); ctx.arc(xc, yvBot(step(tEnd, p)), 4.5, 0, Math.PI * 2); ctx.fill();
  }

  ctx.font = '13px ' + MONO; ctx.textAlign = 'right'; ctx.fillStyle = PAL.muted;
  ctx.fillText('ωd=' + p.wd.toFixed(2) + '  Mp=' + (os * 100).toFixed(1) + '%  Ts=' +
               (isFinite(Ts) ? Ts.toFixed(2) + ' s' : '∞'), padL + plotW, botY0 - 13);
}

function syncSpans(){
  $('zv').textContent = st.z.toFixed(3);
  $('wv').textContent = st.wn.toFixed(2);
  $('z').value = st.z; $('w').value = st.wn;
}
$('z').addEventListener('input', function(){ st.z  = parseFloat(this.value); syncSpans(); draw(); });
$('w').addEventListener('input', function(){ st.wn = parseFloat(this.value); syncSpans(); draw(); });
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.z = 0.707; st.wn = 1.41; st.t = 0; st.running = true; st.showDeriv = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running){
    st.t += dt;
    if (st.t > SWEEP + 0.6) st.t = 0;
  }
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
