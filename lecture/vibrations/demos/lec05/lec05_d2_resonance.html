<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L5-D2 · 공진 — 발산과 감쇠</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 5강</p>
  <h1>공진 — 발산과 감쇠</h1>
  <p class="lede">ζ=0이면 진폭이 t에 비례해 커지고, 감쇠가 있으면 X로 막힙니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">진동수비 r = ω/ωₙ <span class="big-val" id="rv">1.00</span></p>
        <input type="range" id="r" min="0.30" max="1.70" step="0.01" value="1.00">
      </div>
      <div>
        <p class="ctrl-title">감쇠비 ζ <span class="big-val" id="zv">0.00</span></p>
        <input type="range" id="z" min="0" max="0.70" step="0.01" value="0">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="420"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>응답 x(t)</span>
      <span><i style="background:var(--high)"></i>포락선 (공진·맥놀이)</span>
      <span><i style="background:var(--ok)"></i>정상상태 ±X</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 5강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','float','ok','bad','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
var MONO = 'Consolas, ui-monospace, monospace';

var WN = Math.sqrt(800 / 2);
var T_END = 6;
var N = 1440;
var F0 = 4;
var p = { r: 1.00, z: 0 };
var t = 0, running = true;
var sol = null;
var samples = new Float64Array(N + 1);
var yMax = 1;

function makeSolution(){
  var wn = WN, w = p.r * WN, z = p.z, f0 = F0;
  var dw2 = wn * wn - w * w;
  var den2 = dw2 * dw2 + Math.pow(2 * z * wn * w, 2);
  if ((z < 1e-6 && Math.abs(wn - w) < 1e-6) || den2 < 1e-12){
    var slope = f0 / (2 * wn);
    return {
      type: 'res', X: NaN, th: NaN, wd: wn, w: w, z: z,
      x: function(tt){ return slope * tt * Math.sin(wn * tt); },
      env: function(tt){ return slope * tt; }
    };
  }
  var X = f0 / Math.sqrt(den2);
  var th = Math.atan2(2 * z * wn * w, dw2);
  var wd = wn * Math.sqrt(Math.max(1 - z * z, 1e-12));
  var C = -X * Math.cos(th);
  var D = (z * wn * C - X * w * Math.sin(th)) / wd;
  return {
    type: z < 1e-6 ? 'beat' : 'damped', X: X, th: th, wd: wd, w: w, z: z,
    x: function(tt){
      return Math.exp(-z * wn * tt) * (C * Math.cos(wd * tt) + D * Math.sin(wd * tt))
             + X * Math.cos(w * tt - th);
    },
    env: z < 1e-6
      ? function(tt){ return Math.abs(2 * f0 / dw2 * Math.sin((wn - w) * tt / 2)); }
      : null
  };
}

function recompute(){
  sol = makeSolution();
  var m = 1e-6;
  for (var i = 0; i <= N; i++){
    var v = sol.x(i / N * T_END);
    samples[i] = v;
    var a = Math.abs(v);
    if (a > m) m = a;
  }
  if (sol.type === 'damped') m = Math.max(m, sol.X);
  yMax = m * 1.12;
  t = 0;
}

function fmtX(v){ return !isFinite(v) ? '—' : (Math.abs(v) < 0.01 ? v.toFixed(4) : v.toFixed(3)); }

var PL = 78, PR = W - 26, PT = 48, PB = H - 42;
var PW = PR - PL, PH = PB - PT;
function tx(tt){ return PL + tt / T_END * PW; }
function xy(v){ return PT + PH / 2 - v / yMax * (PH / 2); }

function niceStep(range){
  var raw = range / 3;
  var p10 = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-9))));
  var n = raw / p10;
  return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p10;
}

function draw(){
  if (!sol) return;
  ctx.clearRect(0, 0, W, H);

  ctx.textAlign = 'left';
  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT;
  ctx.fillText('x(t) [m]  —  0 ~ 6 s   (f₀ = 4, m = 2, k = 800, ωₙ = 20)', PL - 54, 26);
  ctx.textAlign = 'right'; ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT;
  if (sol.type === 'res') ctx.fillText('공진 성장  ±f₀t/(2ωₙ)', PR, 26);
  else if (sol.type === 'beat') ctx.fillText('비감쇠 맥놀이', PR, 26);
  else ctx.fillText('X = ' + fmtX(sol.X) + ' m', PR, 26);

  var step = niceStep(yMax);
  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
  ctx.font = '12.5px ' + FONT; ctx.fillStyle = PAL.faint; ctx.textAlign = 'right';
  var digits = Math.max(1, Math.min(5, Math.ceil(-Math.log10(step))));
  for (var v = 0; v <= yMax; v += step){
    var list = (v === 0) ? [0] : [v, -v];
    for (var j = 0; j < list.length; j++){
      var y = xy(list[j]);
      ctx.beginPath(); ctx.moveTo(PL, y); ctx.lineTo(PR, y); ctx.stroke();
      ctx.fillText(list[j].toFixed(digits), PL - 9, y + 4);
    }
  }
  ctx.textAlign = 'center';
  for (var s = 0; s <= T_END; s++){
    var xg = tx(s);
    ctx.beginPath(); ctx.moveTo(xg, PT); ctx.lineTo(xg, PB); ctx.stroke();
    ctx.fillText(s + ' s', xg, PB + 18);
  }

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(PL, PT); ctx.lineTo(PL, PB); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PL, xy(0)); ctx.lineTo(PR, xy(0)); ctx.stroke();

  ctx.setLineDash([7, 5]);
  if (sol.type === 'res'){
    ctx.strokeStyle = PAL.high; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(tx(0), xy(0)); ctx.lineTo(tx(T_END), xy(sol.env(T_END))); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx(0), xy(0)); ctx.lineTo(tx(T_END), xy(-sol.env(T_END))); ctx.stroke();
    ctx.fillStyle = PAL.high; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'right';
    ctx.fillText('기울기 ' + (F0 / (2 * WN)).toFixed(3) + ' m/s', PR - 8, Math.max(PT + 14, xy(sol.env(T_END)) - 10));
  } else if (sol.type === 'beat'){
    ctx.strokeStyle = PAL.high; ctx.lineWidth = 1.7;
    for (var sg = 1; sg >= -1; sg -= 2){
      ctx.beginPath();
      for (var bi = 0; bi <= 360; bi++){
        var bt = bi / 360 * T_END;
        var bx = tx(bt), by = xy(sg * sol.env(bt));
        if (bi) ctx.lineTo(bx, by); else ctx.moveTo(bx, by);
      }
      ctx.stroke();
    }
    var peak = Math.abs(2 * sol.X);
    ctx.fillStyle = PAL.high; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'right';
    ctx.fillText('최대 2f₀/|ωₙ²−ω²| = ' + fmtX(peak) + ' m', PR - 8, Math.max(PT + 16, xy(peak) - 10));
  } else {
    ctx.strokeStyle = PAL.ok; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(PL, xy(sol.X)); ctx.lineTo(PR, xy(sol.X)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PL, xy(-sol.X)); ctx.lineTo(PR, xy(-sol.X)); ctx.stroke();
    ctx.fillStyle = PAL.ok; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'left';
    ctx.fillText('±X = ' + fmtX(sol.X) + ' m', PL + 10, Math.max(PT + 16, xy(sol.X) - 9));
  }
  ctx.setLineDash([]);

  var idx = Math.max(1, Math.min(N, Math.floor(t / T_END * N)));
  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (var i = 0; i <= idx; i++){
    var cxp = tx(i / N * T_END), cyp = xy(samples[i]);
    if (i) ctx.lineTo(cxp, cyp); else ctx.moveTo(cxp, cyp);
  }
  ctx.stroke();

  var cx = tx(idx / N * T_END);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
  ctx.beginPath(); ctx.moveTo(cx, PT); ctx.lineTo(cx, PB); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = PAL.accent;
  ctx.beginPath(); ctx.arc(cx, xy(samples[idx]), 4.5, 0, Math.PI * 2); ctx.fill();
}

function syncSliders(){
  $('r').value = p.r; $('z').value = p.z;
  $('rv').textContent = p.r.toFixed(2);
  $('zv').textContent = p.z.toFixed(2);
}
$('r').addEventListener('input', function(){ p.r = parseFloat(this.value); syncSliders(); recompute(); });
$('z').addEventListener('input', function(){ p.z = parseFloat(this.value); syncSliders(); recompute(); });
$('play').addEventListener('click', function(){
  running = !running;
  this.textContent = running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', running);
});
$('reset').addEventListener('click', function(){
  p = { r: 1.00, z: 0 };
  syncSliders();
  running = true;
  $('play').textContent = '⏸ 일시정지';
  $('play').classList.add('btn-acc');
  recompute();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (running){
    t += dt;
    if (t > T_END) t = 0;
  }
  draw();
  requestAnimationFrame(loop);
}
syncSliders();
recompute();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
