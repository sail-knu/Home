<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L5-D1 · 맥놀이</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 5강</p>
  <h1>맥놀이</h1>
  <p class="lede">ω가 ωₙ에 가까울수록 맥놀이 주기가 길어집니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">고유진동수 ωₙ <span class="big-val" id="wnv">10.0</span> rad/s</p>
        <input type="range" id="wn" min="5" max="22" step="0.5" value="10">
      </div>
      <div>
        <p class="ctrl-title">구동주파수 ω <span class="big-val" id="wv">9.00</span> rad/s</p>
        <input type="range" id="w" min="5" max="22" step="0.05" value="9">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="420"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>응답 x(t)</span>
      <span><i style="background:var(--high)"></i>포락선</span>
      <span><i style="background:var(--float)"></i>T_beat 마커</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 5강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var EPS_RES = 0.12;
var T_RES_WIN = 30;
var SWEEP_SEC = 10;
var F0 = 1;
var st = { wn: 10, w: 9, t: 0, running: true };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','float','bad','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
var MONO = 'Consolas, ui-monospace, monospace';

function calc(){
  var wn = st.wn, w = st.w, f0 = F0;
  var d = wn - w;
  var resonant = Math.abs(d) < EPS_RES;
  if (resonant){
    var coef = f0 / (2 * wn);
    return {
      resonant: true, Twin: T_RES_WIN,
      x: function(t){ return coef * t * Math.sin(wn * t); },
      env: function(t){ return coef * t; },
      Yamp: coef * T_RES_WIN,
      Tbeat: Infinity, wbeat: 0, wfast: wn
    };
  }
  var denom = wn * wn - w * w;
  var Xmax = Math.abs(2 * f0 / denom);
  var wbeat = Math.abs(d);
  var Tbeat = 2 * Math.PI / wbeat;
  return {
    resonant: false, Twin: 2 * Tbeat, Tbeat: Tbeat, wbeat: wbeat, Xmax: Xmax,
    wfast: (wn + w) / 2,
    x: function(t){ return (2 * f0 / denom) * Math.sin(d * t / 2) * Math.sin((wn + w) * t / 2); },
    env: function(t){ return Xmax * Math.abs(Math.sin(d * t / 2)); },
    Yamp: Xmax
  };
}

var pL = 88, pR = W - 24, pT = 56, pB = H - 44;
var pW = pR - pL, pH = pB - pT;

function draw(){
  var P = calc();
  ctx.clearRect(0, 0, W, H);
  var Twin = P.Twin;
  var Yamp = Math.max(P.Yamp, 1e-9) * 1.15;
  var tx = function(t){ return pL + (t / Twin) * pW; };
  var ty = function(x){ return pT + pH / 2 - (x / Yamp) * (pH / 2); };
  var i, k, t, X, Y;

  ctx.textAlign = 'left';
  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT;
  ctx.fillText('x(t) = [2f₀/(ωₙ²−ω²)] · sin((ωₙ−ω)t/2) · sin((ωₙ+ω)t/2)', 24, 30);
  ctx.textAlign = 'right'; ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT;
  ctx.fillText('f₀ = 1', pR, 30);

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pL, pT); ctx.lineTo(pL, pB); ctx.lineTo(pR, pB); ctx.stroke();
  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pL, ty(0)); ctx.lineTo(pR, ty(0)); ctx.stroke();

  ctx.fillStyle = PAL.muted; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'center';
  for (i = 0; i <= 4; i++){
    t = Twin * i / 4; X = tx(t);
    ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(X, pB); ctx.lineTo(X, pB + 5); ctx.stroke();
    ctx.fillText(t.toFixed(1), X, pB + 20);
  }

  ctx.font = '13px ' + MONO; ctx.fillStyle = PAL.high; ctx.textAlign = 'right';
  var ymark = P.Yamp;
  ctx.fillText('+' + ymark.toFixed(4), pL - 8, ty(ymark) + 5);
  ctx.fillText('−' + ymark.toFixed(4), pL - 8, ty(-ymark) + 5);

  if (!P.resonant){
    ctx.strokeStyle = PAL.float; ctx.lineWidth = 1.2; ctx.setLineDash([5, 5]);
    for (k = 1; k <= 2; k++){
      X = tx(k * P.Tbeat);
      ctx.beginPath(); ctx.moveTo(X, pT); ctx.lineTo(X, pB); ctx.stroke();
    }
    ctx.setLineDash([]);
    var ay = pT + 22, ax0 = tx(0), ax1 = tx(P.Tbeat);
    ctx.strokeStyle = PAL.float; ctx.fillStyle = PAL.float; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(ax0 + 2, ay); ctx.lineTo(ax1 - 2, ay); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax0 + 2, ay); ctx.lineTo(ax0 + 10, ay - 4.5); ctx.lineTo(ax0 + 10, ay + 4.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(ax1 - 2, ay); ctx.lineTo(ax1 - 10, ay - 4.5); ctx.lineTo(ax1 - 10, ay + 4.5); ctx.closePath(); ctx.fill();
    ctx.textAlign = 'center'; ctx.font = 'bold 13px ' + FONT;
    ctx.fillText('T_beat = ' + P.Tbeat.toFixed(2) + ' s   (ω_beat = ' + P.wbeat.toFixed(2) + ')', (ax0 + ax1) / 2, ay - 8);
  }

  var N = 2400;
  ctx.strokeStyle = PAL.high; ctx.lineWidth = 1.8; ctx.setLineDash([6, 5]);
  [1, -1].forEach(function(sgn){
    ctx.beginPath();
    for (var j = 0; j <= N; j++){
      var tj = Twin * j / N;
      if (j) ctx.lineTo(tx(tj), ty(sgn * P.env(tj))); else ctx.moveTo(tx(tj), ty(sgn * P.env(tj)));
    }
    ctx.stroke();
  });
  ctx.setLineDash([]);

  var tNow = Math.min(st.t, Twin);
  var Ncur = Math.max(2, Math.floor(N * tNow / Twin));
  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.2;
  ctx.beginPath();
  for (i = 0; i <= Ncur; i++){
    t = Twin * i / N; X = tx(t); Y = ty(P.x(t));
    if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
  }
  ctx.stroke();

  var cxp = tx(tNow), cyp = ty(P.x(tNow));
  ctx.fillStyle = PAL.text;
  ctx.beginPath(); ctx.arc(cxp, cyp, 5, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = PAL.muted; ctx.font = '13px Consolas, monospace'; ctx.textAlign = 'left';
  if (P.resonant){
    ctx.fillStyle = PAL.bad;
    ctx.fillText('ω ≈ ωₙ  공진  —  x(t) = (f₀/2ωₙ)·t·sin ωₙt', pL + 8, pB - 10);
  } else {
    ctx.fillText('최대 진폭 2f₀/|ωₙ²−ω²| = ' + P.Xmax.toFixed(4) + ' m', pL + 8, pB - 10);
  }
}

function syncSpans(){
  $('wnv').textContent = st.wn.toFixed(1);
  $('wv').textContent  = st.w.toFixed(2);
  $('wn').value = st.wn; $('w').value = st.w;
}
$('wn').addEventListener('input', function(){ st.wn = parseFloat(this.value); st.t = 0; syncSpans(); draw(); });
$('w').addEventListener('input', function(){ st.w = parseFloat(this.value); st.t = 0; syncSpans(); draw(); });
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.wn = 10; st.w = 9; st.t = 0; st.running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running){
    var Twin = calc().Twin;
    st.t += dt * (Twin / SWEEP_SEC);
    if (st.t > Twin) st.t = 0;
  }
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
