<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L5-D3 · 과도응답 vs 정상상태</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 5강</p>
  <h1>과도응답 vs 정상상태</h1>
  <p class="lede">x₀·v₀는 과도항만 바꾸고, 정상상태 X·θ는 그대로입니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">감쇠비 ζ <span class="big-val" id="zv">0.166</span></p>
        <input type="range" id="zt" min="0.01" max="0.99" step="0.001" value="0.166">
      </div>
      <div>
        <p class="ctrl-title">진동수비 r = ω/ωₙ <span class="big-val" id="rv">0.994</span></p>
        <input type="range" id="rt" min="0.10" max="3.00" step="0.001" value="0.994">
      </div>
      <div>
        <p class="ctrl-title">초기 변위 x₀ <span class="big-val" id="x0v">1</span> mm</p>
        <input type="range" id="x0s" min="-50" max="50" step="1" value="1">
      </div>
      <div>
        <p class="ctrl-title">초기 속도 v₀ <span class="big-val" id="v0v">20</span> mm/s</p>
        <input type="range" id="v0s" min="-100" max="100" step="1" value="20">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="420"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>전체 x(t)</span>
      <span><i style="background:var(--high)"></i>과도 (파선)</span>
      <span><i style="background:var(--low)"></i>정상상태 (파선)</span>
      <span><i style="background:var(--ok)"></i>tₛ = 4/(ζωₙ)</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 5강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','float','ok','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
var MONO = 'Consolas, ui-monospace, monospace';

var WN = Math.sqrt(910 / 100);
var F0M = 0.1;
var EPS = 1e-9;
var st = { z: 0.166, r: 0.994, x0: 0.001, v0: 0.020, t: 0, running: true };

function computeParams(){
  var z = Math.min(0.999, Math.max(1e-6, st.z));
  var w = Math.max(1e-6, st.r) * WN;
  var wd = WN * Math.sqrt(Math.max(1e-12, 1 - z * z));
  var D1 = WN * WN - w * w, D2 = 2 * z * WN * w;
  var den = Math.sqrt(D1 * D1 + D2 * D2);
  var X = F0M / Math.max(EPS, den);
  var th = Math.atan2(D2, D1);
  var B0 = st.x0 - X * Math.cos(th);
  var V0 = st.v0 - X * w * Math.sin(th);
  var Ac = (V0 + z * WN * B0) / wd;
  var ph = Math.atan2(B0 * wd, V0 + z * WN * B0);
  var A = Math.sqrt(B0 * B0 + Ac * Ac);
  if (ph > Math.PI / 2) { ph -= Math.PI; A = -A; }
  else if (ph < -Math.PI / 2) { ph += Math.PI; A = -A; }
  var ts = 4 / (z * WN);
  return { z: z, w: w, wd: wd, X: X, th: th, A: A, ph: ph, ts: ts, B0: B0 };
}

function xTrans(p, t){ return p.A * Math.exp(-p.z * WN * t) * Math.sin(p.wd * t + p.ph); }
function xSteady(p, t){ return p.X * Math.cos(p.w * t - p.th); }

var PL = 70, PR = W - 22, PT = 58, PB = H - 38;
var PW = PR - PL, PH_ = PB - PT, PY0 = (PT + PB) / 2;

function timeWindow(p){ return Math.min(40, Math.max(8, 1.5 * p.ts)); }

function peakAbs(p, T){
  var m = Math.max(Math.abs(st.x0), p.X), n = 720, i, t, v;
  for (i = 0; i <= n; i++){
    t = T * i / n;
    v = Math.abs(xTrans(p, t) + xSteady(p, t));
    if (v > m) m = v;
  }
  return m;
}

function draw(){
  var p = computeParams();
  var T = timeWindow(p);
  var yMax = Math.max(EPS, 1.15 * peakAbs(p, T));
  var tx = function(t){ return PL + (t / T) * PW; };
  var ty = function(x){ return PY0 - (x / yMax) * (PH_ / 2) * 0.95; };

  ctx.clearRect(0, 0, W, H);

  ctx.textAlign = 'left';
  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT;
  ctx.fillText('x(t) = A e^(−ζωₙt) sin(ω_d t + φ)  +  X cos(ωt − θ)', PL - 6, 26);
  ctx.fillStyle = PAL.accent; ctx.font = '13px ' + MONO;
  ctx.fillText('X = ' + (p.X * 1000).toFixed(1) + ' mm   θ = ' + (p.th * 180 / Math.PI).toFixed(1)
    + '°   A = ' + (p.A * 1000).toFixed(1) + ' mm', PL - 6, 46);

  var nTick = 8, i;
  ctx.lineWidth = 1; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'center';
  for (i = 0; i <= nTick; i++){
    var tg = T * i / nTick, gx = tx(tg);
    ctx.strokeStyle = PAL.grid; ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(gx, PT); ctx.lineTo(gx, PB); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PAL.faint;
    ctx.fillText(tg.toFixed(1), gx, PB + 18);
  }
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(PL, PY0); ctx.lineTo(PR, PY0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PL, PT); ctx.lineTo(PL, PB); ctx.stroke();
  ctx.fillStyle = PAL.muted; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('+' + (yMax * 1000).toFixed(1), PL - 6, ty(yMax) + 13);
  ctx.fillText('0', PL - 6, PY0 + 4);
  ctx.fillText('−' + (yMax * 1000).toFixed(1), PL - 6, ty(-yMax) - 5);

  if (p.ts <= T){
    var mx = tx(p.ts);
    ctx.strokeStyle = PAL.ok; ctx.lineWidth = 1.8; ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.moveTo(mx, PT); ctx.lineTo(mx, PB); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PAL.ok; ctx.font = 'bold 13px ' + FONT;
    ctx.textAlign = (mx > PR - 130) ? 'right' : 'left';
    ctx.fillText(' tₛ = 4/(ζωₙ) = ' + p.ts.toFixed(1) + ' s ', mx, PT + 16);
  } else {
    ctx.fillStyle = PAL.ok; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'right';
    ctx.fillText('tₛ = ' + p.ts.toFixed(1) + ' s (화면 밖)', PR - 6, PT + 16);
  }

  ctx.save();
  ctx.beginPath(); ctx.rect(PL - 2, PT - 2, PW + 10, PH_ + 4); ctx.clip();

  var N = 900, j, tt;
  ctx.globalAlpha = 0.22; ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2;
  ctx.beginPath();
  for (j = 0; j <= N; j++){
    tt = T * j / N;
    if (j) ctx.lineTo(tx(tt), ty(xTrans(p, tt) + xSteady(p, tt)));
    else ctx.moveTo(tx(tt), ty(xTrans(p, tt) + xSteady(p, tt)));
  }
  ctx.stroke(); ctx.globalAlpha = 1;

  var tEnd = Math.min(Math.max(st.t, 0), T);
  var curve = function(fn, color, lw, dash){
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash(dash);
    ctx.beginPath();
    for (var k = 0; k <= N; k++){
      var ttt = tEnd * k / N, y = ty(fn(p, ttt));
      if (k) ctx.lineTo(tx(ttt), y); else ctx.moveTo(tx(ttt), y);
    }
    ctx.stroke(); ctx.setLineDash([]);
  };
  if (tEnd > 0){
    curve(xTrans, PAL.high, 1.8, [5, 4]);
    curve(xSteady, PAL.low, 1.8, [5, 4]);
    curve(function(pp, t){ return xTrans(pp, t) + xSteady(pp, t); }, PAL.accent, 3, []);
  }
  var xNow = xTrans(p, tEnd) + xSteady(p, tEnd);
  ctx.fillStyle = PAL.accent;
  ctx.beginPath(); ctx.arc(tx(tEnd), ty(xNow), 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function syncSpans(){
  $('zv').textContent  = st.z.toFixed(3);
  $('rv').textContent  = st.r.toFixed(3);
  $('x0v').textContent = (st.x0 * 1000).toFixed(0);
  $('v0v').textContent = (st.v0 * 1000).toFixed(0);
  $('zt').value = st.z; $('rt').value = st.r;
  $('x0s').value = (st.x0 * 1000).toFixed(0);
  $('v0s').value = (st.v0 * 1000).toFixed(0);
}
$('zt').addEventListener('input', function(){ st.z = parseFloat(this.value); syncSpans(); draw(); });
$('rt').addEventListener('input', function(){ st.r = parseFloat(this.value); syncSpans(); draw(); });
$('x0s').addEventListener('input', function(){ st.x0 = parseFloat(this.value) / 1000; syncSpans(); draw(); });
$('v0s').addEventListener('input', function(){ st.v0 = parseFloat(this.value) / 1000; syncSpans(); draw(); });
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.z = 0.166; st.r = 0.994; st.x0 = 0.001; st.v0 = 0.020; st.t = 0; st.running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  var T = timeWindow(computeParams());
  if (st.running){
    st.t += dt * T / 10;
    if (st.t > T) st.t = 0;
  }
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
