<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L9-D4 · 펄스 응답</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 9강</p>
  <h1>펄스 응답</h1>
  <p class="lede">폭 T인 펄스는 계단 두 개의 차이고, T≈Tₙ/2이면 잔류진동이 작습니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">감쇠비 ζ <span class="big-val" id="zv">0.10</span></p>
        <input type="range" id="z" min="0" max="0.99" step="0.01" value="0.10">
      </div>
      <div>
        <p class="ctrl-title">고유진동수 ωₙ <span class="big-val" id="wv">10.0</span> rad/s</p>
        <input type="range" id="w" min="2" max="20" step="0.1" value="10">
      </div>
      <div>
        <p class="ctrl-title">펄스 폭 T <span class="big-val" id="Tv">0.31</span> s</p>
        <input type="range" id="T" min="0.02" max="1.6" step="0.01" value="0.31">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="460"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>응답 x(t) = step(t) − step(t−T)</span>
      <span><i style="background:var(--high)"></i>켜지는 계단 +F₀Φ(t)</span>
      <span><i style="background:var(--low)"></i>꺼지는 계단 −F₀Φ(t−T)</span>
      <span><i style="background:var(--float)"></i>최대점</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 9강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var EPS = 1e-6;
var K = 100;
var st = { zeta:0.10, wn:10, F0:50, pulse:true, T:0.31, t:0, running:true };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','float','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
var MONO = 'Consolas, ui-monospace, monospace';

function theta(z){ return Math.atan2(z, Math.sqrt(Math.max(0, 1 - z*z))); }
function stepResp(t, z, wn, F0){
  if (t < 0) return 0;
  var xss = F0 / K;
  if (z < EPS) return xss * (1 - Math.cos(wn * t));
  var s = Math.sqrt(Math.max(EPS, 1 - z*z));
  var wd = wn * s;
  return xss - (xss / s) * Math.exp(-z * wn * t) * Math.cos(wd * t - theta(z));
}
function pulseResp(t, z, wn, F0, T){
  return stepResp(t, z, wn, F0) - stepResp(t - T, z, wn, F0);
}
function respAt(t){
  return pulseResp(t, st.zeta, st.wn, st.F0, st.T);
}
function metrics(){
  var z = st.zeta, wn = st.wn, F0 = st.F0;
  var xss = F0 / K;
  var s = Math.sqrt(Math.max(EPS, 1 - z*z));
  var wd = wn * s;
  var tp = Math.PI / wd;
  var ts = z < EPS ? Infinity : 3.5 / (z * wn);
  var osFrac = z < EPS ? 1 : Math.exp(-z * Math.PI / s);
  var peakVal = z < EPS ? 2 * xss : xss * (1 + osFrac);
  return { xss:xss, wd:wd, tp:tp, ts:ts, osPct:osFrac*100, peakVal:peakVal, peakMult:peakVal/xss };
}
function residualAmp(){
  var T = st.T, wn = st.wn, z = st.zeta, F0 = st.F0;
  var Tn = 2 * Math.PI / wn;
  var amax = 0, tEnd = T + 4 * Tn, N = 1200;
  for (var i = 0; i <= N; i++){
    var t = T + (i / N) * (tEnd - T);
    var a = Math.abs(pulseResp(t, z, wn, F0, T));
    if (a > amax) amax = a;
  }
  return amax;
}
function viewSpan(){
  var Tn = 2 * Math.PI / st.wn;
  return Math.max(st.T + 4 * Tn, 2.0);
}

var plotL = 76, plotR = W - 34, plotTop = 56, plotBot = H - 62;
var plotW = plotR - plotL, plotH = plotBot - plotTop;

function yRange(m){
  var ymax = m.peakVal * 1.15, ymin = -m.peakVal * 1.15;
  if (ymax - ymin < 1e-6) ymax = ymin + 1e-6;
  return { ymin:ymin, ymax:ymax };
}
function boxLabel(text, x, y, col, align){
  ctx.font = 'bold 13.5px ' + FONT; ctx.textBaseline = 'middle';
  var w = ctx.measureText(text).width + 13;
  var left = align === 'right' ? x - w : (align === 'center' ? x - w/2 : x);
  left = Math.max(plotL + 1, Math.min(plotR - w - 1, left));
  var top = Math.max(plotTop + 1, Math.min(plotBot - 21, y - 10));
  ctx.fillStyle = PAL.surface2; ctx.globalAlpha = 0.9;
  ctx.fillRect(left, top, w, 20); ctx.globalAlpha = 1;
  ctx.fillStyle = col; ctx.textAlign = 'left';
  ctx.fillText(text, left + 6.5, top + 10);
  ctx.textBaseline = 'alphabetic';
}
function chipAt(text, cx, cy, col){
  ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var w = ctx.measureText(text).width + 14;
  cx = Math.max(plotL + w/2 + 1, Math.min(plotR - w/2 - 1, cx));
  ctx.fillStyle = PAL.surface2; ctx.globalAlpha = 0.92;
  ctx.fillRect(cx - w/2, cy - 11, w, 22); ctx.globalAlpha = 1;
  ctx.strokeStyle = col; ctx.lineWidth = 1;
  ctx.strokeRect(cx - w/2, cy - 11, w, 22);
  ctx.fillStyle = col; ctx.fillText(text, cx, cy);
  ctx.textBaseline = 'alphabetic';
}

function draw(){
  var m = metrics();
  var Tview = viewSpan();
  var r = yRange(m), ymin = r.ymin, ymax = r.ymax;
  var tx = function(t){ return plotL + (t / Tview) * plotW; };
  var yx = function(y){ return plotBot - ((y - ymin) / (ymax - ymin)) * plotH; };

  ctx.clearRect(0, 0, W, H);
  var lblForce = null;
  var i;

  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  for (i = 1; i <= 5; i++){
    var gx = plotL + (i / 5) * plotW;
    ctx.beginPath(); ctx.moveTo(gx, plotTop); ctx.lineTo(gx, plotBot); ctx.stroke();
  }
  for (i = 1; i <= 3; i++){
    var gy = plotTop + (i / 4) * plotH;
    ctx.beginPath(); ctx.moveTo(plotL, gy); ctx.lineTo(plotR, gy); ctx.stroke();
  }
  ctx.setLineDash([]);

  ctx.font = '12.5px ' + FONT; ctx.textAlign = 'right'; ctx.fillStyle = PAL.faint;
  for (i = 0; i <= 4; i++){
    var yv = ymin + (i / 4) * (ymax - ymin);
    ctx.fillText(yv.toFixed(2), plotL - 9, yx(yv) + 4);
  }

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.4;
  ctx.strokeRect(plotL, plotTop, plotW, plotH);

  if (ymin < 0){
    ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.4; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(plotL, yx(0)); ctx.lineTo(plotR, yx(0)); ctx.stroke();
    ctx.setLineDash([]);
  }

  var drawComp = function(sign, shift, color){
    ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]);
    ctx.globalAlpha = 0.6; ctx.beginPath();
    var started = false;
    for (var px = 0; px <= plotW; px += 2){
      var t = (px / plotW) * Tview;
      var v = sign * stepResp(t - shift, st.zeta, st.wn, st.F0);
      var X = plotL + px, Y = yx(v);
      if (!started){ ctx.moveTo(X, Y); started = true; } else ctx.lineTo(X, Y);
    }
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  };
  drawComp(+1, 0, PAL.high);
  drawComp(-1, st.T, PAL.low);

  var xT = tx(Math.min(st.T, Tview));
  ctx.fillStyle = PAL.accent; ctx.globalAlpha = 0.09;
  ctx.fillRect(plotL, plotTop, xT - plotL, plotH); ctx.globalAlpha = 1;
  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
  ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.moveTo(xT, plotTop); ctx.lineTo(xT, plotBot); ctx.stroke();
  ctx.globalAlpha = 1; ctx.setLineDash([]);
  ctx.font = 'bold 13.5px ' + FONT;
  if (xT - plotL > ctx.measureText('힘 F₀ 작용').width + 16){
    lblForce = { t:'힘 F₀ 작용', x:(plotL + xT) / 2, y: plotTop + 16 };
  }
  chipAt('T = ' + st.T.toFixed(2) + ' s', xT, plotBot - 15, PAL.accent);

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.8; ctx.lineJoin = 'round'; ctx.beginPath();
  var started2 = false;
  for (var px2 = 0; px2 <= plotW; px2 += 1){
    var t2 = (px2 / plotW) * Tview;
    var v2 = respAt(t2);
    var X2 = plotL + px2, Y2 = yx(v2);
    if (!started2){ ctx.moveTo(X2, Y2); started2 = true; } else ctx.lineTo(X2, Y2);
  }
  ctx.stroke();

  if (lblForce) boxLabel(lblForce.t, lblForce.x, lblForce.y, PAL.accent, 'center');

  var tCur = Math.min(st.t, Tview);
  var cx = tx(tCur), cy = yx(respAt(tCur));
  ctx.strokeStyle = PAL.faint; ctx.lineWidth = 1; ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.moveTo(cx, plotTop); ctx.lineTo(cx, plotBot); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = PAL.text;
  ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, Math.PI * 2); ctx.fill();

  var best = 0, bestT = 0;
  for (var px3 = 0; px3 <= plotW; px3 += 1){
    var t3 = (px3 / plotW) * Tview, v3 = respAt(t3);
    if (Math.abs(v3) > Math.abs(best)){ best = v3; bestT = t3; }
  }
  if (bestT >= 0 && bestT <= Tview){
    var mx = tx(bestT), my = yx(best);
    ctx.fillStyle = PAL.float;
    ctx.beginPath(); ctx.arc(mx, my, 6.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = PAL.surface2; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.fillStyle = PAL.float; ctx.font = 'bold 13.5px ' + FONT;
    var right = bestT / Tview > 0.72;
    ctx.textAlign = right ? 'right' : 'left';
    ctx.fillText('최대 ' + best.toFixed(3) + ' m', right ? mx - 11 : mx + 11, my - 11);
  }

  ctx.textAlign = 'center'; ctx.font = '12.5px ' + FONT; ctx.fillStyle = PAL.faint;
  for (i = 0; i <= 5; i++){
    ctx.fillText(((i / 5) * Tview).toFixed(1), tx((i / 5) * Tview), plotBot + 22);
  }
  ctx.textAlign = 'right'; ctx.font = '13.5px ' + FONT; ctx.fillStyle = PAL.muted;
  ctx.fillText('시간 t [s] →', plotR, plotBot + 44);

  var Tn = 2 * Math.PI / st.wn;
  var resid = residualAmp();
  ctx.textAlign = 'left'; ctx.font = 'bold 16px ' + FONT; ctx.fillStyle = PAL.text;
  ctx.fillText('x(t) [m] · 사각펄스 F₀[Φ(t) − Φ(t−T)]', 22, plotTop - 18);
  ctx.textAlign = 'right'; ctx.font = '14px ' + MONO; ctx.fillStyle = PAL.muted;
  ctx.fillText('Tₙ=' + Tn.toFixed(2) + ' s  Tₙ/2=' + (Tn/2).toFixed(2) +
               ' s  잔류=' + resid.toFixed(3) + ' m  F₀=50 N  k=100 N/m', plotR, plotTop - 18);
}

function syncSpans(){
  $('zv').textContent = st.zeta.toFixed(2);
  $('wv').textContent = st.wn.toFixed(1);
  $('Tv').textContent = st.T.toFixed(2);
  $('z').value = st.zeta; $('w').value = st.wn; $('T').value = st.T;
}
function bind(id, key){
  $(id).addEventListener('input', function(){
    st[key] = parseFloat(this.value); st.t = 0; syncSpans(); draw();
  });
}
bind('z', 'zeta'); bind('w', 'wn'); bind('T', 'T');

$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.zeta = 0.10; st.wn = 10; st.F0 = 50; st.T = 0.31; st.pulse = true; st.t = 0; st.running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  if (st.running){
    st.t += dt;
    if (st.t > viewSpan()) st.t = 0;
  }
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
