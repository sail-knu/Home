<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L14-D2 · 무차원 설계 지도</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
  --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 14강</p>
  <h1>무차원 설계 지도</h1>
  <p class="lede">흡진기는 r=1에서 영점을 만들지만 공진 두 개가 새로 생깁니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">질량비 μ = mₐ/m <span class="big-val" id="muv">0.250</span></p>
        <input type="range" id="mu" min="0.02" max="0.6" step="0.005" value="0.25">
      </div>
      <div>
        <p class="ctrl-title">진동수비 β = ωₐ/ωₚ <span class="big-val" id="bev">1.000</span></p>
        <input type="range" id="be" min="0.6" max="1.4" step="0.005" value="1">
      </div>
      <div>
        <p class="ctrl-title">주파수비 r = ω/ωₐ <span class="big-val" id="rv">1.000</span></p>
        <input type="range" id="r" min="0.05" max="2.2" step="0.005" value="1">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="540"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>|Xk/F₀| (흡진기)</span>
      <span><i style="background:var(--faint)"></i>원래 1자유도</span>
      <span><i style="background:var(--ok)"></i>안전 |amp|≤1</span>
      <span><i style="background:var(--high)"></i>새 공진 r₁, r₂</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 14강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var EPS = 1e-6;

var state = { mu: 0.25, be: 1.0, r: 1.0, running: true, dir: 1 };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','ok','float','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function rgbParts(c){
  var m = String(c).match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if (m) return [+m[1], +m[2], +m[3]];
  if (c.charAt(0) === '#' && c.length === 7)
    return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  return [136,136,136];
}
function alpha(key, a){
  var p = rgbParts(PAL[key]);
  return 'rgba('+p[0]+','+p[1]+','+p[2]+','+a+')';
}

function ampWith(r, mu, be){
  var b2 = be * be, r2 = r * r;
  var den = (1 + mu * b2 - b2 * r2) * (1 - r2) - mu * b2;
  if (Math.abs(den) < EPS) den = (den < 0 ? -1 : 1) * EPS;
  return (1 - r2) / den;
}
function ampOrig(r, be){
  var den = 1 - be * be * r * r;
  if (Math.abs(den) < EPS) den = (den < 0 ? -1 : 1) * EPS;
  return 1 / den;
}

function resonances(mu, be){
  var b2 = be * be;
  var A = b2, B = -(1 + mu * b2 + b2), C = 1;
  var disc = B * B - 4 * A * C;
  if (disc <= 0 || A < EPS) return [NaN, NaN];
  var sd = Math.sqrt(disc);
  var s1 = (-B - sd) / (2 * A), s2 = (-B + sd) / (2 * A);
  var r1 = s1 > 0 ? Math.sqrt(s1) : NaN;
  var r2 = s2 > 0 ? Math.sqrt(s2) : NaN;
  return [Math.min(r1, r2), Math.max(r1, r2)];
}

function safeCrossings(mu, be){
  var res = resonances(mu, be);
  var g = function(r){ return Math.abs(ampWith(r, mu, be)) - 1; };
  var roots = [];
  var pr = 0.01, pv = g(pr);
  for (var r = 0.02; r <= 2.6; r += 0.002){
    var v = g(r);
    if (isFinite(pv) && isFinite(v) && pv * v < 0){
      var nearRes = res.some(function(rr){ return isFinite(rr) && Math.abs(r - rr) < 0.02; });
      if (!nearRes){
        var a = pr, b = r;
        for (var k = 0; k < 40; k++){
          var m = 0.5 * (a + b), gm = g(m);
          if (!isFinite(gm)) break;
          if (g(a) * gm <= 0) b = m; else a = m;
        }
        roots.push(0.5 * (a + b));
      }
    }
    pr = r; pv = v;
  }
  return roots;
}

var plotL = 62, plotR = W - 22, plotTop = 42, plotBot = H - 46;
var plotW = plotR - plotL, plotH = plotBot - plotTop;
var R_MAX = 2.2, Y_MAX = 6;
var rx = function(r){ return plotL + (r / R_MAX) * plotW; };
var ry = function(y){ return plotBot - Math.min(y, Y_MAX) / Y_MAX * plotH; };

function safeBand(){
  var mu = state.mu, be = state.be;
  var res = resonances(mu, be);
  var cr = safeCrossings(mu, be).sort(function(a,b){ return a - b; });
  var lo = NaN, hi = NaN, hf = NaN;
  var below = cr.filter(function(c){ return c < 1; });
  var above = cr.filter(function(c){ return c > 1; });
  if (below.length) lo = below[below.length - 1];
  if (above.length){ hi = above[0]; hf = above[above.length - 1]; }
  if (above.length <= 1) hf = NaN;
  return { res: res, lo: lo, hi: hi, hf: hf, cr: cr };
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  var mu = state.mu, be = state.be, r = state.r;
  var p = safeBand();

  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(plotL, plotTop, plotW, plotH);

  ctx.fillStyle = alpha('ok', 0.14);
  var bandOn = false, bandStart = 0;
  for (var r0 = 0.03; r0 <= R_MAX + 0.001; r0 += 0.004){
    var safe = Math.abs(ampWith(r0, mu, be)) <= 1;
    if (safe && !bandOn){ bandOn = true; bandStart = r0; }
    if ((!safe || r0 >= R_MAX) && bandOn){
      ctx.fillRect(rx(bandStart), plotTop, rx(r0) - rx(bandStart), plotH);
      bandOn = false;
    }
  }
  ctx.strokeStyle = PAL.ok; ctx.lineWidth = 1.2; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(plotL, ry(1)); ctx.lineTo(plotR, ry(1)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = PAL.ok; ctx.font = '11px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('|Xk/F₀| = 1', plotL + 6, ry(1) - 5);

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(plotL, plotTop); ctx.lineTo(plotL, plotBot); ctx.lineTo(plotR, plotBot); ctx.stroke();
  ctx.fillStyle = PAL.faint; ctx.font = '11px ' + FONT;
  ctx.textAlign = 'center';
  for (var tick = 0; tick <= R_MAX + 0.001; tick += 0.25){
    var X = rx(tick);
    ctx.strokeStyle = PAL.grid; ctx.beginPath();
    ctx.moveTo(X, plotTop); ctx.lineTo(X, plotBot); ctx.stroke();
    ctx.fillStyle = PAL.faint;
    ctx.fillText(tick.toFixed(2), X, plotBot + 15);
  }
  ctx.textAlign = 'right';
  for (var y = 0; y <= Y_MAX; y += 1){
    var Y = ry(y);
    ctx.strokeStyle = PAL.grid; ctx.beginPath();
    ctx.moveTo(plotL, Y); ctx.lineTo(plotR, Y); ctx.stroke();
    ctx.fillStyle = PAL.faint; ctx.fillText(String(y), plotL - 8, Y + 4);
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = PAL.muted; ctx.font = '12px ' + FONT;
  ctx.fillText('r = ω / ωₐ', (plotL + plotR) / 2, H - 8);
  ctx.save(); ctx.translate(16, (plotTop + plotBot) / 2); ctx.rotate(-Math.PI/2);
  ctx.fillText('|Xk/F₀|', 0, 0); ctx.restore();

  function curve(fn, style, lw){
    ctx.strokeStyle = style; ctx.lineWidth = lw;
    ctx.beginPath();
    var pen = false;
    for (var rr = 0.02; rr <= R_MAX + 0.001; rr += 0.003){
      var yv = Math.abs(fn(rr));
      var Xp = rx(rr), Yp = ry(yv);
      if (yv > Y_MAX){ pen = false; continue; }
      if (!pen){ ctx.moveTo(Xp, Yp); pen = true; } else ctx.lineTo(Xp, Yp);
    }
    ctx.stroke();
  }
  curve(function(r0){ return ampOrig(r0, be); }, PAL.faint, 1.6);
  curve(function(r0){ return ampWith(r0, mu, be); }, PAL.accent, 2.8);

  p.res.forEach(function(rr){
    if (!isFinite(rr) || rr > R_MAX) return;
    var Xr = rx(rr);
    ctx.strokeStyle = PAL.high; ctx.lineWidth = 1.4; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(Xr, plotTop); ctx.lineTo(Xr, plotBot); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PAL.high; ctx.font = 'bold 11px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText('r=' + rr.toFixed(3), Xr, plotTop + 16);
  });

  var Xg = rx(1);
  ctx.fillStyle = PAL.ok; ctx.font = '11px ' + FONT; ctx.textAlign = 'center';
  ctx.beginPath(); ctx.arc(Xg, ry(Math.abs(ampWith(1, mu, be))), 4, 0, 7); ctx.fill();
  ctx.fillText('골 r=1', Xg, plotBot - 6);

  var yc = Math.abs(ampWith(r, mu, be));
  var Xm = rx(r), Ym = ry(yc);
  ctx.strokeStyle = PAL.float; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(Xm, plotTop); ctx.lineTo(Xm, plotBot); ctx.stroke();
  ctx.fillStyle = PAL.float;
  ctx.beginPath(); ctx.arc(Xm, Math.max(Ym, plotTop + 3), 5, 0, 7); ctx.fill();
  ctx.font = 'bold 12px ' + FONT; ctx.textAlign = Xm > W - 90 ? 'right' : 'left';
  ctx.fillText('r=' + r.toFixed(3), Xm + (Xm > W - 90 ? -8 : 8), plotTop + 40);
}

$('mu').addEventListener('input', function(){
  state.mu = parseFloat(this.value);
  $('muv').textContent = state.mu.toFixed(3);
});
$('be').addEventListener('input', function(){
  state.be = parseFloat(this.value);
  $('bev').textContent = state.be.toFixed(3);
});
$('r').addEventListener('input', function(){
  state.r = parseFloat(this.value);
  $('rv').textContent = state.r.toFixed(3);
});
$('play').addEventListener('click', function(){
  state.running = !state.running;
  this.textContent = state.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', state.running);
});
$('reset').addEventListener('click', function(){
  state.mu = 0.25; state.be = 1.0; state.r = 1.0; state.dir = 1; state.running = true;
  $('mu').value = 0.25;  $('muv').textContent = '0.250';
  $('be').value = 1.0;   $('bev').textContent = '1.000';
  $('r').value = 1.0;    $('rv').textContent = '1.000';
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.05, (now - last) / 1000) : 0; last = now;
  if (state.running){
    state.r += state.dir * 0.28 * dt;
    if (state.r >= 2.15){ state.r = 2.15; state.dir = -1; }
    if (state.r <= 0.08){ state.r = 0.08; state.dir = 1; }
    $('r').value = state.r.toFixed(3);
    $('rv').textContent = state.r.toFixed(3);
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
