<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L2-D2 · 변위·속도·가속도 위상</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
  --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 2강</p>
  <h1>변위·속도·가속도 위상</h1>
  <p class="lede">속도는 <b>90°</b>, 가속도는 <b>180°</b> 앞섭니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">진폭 A <span class="big-val" id="Av">10.0</span> mm</p>
        <input type="range" id="A" min="2" max="20" step="0.5" value="10">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="540"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>x(t)</span>
      <span><i style="background:var(--low)"></i>ẋ(t), 90° 선행</span>
      <span><i style="background:var(--high)"></i>ẍ(t), 180° 선행</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 2강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var WN = 8;
var st = { A: 10, th: 0, running: true };
var WIN = 4 * Math.PI;

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['bg','surface','surface2','border','border2','text','muted','faint',
   'accent','high','low','float','mass','mass-ink','spring','wall','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function drawSpringV(cx, y0, y1){
  ctx.strokeStyle = PAL.spring; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(cx, y0);
  var c = 8, seg = (y1 - y0) / (c * 2);
  for (var i = 0; i < c * 2; i++) ctx.lineTo(cx + (i % 2 === 0 ? -11 : 11), y0 + seg * (i + 0.5));
  ctx.lineTo(cx, y1); ctx.stroke();
}

var smL = 14, smR = 206, smCx = (smL + smR) / 2;
var plotL = 250, plotR = 884, plotW = plotR - plotL;
var rows = [
  { lab: 40, y0: 52, y1: 188, name: 'x(t) = A sin(ωₙt)', col: 'accent', f: Math.sin },
  { lab: 214, y0: 226, y1: 362, name: 'ẋ(t) = Aωₙ cos(ωₙt)   90° 선행', col: 'low', f: Math.cos },
  { lab: 388, y0: 400, y1: 536, name: 'ẍ(t) = −Aωₙ² sin(ωₙt)   180° 선행', col: 'high', f: function(u){ return -Math.sin(u); } }
];

function draw(){
  var A = st.A, th = st.th, s = Math.sin(th);
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(smL, 14, smR - smL, H - 28);
  ctx.strokeStyle = PAL.border; ctx.strokeRect(smL, 14, smR - smL, H - 28);
  var ceilY = 56, eqY = 300, amp = 90, mside = 48;
  ctx.fillStyle = PAL.wall; ctx.fillRect(smCx - 56, ceilY - 10, 112, 10);
  ctx.strokeStyle = PAL.grid; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(smL + 8, eqY); ctx.lineTo(smR - 8, eqY); ctx.stroke(); ctx.setLineDash([]);
  var massY = eqY - (A / 20) * amp * s;
  drawSpringV(smCx, ceilY, massY - mside / 2);
  ctx.fillStyle = PAL.mass; ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2;
  ctx.fillRect(smCx - mside / 2, massY - mside / 2, mside, mside);
  ctx.strokeRect(smCx - mside / 2, massY - mside / 2, mside, mside);
  ctx.fillStyle = PAL['mass-ink']; ctx.font = 'bold 16px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('m', smCx, massY); ctx.textBaseline = 'alphabetic';

  var cur = ((th % WIN) + WIN) % WIN;
  var cx = plotL + cur / WIN * plotW;
  rows.forEach(function(r){
    var ym = (r.y0 + r.y1) / 2, halfH = (r.y1 - r.y0) / 2 - 12;
    ctx.fillStyle = PAL[r.col]; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'left';
    ctx.fillText(r.name, plotL, r.lab);
    ctx.fillStyle = PAL.surface2;
    ctx.fillRect(plotL, r.y0, plotW, r.y1 - r.y0);
    ctx.strokeStyle = PAL.border; ctx.lineWidth = 1;
    ctx.strokeRect(plotL, r.y0, plotW, r.y1 - r.y0);
    ctx.strokeStyle = PAL.border2;
    ctx.beginPath(); ctx.moveTo(plotL, ym); ctx.lineTo(plotR, ym); ctx.stroke();
    ctx.strokeStyle = PAL[r.col]; ctx.lineWidth = 2.5; ctx.beginPath();
    for (var i = 0; i <= 240; i++){
      var u = i / 240 * WIN, X = plotL + i / 240 * plotW, Y = ym - r.f(u) * halfH;
      if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
    }
    ctx.stroke();
    ctx.strokeStyle = PAL.float; ctx.lineWidth = 1.4; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(cx, r.y0 + 2); ctx.lineTo(cx, r.y1 - 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = PAL.float;
    ctx.beginPath(); ctx.arc(cx, ym - r.f(cur) * halfH, 5, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = PAL.faint; ctx.font = '12px ' + FONT; ctx.textAlign = 'center';
  ['0', 'T/2', 'T', '3T/2', '2T'].forEach(function(lab, k){
    ctx.fillText(lab, plotL + k / 4 * plotW, 538);
  });
}

$('A').addEventListener('input', function(){
  st.A = parseFloat(this.value); $('Av').textContent = st.A.toFixed(1); draw();
});
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.A = 10; st.th = 0; st.running = true;
  $('A').value = 10; $('Av').textContent = '10.0';
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  draw();
});
var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running) st.th += dt * WN;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
