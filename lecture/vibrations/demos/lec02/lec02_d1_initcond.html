<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L2-D1 · 초기조건 → 진폭·위상</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
  --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 2강</p>
  <h1>초기조건 → 진폭·위상</h1>
  <p class="lede">x₀와 v₀가 진폭 <b>A</b>와 위상 <b>φ</b>를 정합니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">초기 변위 x₀ <span class="big-val" id="x0v">+2.0</span> mm</p>
        <input type="range" id="x0" min="-3" max="3" step="0.1" value="2">
      </div>
      <div>
        <p class="ctrl-title">초기 속도 v₀ <span class="big-val" id="v0v">+1.0</span> mm/s</p>
        <input type="range" id="v0" min="-30" max="30" step="0.5" value="1">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="500"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>x(t) = A sin(ωₙt + φ)</span>
      <span><i style="background:var(--high);height:0;border-top:2px dashed var(--high);width:16px"></i>±A</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 2강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var WN = 10;
var X0MAX = 3, V0MAX = 30;
var AMAX = Math.hypot(WN * X0MAX, V0MAX) / WN;
var TIME_SCALE = 0.5;
var st = { x0: 2, v0: 1, t: 0, running: true };
var Twin = 2;

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['bg','surface','surface2','border','border2','text','muted','faint',
   'accent','high','low','float','ok','plot-bg','grid','mass','mass-ink','spring','wall'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function calc(){
  var A = Math.hypot(WN * st.x0, st.v0) / WN;
  var phi = A < 1e-9 ? 0 : Math.atan2(WN * st.x0, st.v0);
  return { A: A, phi: phi };
}
function sgn(v){ return Math.abs(v) < 1e-9 ? '0' : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(1); }
function setPlayBtn(){
  $('play').textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  $('play').classList.toggle('btn-acc', st.running);
}
function arrow(x1, y1, x2, y2, color, lw){
  var dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  if (L < 6) return;
  var ux = dx / L, uy = dy / L, hs = Math.min(9, L * 0.5);
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hs * ux - hs * 0.45 * uy, y2 - hs * uy + hs * 0.45 * ux);
  ctx.lineTo(x2 - hs * ux + hs * 0.45 * uy, y2 - hs * uy - hs * 0.45 * ux);
  ctx.closePath(); ctx.fill();
}
function drawSpringV(cx, y0, y1){
  ctx.strokeStyle = PAL.spring; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(cx, y0);
  var c = 6, seg = (y1 - y0) / (c * 2);
  for (var i = 0; i < c * 2; i++) ctx.lineTo(cx + (i % 2 === 0 ? -11 : 11), y0 + seg * (i + 0.5));
  ctx.lineTo(cx, y1); ctx.stroke();
}

var PNL_X = 18, PNL_Y = 18, PNL_W = 200, PNL_H = 464;
var CEIL_Y = 48, CX = 118, EQY = 230, MS = 44;
var AMP = 34;
var plotL = 268, plotR = 876, plotTop = 70, plotBot = 452;
var plotW = plotR - plotL, midY = (plotTop + plotBot) / 2, half = 135;
var YS = half * 0.88 / AMAX;

function draw(){
  var c = calc(), xNow = c.A * Math.sin(WN * st.t + c.phi);
  var vNow = c.A * WN * Math.cos(WN * st.t + c.phi);
  var tc = Math.min(st.t, Twin);
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(PNL_X, PNL_Y, PNL_W, PNL_H);
  ctx.strokeStyle = PAL.border; ctx.lineWidth = 1;
  ctx.strokeRect(PNL_X, PNL_Y, PNL_W, PNL_H);
  ctx.fillStyle = PAL.wall;
  ctx.fillRect(PNL_X + 12, CEIL_Y, PNL_W - 24, 9);
  ctx.strokeStyle = PAL.grid; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(PNL_X + 10, EQY); ctx.lineTo(PNL_X + PNL_W - 10, EQY); ctx.stroke();
  ctx.setLineDash([]);
  var my = EQY - xNow * AMP;
  drawSpringV(CX, CEIL_Y + 9, my - MS / 2);
  ctx.fillStyle = PAL.mass; ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2;
  ctx.fillRect(CX - MS / 2, my - MS / 2, MS, MS);
  ctx.strokeRect(CX - MS / 2, my - MS / 2, MS, MS);
  ctx.fillStyle = PAL['mass-ink']; ctx.font = 'bold 16px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('m', CX, my); ctx.textBaseline = 'alphabetic';
  var ax = CX + 16;
  var vLen = (vNow / (AMAX * WN)) * 36;
  if (Math.abs(vLen) < 5) vLen = vLen < 0 ? -5 : 5;
  arrow(ax, my, ax, my - vLen, PAL.high, 2.4);

  ctx.fillStyle = PAL.text; ctx.font = 'bold 15px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('x(t) = A sin(ωₙt + φ)', plotL, 28);
  ctx.fillStyle = PAL.accent; ctx.font = '13px Consolas, monospace';
  ctx.fillText('A = ' + c.A.toFixed(3) + ' mm,   φ = ' + c.phi.toFixed(3) + ' rad  (' + (c.phi * 180 / Math.PI).toFixed(1) + '°)', plotL, 50);

  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(plotL, plotTop); ctx.lineTo(plotL, plotBot); ctx.lineTo(plotR, plotBot); ctx.stroke();
  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(plotL, midY); ctx.lineTo(plotR, midY); ctx.stroke();

  ctx.font = '12px ' + FONT; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  var ticks = [4, 2, 0, -2, -4], ti;
  for (ti = 0; ti < ticks.length; ti++){
    var yk = midY - ticks[ti] * YS;
    ctx.strokeStyle = PAL.grid; ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(plotL, yk); ctx.lineTo(plotR, yk); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = PAL.faint;
    ctx.fillText(ticks[ti].toFixed(0), plotL - 8, yk);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = PAL.faint; ctx.font = '11.5px ' + FONT;
  ctx.fillText('mm', plotL - 28, plotTop + 8);
  for (var s = 0; s <= Twin; s++){
    var px = plotL + (s / Twin) * plotW;
    ctx.strokeStyle = PAL.grid; ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(px, plotTop); ctx.lineTo(px, plotBot); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = PAL.faint; ctx.fillText(s + ' s', px, plotBot + 20);
  }

  ctx.strokeStyle = PAL.high; ctx.lineWidth = 1.4; ctx.setLineDash([5, 4]);
  var yA = midY - c.A * YS, yAm = midY + c.A * YS;
  ctx.beginPath(); ctx.moveTo(plotL, yA); ctx.lineTo(plotR, yA); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(plotL, yAm); ctx.lineTo(plotR, yAm); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = PAL.high; ctx.font = '12px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('+A', plotR - 28, yA - 6);
  ctx.fillText('−A', plotR - 28, yAm + 14);

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.6; ctx.beginPath();
  for (var pc = 0; pc <= plotW; pc++){
    var tt = (pc / plotW) * Twin, yc = midY - c.A * Math.sin(WN * tt + c.phi) * YS;
    if (pc) ctx.lineTo(plotL + pc, yc); else ctx.moveTo(plotL + pc, yc);
  }
  ctx.stroke();

  ctx.strokeStyle = PAL.float; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
  var cx = plotL + (tc / Twin) * plotW;
  ctx.beginPath(); ctx.moveTo(cx, plotTop); ctx.lineTo(cx, plotBot); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = PAL.float;
  ctx.beginPath(); ctx.arc(cx, midY - xNow * YS, 6, 0, Math.PI * 2); ctx.fill();
}

function syncSpans(){
  $('x0v').textContent = sgn(st.x0);
  $('v0v').textContent = sgn(st.v0);
  $('x0').value = st.x0; $('v0').value = st.v0;
}
$('x0').addEventListener('input', function(){ st.x0 = parseFloat(this.value); st.t = 0; syncSpans(); draw(); });
$('v0').addEventListener('input', function(){ st.v0 = parseFloat(this.value); st.t = 0; syncSpans(); draw(); });
$('play').addEventListener('click', function(){
  if (!st.running && st.t >= Twin - 1e-6) st.t = 0;
  st.running = !st.running;
  setPlayBtn();
});
$('reset').addEventListener('click', function(){
  st.x0 = 2; st.v0 = 1; st.t = 0; st.running = true;
  setPlayBtn();
  syncSpans(); draw();
});
var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running){
    st.t += dt * TIME_SCALE;
    if (st.t >= Twin){
      st.t = Twin;
      st.running = false;
      setPlayBtn();
    }
  }
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
