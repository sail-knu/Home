<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L2-D4 · atan 사분면 함정</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 2강</p>
  <h1>atan 사분면 함정</h1>
  <p class="lede">계산기 tan⁻¹은 2·3사분면에서 틀립니다. <b>atan2</b>를 쓰세요.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">초기 변위 x₀ <span class="big-val" id="x0v">+2.0</span> mm</p>
        <input type="range" id="x0" min="-3" max="3" step="0.1" value="2">
      </div>
      <div>
        <p class="ctrl-title">초기 속도 v₀ <span class="big-val" id="v0v">−1.0</span> mm/s</p>
        <input type="range" id="v0" min="-30" max="30" step="0.5" value="-1">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="500"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>진짜 φ (atan2)</span>
      <span><i style="background:var(--bad)"></i>계산기 tan⁻¹</span>
      <span><i style="background:var(--low)"></i>cos φ ∝ v₀</span>
      <span><i style="background:var(--high)"></i>sin φ ∝ x₀</span>
    </div>
    <div class="btn-row">
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 2강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var WN = 10, EPS = 1e-9;
var st = { x0: 2, v0: -1 };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','accent-soft',
   'high','low','ok','bad'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function calc(){
  var x0 = st.x0, v0 = st.v0;
  var A = Math.hypot(WN * x0, v0) / WN;
  var phi = A < EPS ? 0 : Math.atan2(WN * x0, v0);
  var naive;
  if (Math.abs(v0) < EPS) naive = (Math.abs(x0) < EPS) ? 0 : (x0 > 0 ? 1 : -1) * Math.PI / 2;
  else naive = Math.atan(WN * x0 / v0);
  var qIdx = 0, quad = '경계';
  if (A >= EPS){
    if (x0 > 0 && v0 > 0) { qIdx = 1; quad = '1사분면'; }
    else if (x0 > 0 && v0 < 0) { qIdx = 2; quad = '2사분면'; }
    else if (x0 < 0 && v0 < 0) { qIdx = 3; quad = '3사분면'; }
    else if (x0 < 0 && v0 > 0) { qIdx = 4; quad = '4사분면'; }
  }
  return { A: A, phi: phi, naive: naive, qIdx: qIdx, quad: quad, wrong: A >= EPS && Math.abs(phi - naive) > 1e-6 };
}
function sgn(v){ return Math.abs(v) < EPS ? '0' : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(1); }
function arrow(x1, y1, x2, y2, color, lw){
  var dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  if (L < 6) return;
  var ux = dx / L, uy = dy / L, hs = 11;
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hs * ux - hs * 0.45 * uy, y2 - hs * uy + hs * 0.45 * ux);
  ctx.lineTo(x2 - hs * ux + hs * 0.45 * uy, y2 - hs * uy - hs * 0.45 * ux);
  ctx.closePath(); ctx.fill();
}

function draw(){
  var c = calc(), x0 = st.x0, v0 = st.v0;
  ctx.clearRect(0, 0, W, H);
  var cx = 360, cy = 268, half = 168;
  var qRects = { 1:[cx, cy - half], 2:[cx - half, cy - half], 3:[cx - half, cy], 4:[cx, cy] };
  for (var q = 1; q <= 4; q++){
    ctx.fillStyle = (q === c.qIdx) ? PAL['accent-soft'] : PAL.surface2;
    ctx.fillRect(qRects[q][0], qRects[q][1], half, half);
  }
  ctx.strokeStyle = PAL.border; ctx.lineWidth = 1;
  ctx.strokeRect(cx - half, cy - half, half * 2, half * 2);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(cx - half, cy); ctx.lineTo(cx + half, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - half); ctx.lineTo(cx, cy + half); ctx.stroke();

  ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT;
  ctx.textAlign = 'right'; ctx.fillText('cos φ ∝ v₀', cx + half - 8, cy - 10);
  ctx.textAlign = 'left'; ctx.fillText('sin φ ∝ x₀', cx + 8, cy - half + 18);
  ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'center';
  var qLab = { 1:[cx + half - 18, cy - half + 22], 2:[cx - half + 18, cy - half + 22],
               3:[cx - half + 18, cy + half - 10], 4:[cx + half - 18, cy + half - 10] };
  for (var q2 = 1; q2 <= 4; q2++){
    ctx.fillStyle = (q2 === c.qIdx) ? PAL.accent : PAL.faint;
    ctx.fillText(String(q2), qLab[q2][0], qLab[q2][1]);
  }

  var s = (half - 28) / Math.max(c.A, 1.2);
  var hx = (v0 / WN) * s, vy = x0 * s;
  if (c.A >= EPS){
    if (c.wrong){
      ctx.strokeStyle = PAL.bad; ctx.setLineDash([6, 5]); ctx.lineWidth = 2.6;
      var nl = half * 0.72;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + nl * Math.cos(c.naive), cy - nl * Math.sin(c.naive)); ctx.stroke();
      ctx.setLineDash([]);
    }
    arrow(cx, cy, cx + hx, cy, PAL.low, 2.6);
    arrow(cx + hx, cy, cx + hx, cy - vy, PAL.high, 2.6);
    arrow(cx, cy, cx + hx, cy - vy, PAL.accent, 3.4);
    ctx.fillStyle = PAL.accent; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
    ctx.fillText('A', cx + hx * 0.55 + 8, cy - vy * 0.55);
  }

  ctx.textAlign = 'left';
  var tx = 580, ty = 120;
  ctx.fillStyle = PAL.text; ctx.font = 'bold 18px ' + FONT;
  ctx.fillText(c.quad, tx, ty); ty += 36;
  ctx.font = '15px Consolas, monospace';
  ctx.fillStyle = PAL.ok; ctx.fillText('atan2  φ = ' + c.phi.toFixed(3) + ' rad', tx, ty); ty += 26;
  ctx.fillStyle = c.wrong ? PAL.bad : PAL.muted;
  ctx.fillText('tan⁻¹   = ' + c.naive.toFixed(3) + ' rad', tx, ty); ty += 36;
  ctx.font = '15px ' + FONT;
  ctx.fillStyle = c.wrong ? PAL.bad : PAL.ok;
  ctx.fillText(c.wrong ? 'π를 더해야 합니다' : '계산기 값을 그대로 사용', tx, ty);

  ctx.fillStyle = PAL.text; ctx.font = 'bold 15px ' + FONT;
  ctx.fillText('페이저 (v₀/ωₙ , x₀)', 28, 36);
}

function sync(){
  $('x0v').textContent = sgn(st.x0);
  $('v0v').textContent = sgn(st.v0);
  $('x0').value = st.x0; $('v0').value = st.v0;
  draw();
}
$('x0').addEventListener('input', function(){ st.x0 = parseFloat(this.value); sync(); });
$('v0').addEventListener('input', function(){ st.v0 = parseFloat(this.value); sync(); });
$('reset').addEventListener('click', function(){ st.x0 = 2; st.v0 = -1; sync(); });
sync();
})();
</script>
</body>
</html>
