<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L4-D3 · 허용 변위 설계</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 4강</p>
  <h1>허용 변위 설계</h1>
  <p class="lede">첫 피크 x(Tₘ)를 허용선 아래로 넣으세요.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">감쇠비 ζ <span class="big-val" id="zVal">0.100</span></p>
        <input type="range" id="zSl" min="0.01" max="0.99" step="0.001" value="0.1">
      </div>
      <div>
        <p class="ctrl-title">강성 k <span class="big-val" id="kVal">200</span> N/m</p>
        <input type="range" id="kSl" min="100" max="800" step="5" value="200">
      </div>
      <div>
        <p class="ctrl-title">질량 m <span class="big-val" id="mVal">3.0</span> kg</p>
        <input type="range" id="mSl" min="1" max="5" step="0.1" value="3">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="420"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>응답 x(t)</span>
      <span><i style="background:var(--bad)"></i>허용 한계 ±lim</span>
      <span><i style="background:var(--ok)"></i>첫 봉우리 x(Tₘ)</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 4강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var DEF = { m: 3, k: 200, z: 0.1, v0: 300, lim: 25 };
var p = { m: DEF.m, k: DEF.k, z: DEF.z, v0: DEF.v0, lim: DEF.lim };
var tAnim = 0, running = true;
var EPS = 1e-6;

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','float','ok','bad','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function clampZ(z){ return Math.min(0.995, Math.max(EPS, z)); }
function derived(){
  var z = clampZ(p.z);
  var wn = Math.sqrt(p.k / Math.max(p.m, EPS));
  var s = Math.sqrt(Math.max(1 - z * z, EPS * EPS));
  var wd = wn * s;
  var v0 = p.v0 / 1000;
  var Tm = Math.atan2(wd, z * wn) / Math.max(wd, EPS);
  var xmax = (v0 / wn) * Math.exp(-(z / s) * Math.atan2(s, z));
  var c = 2 * p.m * wn * z;
  return { z:z, wn:wn, wd:wd, Tm:Tm, xmax:xmax, c:c, v0:v0 };
}
function xOfT(t, d){
  return (d.v0 / d.wd) * Math.exp(-d.z * d.wn * t) * Math.sin(d.wd * t);
}
function timeSpan(d){
  var Tp = 2 * Math.PI / Math.max(d.wd, EPS);
  return Math.min(12, Math.max(3 * Tp, 5 / Math.max(d.z * d.wn, 0.45)));
}

var PL = 74, PR = W - 26, PT = 56, PB = H - 40;
var PW = PR - PL, PH = PB - PT;

function niceStep(raw){
  var p10 = Math.pow(10, Math.floor(Math.log10(Math.max(raw, EPS))));
  var cand = [1, 2, 2.5, 5, 10];
  for (var i = 0; i < cand.length; i++) if (cand[i] * p10 >= raw) return cand[i] * p10;
  return 10 * p10;
}
function tickDec(step){
  for (var d = 0; d <= 3; d++){
    var s = step * Math.pow(10, d);
    if (Math.abs(s - Math.round(s)) < 1e-9) return d;
  }
  return 3;
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  var d = derived();
  var Tend = timeSpan(d);
  var xmaxMM = d.xmax * 1000;
  var yMax = Math.max(xmaxMM, p.lim) * 1.3;
  var tx = function(t){ return PL + (t / Tend) * PW; };
  var ty = function(mm){ return PT + PH / 2 - (mm / yMax) * (PH / 2); };
  var ok = xmaxMM <= p.lim * 1.005;
  var keyCol = ok ? PAL.ok : PAL.bad;

  var gs = niceStep(yMax / 3), gsD = tickDec(gs), mm, sgn, y;
  ctx.font = '12.5px ' + FONT; ctx.textAlign = 'right';
  for (mm = 0; mm <= yMax; mm += gs){
    var signs = (mm === 0) ? [1] : [1, -1];
    for (var si = 0; si < signs.length; si++){
      sgn = signs[si]; y = ty(sgn * mm);
      ctx.strokeStyle = (mm === 0) ? PAL.border2 : PAL.grid;
      ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(PL, y); ctx.lineTo(PR, y); ctx.stroke();
      ctx.fillStyle = PAL.faint; ctx.fillText((sgn * mm).toFixed(gsD), PL - 9, y + 4);
    }
  }
  var ts = niceStep(Tend / 5), tsD = tickDec(ts);
  ctx.textAlign = 'center';
  for (var t = 0; t <= Tend + EPS; t += ts){
    var xg = tx(t);
    ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(xg, PT); ctx.lineTo(xg, PB); ctx.stroke();
    ctx.fillStyle = PAL.faint; ctx.fillText(t.toFixed(tsD), xg, PB + 18);
  }
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.strokeRect(PL, PT, PW, PH);

  ctx.textAlign = 'left';
  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT;
  ctx.fillText('x(t) [mm] = (v₀/ω_d)·e^(−ζωₙt)·sin(ω_d t)', PL, 28);
  ctx.textAlign = 'right'; ctx.font = '13px ' + FONT; ctx.fillStyle = PAL.muted;
  ctx.fillText('v₀ = ' + p.v0 + ' mm/s   lim = ±' + p.lim + ' mm', PR, 28);

  ctx.strokeStyle = PAL.bad; ctx.lineWidth = 2; ctx.setLineDash([7, 5]);
  [1, -1].forEach(function(sg){
    var yy = ty(sg * p.lim);
    ctx.beginPath(); ctx.moveTo(PL, yy); ctx.lineTo(PR, yy); ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.fillStyle = PAL.bad; ctx.textAlign = 'right'; ctx.font = 'bold 13px ' + FONT;
  ctx.fillText('+' + p.lim + ' mm', PR - 8, ty(p.lim) - 7);
  ctx.fillText('−' + p.lim + ' mm', PR - 8, ty(-p.lim) + 17);

  var N = 800, i2, tt2;
  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.32; ctx.beginPath();
  for (i2 = 0; i2 <= N; i2++){
    tt2 = Tend * i2 / N;
    if (i2) ctx.lineTo(tx(tt2), ty(xOfT(tt2, d) * 1000)); else ctx.moveTo(tx(tt2), ty(xOfT(tt2, d) * 1000));
  }
  ctx.stroke(); ctx.globalAlpha = 1;

  var tCur = Math.min(tAnim, Tend);
  var nCur = Math.max(2, Math.floor(N * tCur / Tend));
  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.8; ctx.beginPath();
  for (i2 = 0; i2 <= nCur; i2++){
    tt2 = Tend * i2 / N;
    if (i2) ctx.lineTo(tx(tt2), ty(xOfT(tt2, d) * 1000)); else ctx.moveTo(tx(tt2), ty(xOfT(tt2, d) * 1000));
  }
  ctx.stroke();
  ctx.fillStyle = PAL.text;
  ctx.beginPath(); ctx.arc(tx(tCur), ty(xOfT(tCur, d) * 1000), 5.5, 0, 2 * Math.PI); ctx.fill();

  var px = tx(d.Tm), py = ty(xmaxMM);
  ctx.strokeStyle = keyCol; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, ty(0)); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = keyCol;
  ctx.beginPath(); ctx.arc(px, py, 6.5, 0, 2 * Math.PI); ctx.fill();
  var labX = Math.min(px + 13, PR - 200), labY = Math.max(py - 28, PT + 16);
  ctx.font = 'bold 14px ' + FONT; ctx.textAlign = 'left';
  ctx.fillStyle = keyCol;
  ctx.fillText('x(Tₘ) = ' + xmaxMM.toFixed(1) + ' mm', labX, labY);
  ctx.fillStyle = PAL.muted; ctx.font = '12.5px ' + FONT;
  ctx.fillText('Tₘ = ' + d.Tm.toFixed(3) + ' s', labX, labY + 18);
}

function syncSpans(){
  $('zSl').value = p.z; $('zVal').textContent = p.z.toFixed(3);
  $('kSl').value = p.k; $('kVal').textContent = p.k.toFixed(0);
  $('mSl').value = p.m; $('mVal').textContent = p.m.toFixed(1);
}
$('zSl').addEventListener('input', function(){ p.z = parseFloat(this.value); $('zVal').textContent = p.z.toFixed(3); draw(); });
$('kSl').addEventListener('input', function(){ p.k = parseFloat(this.value); $('kVal').textContent = p.k.toFixed(0); draw(); });
$('mSl').addEventListener('input', function(){ p.m = parseFloat(this.value); $('mVal').textContent = p.m.toFixed(1); draw(); });
$('play').addEventListener('click', function(){
  running = !running;
  this.textContent = running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', running);
});
$('reset').addEventListener('click', function(){
  p.m = DEF.m; p.k = DEF.k; p.z = DEF.z; p.v0 = DEF.v0; p.lim = DEF.lim;
  tAnim = 0; running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncSpans(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (running){
    var Tend = timeSpan(derived());
    tAnim += dt * Tend / 5;
    if (tAnim > Tend * 1.12) tAnim = 0;
  }
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
