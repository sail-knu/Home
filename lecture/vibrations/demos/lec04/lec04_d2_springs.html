<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L5-D2 · 직렬 vs 병렬 등가강성</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 5강</p>
  <h1>직렬 vs 병렬 등가강성</h1>
  <p class="lede">같은 두 스프링도 연결에 따라 k_eq가 달라집니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">강성 k₁ <span class="big-val" id="k1v">1000</span> N/m</p>
        <input type="range" id="k1" min="100" max="3000" step="50" value="1000">
      </div>
      <div>
        <p class="ctrl-title">강성 k₂ <span class="big-val" id="k2v">3000</span> N/m</p>
        <input type="range" id="k2" min="100" max="3000" step="50" value="3000">
      </div>
      <div>
        <p class="ctrl-title">연결</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm" id="modeSeries">직렬</button>
          <button class="btn btn-sm btn-acc" id="modeParallel">병렬</button>
        </div>
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="420"></canvas>
    <div class="legend">
      <span><i style="background:var(--low)"></i>스프링 k₁</span>
      <span><i style="background:var(--high)"></i>스프링 k₂</span>
      <span><i style="background:var(--accent)"></i>등가강성 kₑq</span>
    </div>
    <div class="btn-row">
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 5강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var st = { k1: 1000, k2: 3000, mode: 'parallel' };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','surface3','border','border2','text','muted','faint',
   'accent','high','low','float','ok','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function keq(){
  if (st.mode === 'parallel') return st.k1 + st.k2;
  var den = Math.max(st.k1 + st.k2, 1e-6);
  return st.k1 * st.k2 / den;
}
function fmtK(v){ return v >= 1000 ? v.toFixed(0) : v.toFixed(v % 1 ? 1 : 0); }

function drawSpring(x1, y, x2, coils, amp, color, lw){
  ctx.strokeStyle = color; ctx.lineWidth = lw || 2.4;
  ctx.beginPath(); ctx.moveTo(x1, y);
  var len = x2 - x1, seg = len / (coils * 2);
  for (var i = 0; i < coils * 2; i++){
    var px = x1 + seg * (i + 0.5);
    ctx.lineTo(px, y + (i % 2 === 0 ? -amp : amp));
  }
  ctx.lineTo(x2, y); ctx.stroke();
}
function drawWall(x, yc, h){
  ctx.fillStyle = PAL.border2; ctx.fillRect(x - 10, yc - h / 2, 10, h);
  ctx.strokeStyle = PAL.faint; ctx.lineWidth = 1;
  for (var i = 0; i <= Math.floor(h / 14); i++){
    ctx.beginPath(); ctx.moveTo(x - 10, yc - h / 2 + i * 14); ctx.lineTo(x, yc - h / 2 - 10 + i * 14); ctx.stroke();
  }
}
function drawMass(xLeft, yc, s, label){
  ctx.fillStyle = PAL.surface3; ctx.strokeStyle = PAL.border2; ctx.lineWidth = 2;
  ctx.fillRect(xLeft, yc - s / 2, s, s); ctx.strokeRect(xLeft, yc - s / 2, s, s);
  ctx.fillStyle = PAL.text; ctx.font = 'bold 15px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, xLeft + s / 2, yc); ctx.textBaseline = 'alphabetic';
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  var k1 = st.k1, k2 = st.k2, den = Math.max(k1 + k2, 1e-6), ke = keq();

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText(st.mode === 'series' ? '직렬 — 힘 공유' : '병렬 — 변위 공유', 24, 32);
  ctx.fillStyle = PAL.accent; ctx.font = '14px Consolas, monospace'; ctx.textAlign = 'right';
  ctx.fillText('kₑq = ' + fmtK(ke) + ' N/m', W - 24, 32);

  var wallX = 90, yc = 150, massL = 620, massS = 64;
  var bx = 90, bw = 720, bh = 28, BY = 300;
  drawWall(wallX, yc, 120);

  if (st.mode === 'series'){
    var nodeX = wallX + (massL - wallX) * 0.5;
    drawSpring(wallX, yc, nodeX - 6, 8, 14, PAL.low, 2.8);
    drawSpring(nodeX + 6, yc, massL, 8, 14, PAL.high, 2.8);
    ctx.fillStyle = PAL.text; ctx.beginPath(); ctx.arc(nodeX, yc, 5.5, 0, 6.2832); ctx.fill();
    ctx.font = 'bold 14px ' + FONT; ctx.textAlign = 'center';
    ctx.fillStyle = PAL.low;  ctx.fillText('k₁', (wallX + nodeX) / 2, yc - 28);
    ctx.fillStyle = PAL.high; ctx.fillText('k₂', (nodeX + massL) / 2, yc - 28);
    drawMass(massL, yc, massS, 'm');
    ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT; ctx.textAlign = 'left';
    ctx.fillText('같은 힘 F가 두 스프링을 통과 (힘 공유)', bx, yc + 86);

    var f1 = k2 / den;
    ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT;
    ctx.fillText('변형 나눠 갖기 — 무른 쪽이 더 많이 늘어남', bx, BY - 10);
    ctx.fillStyle = PAL.low;  ctx.fillRect(bx, BY, bw * f1, bh);
    ctx.fillStyle = PAL.high; ctx.fillRect(bx + bw * f1, BY, bw * (1 - f1), bh);
    ctx.strokeStyle = PAL.border; ctx.lineWidth = 1; ctx.strokeRect(bx + 0.5, BY + 0.5, bw - 1, bh - 1);
    ctx.font = '13px ' + FONT;
    ctx.fillStyle = PAL.low;  ctx.textAlign = 'left';
    ctx.fillText('x₁ = F/k₁ · ' + (f1 * 100).toFixed(0) + '%', bx, BY + 48);
    ctx.fillStyle = PAL.high; ctx.textAlign = 'right';
    ctx.fillText('x₂ = F/k₂ · ' + ((1 - f1) * 100).toFixed(0) + '%', bx + bw, BY + 48);
    ctx.textAlign = 'left';
    ctx.fillStyle = PAL.accent; ctx.font = 'bold 16px ' + FONT;
    ctx.fillText('kₑq = k₁k₂/(k₁+k₂) = ' + fmtK(ke) + ' N/m', bx, BY + 80);
    ctx.fillStyle = PAL.high; ctx.font = '13px ' + FONT;
    ctx.fillText('약한 쪽 ' + fmtK(Math.min(k1, k2)) + ' N/m 보다도 더 무르다', bx, BY + 104);
  } else {
    var plateX = massL - 6;
    ctx.strokeStyle = PAL.border2; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(plateX, yc - 56); ctx.lineTo(plateX, yc + 56); ctx.stroke();
    drawSpring(wallX, yc - 32, plateX, 10, 12, PAL.low, 2.8);
    drawSpring(wallX, yc + 32, plateX, 10, 12, PAL.high, 2.8);
    ctx.font = 'bold 14px ' + FONT; ctx.textAlign = 'center';
    ctx.fillStyle = PAL.low;  ctx.fillText('k₁', (wallX + plateX) / 2, yc - 52);
    ctx.fillStyle = PAL.high; ctx.fillText('k₂', (wallX + plateX) / 2, yc + 62);
    drawMass(massL, yc, massS, 'm');
    ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT; ctx.textAlign = 'left';
    ctx.fillText('두 스프링이 같은 변위 x를 공유 (변위 공유)', bx, yc + 90);

    var g1 = k1 / den;
    ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT;
    ctx.fillText('힘 나눠 갖기 — 단단한 쪽이 더 많은 힘 부담', bx, BY - 10);
    ctx.fillStyle = PAL.low;  ctx.fillRect(bx, BY, bw * g1, bh);
    ctx.fillStyle = PAL.high; ctx.fillRect(bx + bw * g1, BY, bw * (1 - g1), bh);
    ctx.strokeStyle = PAL.border; ctx.lineWidth = 1; ctx.strokeRect(bx + 0.5, BY + 0.5, bw - 1, bh - 1);
    ctx.font = '13px ' + FONT;
    ctx.fillStyle = PAL.low;  ctx.textAlign = 'left';
    ctx.fillText('F₁ = k₁x · ' + (g1 * 100).toFixed(0) + '%', bx, BY + 48);
    ctx.fillStyle = PAL.high; ctx.textAlign = 'right';
    ctx.fillText('F₂ = k₂x · ' + ((1 - g1) * 100).toFixed(0) + '%', bx + bw, BY + 48);
    ctx.textAlign = 'left';
    ctx.fillStyle = PAL.accent; ctx.font = 'bold 16px ' + FONT;
    ctx.fillText('kₑq = k₁ + k₂ = ' + fmtK(ke) + ' N/m', bx, BY + 80);
    ctx.fillStyle = PAL.ok; ctx.font = '13px ' + FONT;
    ctx.fillText('단순 합 — 항상 더 단단해진다', bx, BY + 104);
  }
}

function syncSpans(){
  $('k1v').textContent = st.k1.toFixed(0);
  $('k2v').textContent = st.k2.toFixed(0);
  $('k1').value = st.k1; $('k2').value = st.k2;
  $('modeSeries').classList.toggle('btn-acc', st.mode === 'series');
  $('modeParallel').classList.toggle('btn-acc', st.mode === 'parallel');
}
$('k1').addEventListener('input', function(){ st.k1 = parseFloat(this.value); syncSpans(); draw(); });
$('k2').addEventListener('input', function(){ st.k2 = parseFloat(this.value); syncSpans(); draw(); });
$('modeSeries').addEventListener('click', function(){ st.mode = 'series'; syncSpans(); draw(); });
$('modeParallel').addEventListener('click', function(){ st.mode = 'parallel'; syncSpans(); draw(); });
$('reset').addEventListener('click', function(){
  st.k1 = 1000; st.k2 = 3000; st.mode = 'parallel';
  syncSpans(); draw();
});
syncSpans();
draw();
})();
</script>
</body>
</html>
