<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L4-D1 · 실제 부품 강성</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 4강</p>
  <h1>실제 부품 강성</h1>
  <p class="lede">길이·단면이 k와 ωₙ을 정합니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">부품</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm btn-acc" id="b_rod">봉</button>
          <button class="btn btn-sm" id="b_shaft">축</button>
          <button class="btn btn-sm" id="b_beam">보</button>
          <button class="btn btn-sm" id="b_coil">코일</button>
        </div>
      </div>
      <div id="g1">
        <p class="ctrl-title"><span id="n1">길이 l</span> <span class="big-val" id="v1">1.00</span> <span id="u1">m</span></p>
        <input type="range" id="s1">
      </div>
      <div id="g2">
        <p class="ctrl-title"><span id="n2">지름 d</span> <span class="big-val" id="v2">10</span> <span id="u2">mm</span></p>
        <input type="range" id="s2">
      </div>
      <div id="g3">
        <p class="ctrl-title"><span id="n3">—</span> <span class="big-val" id="v3">—</span> <span id="u3"></span></p>
        <input type="range" id="s3">
      </div>
      <div id="gm">
        <p class="ctrl-title"><span id="nm">부착 질량 m</span> <span class="big-val" id="vm">100</span> <span id="um">kg</span></p>
        <input type="range" id="sm">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="420"></canvas>
    <div class="legend">
      <span><i style="background:var(--high)"></i>하중 F · 토크 T</span>
      <span><i style="background:var(--float)"></i>변형 x · δ · θ</span>
      <span><i style="background:var(--accent)"></i>강철 E=2×10¹¹, G=8×10¹⁰</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 4강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface','surface2','surface3','border','border2','text','muted','faint',
   'accent','accent-line','high','low','float','ok','grid'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
var MONO = 'Consolas, "SF Mono", monospace';

var STEEL = { name: '강철', E: 2.0e11, G: 8.0e10 };

function defaults(){
  return {
    rod: {
      name: '봉', formula: 'k = EA/l', matKey: 'E', unitK: 'N/m',
      sliders: [
        { key: 'l', label: '길이 l', unit: 'm',  min: 0.2, max: 3.0, step: 0.05, dec: 2 },
        { key: 'd', label: '지름 d', unit: 'mm', min: 5,   max: 50,  step: 1,    dec: 0 }
      ],
      mass: { label: '부착 질량 m', unit: 'kg', min: 1, max: 1000, step: 1, dec: 0 },
      vals: { l: 1.0, d: 10, m: 100 }
    },
    shaft: {
      name: '축', formula: 'kₜ = GJₚ/l,  Jₚ = πd⁴/32', matKey: 'G', unitK: 'N·m/rad',
      sliders: [
        { key: 'l', label: '길이 l', unit: 'm',  min: 0.2, max: 3.0, step: 0.05, dec: 2 },
        { key: 'd', label: '지름 d', unit: 'mm', min: 10,  max: 100, step: 1,    dec: 0 }
      ],
      mass: { label: '원판 관성모멘트 J', unit: 'kg·m²', min: 0.05, max: 2.0, step: 0.05, dec: 2 },
      vals: { l: 1.0, d: 50, m: 0.5 }
    },
    beam: {
      name: '보', formula: 'k = 3EI/l³,  I = bh³/12', matKey: 'E', unitK: 'N/m',
      sliders: [
        { key: 'l', label: '길이 l',    unit: 'm',  min: 0.2, max: 2.0, step: 0.05, dec: 2 },
        { key: 'b', label: '단면 폭 b',   unit: 'mm', min: 5,   max: 50,  step: 1,    dec: 0 },
        { key: 'h', label: '단면 높이 h', unit: 'mm', min: 5,   max: 50,  step: 1,    dec: 0 }
      ],
      mass: { label: '끝단 질량 m', unit: 'kg', min: 0.5, max: 50, step: 0.5, dec: 1 },
      vals: { l: 0.5, b: 12, h: 10, m: 3 }
    },
    coil: {
      name: '코일', formula: 'k = Gd⁴/(64nR³)', matKey: 'G', unitK: 'N/m',
      sliders: [
        { key: 'd', label: '와이어 지름 d', unit: 'mm', min: 2,  max: 20,  step: 0.5, dec: 1 },
        { key: 'R', label: '코일 반지름 R', unit: 'mm', min: 10, max: 150, step: 5,   dec: 0 },
        { key: 'n', label: '감김 수 n',     unit: '회', min: 2,  max: 20,  step: 0.5, dec: 1 }
      ],
      mass: { label: '부착 질량 m', unit: 'kg', min: 1, max: 100, step: 1, dec: 0 },
      vals: { d: 10, R: 100, n: 12.5, m: 10 }
    }
  };
}

var COMPS = defaults();
var ORDER = ['rod', 'shaft', 'beam', 'coil'];
var cur = 'rod';
var running = true, ph = 0;

function SAFE(v){ return Math.max(v, 1e-9); }
function calcK(id){
  var v = COMPS[id].vals, mat = STEEL;
  if (id === 'rod'){
    var A = Math.PI * Math.pow(v.d / 1000, 2) / 4;
    return { k: mat.E * A / SAFE(v.l), sec: A };
  }
  if (id === 'shaft'){
    var Jp = Math.PI * Math.pow(v.d / 1000, 4) / 32;
    return { k: mat.G * Jp / SAFE(v.l), sec: Jp };
  }
  if (id === 'beam'){
    var I = (v.b / 1000) * Math.pow(v.h / 1000, 3) / 12;
    return { k: 3 * mat.E * I / SAFE(Math.pow(v.l, 3)), sec: I };
  }
  var d4 = Math.pow(v.d / 1000, 4);
  return { k: mat.G * d4 / SAFE(64 * v.n * Math.pow(v.R / 1000, 3)), sec: d4 };
}

var SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
            '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function sup(e){ return String(e).split('').map(function(c){ return SUP[c] || ''; }).join(''); }
function fmtSci(v){
  if (!isFinite(v)) return '—';
  if (v === 0) return '0';
  var e = Math.floor(Math.log10(Math.abs(v)));
  if (e >= -2 && e <= 3) return v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
  return (v / Math.pow(10, e)).toFixed(2) + '×10' + sup(e);
}

function rebuildUI(){
  var c = COMPS[cur];
  for (var i = 0; i < 3; i++){
    var g = $('g' + (i + 1)), s = $('s' + (i + 1)), def = c.sliders[i];
    if (!def){ g.style.display = 'none'; continue; }
    g.style.display = 'block';
    $('n' + (i + 1)).textContent = def.label;
    $('u' + (i + 1)).textContent = def.unit;
    s.min = def.min; s.max = def.max; s.step = def.step;
    s.value = c.vals[def.key];
    $('v' + (i + 1)).textContent = c.vals[def.key].toFixed(def.dec);
  }
  var md = c.mass, sm = $('sm');
  $('nm').textContent = md.label; $('um').textContent = md.unit;
  sm.min = md.min; sm.max = md.max; sm.step = md.step;
  sm.value = c.vals.m;
  $('vm').textContent = c.vals.m.toFixed(md.dec);
  ORDER.forEach(function(id){ $('b_' + id).classList.toggle('btn-acc', id === cur); });
}

function arrow(x1, y1, x2, y2, color, lw){
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw || 2.5;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  var a = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 10 * Math.cos(a - 0.42), y2 - 10 * Math.sin(a - 0.42));
  ctx.lineTo(x2 - 10 * Math.cos(a + 0.42), y2 - 10 * Math.sin(a + 0.42));
  ctx.closePath(); ctx.fill();
}
function wallV(x, y1, y2){
  ctx.fillStyle = PAL.border2; ctx.fillRect(x - 12, y1, 12, y2 - y1);
  ctx.strokeStyle = PAL.faint; ctx.lineWidth = 1.5;
  for (var y = y1; y < y2; y += 14){
    ctx.beginPath(); ctx.moveTo(x - 12, y + 14); ctx.lineTo(x, y); ctx.stroke();
  }
}
function wallH(x1, x2, y){
  ctx.fillStyle = PAL.border2; ctx.fillRect(x1, y - 12, x2 - x1, 12);
  ctx.strokeStyle = PAL.faint; ctx.lineWidth = 1.5;
  for (var x = x1; x < x2; x += 14){
    ctx.beginPath(); ctx.moveTo(x, y - 12); ctx.lineTo(x + 14, y); ctx.stroke();
  }
}
function member(x, y, w, h){
  ctx.fillStyle = PAL.muted; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = PAL.text; ctx.lineWidth = 1.4; ctx.strokeRect(x, y, w, h);
}
function massBox(x, y, s, label){
  ctx.fillStyle = PAL.accent; ctx.strokeStyle = PAL['accent-line']; ctx.lineWidth = 2;
  ctx.fillRect(x - s / 2, y - s / 2, s, s);
  ctx.strokeRect(x - s / 2, y - s / 2, s, s);
  ctx.fillStyle = PAL.surface; ctx.font = 'bold 17px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y); ctx.textBaseline = 'alphabetic';
}
function dashLine(x1, y1, x2, y2){
  ctx.strokeStyle = PAL.border2; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
}
function lenPx(l, lmax){ return 150 + (l - 0.2) / (lmax - 0.2) * 330; }

function drawRod(){
  var v = COMPS.rod.vals, y0 = 212, wx = 95;
  var L = lenPx(v.l, 3.0), th = 8 + v.d * 0.35;
  var dx = 24 * Math.sin(ph);
  wallV(wx, y0 - 92, y0 + 92);
  member(wx, y0 - th / 2, L + dx, th);
  var mx = wx + L + dx + 26;
  massBox(mx, y0, 52, 'm');
  arrow(mx + 40, y0, mx + 94, y0, PAL.high, 2.8);
  ctx.fillStyle = PAL.high; ctx.font = 'bold 14px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('F', mx + 100, y0 + 5);
  var eqx = wx + L + 26;
  dashLine(eqx, y0 - 78, eqx, y0 + 78);
  arrow(eqx, y0 - 62, eqx + (Math.abs(dx) < 0.5 ? 0.5 : dx), y0 - 62, PAL.float, 2.2);
  ctx.fillStyle = PAL.float; ctx.font = '13px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('x(t)', eqx + dx / 2, y0 - 71);
  ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('길이 l = ' + v.l.toFixed(2) + ' m,  지름 d = ' + v.d.toFixed(0) + ' mm',
               wx + L / 2, y0 + 118);
}
function drawShaft(){
  var v = COMPS.shaft.vals, y0 = 212, wx = 95;
  var L = lenPx(v.l, 3.0), th = 6 + v.d * 0.3;
  var th0 = 0.9 * Math.sin(ph);
  wallV(wx, y0 - 92, y0 + 92);
  member(wx, y0 - th / 2, L, th);
  ctx.strokeStyle = PAL.text; ctx.lineWidth = 1;
  ctx.globalAlpha = 0.55;
  for (var i = 1; i <= 4; i++){
    var xx = wx + L * i / 5, tw = th0 * i / 5;
    ctx.beginPath(); ctx.moveTo(xx, y0 - th / 2); ctx.lineTo(xx + tw * 6, y0 + th / 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  var dcx = wx + L + 14, ry = 78, rx = 16;
  ctx.fillStyle = PAL.surface3; ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.ellipse(dcx, y0, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  var mkx = dcx + rx * 0.9 * Math.sin(th0), mky = y0 - ry * 0.9 * Math.cos(th0);
  ctx.strokeStyle = PAL.float; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(dcx, y0); ctx.lineTo(mkx, mky); ctx.stroke();
  ctx.fillStyle = PAL.float; ctx.beginPath(); ctx.arc(mkx, mky, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.font = '13px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('θ(t)', dcx + 24, y0 - ry - 8);
  ctx.fillStyle = PAL.text; ctx.font = 'bold 14px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('원판 J', dcx, y0 + ry + 20);
  ctx.strokeStyle = PAL.high; ctx.lineWidth = 2.8;
  ctx.beginPath(); ctx.arc(dcx + 44, y0, 30, -1.2, 1.2); ctx.stroke();
  var ax = dcx + 44 + 30 * Math.cos(1.2), ay = y0 + 30 * Math.sin(1.2);
  arrow(ax + 3, ay - 3, ax - 4, ay + 4, PAL.high, 2.8);
  ctx.fillStyle = PAL.high; ctx.font = 'bold 14px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('T', dcx + 84, y0 + 5);
  ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('길이 l = ' + v.l.toFixed(2) + ' m,  지름 d = ' + v.d.toFixed(0) + ' mm',
               wx + L / 2, y0 + 118);
}
function drawBeam(){
  var v = COMPS.beam.vals, y0 = 168, wx = 95;
  var L = lenPx(v.l, 2.0), th = Math.max(4, v.h * 0.4);
  var del = 40 * Math.sin(ph);
  wallV(wx, y0 - 84, y0 + 128);
  dashLine(wx, y0, wx + L, y0);
  ctx.strokeStyle = PAL.muted; ctx.lineWidth = th; ctx.lineCap = 'round';
  ctx.beginPath();
  for (var i = 0; i <= 40; i++){
    var s = i / 40, xx = wx + L * s, yy = y0 + del * (3 * s * s - s * s * s) / 2;
    if (i) ctx.lineTo(xx, yy); else ctx.moveTo(xx, yy);
  }
  ctx.stroke(); ctx.lineCap = 'butt';
  var tipY = y0 + del;
  massBox(wx + L + 8, tipY, 46, 'm');
  arrow(wx + L + 8, tipY + 38, wx + L + 8, tipY + 86, PAL.high, 2.8);
  ctx.fillStyle = PAL.high; ctx.font = 'bold 14px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('F', wx + L + 20, tipY + 76);
  var dxm = wx + L - 62;
  arrow(dxm, y0, dxm, Math.abs(del) < 0.5 ? y0 + 0.5 : tipY, PAL.float, 2.2);
  ctx.fillStyle = PAL.float; ctx.font = '13px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('δ(t)', dxm - 7, Math.abs(del) < 26 ? y0 - 12 : (y0 + tipY) / 2 + 5);
  var sbx = wx + 34, sby = 362;
  ctx.strokeStyle = PAL.text; ctx.lineWidth = 1.5;
  ctx.strokeRect(sbx, sby - v.h * 0.9, v.b * 0.9, v.h * 0.9);
  ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('단면 b×h = ' + v.b.toFixed(0) + '×' + v.h.toFixed(0) + ' mm',
               sbx + v.b * 0.9 + 10, sby - v.h * 0.45 + 4);
  ctx.textAlign = 'center';
  ctx.fillText('길이 l = ' + v.l.toFixed(2) + ' m', wx + L / 2, y0 - 66);
}
function drawCoil(){
  var v = COMPS.coil.vals, x0 = 320, yTop = 88, yBase = 282;
  var halfW = Math.min(110, 14 + v.R * 0.6);
  var yMass = yBase + 22 * Math.sin(ph);
  wallH(x0 - halfW - 30, x0 + halfW + 30, yTop);
  var n2 = Math.max(2, Math.round(v.n)), yBot = yMass - 26;
  var segs = n2 * 2, dy = (yBot - yTop - 24) / segs;
  ctx.strokeStyle = PAL.muted;
  ctx.lineWidth = Math.max(2, Math.min(1.5 + v.d * 0.28, Math.abs(dy) * 0.85));
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, yTop);
  ctx.lineTo(x0, yTop + 12);
  for (var i = 0; i < segs; i++){
    ctx.lineTo(x0 + (i % 2 === 0 ? -halfW : halfW), yTop + 12 + dy * (i + 0.5));
  }
  ctx.lineTo(x0, yBot); ctx.stroke();
  ctx.lineJoin = 'miter'; ctx.lineCap = 'butt';
  massBox(x0, yMass, 52, 'm');
  arrow(x0, yMass + 32, x0, yMass + 62, PAL.high, 2.8);
  ctx.fillStyle = PAL.high; ctx.font = 'bold 14px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('F = mg', x0 + 12, yMass + 58);
  dashLine(x0 + halfW + 24, yBase, x0 + halfW + 96, yBase);
  arrow(x0 + halfW + 58, yBase, x0 + halfW + 58, Math.abs(yMass - yBase) < 0.5 ? yBase + 0.5 : yMass,
        PAL.float, 2.2);
  ctx.fillStyle = PAL.float; ctx.font = '13px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('x(t)', x0 + halfW + 66,
               Math.abs(yMass - yBase) < 18 ? yBase - 10 : (yBase + yMass) / 2 + 5);
  ctx.fillStyle = PAL.muted; ctx.font = '13px ' + FONT;
  ctx.fillText('와이어 d = ' + v.d.toFixed(1) + ' mm', x0 + halfW + 24, 138);
  ctx.fillText('코일 반지름 R = ' + v.R.toFixed(0) + ' mm', x0 + halfW + 24, 160);
  ctx.fillText('감김 수 n = ' + v.n.toFixed(1) + ' 회', x0 + halfW + 24, 182);
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  var c = COMPS[cur];
  var r = calcK(cur), k = r.k;
  var m = SAFE(c.vals.m);
  var wn = Math.sqrt(Math.max(k, 0) / m);

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText(c.name + ' — ' + c.formula, 24, 32);
  ctx.fillStyle = PAL.accent; ctx.font = '14px ' + MONO;
  ctx.fillText((cur === 'shaft' ? 'kₜ = ' : 'k = ') + fmtSci(k) + ' ' + c.unitK
    + '    ωₙ = √(' + (cur === 'shaft' ? 'kₜ/J' : 'k/m') + ') = ' + fmtSci(wn) + ' rad/s', 24, 56);
  ctx.fillStyle = PAL.faint; ctx.font = '12.5px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('강철  ' + c.matKey + ' = ' + fmtSci(STEEL[c.matKey]) + ' N/m²', W - 24, 32);

  if (cur === 'rod') drawRod();
  else if (cur === 'shaft') drawShaft();
  else if (cur === 'beam') drawBeam();
  else drawCoil();
}

ORDER.forEach(function(id){
  $('b_' + id).addEventListener('click', function(){ cur = id; rebuildUI(); draw(); });
});
for (var i = 1; i <= 3; i++){
  (function(i){
    $('s' + i).addEventListener('input', function(){
      var def = COMPS[cur].sliders[i - 1];
      if (!def) return;
      COMPS[cur].vals[def.key] = parseFloat(this.value);
      $('v' + i).textContent = COMPS[cur].vals[def.key].toFixed(def.dec);
      draw();
    });
  })(i);
}
$('sm').addEventListener('input', function(){
  COMPS[cur].vals.m = parseFloat(this.value);
  $('vm').textContent = COMPS[cur].vals.m.toFixed(COMPS[cur].mass.dec);
  draw();
});
$('play').addEventListener('click', function(){
  running = !running;
  this.textContent = running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', running);
});
$('reset').addEventListener('click', function(){
  COMPS = defaults(); cur = 'rod'; ph = 0; running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  rebuildUI(); draw();
});

var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  var k = calcK(cur).k;
  var fn = Math.sqrt(Math.max(k, 0) / SAFE(COMPS[cur].vals.m)) / (2 * Math.PI);
  var fDisp = Math.min(2.5, Math.max(0.3, 0.35 * Math.sqrt(isFinite(fn) ? fn : 0)));
  if (running) ph += 2 * Math.PI * fDisp * dt;
  draw();
  requestAnimationFrame(loop);
}
rebuildUI();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
