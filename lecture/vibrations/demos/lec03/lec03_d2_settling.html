<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L3-D2 · Ts = 4/(ζωₙ)</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 3강</p>
  <h1>Ts = 4/(ζωₙ)</h1>
  <p class="lede">ζ나 ωₙ을 <b>2배</b>로 하면 정착시간이 <b>절반</b>이 됩니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">감쇠비 ζ <span class="big-val" id="zv">0.015</span></p>
        <input type="range" id="z" min="0.005" max="1" step="0.005" value="0.015">
      </div>
      <div>
        <p class="ctrl-title">고유진동수 ωₙ <span class="big-val" id="wnv">10.0</span> rad/s</p>
        <input type="range" id="wn" min="1" max="30" step="0.5" value="10">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="420"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>x(t)</span>
      <span><i style="background:var(--high)"></i>포락선</span>
      <span><i style="background:var(--ok)"></i>±2% 밴드</span>
      <span><i style="background:var(--float)"></i>Ts = 4/(ζωₙ)</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 3강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var X0 = 0.010, N = 720;
var st = { z: 0.015, wn: 10, t: 0, running: true };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','ok','float'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function derived(){
  var z = Math.min(st.z, 1 - 1e-6), wn = st.wn;
  var sigma = z * wn;
  var wd = wn * Math.sqrt(Math.max(1 - z * z, 1e-12));
  var A = X0 * Math.sqrt(wd * wd + sigma * sigma) / wd;
  var phi = Math.atan2(wd * X0, sigma * X0);
  return { z: z, wn: wn, sigma: sigma, wd: wd, A: A, phi: phi, Ts: 4 / sigma };
}
function xOf(d, t){ return d.A * Math.exp(-d.sigma * t) * Math.sin(d.wd * t + d.phi); }
function envOf(d, t){ return d.A * Math.exp(-d.sigma * t); }

var L = 64, R = W - 24, T = 52, B = 384;
function xPix(t, Tmax){ return L + t / Tmax * (R - L); }
function yPix(x, peak){ return (T + B) / 2 - x / peak * (B - T) * 0.42; }

function draw(){
  var d = derived(), Tmax = Math.max(d.Ts * 1.45, 1);
  var peak = Math.max(d.A, X0) * 1.05, band = 0.02 * X0, i;
  var tc = Math.min(st.t, Tmax);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(L, T, R - L, B - T);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(L, T); ctx.lineTo(L, B); ctx.lineTo(R, B); ctx.stroke();

  ctx.fillStyle = PAL.ok; ctx.globalAlpha = 0.12;
  ctx.fillRect(L, yPix(band, peak), R - L, yPix(-band, peak) - yPix(band, peak));
  ctx.globalAlpha = 1;
  ctx.strokeStyle = PAL.ok; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(L, yPix(band, peak)); ctx.lineTo(R, yPix(band, peak)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(L, yPix(-band, peak)); ctx.lineTo(R, yPix(-band, peak)); ctx.stroke();

  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('x(t)  [mm]', L, 28);
  ctx.fillStyle = PAL.float; ctx.font = '13px Consolas, monospace'; ctx.textAlign = 'right';
  ctx.fillText('Ts = ' + d.Ts.toFixed(2) + ' s', R, 28);

  ctx.strokeStyle = PAL.high; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
  ctx.beginPath();
  for (i = 0; i <= N; i++){
    var te = i / N * Tmax, X = xPix(te, Tmax);
    if (i) ctx.lineTo(X, yPix(envOf(d, te), peak)); else ctx.moveTo(X, yPix(envOf(d, te), peak));
  }
  ctx.stroke();
  ctx.beginPath();
  for (i = 0; i <= N; i++){
    te = i / N * Tmax; X = xPix(te, Tmax);
    if (i) ctx.lineTo(X, yPix(-envOf(d, te), peak)); else ctx.moveTo(X, yPix(-envOf(d, te), peak));
  }
  ctx.stroke(); ctx.setLineDash([]);

  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.4; ctx.beginPath();
  for (i = 0; i <= N; i++){
    te = i / N * Tmax; X = xPix(te, Tmax);
    if (i) ctx.lineTo(X, yPix(xOf(d, te), peak)); else ctx.moveTo(X, yPix(xOf(d, te), peak));
  }
  ctx.stroke();

  if (d.Ts < Tmax){
    ctx.strokeStyle = PAL.float; ctx.lineWidth = 1.8; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(xPix(d.Ts, Tmax), T); ctx.lineTo(xPix(d.Ts, Tmax), B); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PAL.float; ctx.font = '12px ' + FONT; ctx.textAlign = 'left';
    ctx.fillText('Ts', xPix(d.Ts, Tmax) + 6, T + 16);
  }

  ctx.strokeStyle = PAL.float; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(xPix(tc, Tmax), T); ctx.lineTo(xPix(tc, Tmax), B); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = PAL.float;
  ctx.beginPath(); ctx.arc(xPix(tc, Tmax), yPix(xOf(d, tc), peak), 6, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = PAL.faint; ctx.font = '12px ' + FONT; ctx.textAlign = 'center';
  for (i = 0; i <= 4; i++){
    var tt = i / 4 * Tmax;
    ctx.fillText(tt.toFixed(1), xPix(tt, Tmax), B + 20);
  }
}

function sync(){
  $('zv').textContent = st.z < 0.1 ? st.z.toFixed(3) : st.z.toFixed(2);
  $('wnv').textContent = st.wn.toFixed(1);
  $('z').value = st.z; $('wn').value = st.wn;
}
$('z').addEventListener('input', function(){ st.z = parseFloat(this.value); st.t = 0; sync(); draw(); });
$('wn').addEventListener('input', function(){ st.wn = parseFloat(this.value); st.t = 0; sync(); draw(); });
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.z = 0.015; st.wn = 10; st.t = 0; st.running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  sync(); draw();
});
var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  var d = derived(), Tmax = Math.max(d.Ts * 1.45, 1);
  if (st.running) st.t += dt * (Tmax / 9);
  if (st.t > Tmax) st.t = 0;
  draw();
  requestAnimationFrame(loop);
}
sync();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
