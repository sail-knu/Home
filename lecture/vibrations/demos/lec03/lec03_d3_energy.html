<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L3-D3 · Tmax = Umax</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
  --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 3강</p>
  <h1>Tmax = Umax</h1>
  <p class="lede">평형에서 T가 최대, ±A에서 U가 최대 — 둘은 같은 E₀입니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">강성 k <span class="big-val" id="kv">100</span> N/m</p>
        <input type="range" id="k" min="10" max="200" step="5" value="100">
      </div>
      <div>
        <p class="ctrl-title">질량 m <span class="big-val" id="mv">1.0</span> kg</p>
        <input type="range" id="m" min="0.5" max="4" step="0.1" value="1">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="480"></canvas>
    <div class="legend">
      <span><i style="background:var(--low)"></i>T = ½mẋ²</span>
      <span><i style="background:var(--high)"></i>U = ½kx²</span>
      <span><i style="background:var(--ok)"></i>E₀ = ½kA²</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 3강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var A0 = 0.2, HIST = 5;
var st = { k: 100, m: 1, t: 0, running: true };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','ok','mass','mass-ink','spring','wall'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function wn(){ return Math.sqrt(st.k / st.m); }
function sol(t){
  var w = wn();
  return { x: A0 * Math.cos(w * t), v: -A0 * w * Math.sin(w * t) };
}
function energies(t){
  var s = sol(t);
  return { x: s.x, v: s.v, U: 0.5 * st.k * s.x * s.x, T: 0.5 * st.m * s.v * s.v, E0: 0.5 * st.k * A0 * A0 };
}
function drawSpring(x1, y, x2){
  ctx.strokeStyle = PAL.spring; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(x1, y);
  var n = 12, seg = (x2 - x1) / (n * 2);
  for (var i = 0; i < n * 2; i++) ctx.lineTo(x1 + seg * (i + 0.5), y + (i % 2 === 0 ? -12 : 12));
  ctx.lineTo(x2, y); ctx.stroke();
}

function draw(){
  var e = energies(st.t), w = wn(), E0 = e.E0;
  var eqX = 300, wallX = 40, px = 130 / A0, ms = 56;
  var mx = eqX + e.x * px, midY = 118;
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(16, 16, 560, 204);
  ctx.fillStyle = PAL.wall; ctx.fillRect(wallX - 14, midY - 58, 14, 116);
  ctx.setLineDash([4, 4]); ctx.strokeStyle = PAL.border2;
  ctx.beginPath(); ctx.moveTo(eqX, 36); ctx.lineTo(eqX, 200); ctx.stroke();
  ctx.strokeStyle = PAL.high;
  ctx.beginPath(); ctx.moveTo(eqX - A0 * px, 36); ctx.lineTo(eqX - A0 * px, 200); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(eqX + A0 * px, 36); ctx.lineTo(eqX + A0 * px, 200); ctx.stroke();
  ctx.setLineDash([]);
  drawSpring(wallX, midY, mx - ms / 2);
  ctx.fillStyle = PAL.mass; ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2;
  ctx.fillRect(mx - ms / 2, midY - ms / 2, ms, ms);
  ctx.strokeRect(mx - ms / 2, midY - ms / 2, ms, ms);
  ctx.fillStyle = PAL['mass-ink']; ctx.font = 'bold 18px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('m', mx, midY); ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = PAL.high; ctx.font = '12px ' + FONT;
  ctx.fillText('−A', eqX - A0 * px, 214);
  ctx.fillText('+A', eqX + A0 * px, 214);
  ctx.fillStyle = PAL.low; ctx.fillText('x=0', eqX, 214);

  var barBase = 196, barTop = 48, bh = barBase - barTop;
  function bar(x, val, col, lab){
    var h = Math.min(bh, val / Math.max(E0, 1e-9) * bh);
    ctx.fillStyle = col; ctx.globalAlpha = 0.85;
    ctx.fillRect(x, barBase - h, 40, h); ctx.globalAlpha = 1;
    ctx.strokeStyle = PAL.ok; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(x - 6, barTop); ctx.lineTo(x + 46, barTop); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = PAL.muted; ctx.font = '12px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText(lab, x + 20, 214);
  }
  bar(620, e.T, PAL.low, 'T');
  bar(700, e.U, PAL.high, 'U');
  ctx.fillStyle = PAL.text; ctx.font = 'bold 15px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('½m(Aωₙ)² = ½kA²', 600, 36);
  ctx.fillStyle = PAL.accent; ctx.font = '13px Consolas, monospace';
  ctx.fillText('ωₙ = ' + w.toFixed(2) + ' rad/s', 600, 56);

  var L = 48, R = W - 24, T = 250, B = 452, mid = (T + B) / 2;
  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(L, T, R - L, B - T);
  ctx.strokeStyle = PAL.border2;
  ctx.beginPath(); ctx.moveTo(L, T); ctx.lineTo(L, B); ctx.lineTo(R, B); ctx.stroke();
  ctx.strokeStyle = PAL.ok; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(L, T + 12); ctx.lineTo(R, T + 12); ctx.stroke(); ctx.setLineDash([]);
  function yE(v){ return B - v / Math.max(E0, 1e-9) * (B - T - 16); }
  var i, te;
  ctx.strokeStyle = PAL.low; ctx.lineWidth = 2.2; ctx.beginPath();
  for (i = 0; i <= 240; i++){
    te = i / 240 * HIST;
    var X = L + i / 240 * (R - L), Y = yE(energies(te).T);
    if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
  }
  ctx.stroke();
  ctx.strokeStyle = PAL.high; ctx.beginPath();
  for (i = 0; i <= 240; i++){
    te = i / 240 * HIST;
    X = L + i / 240 * (R - L); Y = yE(energies(te).U);
    if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
  }
  ctx.stroke();
  var tc = ((st.t % HIST) + HIST) % HIST;
  ctx.strokeStyle = PAL.float; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(L + tc / HIST * (R - L), T); ctx.lineTo(L + tc / HIST * (R - L), B); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = PAL.faint; ctx.font = '12px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('T·U 이력 (c = 0, E = E₀ 일정)', L, T - 8);
}

function sync(){
  $('kv').textContent = String(Math.round(st.k));
  $('mv').textContent = st.m.toFixed(1);
  $('k').value = st.k; $('m').value = st.m;
}
$('k').addEventListener('input', function(){ st.k = parseFloat(this.value); st.t = 0; sync(); draw(); });
$('m').addEventListener('input', function(){ st.m = parseFloat(this.value); st.t = 0; sync(); draw(); });
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.k = 100; st.m = 1; st.t = 0; st.running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  sync(); draw();
});
var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running) st.t += dt * 0.4;
  draw();
  requestAnimationFrame(loop);
}
sync();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
