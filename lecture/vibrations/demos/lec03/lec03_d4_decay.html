<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L3-D4 · 감쇠와 에너지 소산</title>
</head>
<body>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
    --ok:#5cc793; --bad:#f09289;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --low:#82b4f0; --float:#b58ae6;
  --ok:#5cc793; --bad:#f09289;
  --plot-bg:#0e2429; --grid:#1e3d44;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --low:#2f66ad; --float:#8a56c8;
  --ok:#177a4c; --bad:#bb4038;
  --plot-bg:#eef4f4; --grid:#cddcdc;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding-top:26px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:22px 24px}
.ctrl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 5px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);display:block}
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
</style>

<header class="hero wrap">
  <p class="eyebrow">기계진동학 3강</p>
  <h1>감쇠와 에너지 소산</h1>
  <p class="lede">c&gt;0이면 총에너지가 새어 나가 Tmax = Umax가 깨집니다.</p>
</header>

<main class="wrap">
<section id="sim" style="margin-top:6px">
  <div class="card">
    <div class="ctrl-bar">
      <div>
        <p class="ctrl-title">강성 k <span class="big-val" id="kv">100</span> N/m</p>
        <input type="range" id="k" min="10" max="200" step="5" value="100">
      </div>
      <div>
        <p class="ctrl-title">질량 m <span class="big-val" id="mv">1.0</span> kg</p>
        <input type="range" id="m" min="0.5" max="4" step="0.1" value="1">
      </div>
      <div>
        <p class="ctrl-title">감쇠 c <span class="big-val" id="cv2">2.0</span> N·s/m</p>
        <input type="range" id="c" min="0" max="20" step="0.1" value="2">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="420"></canvas>
    <div class="legend">
      <span><i style="background:var(--low)"></i>T</span>
      <span><i style="background:var(--high)"></i>U</span>
      <span><i style="background:var(--faint)"></i>소산 E₀−E(t)</span>
      <span><i style="background:var(--accent)"></i>E(t)</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>
  </div>
</section>
</main>
<footer>기계진동학 3강</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var A0 = 0.2, HIST = 5, EPS = 1e-6;
var st = { k: 100, m: 1, c: 2, t: 0, running: true };

var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['surface2','border','border2','text','muted','faint','accent','high','low','ok'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
}
readPalette();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';

function params(){
  var wn = Math.sqrt(st.k / st.m);
  var zeta = st.c / (2 * Math.sqrt(st.k * st.m));
  var p = { wn: wn, zeta: zeta, E0: 0.5 * st.k * A0 * A0 };
  if (zeta < 1 - EPS){ p.b = 'under'; p.wd = wn * Math.sqrt(Math.max(EPS * EPS, 1 - zeta * zeta)); }
  else if (zeta > 1 + EPS){
    p.b = 'over';
    var s = wn * Math.sqrt(Math.max(EPS * EPS, zeta * zeta - 1));
    p.l1 = -zeta * wn + s; p.l2 = -zeta * wn - s;
  } else p.b = 'crit';
  return p;
}
function sol(t, p){
  if (p.b === 'under'){
    var e = Math.exp(-p.zeta * p.wn * t);
    return { x: A0 * e * (Math.cos(p.wd * t) + (p.zeta * p.wn / p.wd) * Math.sin(p.wd * t)),
             v: -A0 * e * (p.wn * p.wn / p.wd) * Math.sin(p.wd * t) };
  }
  if (p.b === 'crit'){
    var ec = Math.exp(-p.wn * t);
    return { x: A0 * (1 + p.wn * t) * ec, v: -A0 * p.wn * p.wn * t * ec };
  }
  var e1 = Math.exp(p.l1 * t), e2 = Math.exp(p.l2 * t), den = p.l2 - p.l1;
  return { x: A0 * (p.l2 * e1 - p.l1 * e2) / den, v: A0 * p.l1 * p.l2 * (e1 - e2) / den };
}
function energies(t, p){
  var s = sol(t, p);
  var U = 0.5 * st.k * s.x * s.x, T = 0.5 * st.m * s.v * s.v;
  return { U: U, T: T, E: U + T, dis: Math.max(0, p.E0 - U - T) };
}

function draw(){
  var p = params(), L = 56, R = W - 24, Top = 48, B = 384, i;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = PAL.surface2;
  ctx.fillRect(L, Top, R - L, B - Top);
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(L, Top); ctx.lineTo(L, B); ctx.lineTo(R, B); ctx.stroke();
  ctx.fillStyle = PAL.text; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('에너지 이력', L, 28);
  ctx.fillStyle = PAL.accent; ctx.font = '13px Consolas, monospace'; ctx.textAlign = 'right';
  ctx.fillText('ζ = ' + p.zeta.toFixed(2) + '   E₀ = ' + p.E0.toFixed(2) + ' J', R, 28);

  function yE(v){ return B - v / Math.max(p.E0, 1e-9) * (B - Top - 10); }
  function xT(t){ return L + t / HIST * (R - L); }
  var samples = [];
  for (i = 0; i <= 280; i++) samples.push(energies(i / 280 * HIST, p));

  ctx.fillStyle = PAL.faint; ctx.globalAlpha = 0.28; ctx.beginPath();
  ctx.moveTo(L, B);
  for (i = 0; i <= 280; i++) ctx.lineTo(xT(i / 280 * HIST), yE(samples[i].dis));
  ctx.lineTo(R, B); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;

  ctx.fillStyle = PAL.high; ctx.globalAlpha = 0.22; ctx.beginPath();
  ctx.moveTo(L, B);
  for (i = 0; i <= 280; i++) ctx.lineTo(xT(i / 280 * HIST), yE(samples[i].U + samples[i].T));
  ctx.lineTo(R, B); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;

  ctx.strokeStyle = PAL.low; ctx.lineWidth = 2; ctx.beginPath();
  for (i = 0; i <= 280; i++){
    var X = xT(i / 280 * HIST);
    if (i) ctx.lineTo(X, yE(samples[i].T)); else ctx.moveTo(X, yE(samples[i].T));
  }
  ctx.stroke();
  ctx.strokeStyle = PAL.high; ctx.beginPath();
  for (i = 0; i <= 280; i++){
    X = xT(i / 280 * HIST);
    if (i) ctx.lineTo(X, yE(samples[i].U)); else ctx.moveTo(X, yE(samples[i].U));
  }
  ctx.stroke();
  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.4; ctx.beginPath();
  for (i = 0; i <= 280; i++){
    X = xT(i / 280 * HIST);
    if (i) ctx.lineTo(X, yE(samples[i].E)); else ctx.moveTo(X, yE(samples[i].E));
  }
  ctx.stroke();
  ctx.strokeStyle = PAL.ok; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(L, yE(p.E0)); ctx.lineTo(R, yE(p.E0)); ctx.stroke(); ctx.setLineDash([]);

  var tc = ((st.t % HIST) + HIST) % HIST, now = energies(tc, p);
  ctx.strokeStyle = PAL.float; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(xT(tc), Top); ctx.lineTo(xT(tc), B); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = PAL.float;
  ctx.beginPath(); ctx.arc(xT(tc), yE(now.E), 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PAL.faint; ctx.font = '12px ' + FONT; ctx.textAlign = 'center';
  for (i = 0; i <= 5; i++) ctx.fillText(i + ' s', xT(i), B + 20);
}

function sync(){
  $('kv').textContent = String(Math.round(st.k));
  $('mv').textContent = st.m.toFixed(1);
  $('cv2').textContent = st.c.toFixed(1);
  $('k').value = st.k; $('m').value = st.m; $('c').value = st.c;
}
$('k').addEventListener('input', function(){ st.k = parseFloat(this.value); st.t = 0; sync(); draw(); });
$('m').addEventListener('input', function(){ st.m = parseFloat(this.value); st.t = 0; sync(); draw(); });
$('c').addEventListener('input', function(){ st.c = parseFloat(this.value); st.t = 0; sync(); draw(); });
$('play').addEventListener('click', function(){
  st.running = !st.running;
  this.textContent = st.running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', st.running);
});
$('reset').addEventListener('click', function(){
  st.k = 100; st.m = 1; st.c = 2; st.t = 0; st.running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  sync(); draw();
});
var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (st.running) st.t += dt * 0.4;
  draw();
  requestAnimationFrame(loop);
}
sync();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
