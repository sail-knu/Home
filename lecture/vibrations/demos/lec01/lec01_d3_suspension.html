<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L1-D3 · 자동차 서스펜션</title>
</head>
<body>
<style>
/* ================= tokens ================= */
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --high-soft:#fbe9e6;
  --low:#2f66ad; --low-soft:#e7eefb;
  --float:#8a56c8; --float-soft:#f0e8fa;
  --ok:#177a4c; --ok-soft:#e2f3e9; --bad:#bb4038; --bad-soft:#fbe9e8;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
    --border:#2a3848; --border2:#3a4d62;
    --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
    --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
    --high:#ff8577; --high-soft:#3c211d;
    --low:#82b4f0; --low-soft:#182f4a;
    --float:#b58ae6; --float-soft:#2b1e40;
    --ok:#5cc793; --ok-soft:#153426; --bad:#f09289; --bad-soft:#3d1f1c;
    --plot-bg:#0e2429; --grid:#1e3d44;
    --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1622; --surface:#121a24; --surface2:#182332; --surface3:#1e2c3c;
  --border:#2a3848; --border2:#3a4d62;
  --text:#e6edf4; --muted:#9bb0c0; --faint:#7d90a0;
  --accent:#6ea3d8; --accent-ink:#0d1622; --accent-soft:#1a2d44; --accent-line:#2d4f70;
  --high:#ff8577; --high-soft:#3c211d;
  --low:#82b4f0; --low-soft:#182f4a;
  --float:#b58ae6; --float-soft:#2b1e40;
  --ok:#5cc793; --ok-soft:#153426; --bad:#f09289; --bad-soft:#3d1f1c;
  --plot-bg:#0e2429; --grid:#1e3d44;
  --mass:#4d7d86; --mass-ink:#e6f4f4; --spring:#8fa8ac; --wall:#33525a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.55);
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e6ebf2;
  --border:#d5dde6; --border2:#b8c4d1;
  --text:#1a2330; --muted:#5a6776; --faint:#7a8794;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dce7ef; --accent-line:#8aa8c4;
  --high:#c8433a; --high-soft:#fbe9e6;
  --low:#2f66ad; --low-soft:#e7eefb;
  --float:#8a56c8; --float-soft:#f0e8fa;
  --ok:#177a4c; --ok-soft:#e2f3e9; --bad:#bb4038; --bad-soft:#fbe9e8;
  --plot-bg:#eef4f4; --grid:#cddcdc;
  --mass:#3c5a60; --mass-ink:#eaf3f3; --spring:#7e9296; --wall:#b9cccc;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 8px 24px -14px rgba(20,32,48,.18);
}

/* ================= base ================= */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  line-height:1.66;font-size:15.5px;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{line-height:1.3;text-wrap:balance}
a{color:var(--accent)}
.wrap{max-width:1024px;margin:0 auto;padding:0 20px}
.wrap.wide{max-width:1320px}
.num{font-variant-numeric:tabular-nums}

/* ================= math ================= */
.mth{font-family:"Cambria Math",Cambria,"Times New Roman",Georgia,serif;font-size:1.06em}
var{font-family:"Cambria Math",Cambria,"Times New Roman",Georgia,serif;font-style:italic}
.eq{display:block;text-align:center;margin:14px 0;font-family:"Cambria Math",Cambria,"Times New Roman",Georgia,serif;
  font-size:18px;line-height:2.1}
.eq.boxed{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:10px;padding:8px 12px}
.frac{display:inline-flex;flex-direction:column;vertical-align:-0.62em;text-align:center;margin:0 .22em}
.frac>span:first-child{border-bottom:1.2px solid currentColor;padding:0 .35em;line-height:1.35}
.frac>span:last-child{padding:0 .35em;line-height:1.35}
.rad{border-top:1.2px solid currentColor;padding:0 .2em 0 .12em;margin-left:-.06em}

/* ================= hero & nav ================= */
.hero{padding-top:42px;padding-bottom:10px}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.02em}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:64ch;font-size:16px;margin:14px 0 20px}
.nav{position:sticky;top:0;z-index:60;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.nav-inner{display:flex;gap:8px;overflow-x:auto;padding:10px 20px;max-width:1024px;margin:0 auto;scrollbar-width:thin}
.chip{white-space:nowrap;padding:6px 13px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);text-decoration:none}
.chip:hover{color:var(--accent);border-color:var(--accent-line)}

/* ================= sections & cards ================= */
section{scroll-margin-top:66px;margin:38px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px 24px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 4px}
.sec-num{font-family:Consolas,ui-monospace,monospace;font-size:13px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);padding:3px 10px;border-radius:8px}
.sec-head h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sec-sub{color:var(--muted);font-size:14.5px;margin:6px 0 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.grid2.wide-left{grid-template-columns:1.35fr 1fr}
@media (max-width:880px){.grid2,.grid2.wide-left{grid-template-columns:1fr}}
.panel-label{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 8px}

/* ================= buttons & controls ================= */
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-acc:hover{color:var(--accent-ink);opacity:.92}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:8px}
.ctl-row{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:9px 0}
.ctl-row label{min-width:112px;color:var(--muted);font-weight:600}
.ctl-row output{min-width:86px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
input[type=number],input[type=text]{padding:7px 10px;border-radius:9px;border:1px solid var(--border2);
  background:var(--surface);color:var(--text);font-family:inherit;font-size:14px;min-width:0}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.conv-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}

/* ================= readouts ================= */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:10px 0}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 12px}
.stat .k{font-size:11.5px;color:var(--faint);font-weight:700;letter-spacing:.03em}
.stat .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .v.acc{color:var(--accent)} .stat .v.hi{color:var(--high)} .stat .v.lo{color:var(--low)}
.state-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 13px;border-radius:999px;
  font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.st-ok{color:var(--ok);background:var(--ok-soft)}
.st-bad{color:var(--bad);background:var(--bad-soft)}
.st-mid{color:var(--float);background:var(--float-soft)}
.verdict{padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:700;line-height:1.55;margin:10px 0 0}
.verdict.good{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.verdict.mid{background:var(--float-soft);color:var(--float);border:1px solid var(--float)}

/* ================= svg / plots ================= */
.simsvg{width:100%;height:auto;display:block;overflow:visible}
.plot{width:100%;height:auto;display:block;background:var(--plot-bg);border:1px solid var(--border);border-radius:10px}
.ax{stroke:var(--border2);stroke-width:1.4;fill:none}
.gl{stroke:var(--grid);stroke-width:1;stroke-dasharray:3 4;fill:none}
.gl-a{stroke:var(--accent);stroke-width:1;stroke-dasharray:5 5;fill:none;opacity:.65}
.curve{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.c-x{stroke:var(--accent)} .c-v{stroke:var(--low)} .c-a{stroke:var(--high)} .c-r{stroke:var(--bad)}
.c-ghost{stroke:var(--faint);stroke-width:1.8;stroke-dasharray:6 5;opacity:.75}
.area{fill:var(--accent);opacity:.16;stroke:none}
.lbl{fill:var(--muted);font-size:11.5px;font-family:inherit}
.lbl-s{fill:var(--faint);font-size:10.5px;font-family:inherit}
.lbl-b{fill:var(--text);font-size:12.5px;font-weight:700;font-family:inherit}
.head-dot{fill:var(--text)}
.wallr{fill:var(--wall)}
.massr{fill:var(--mass)}
.massl{fill:var(--mass-ink);font-size:13px;font-weight:700;font-family:inherit}
.spr{fill:none;stroke:var(--spring);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.grnd{stroke:var(--border2);stroke-width:1.4}
.farrow{stroke:var(--high);stroke-width:3;fill:none;stroke-linecap:round}
.farrow-h{fill:var(--high)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}

/* ================= tables ================= */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;color:var(--faint);font-size:12.5px;letter-spacing:.03em}
th,td{padding:8px 12px;border-bottom:1px solid var(--border)}
tr.cur td{background:var(--accent-soft);font-weight:700}
td.num,th.num{font-variant-numeric:tabular-nums}

/* ================= callouts, steps, details ================= */
.note-box{border-left:3px solid var(--accent);background:var(--accent-soft);
  padding:12px 16px;border-radius:0 10px 10px 0;font-size:14px;margin:14px 0}
.warn-box{border-left:3px solid var(--high);background:var(--high-soft);
  padding:12px 16px;border-radius:0 10px 10px 0;font-size:14px;margin:14px 0}
.ok-box{border-left:3px solid var(--ok);background:var(--ok-soft);
  padding:12px 16px;border-radius:0 10px 10px 0;font-size:14px;margin:14px 0}
details{border:1px solid var(--border);border-radius:11px;padding:11px 16px;margin:8px 0;background:var(--surface)}
summary{cursor:pointer;font-weight:700;font-size:14.5px}
summary::marker{color:var(--accent)}
details[open]{padding-bottom:14px}
.step{border:1.5px solid var(--border2);border-radius:11px;padding:11px 16px;background:var(--surface2);
  transition:border-color .2s,background .2s;margin:0 0 8px}
.step .st-t{font-weight:800;font-size:14.5px}
.step .st-d{font-size:13.5px;color:var(--muted)}
.step.hl{border-color:var(--accent);background:var(--accent-soft)}
.step.hl .st-d{color:var(--text)}
.step.dim{opacity:.55}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:5px 0;cursor:pointer}
.chk input{accent-color:var(--accent);margin-top:4px;flex:none}
.chk input:checked+span{color:var(--faint);text-decoration:line-through}
.pill{display:inline-block;font-size:11.5px;font-weight:800;color:var(--accent);
  background:var(--accent-soft);border-radius:6px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.pill-w{color:var(--high);background:var(--high-soft)}

/* ================= quiz ================= */
.q{border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin:0 0 12px;background:var(--surface)}
.q-title{font-weight:700;margin:0 0 10px}
.q-title .qn{color:var(--accent);margin-right:6px}
.opt{display:block;width:100%;text-align:left;padding:9px 13px;margin:6px 0;border-radius:9px;
  border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default;opacity:.75}
.opt.correct{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700;opacity:1}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);opacity:1}
.expl{margin-top:10px;font-size:13.5px;padding:10px 14px;border-radius:9px;background:var(--accent-soft)}
.quiz-score{font-weight:800;font-size:15px;color:var(--accent)}
footer{color:var(--faint);font-size:13px;text-align:center;padding:34px 20px 44px}
/* ================= demo 전용 ================= */
.demo-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:1000px){.demo-layout{grid-template-columns:1fr}}
/* k·c·m·v 슬라이더 — 카드 전체 폭을 쓰는 가로 4열 바 */
.ctrl-bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px;
  background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 18px;margin:0 0 18px}
.ctrl-bar .cb{min-width:0}
.ctrl-bar .ctrl-title{margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl-bar input[type=range]{width:100%;display:block}
.ctrl-bar .mini{margin:5px 0 0;min-height:2.6em}
@media (max-width:1000px){.ctrl-bar{grid-template-columns:repeat(2,minmax(0,1fr))}.ctrl-bar .mini{min-height:0}}
@media (max-width:620px){.ctrl-bar{grid-template-columns:1fr}}
canvas.sim{width:100%;height:auto;display:block;background:var(--plot-bg);
  border:1px solid var(--border);border-radius:12px}
.ctrl{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin:0 0 10px}
.ctrl > .panel-label{margin-bottom:6px}
.ctrl-title{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin:0 0 6px}
.big-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:-.01em}
.mini{font-size:12.5px;color:var(--muted)}
.formula-chip{display:inline-block;background:var(--accent-soft);border:1px solid var(--accent-line);
  border-radius:9px;padding:5px 12px;font-family:"Cambria Math",Cambria,"Times New Roman",serif;
  font-size:15.5px;margin:4px 0}
.stepbar{display:flex;gap:6px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.stepdot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;background:var(--surface3);color:var(--faint);border:1.5px solid var(--border2)}
.stepdot.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepdot.done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.mission{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:5px 0;cursor:pointer}
.mission input{accent-color:var(--accent);margin-top:4px;flex:none}
.mission input:checked+span{color:var(--faint);text-decoration:line-through}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.two-col{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.mission{cursor:default} .mission input:disabled{opacity:1}
.mission .ms-v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
/* 프리셋: 버튼 한 줄 + 결과 한 줄 설명 */
.pset{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 10px;align-items:center;margin:0}
.pset .btn{width:100%;white-space:nowrap}
.pset .pd{font-size:12px;line-height:1.4;color:var(--muted)}
.pset .pd b{color:var(--text)}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
<header class="hero wrap wide" style="padding-top:26px">
  <p class="eyebrow">기계진동학 1강</p>
  <h1>자동차 서스펜션</h1>
  <p class="lede">차체 = <b>m</b>, 코일 스프링 = <b>k</b>, 쇼크업소버 = <b>c</b>.</p>
</header>

<main class="wrap wide">
<section id="sim" style="margin-top:6px">
  <div class="card">

    <div class="ctrl-bar">
      <div class="cb">
        <p class="ctrl-title">코일 스프링 강성 k <span class="big-val" id="kVal">10.0</span> kN/m</p>
        <input type="range" id="k" min="5" max="50" step="0.5" value="10">
      </div>
      <div class="cb">
        <p class="ctrl-title">쇼크업소버 c <span class="big-val" id="cVal">500</span> N·s/m</p>
        <input type="range" id="c" min="0" max="8000" step="50" value="500">
      </div>
      <div class="cb">
        <p class="ctrl-title">차체 질량 m (바퀴당 1/4) <span class="big-val" id="mVal">300</span> kg</p>
        <input type="range" id="m" min="200" max="500" step="10" value="300">
      </div>
    </div>
    <canvas id="cv" class="sim" width="900" height="500"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>차체 높이 x(t)</span>
      <span><i style="background:var(--low)"></i>노면 y(t)</span>
    </div>
    <div class="btn-row" style="margin:12px 0 0">
      <button class="btn btn-acc" id="play">⏸ 일시정지</button>
      <button class="btn" id="reset">↺ 리셋</button>
    </div>

  </div>
</section>
</main>

<footer>
  기계진동학 1강
</footer>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

/* ---- 물리 상수 ---- */
var L_BUMP = 3.6, H_BUMP = 0.10;            /* 한국 표준 과속방지턱: 길이 3.6 m, 높이 10 cm (반정현파) */
var T0 = 0.5, T_SIM = 6.0;
var DT = 1 / 600, NS = 3600;
var TH_ABS = 0.15 * H_BUMP, REL = 0.45;     /* 출렁임 판정: 1.5 cm 절대 문턱 + 직전 45 % 상대 문턱 */
var G = 9.81;

/* ---- 상태 ---- */
var DEF = { m: 300, k: 10, c: 500, v: 25 };
var p = { m: DEF.m, k: DEF.k, c: DEF.c, v: DEF.v };
var tAnim = 0, running = true;

/* ---- 테마 대응 팔레트 ---- */
var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  ['bg','surface','surface2','surface3','border','border2','text','muted','faint',
   'accent','accent-soft','accent-line','high','high-soft','low','low-soft','float','float-soft',
   'ok','ok-soft','bad','bad-soft','plot-bg','grid','mass','mass-ink','spring'].forEach(function(k){
    PAL[k] = cs.getPropertyValue('--' + k).trim() || '#888';
  });
  stateCol = PAL.accent;
}
readPalette();
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').addEventListener){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); draw(); });
}
if (window.MutationObserver){
  new MutationObserver(function(){ readPalette(); draw(); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
var FONT = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
var MONO = 'Consolas, ui-monospace, monospace';

/* ---- 포맷 ---- */
function fmtInt(n){ return n.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function fmtZ(z){ return z < 0.1 ? z.toFixed(3) : z.toFixed(2); }
function fmt(v, n){ return isFinite(v) ? v.toFixed(n) : '—'; }
function sgn(v, n){ return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(n); }

/* ---- 적분 결과 (recompute 에서 채움) ---- */
var XS = new Float64Array(NS + 1), YS = new Float64Array(NS + 1), AS = new Float64Array(NS + 1);
var D = {};
var stateCol = '#1d4e89';

/* 1/4 차량 모델, 바닥가진:  m x'' + c(x' − y') + k(x − y) = 0
   고전 RK4, 고정 h = 1/600 s. 슬라이더 최악 고유값 ≤ max(ωₙ_max 15.8, c_max/m_min 40) rad/s
   → |λ|h = 0.067 ≪ 2.78 (RK4 실축 안정 한계) — 어떤 조합에서도 안정, 국소오차 (ωh)⁴ ≈ 5e-7.
   ẏ 는 턱 진입·이탈에서 불연속(턱 모서리) — 그 순간 c·ẏ 가 차체에 전달되는 충격의 원천. */
function integrate(m, k, c, tau, outX, outY, outA){
  var Hh = H_BUMP, om = Math.PI / tau;
  function y(t){ var s = t - T0; return (s >= 0 && s <= tau) ? Hh * Math.sin(om * s) : 0; }
  function yd(t){ var s = t - T0; return (s >= 0 && s <= tau) ? Hh * om * Math.cos(om * s) : 0; }
  function acc(t, x, xd){ return -(c / m) * (xd - yd(t)) - (k / m) * (x - y(t)); }
  var x = 0, xd = 0, t = 0, i;
  var k1x, k1v, k2x, k2v, k3x, k3v, k4x, k4v;
  outX[0] = 0; if (outY) outY[0] = 0; if (outA) outA[0] = 0;
  for (i = 1; i <= NS; i++){
    k1x = xd;               k1v = acc(t, x, xd);
    k2x = xd + .5*DT*k1v;   k2v = acc(t + .5*DT, x + .5*DT*k1x, xd + .5*DT*k1v);
    k3x = xd + .5*DT*k2v;   k3v = acc(t + .5*DT, x + .5*DT*k2x, xd + .5*DT*k2v);
    k4x = xd + DT*k3v;      k4v = acc(t + DT,     x + DT*k3x,     xd + DT*k3v);
    x  += DT*(k1x + 2*k2x + 2*k3x + k4x)/6;
    xd += DT*(k1v + 2*k2v + 2*k3v + k4v)/6;
    t  += DT;
    outX[i] = x; if (outY) outY[i] = y(t); if (outA) outA[i] = acc(t, x, xd);
  }
}

/* 출렁임 1회 = 턱 이탈(및 최고점) 이후 정지선에서 1.5 cm 이상 벗어난 봉우리/골.
   직전 출렁임의 45 % 미만이면 잔진동으로 보고 세기를 멈춘다 (ρ = e^(−πζ/√(1−ζ²)) 와 비교 → ζ* ≈ 0.246). */
function countRebounds(iFrom){
  var list = [], prev = -1, broke = false;
  for (var i = iFrom + 1; i < NS; i++){
    var d1 = XS[i] - XS[i-1], d2 = XS[i+1] - XS[i];
    if (d1 * d2 < 0){
      var a = Math.abs(XS[i]);
      if (a >= TH_ABS && (prev < 0 || a >= REL * prev)){ list.push({ t: i * DT, x: XS[i] }); prev = a; }
      else { broke = true; break; }
    }
  }
  var truncated = !broke && list.length > 0 && prev * REL >= TH_ABS;
  return { N: list.length, ext: list, truncated: truncated };
}

function recompute(){
  var m = p.m, k = p.k * 1000, c = p.c, vms = p.v / 3.6, tau = L_BUMP / vms;
  var wn = Math.sqrt(k / m), fn = wn / (2 * Math.PI), ccr = 2 * Math.sqrt(k * m), zeta = c / ccr;
  integrate(m, k, c, tau, XS, YS, AS);

  var i, xmax = -1, imax = -1, amax = 0, iLast = 0;
  var i0 = Math.round(T0 / DT), iExit = Math.ceil((T0 + tau) / DT);
  for (i = 0; i <= NS; i++){
    var aa = Math.abs(AS[i]); if (aa > amax) amax = aa;
    if (Math.abs(XS[i]) > 0.005) iLast = i;
  }
  /* 최고점 = 턱 진입 후 '첫' 극대. 전역 최댓값을 쓰면 c ≈ 0 에서 뒤쪽 봉우리가 잡혀
     그 앞의 되튐이 통째로 건너뛰어진다(무감쇠인데 1회로 표시되는 문제). */
  for (i = i0 + 1; i < NS; i++){
    if (XS[i] >= XS[i-1] && XS[i] > XS[i+1] && XS[i] > 0.005){ imax = i; break; }
  }
  if (imax < 0){ imax = i0; for (i = i0; i <= NS; i++) if (XS[i] > XS[imax]) imax = i; }
  xmax = XS[imax];
  /* 정지 = 마지막 반주기 내내 ±5 mm 안. 마지막 표본이 우연히 영교차에 걸려
     '정지'로 보고되는 것을 막는다. */
  var win = Math.max(30, Math.ceil(Math.PI / wn / DT));
  var Ts = (iLast > NS - win) ? Infinity : Math.max(0, iLast * DT - (T0 + tau));
  /* 되튐은 '턱 이탈 후'부터 — 턱 위에서 흔들린 것은 세지 않는다. */
  var iFrom = Math.max(imax, iExit);
  var dip1 = 0;
  for (i = iFrom + 1; i < NS; i++){
    if ((XS[i] - XS[i-1]) * (XS[i+1] - XS[i]) < 0){ dip1 = XS[i]; break; }
  }
  var rb = countRebounds(iFrom);

  D = { m: m, k: k, c: c, v: p.v, vms: vms, tau: tau, wn: wn, fn: fn, ccr: ccr, zeta: zeta,
        xmax: xmax, imax: imax, amax: amax, Ts: Ts, dip1: dip1,
        N: rb.N, ext: rb.ext, truncated: rb.truncated };
}

/* ---- 레이아웃 상수 ---- */
var TEXT_X = 32, ROAD_X0 = 32, ROAD_X1 = 868, CAR_X = 220;
var ROAD_Y = 264, WR = 20, REST_Y = 140, PX_PER_M_H = 60, PX_PER_CM = 3.5, RB_X = 580;
var PL = 64, PR = 876, PT = 322, PB = 470, MIDY = 396;
function ty(cm){ return MIDY - cm * (PB - PT) / 36; }
function tx(t){ return PL + t / T_SIM * (PR - PL); }

/* ---- 그리기 도우미 ---- */
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function headV(x, y, dir, color){
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x - 4.5, y - dir * 8); ctx.lineTo(x + 4.5, y - dir * 8);
  ctx.closePath(); ctx.fill();
}
function vArrow(x, y1, y2, color, lw){
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke();
  if (Math.abs(y2 - y1) > 10){ headV(x, y1, -1, color); headV(x, y2, 1, color); }
}
function chip(x, y, text, col, bg){
  ctx.font = 'bold 13px ' + FONT;
  var w = ctx.measureText(text).width + 34;
  ctx.fillStyle = bg; roundRect(x, y, w, 24, 8); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x + 12, y + 12, 4, 0, Math.PI * 2); ctx.fill();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x + 22, y + 12); ctx.textBaseline = 'alphabetic';
}
function dashLine(x1, y1, x2, y2, color, lw, dash, alpha){
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash(dash);
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}

function draw(){
  if (!D.tau) return;
  var tA = Math.min(tAnim, T_SIM);
  var i = Math.min(NS, Math.round(tA / DT));
  var xcm = XS[i] * 100, ycm = YS[i] * 100, rcm = xcm - ycm;
  var tau = D.tau, tExit = T0 + tau;
  var s = D.vms * tA;

  ctx.clearRect(0, 0, W, H);

  /* ============ 상단: 주행 장면 ============ */
  ctx.fillStyle = PAL.surface; ctx.fillRect(18, 14, 864, 272);
  ctx.strokeStyle = PAL.border; ctx.lineWidth = 1; ctx.strokeRect(18.5, 14.5, 864, 272);

  /* 노면 (클립) */
  var bx0 = CAR_X + (T0 - tA) * D.vms * PX_PER_M_H, bw = L_BUMP * PX_PER_M_H;
  function roadPx(px){
    return (px >= bx0 && px <= bx0 + bw) ? ROAD_Y - H_BUMP * 100 * PX_PER_CM * Math.sin(Math.PI * (px - bx0) / bw) : ROAD_Y;
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(ROAD_X0, 14, ROAD_X1 - ROAD_X0, 272); ctx.clip();
  var px;
  ctx.beginPath(); ctx.moveTo(ROAD_X0, ROAD_Y);
  for (px = ROAD_X0; px <= ROAD_X1; px += 2) ctx.lineTo(px, roadPx(px));
  ctx.lineTo(ROAD_X1, 284); ctx.lineTo(ROAD_X0, 284); ctx.closePath();
  ctx.globalAlpha = .13; ctx.fillStyle = PAL.low; ctx.fill(); ctx.globalAlpha = 1;
  /* 턱 로브 */
  ctx.beginPath(); ctx.moveTo(bx0, ROAD_Y);
  for (px = bx0; px <= bx0 + bw; px += 2) ctx.lineTo(px, roadPx(px));
  ctx.lineTo(bx0 + bw, ROAD_Y); ctx.closePath();
  ctx.globalAlpha = .22; ctx.fillStyle = PAL.low; ctx.fill(); ctx.globalAlpha = 1;
  /* 노면선 */
  ctx.strokeStyle = PAL.low; ctx.lineWidth = 2.6; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(ROAD_X0, ROAD_Y);
  for (px = ROAD_X0; px <= ROAD_X1; px += 2) ctx.lineTo(px, roadPx(px));
  ctx.stroke();
  /* 1 m 눈금 (평지에서도 스크롤이 보이게) */
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1; ctx.globalAlpha = .5;
  for (var gi = 0; gi < 10; gi++){
    var gx = ROAD_X0 + (((gi * 60 - s * 60) % 540) + 540) % 540;
    ctx.beginPath(); ctx.moveTo(gx, ROAD_Y + 2); ctx.lineTo(gx, ROAD_Y + 8); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = PAL.low; ctx.font = 'bold 12px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('방지턱 3.6 m × 10 cm', bx0 + bw / 2, ROAD_Y - 10);
  ctx.restore();

  /* 바퀴 */
  var wy = ROAD_Y - WR - YS[i] * 100 * PX_PER_CM;
  ctx.fillStyle = PAL.mass; ctx.beginPath(); ctx.arc(CAR_X, wy, WR, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 4; ctx.stroke();
  ctx.save(); ctx.translate(CAR_X, wy); ctx.rotate(s / 0.3);
  ctx.strokeStyle = PAL.surface2; ctx.lineWidth = 1.5; ctx.globalAlpha = .7;
  for (var sp = 0; sp < 3; sp++){
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(sp * 2.094) * (WR - 5), Math.sin(sp * 2.094) * (WR - 5)); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = PAL.surface2; ctx.beginPath(); ctx.arc(CAR_X, wy, 5, 0, Math.PI * 2); ctx.fill();

  /* 차체 위치 */
  var bodyY = REST_Y - XS[i] * 100 * PX_PER_CM, bodyBot = bodyY + 20, wheelTop = wy - WR;

  /* 현가장치 — 스프링 (지그재그 8코일) */
  var sx = CAR_X - 22, ncoil = 16, dy = (bodyBot - wheelTop) / ncoil;
  ctx.strokeStyle = PAL.spring; ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(sx, wheelTop);
  for (var ci = 0; ci < ncoil; ci++) ctx.lineTo(sx + (ci % 2 === 0 ? -9 : 9), wheelTop + dy * (ci + 0.5));
  ctx.lineTo(sx, bodyBot); ctx.stroke();
  /* 현가장치 — 댐퍼 (실린더 + 로드/피스톤, 도식 비율) */
  /* 캔버스 y는 아래로 증가 — 차체 밑면(bodyBot)이 바퀴 위(wheelTop)보다 위에 있으므로
     간격 Lg = wheelTop − bodyBot 이 양수. (부호를 뒤집으면 실린더·로드가 그려지지 않는다) */
  var dx = CAR_X + 22, Lg = wheelTop - bodyBot, cylH = 0.55 * Lg, rodL = 0.65 * Lg;
  ctx.fillStyle = PAL.surface2; ctx.fillRect(dx - 7, wheelTop - cylH, 14, cylH);
  ctx.strokeStyle = PAL.float; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(dx - 7, wheelTop - cylH); ctx.lineTo(dx - 7, wheelTop);
  ctx.lineTo(dx + 7, wheelTop); ctx.lineTo(dx + 7, wheelTop - cylH); ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(dx, bodyBot); ctx.lineTo(dx, bodyBot + rodL); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(dx - 5, bodyBot + rodL); ctx.lineTo(dx + 5, bodyBot + rodL); ctx.stroke();
  var midS = (wheelTop + bodyBot) / 2;
  ctx.font = 'bold 14px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = PAL.text; ctx.fillText('k', CAR_X - 48, midS);
  ctx.fillStyle = PAL.float; ctx.fillText('c', CAR_X + 48, midS);
  ctx.textBaseline = 'alphabetic';

  /* 차체 그리기 */
  ctx.fillStyle = PAL['accent-soft']; ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.5;
  roundRect(CAR_X - 80, bodyY - 20, 160, 40, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = PAL.surface; ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2;
  roundRect(CAR_X - 44, bodyY - 48, 88, 30, 9); ctx.fill(); ctx.stroke();
  ctx.fillStyle = PAL.accent; ctx.font = 'bold 14px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('m = ' + p.m + ' kg', CAR_X, bodyY); ctx.textBaseline = 'alphabetic';

  /* 정지선 */
  dashLine(CAR_X - 100, REST_Y, CAR_X + 112, REST_Y, PAL.border2, 1, [4, 4]);
  ctx.fillStyle = PAL.faint; ctx.font = '11.5px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('정지 높이 (x = 0)', CAR_X - 86, REST_Y + 15);

  /* ============ 하단: x(t) 플롯 ============ */
  ctx.textAlign = 'left'; ctx.fillStyle = PAL.text; ctx.font = 'bold 15px ' + FONT;
  ctx.fillText('차체 높이 x(t) [cm]', PL, 306);

  /* 축·격자 */
  ctx.strokeStyle = PAL.border2; ctx.lineWidth = 1.5; ctx.strokeRect(PL, PT, PR - PL, PB - PT);
  dashLine(PL, ty(10), PR, ty(10), PAL.grid, 1, [3, 4]);
  dashLine(PL, ty(-10), PR, ty(-10), PAL.grid, 1, [3, 4]);
  dashLine(PL, MIDY, PR, MIDY, PAL.border2, 1, [4, 4]);
  ctx.font = '12.5px ' + FONT; ctx.fillStyle = PAL.faint; ctx.textAlign = 'right';
  ctx.fillText('+10', PL - 8, ty(10) + 4); ctx.fillText('0', PL - 8, MIDY + 4); ctx.fillText('−10', PL - 8, ty(-10) + 4);
  ctx.textAlign = 'center';
  for (var gs2 = 0; gs2 <= T_SIM; gs2++){
    if (gs2 > 0 && gs2 < T_SIM) dashLine(tx(gs2), PT, tx(gs2), PB, PAL.grid, 1, [3, 4]);
    ctx.fillStyle = PAL.faint; ctx.fillText(gs2 + ' s', tx(gs2), PB + 17);
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(PL, PT, PR - PL, PB - PT); ctx.clip();
  /* 노면 y(t) */
  var j;
  ctx.beginPath(); ctx.moveTo(PL, MIDY);
  for (j = 0; j <= NS; j += 3) ctx.lineTo(tx(j * DT), ty(YS[j] * 100));
  ctx.lineTo(PR, MIDY); ctx.closePath();
  ctx.globalAlpha = .18; ctx.fillStyle = PAL.low; ctx.fill(); ctx.globalAlpha = 1;
  ctx.strokeStyle = PAL.low; ctx.lineWidth = 1.6; ctx.stroke();
  /* 본 곡선 — 전체 옅게 */
  ctx.strokeStyle = stateCol; ctx.lineWidth = 1.6; ctx.globalAlpha = .32; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (j = 0; j <= NS; j += 3){
    if (j) ctx.lineTo(tx(j * DT), ty(XS[j] * 100)); else ctx.moveTo(tx(j * DT), ty(XS[j] * 100));
  }
  ctx.stroke(); ctx.globalAlpha = 1;
  /* 본 곡선 — 0..tAnim 진하게 */
  ctx.lineWidth = 2.8; ctx.beginPath();
  for (j = 0; j <= i; j += 2){
    if (j) ctx.lineTo(tx(j * DT), ty(XS[j] * 100)); else ctx.moveTo(tx(j * DT), ty(XS[j] * 100));
  }
  if (i % 2) ctx.lineTo(tx(i * DT), ty(XS[i] * 100));
  ctx.stroke();
  ctx.restore();

  /* 커서 */
  var cx = tx(tA), cy = ty(xcm);
  dashLine(cx, PT, cx, PB, PAL.faint, 1, [], .5);
  ctx.fillStyle = PAL.surface; ctx.strokeStyle = stateCol; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}

/* ---- 컨트롤 ---- */
function syncSpans(){
  $('kVal').textContent = p.k.toFixed(1);
  $('cVal').textContent = fmtInt(p.c);
  $('mVal').textContent = p.m.toFixed(0);
  $('k').value = p.k; $('c').value = p.c; $('m').value = p.m;
}
function bindSlider(id, key){
  $(id).addEventListener('input', function(){ p[key] = parseFloat(this.value); syncSpans(); recompute(); draw(); });
}
bindSlider('k', 'k'); bindSlider('c', 'c'); bindSlider('m', 'm');

$('play').addEventListener('click', function(){
  running = !running;
  this.textContent = running ? '⏸ 일시정지' : '▶ 재생';
  this.classList.toggle('btn-acc', running);
});
$('reset').addEventListener('click', function(){
  p = { m: DEF.m, k: DEF.k, c: DEF.c, v: DEF.v };
  tAnim = 0; running = true;
  $('play').textContent = '⏸ 일시정지'; $('play').classList.add('btn-acc');
  syncSpans(); recompute(); draw();
});

/* ---- rAF 루프 (1개) ---- */
var last = 0;
function loop(now){
  var dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
  last = now;
  if (running) tAnim += dt;
  if (tAnim > T_SIM + 0.8) tAnim = 0;
  draw();
  requestAnimationFrame(loop);
}
syncSpans();
recompute();
requestAnimationFrame(loop);
})();
</script>
</body>
